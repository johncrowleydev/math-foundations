    instructions: Sequence indices are nonnegative integers; the recurrence applies for every integer $n\geq1$.
    prompt: Solve $a_0=3$, $a_n=2a_{n-1}+2^n$.
    answer: Define $b_n=a_n/2^n$. Dividing the recurrence by $2^n$ gives $b_0=3$ and $b_n=b_{n-1}+1$. Thus $b_n=n+3$ and $a_n=(n+3)2^n$.
  '33':
    instructions: Sequence indices are nonnegative integers; the recurrence applies for every integer $n\geq1$.
    prompt: Solve $a_0=0$, $a_n=3a_{n-1}+3^n$.
    answer: Divide by $3^n$ to get an increment of 1 and zero initial value. Thus $a_n=n3^n$.
  '34':
    instructions: Sequence indices are nonnegative integers; the recurrence applies for every integer $n\geq1$.
    prompt: Derive a weighted-sum formula for $a_n=ra_{n-1}+f(n)$ when $r\neq0$ and $n\geq1$.
    answer: Unfolding gives $a_n=r^na_0+\sum_{j=1}^n r^{n-j}f(j)$. The contribution inserted at step $j$ receives one factor of $r$ at each of the $n-j$ later steps.
  '35':
    instructions: Sequence indices are nonnegative integers; the recurrence applies for every integer $n\geq1$.
    prompt: Use the weighted-sum idea to solve $a_0=0$, $a_n=2a_{n-1}+3^n$.
    answer: "$a_n=\\sum_{j=1}^n2^{n-j}3^j=3(3^n-2^n)$. Substitution verifies: $2\\cdot3(3^{n-1}-2^{n-1})+3^n=3^{n+1}-3\\cdot2^n$."
  '36':
    instructions: ''
    prompt: Let $F(n)$ count length-$n$ binary strings with no adjacent 1s, where $n$ is a nonnegative integer. Determine $F(0)$, $F(1)$, and a recurrence for $n\geq2$.
    answer: $F(0)=1$ for the empty string and $F(1)=2$. Valid strings begin with 0 followed by a valid shorter string, or 10 followed by one shorter by two. Thus $F(n)=F(n-1)+F(n-2)$.
  '37':
    instructions: ''
    prompt: Let $F(n)$ count length-$n$ binary strings with no adjacent 1s. Use $F(0)=1$, $F(1)=2$, and $F(n)=F(n-1)+F(n-2)$ for integers $n\geq2$ to calculate $F(2)$ through $F(6)$.
    answer: $3,5,8,13,21$, starting from $F(0)=1,F(1)=2$.
  '38':
    instructions: ''
    prompt: A staircase has $n$ steps, where $n$ is a nonnegative integer. Moves advance one or two steps. Count ordered ways to reach the top exactly by giving initial conditions and a recurrence.
    answer: Let $W(0)=1$ for the empty move sequence and $W(1)=1$. For $n\geq2$, the final move is 1 or 2 steps, giving disjoint cases $W(n)=W(n-1)+W(n-2)$.
  '39':
    instructions: ''
    prompt: A staircase has $n$ steps, and each move advances one or two steps. Let $W(n)$ count ordered move sequences that reach the top exactly, with $W(0)=W(1)=1$ and $W(n)=W(n-1)+W(n-2)$ for $n\geq2$. Compute $W(5)$ and explain why order matters.
    answer: $W(2)=2,W(3)=3,W(4)=5,W(5)=8$. For example, moves $1,2$ and $2,1$ are different ordered sequences even though they use the same step sizes the same number of times.
  '40':
    instructions: ''
    prompt: Explain why matching a few Fibonacci-like initial counts is insufficient to derive a counting recurrence.
    answer: Finite agreement does not force every later count. A recurrence requires a disjoint, exhaustive decomposition of each counted object into smaller objects, with a bijection or equivalent justification for each case.
  '41':
    instructions: Sequence indices are nonnegative integers; the recurrence applies for every integer $n\geq2$.
    prompt: Find the characteristic equation for $a_n=5a_{n-1}-6a_{n-2}$.
    answer: The characteristic equation is $r^2-5r+6=(r-2)(r-3)=0$, obtained by substituting a geometric candidate.
  '42':
    instructions: Sequence indices are nonnegative integers; the recurrence applies for every integer $n\geq2$.
    prompt: Solve $a_0=2,a_1=5$, $a_n=5a_{n-1}-6a_{n-2}$ for $n\geq2$.
    answer: Try $A2^n+B3^n$. The equations $A+B=2$, $2A+3B=5$ give $A=B=1$, hence $a_n=2^n+3^n$.
  '43':
    instructions: Sequence indices are nonnegative integers; the recurrence applies for every integer $n\geq2$.
    prompt: Solve $a_0=1,a_1=4$, $a_n=3a_{n-1}-2a_{n-2}$.
    answer: Roots are 1 and 2. From $A+B=1$ and $A+2B=4$, get $A=-2,B=3$. Thus $a_n=-2+3\cdot2^n$.
  '44':
    instructions: Sequence indices are nonnegative integers; the recurrence applies for every integer $n\geq2$.
    prompt: Solve $a_0=2,a_1=0$, $a_n=a_{n-2}$ for $n\geq2$.
    answer: 'Roots are 1 and $-1$. The solution is $a_n=1+(-1)^n$: even indices have value 2 and odd indices value 0.'
  '45':
    instructions: Sequence indices are nonnegative integers; the recurrence applies for every integer $n\geq2$.
    prompt: Find and factor the characteristic polynomial for $a_n=4a_{n-1}-4a_{n-2}$.
    answer: $r^2-4r+4=(r-2)^2$, so 2 is a repeated root.
  '46':
    instructions: Sequence indices are nonnegative integers; the recurrence applies for every integer $n\geq2$.
    prompt: Solve $a_0=1,a_1=6$, $a_n=4a_{n-1}-4a_{n-2}$.
    answer: Try $(A+Bn)2^n$. Initial data give $A=1$ and $2(1+B)=6$, so $B=2$. Hence $a_n=(1+2n)2^n$.
  '47':
    instructions: Sequence indices are nonnegative integers; the recurrence applies for every integer $n\geq2$.
    prompt: Solve $a_0=3,a_1=5$, $a_n=2a_{n-1}-a_{n-2}$.
    answer: 'The repeated root is 1. Consecutive differences are constant: $a_n-a_{n-1}=a_{n-1}-a_{n-2}=2$. Thus $a_n=3+2n$.'
  '48':
    instructions: Sequence indices are nonnegative integers; the recurrence applies for every integer $n\geq2$.
    prompt: Justify the factor $n$ in the repeated-root candidate for $a_n=2\rho a_{n-1}-\rho^2a_{n-2}$, assuming $\rho\neq0$.
    answer: Writing $b_n=a_n/\rho^n$ gives $b_n=2b_{n-1}-b_{n-2}$. Its first differences are constant, so $b_n=A+Bn$ and $a_n=(A+Bn)\rho^n$.
  '49':
    instructions: Sequence indices are nonnegative integers; the recurrence applies for every integer $n\geq2$.
    prompt: For $a_0=4,a_1=9$, $a_n=0a_{n-1}+0a_{n-2}$ for $n\geq2$, give all terms and explain why the nonzero repeated-root derivation does not apply.
    answer: $a_0=4,a_1=9$, and every later term is zero. Dividing by $\rho^n$ is invalid when the repeated root $\rho$ is zero; the recurrence itself gives the answer.
  '50':
    instructions: ''
    prompt: Prove that two solutions of the same explicit second-order recurrence agreeing at indices 0 and 1 agree everywhere.
    answer: The initial two values agree. If agreement holds at the two preceding indices, the identical recurrence forces agreement at the next index. Induction from index 2 proves equality at all nonnegative indices.
  '51':
    instructions: ''
    prompt: In the three-peg Tower of Hanoi puzzle, move a stack of $n$ differently sized disks to another peg. Move one exposed disk at a time and never place a larger disk on a smaller one. Let $H(n)$ be the minimum number of moves. State $H(0)$ and derive a recurrence for $H(n)$.
    answer: "$H(0)=0$ and $H(n)=2H(n-1)+1$ for $n\\geq1$. The usual construction moves the smaller stack to the spare peg, moves the largest disk to its destination, and moves the smaller stack onto it, using this many moves. For a lower bound, before the largest disk's first move the entire smaller stack must have moved to one other peg, requiring at least $H(n-1)$ moves. After its last move to the destination, the smaller stack is entirely on a different peg and needs at least $H(n-1)$ further moves. Those two stages and at least one largest-disk move give the same lower bound, so the construction is optimal."
  '52':
    instructions: ''
    prompt: In the three-peg Tower of Hanoi puzzle, one exposed disk moves at a time and no larger disk may rest on a smaller one. The minimum move count satisfies $H(0)=0$ and $H(n)=2H(n-1)+1$ for $n\geq1$. Compute $H(1)$ through $H(5)$.
    answer: $1,3,7,15,31$, successively doubling the preceding count and adding 1.
  '53':
    instructions: Sequence indices are nonnegative integers; the recurrence applies for every integer $n\geq1$.
    prompt: Prove by induction that the recurrence $H(0)=0$, $H(n)=2H(n-1)+1$ gives $H(n)=2^n-1$.
    answer: 'The base gives $0=2^0-1$. Assuming the formula for $n-1$, substitute: $H(n)=2(2^{n-1}-1)+1=2^n-1$.'
  '54':
    instructions: In the three-peg Tower of Hanoi puzzle, transfer a stack of differently sized disks to another peg. Move one exposed disk at a time, never placing a larger disk on a smaller one.
    prompt: Why does describing a Hanoi strategy with a specified move count prove only an upper bound on the optimum?
    answer: It exhibits one legal solution using that many moves. A shorter strategy is not ruled out until a lower-bound argument shows every legal solution needs at least that many.
  '55':
    instructions: In the three-peg Tower of Hanoi puzzle, transfer a stack of differently sized disks to another peg. Move one exposed disk at a time, never placing a larger disk on a smaller one.
    prompt: Let $H(n)$ be the minimum moves for $n$ disks, with $H(0)=0$. Explain why any solution needs at least $2H(n-1)+1$ moves. Account for the smaller disks before the largest disk first moves and after it finally reaches its destination.
    answer: Before the largest disk first moves, all smaller disks must be transferred to the third peg, requiring at least $H(n-1)$ moves. After its last move to the target, transferring the smaller stack onto it requires at least another $H(n-1)$. These disjoint portions plus at least one largest-disk move force $2H(n-1)+1$.
  '56':
    instructions: In the three-peg Tower of Hanoi puzzle, transfer a stack of differently sized disks to another peg. Move one exposed disk at a time, never placing a larger disk on a smaller one.
    prompt: How many disks can be transferred in at most 100 moves using an optimal three-peg Hanoi solution?
    answer: "Six disks: $H(6)=63\\leq100$, while $H(7)=127>100$. The count increases with disk number."
  '57':
    instructions: Sequence indices are nonnegative integers; the recurrence applies for every integer $n\geq1$.
    prompt: A proposed formula $a_n=2^n$ is offered for $a_0=1$, $a_n=2a_{n-1}+1$. Test both defining conditions.
    answer: The base condition passes, but substitution gives $2\cdot2^{n-1}+1=2^n+1$, not $2^n$. The recurrence condition fails for every positive index.
  '58':
    instructions: Sequence indices are nonnegative integers; the recurrence applies for every integer $n\geq1$.
    prompt: A sequence has $a_0=1$ and $a_n=2a_{n-1}+1$ for integers $n\geq1$. The proposed formula $a_n=2^n$ satisfies the base condition but fails the recurrence. Find a correct formula and verify both defining conditions.
    answer: $a_n=2^{n+1}-1$. It gives $a_0=1$, and $2(2^n-1)+1=2^{n+1}-1$ verifies the step.
  '59':
    instructions: Sequence indices are nonnegative integers; the recurrence applies for every integer $n\geq2$.
    prompt: Both $a_n=1$ and $a_n=2^n$ satisfy $a_n=3a_{n-1}-2a_{n-2}$. Explain why specifying only $a_0=1$ cannot select between them.
    answer: Both have the same value at zero but different values at one. A second initial value is needed to select the intended solution of this second-order recurrence.
  '60':
    instructions: ''
    prompt: A recurrence models the work of a particular recursive program exactly. Does solving it prove that the program is optimal among all programs for that task?
    answer: No. It determines that program's work in the specified model. Optimality requires a lower bound applying to every permitted algorithm, not merely to that recurrence.
  '61':
    instructions: Let $n=2^k$ for integers $k\geq0$. The recurrence applies for $n\geq2$.
    prompt: For $T(1)=1$, $T(n)=2T(n/2)+n$, compute $T(2),T(4),T(8)$.
    answer: $4,12,32$, using respectively $2\cdot1+2$, $2\cdot4+4$, and $2\cdot12+8$.
  '62':
    instructions: Let $n=2^k$ for integers $k\geq0$. The recurrence applies for $n\geq2$.
    prompt: For $T(1)=1$ and $T(n)=2T(n/2)+n$, describe the number of calls, size of each subproblem, and total nonrecursive work at internal level $j$, where $0\leq j<\log_2 n$. Level 0 contains the initial call.
    answer: There are $2^j$ nodes of size $n/2^j$, so their total nonrecursive work is $2^j(n/2^j)=n$, for $0\leq j<\log_2 n$.
  '63':
    instructions: Let $n=2^k$ for integers $k\geq0$. The recurrence applies for $n\geq2$.
    prompt: Derive the exact solution to $T(1)=1$, $T(n)=2T(n/2)+n$ using a recursion tree.
    answer: There are $\log_2 n$ internal levels, each costing $n$, followed by $n$ leaves of cost 1. Thus $T(n)=n\log_2 n+n$.
  '64':
    instructions: Let $n=2^k$ for integers $k\geq0$. The recurrence applies for $n\geq2$.
    prompt: Prove by induction on $k$, where $n=2^k$, that $T(1)=1$ and $T(n)=2T(n/2)+n$ have the solution $T(n)=n\log_2 n+n$.
    answer: At $k=0$ the formula gives 1. The induction step is $2[(n/2)\log_2(n/2)+n/2]+n=n(\log_2 n-1)+2n=n\log_2 n+n$.
  '65':
    instructions: Let $n=2^k$ for integers $k\geq0$. The recurrence applies for $n\geq2$.
    prompt: Solve $S(1)=1$, $S(n)=S(n/2)+1$.
    answer: There are $\log_2 n$ single-branch internal steps plus the final unit leaf cost. Hence $S(n)=\log_2 n+1$.
  '66':
    instructions: Let $n=2^k$ for integers $k\geq0$. The recurrence applies for $n\geq2$.
    prompt: Solve $U(1)=1$, $U(n)=2U(n/2)+1$.
    answer: The full binary recursion tree has $n$ leaves and $n-1$ internal nodes, all costing 1. Thus $U(n)=2n-1$; substitution gives $2(n-1)+1=2n-1$.
  '67':
    instructions: Let $n=2^k$ for integers $k\geq0$. The recurrence applies for $n\geq2$.
    prompt: Solve $V(1)=3$, $V(n)=2V(n/2)+n$.
    answer: Each internal level costs $n$, and the $n$ leaves cost 3 each. Therefore $V(n)=n\log_2 n+3n$.
  '68':
    instructions: Let $n=2^k$ for integers $k\geq0$. The recurrence applies for $n\geq2$.
    prompt: Solve $W(1)=1$, $W(n)=W(n/2)+n$.
    answer: Along the one branch, costs sum to $n+n/2+\cdots+1=2n-1$. The last term is the leaf cost.
  '69':
    instructions: ''
    prompt: Why can two halving recurrences have the same recursion depth but different total work?
    answer: One may explore a single child while another explores multiple children. Depth counts levels, while total work sums the work of all nodes at those levels.
  '70':
    instructions: ''
    prompt: Why does an exact formula proved only for powers of two not automatically apply to arbitrary integer input sizes?
    answer: Other sizes may generate floor and ceiling subproblems rather than equal integer halves. Those are different recurrence equations; a separate proof or suitable bounds must handle the rounding.
  '71':
    instructions: Let $T$ be nonnegative on inputs $n=2^k$ for integers $k\geq0$. The recurrence inequality applies for $n\geq2$.
    prompt: Assume nonnegative $T(1)=1$ and $T(n)\leq2T(n/2)+n$ on powers of two. Prove $T(n)\leq n\log_2 n+n$.
    answer: Induct on $\log_2 n$. At $n=1$ the proposed bound is equality. At $n\geq2$, the induction hypothesis gives $T(n/2)\leq(n/2)\log_2(n/2)+n/2$. Therefore $T(n)\leq2[(n/2)\log_2(n/2)+n/2]+n=n\log_2 n+n$.
  '72':
    instructions: ''
    prompt: Let $T$ be nonnegative on inputs $n=2^k$ for integers $k\geq0$, with $T(1)=1$ and $T(n)\leq2T(n/2)+n$ for $n\geq2$. Do these assumptions force $T(n)\geq c n\log_2 n$ for some fixed $c>0$ and all sufficiently large allowed inputs? Give a counterexample if not.
    answer: No. The constant function $T(n)=1$ satisfies $1\leq2\cdot1+n$ and the base condition, but does not grow like $n\log n$.
  '73':
    instructions: ''
    prompt: On positive powers of two, define $T(1)=1$ and $T(n)=2T(n/2)+n$ for $n\geq2$. Explain why an induction attempting to prove $T(n)\leq cn$, with a fixed positive constant $c$, does not close.
    answer: Substitution yields only $T(n)\leq cn+n$, which exceeds the target $cn$. Changing the constant within that same argument does not absorb the extra positive $n$ at every step.
  '74':
    instructions: Sequence indices are nonnegative integers; the recurrence applies for every integer $n\geq1$.
    prompt: Solve $a_0=2$, $a_n=2a_{n-1}+n$ and verify the candidate $a_n=4\cdot2^n-n-2$.
    answer: At zero it gives 2. For $n\geq1$, $2[4\cdot2^{n-1}-(n-1)-2]+n=4\cdot2^n-n-2$. Uniqueness therefore establishes the candidate.
  '75':
    instructions: Sequence indices are nonnegative integers; the recurrence applies for every integer $n\geq2$.
    prompt: For $a_0=1,a_1=3$ and $a_n=2a_{n-1}-a_{n-2}$, compute $a_5$ using a justified formula.
    answer: First differences are constant with value 2, so $a_n=1+2n$ and $a_5=11$.
  '76':
    instructions: Sequence indices are nonnegative integers; the recurrence applies for every integer $n\geq2$.
    prompt: For $a_0=1,a_1=2$ and $a_n=5a_{n-1}-6a_{n-2}$, solve and explain why one characteristic component disappears.
    answer: Writing $a_n=A2^n+B3^n$ gives $A+B=1$, $2A+3B=2$, hence $A=1,B=0$. Thus $a_n=2^n$; initial data eliminate the other component.
  '77':
    instructions: Sequence indices are nonnegative integers; the recurrence applies for every integer $n\geq2$.
    prompt: For $a_0=1,a_1=4$ and $a_n=4a_{n-1}-4a_{n-2}$, solve using the repeated root.
    answer: $a_n=(A+Bn)2^n$, with $A=1$ and $2(1+B)=4$, gives $B=1$. Thus $a_n=(n+1)2^n$.
  '78':
    instructions: ''
    prompt: A merge-sort analysis assigns exactly n merge operations to every size-n call. What must be checked before treating this as an exact cost recurrence for an implementation?
    answer: The chosen operation count, base cost, actual merge behavior, and subproblem sizes must match the equation. Real merge costs may only be bounded by constants times $n$, leading to bounds rather than that exact formula.
  '79':
    instructions: Let $n=2^k$ for integers $k\geq0$, with the recurrence applied for $n\geq2$.
    prompt: For powers of two, verify $R(n)=3n-2$ solves $R(1)=1$, $R(n)=2R(n/2)+2$.
    answer: The base gives $3-2=1$. Substitution gives $2[3n/2-2]+2=3n-2$, proving the formula by induction on the exponent.
  '80':
    instructions: ''
    prompt: Describe a complete workflow for solving and proving a new recurrence, including what to do if no exact formula is needed.
    answer: State its domain and initial conditions, compute a few terms, derive a candidate by iteration, sums, or a structural method, then verify the initial data and recurrence by induction. If only growth is needed, conjecture bounds and prove the inequalities with valid constants on the stated domain.
graph-theory:
  '1':
    instructions: ''
    prompt: How many possible edges can a simple undirected graph on five labeled vertices have?
    answer: $\binom52=10$, choosing an unordered pair of distinct endpoints.
  '2':
    instructions: ''
    prompt: How many possible arcs can a loop-free digraph on five labeled vertices have?
    answer: $5\cdot4=20$. The initial endpoint and distinct terminal endpoint are ordered choices.
  '3':
    instructions: ''
    prompt: A simple undirected graph has degree list 3,3,2,2,2. How many edges would it have?
    answer: The sum is 12, so handshaking gives 6 edges.
  '4':
    instructions: Use finite simple undirected graphs.
    prompt: Can degree list 3,3,3,2,2 belong to an undirected graph? Explain.
    answer: No. The degree sum is 13, which is odd and therefore cannot equal twice an integer edge count.
  '5':
    instructions: ''
    prompt: If two drawn edges cross without a marked vertex, does that crossing become a vertex of the abstract graph?
    answer: No. The vertex set and incidence data define the graph. A geometric crossing alone introduces no additional vertex or adjacency.
  '6':
    instructions: Use finite simple undirected graphs.
    prompt: A graph on five vertices has all degrees 4. Identify its edge set structurally and count edges.
    answer: Every vertex is adjacent to all four others, so it is the complete graph on five vertices. It has $5\cdot4/2=10$ edges.
  '7':
    instructions: ''
    prompt: Can a simple graph on four vertices contain two different edges with the same unordered pair of endpoints?
    answer: No. Its edge collection is a set of two-element vertex sets, so a given pair occurs at most once. Parallel edges require a different graph model.
  '8':
    instructions: ''
    prompt: Can a loop-free digraph contain both (a,b) and (b,a)? Explain.
    answer: Yes. They are distinct ordered pairs representing opposite directions; the no-loop rule only excludes arcs whose two endpoints are equal.
  '9':
    instructions: ''
    prompt: In a digraph, the sum of out-degrees is 17. What is the sum of in-degrees, and why?
    answer: It is also 17. Each of the 17 arcs contributes one outgoing incidence and one incoming incidence.
  '10':
    instructions: Use finite simple undirected graphs.
    prompt: An undirected graph has 7 vertices, all of degree 2. How many edges does it have? Does this alone establish connectivity?
    answer: 'The degree sum is 14, so there are 7 edges. It need not be connected: a disjoint triangle and four-cycle have these degrees.'
  '11':
    instructions: Use the simple undirected graph $V=\{a,b,c,d,e\}$, $E=\{\{a,b\},\{a,c\},\{b,c\},\{c,d\},\{d,e\}\}$.
    prompt: List the neighbors of c and its degree.
    answer: The neighbors are $a,b,d$, so $\deg(c)=3$.
  '12':
    instructions: Use the simple undirected graph $V=\{a,b,c,d,e\}$, $E=\{\{a,b\},\{a,c\},\{b,c\},\{c,d\},\{d,e\}\}$.
    prompt: Give every vertex degree and the number of edges.
    answer: Degrees at $a,b,c,d,e$ are $2,2,3,2,1$. There are 5 edges.
  '13':
    instructions: Use the simple undirected graph $V=\{a,b,c,d,e\}$, $E=\{\{a,b\},\{a,c\},\{b,c\},\{c,d\},\{d,e\}\}$.
    prompt: Verify the handshaking lemma numerically for this graph.
    answer: The degree sum is $2+2+3+2+1=10=2\cdot5$, twice the edge count.
  '14':
    instructions: Use the simple undirected graph $V=\{a,b,c,d,e\}$, $E=\{\{a,b\},\{a,c\},\{b,c\},\{c,d\},\{d,e\}\}$.
    prompt: Identify the odd-degree vertices and check the parity conclusion.
    answer: The odd-degree vertices are $c,e$, exactly two. The number of odd-degree vertices is even.
  '15':
    instructions: Use the simple undirected graph $V=\{a,b,c,d,e\}$, $E=\{\{a,b\},\{a,c\},\{b,c\},\{c,d\},\{d,e\}\}$.
    prompt: Does this graph have an isolated vertex? Identify its degree-1 vertices.
    answer: No vertex is isolated. The only degree-1 vertex is $e$.
  '16':
    instructions: Use the simple undirected graph $V=\{a,b,c,d,e\}$, $E=\{\{a,b\},\{a,c\},\{b,c\},\{c,d\},\{d,e\}\}$.
    prompt: Write the adjacency-matrix row for c with column order a,b,c,d,e.
    answer: $1,1,0,1,0$. There are edges from $c$ to $a,b,d$, and no loop at $c$.
  '17':
    instructions: ''
    prompt: Can a simple undirected graph on five vertices have a vertex of degree 5? Explain.
    answer: No. A vertex can have at most the other four vertices as neighbors, so its degree is at most 4.
  '18':
    instructions: Use finite simple undirected graphs.
    prompt: Can an undirected graph have exactly three odd-degree vertices? Prove your answer.
    answer: No. Its degree sum is even by handshaking. Even-degree terms contribute an even sum, while three odd terms contribute an odd sum, a contradiction.
  '19':
    instructions: ''
    prompt: Explain the difference between a simple undirected edge and a directed arc.
    answer: An undirected edge is a two-element set $\{u,v\}$, unchanged when endpoints are exchanged. An arc is an ordered pair $(u,v)$, whose reverse is a distinct possible arc.
  '20':
    instructions: ''
    prompt: For a digraph with arcs $(a,b),(a,c),(b,c),(c,a)$, list in- and out-degrees for $a,b,c$.
    answer: 'At $a$: in 1, out 2; at $b$: in 1, out 1; at $c$: in 2, out 1. Each total equals the four arcs.'
  '21':
    instructions: Use the simple undirected graph $V=\{a,b,c,d,e\}$, $E=\{\{a,b\},\{a,c\},\{b,c\},\{c,d\},\{d,e\}\}$.
    prompt: Classify $a,b,c,d,e$ as a walk, trail, path, or cycle, and give its length.
    answer: It is a walk, trail, and path of length 4. It is not a cycle because its endpoints differ.
  '22':
    instructions: Use the simple undirected graph $V=\{a,b,c,d,e\}$, $E=\{\{a,b\},\{a,c\},\{b,c\},\{c,d\},\{d,e\}\}$.
    prompt: Classify the vertex sequence $a,b,c,a$ as a walk, trail, path, or cycle in the specified graph, and give its length.
    answer: It is a closed walk, a trail, and a cycle of length 3. It is not a path because the start vertex repeats.
  '23':
    instructions: Use the simple undirected graph $V=\{a,b,c,d,e\}$, $E=\{\{a,b\},\{a,c\},\{b,c\},\{c,d\},\{d,e\}\}$.
    prompt: Classify $a,c,a,c,d$ as a walk, trail, path, or cycle. List every classification that applies and give its length.
    answer: It is a walk of length 4. The edge $\{a,c\}$ repeats, so it is not a trail, path, or cycle.
  '24':
    instructions: Use the simple undirected graph $V=\{a,b,c,d,e\}$, $E=\{\{a,b\},\{a,c\},\{b,c\},\{c,d\},\{d,e\}\}$.
    prompt: Is $a,b,d,e$ a walk? Explain.
    answer: No. The consecutive pair $b,d$ is not an edge.
  '25':
    instructions: Use the simple undirected graph $V=\{a,b,c,d,e\}$, $E=\{\{a,b\},\{a,c\},\{b,c\},\{c,d\},\{d,e\}\}$.
    prompt: Is $c,d,e,d,c$ a cycle? Explain.
    answer: No. It is a closed walk, but it repeats edges $\{c,d\}$ and $\{d,e\}$ and repeats the interior vertex $d$.
  '26':
    instructions: Use the simple undirected graph $V=\{a,b,c,d,e\}$, $E=\{\{a,b\},\{a,c\},\{b,c\},\{c,d\},\{d,e\}\}$.
    prompt: Give two different paths from a to c, and explain what their existence reveals.
    answer: $a,c$ and $a,b,c$ are different paths. Their union contains the cycle $a,b,c,a$, so the connected graph is not a tree.
  '27':
    instructions: ''
    prompt: An undirected cycle has at least three edges, with distinct vertices except for its repeated start. Explain why traversing one undirected edge out and back is not a cycle.
    answer: It uses the same edge twice and has length 2. An undirected cycle here has length at least 3 and distinct vertices except the repeated start.
  '28':
    instructions: ''
    prompt: In the digraph with arcs $(a,b),(b,a)$, is $a,b,a$ a directed cycle?
    answer: Yes. The two opposite arcs are distinct, and the closed directed walk has two distinct vertices before returning to its start. Directed cycles of length 2 are allowed.
  '29':
    instructions: Use finite simple undirected graphs.
    prompt: Prove that whenever a finite walk connects two vertices, some path connects them.
    answer: If the walk repeats a vertex, delete the portion between two occurrences. This gives a shorter walk with the same endpoints. Repeated deletion terminates, leaving no repeated vertices and hence a path.
  '30':
    instructions: ''
    prompt: What is the length-0 path at a vertex, and why is it useful?
    answer: It consists of that vertex alone and traverses zero edges. It establishes that every vertex can reach itself without requiring a loop.
  '31':
    instructions: Use a simple undirected graph.
    prompt: For $V=\{a,b,c,d,e,f\}$ and edges $\{a,b\},\{b,c\},\{d,e\}$, list the components.
    answer: The components have vertex sets $\{a,b,c\}$, $\{d,e\}$, and $\{f\}$. The isolated vertex forms its own component.
  '32':
    instructions: ''
    prompt: A simple undirected graph has $V=\{a,b,c,d,e,f\}$ and edges $\{a,b\},\{b,c\},\{d,e\}$. What is the minimum number of new edges needed to make it connected? Give suitable edges and justify minimality.
    answer: Two edges suffice, for example $\{c,d\}$ and $\{e,f\}$. Three components require at least two joining edges because one edge can reduce the component count by at most one.
  '33':
    instructions: Use finite simple undirected graphs.
    prompt: Explain why undirected reachability is reflexive and symmetric.
    answer: A length-0 path reaches the starting vertex, proving reflexivity. Reversing an undirected path gives a path in the opposite direction, proving symmetry.
  '34':
    instructions: Use finite simple undirected graphs.
    prompt: Explain why undirected reachability is transitive even when concatenating paths repeats vertices.
    answer: Concatenation gives a walk from the first vertex to the third. Removing repeated-vertex portions produces a path with the same endpoints, proving transitivity.
  '35':
    instructions: ''
    prompt: Classify the digraph $a\to b\to c$ as strongly connected, weakly connected, both, or neither.
    answer: It is weakly connected because its underlying undirected graph is a path. It is not strongly connected because $c$ cannot reach $a$.
  '36':
    instructions: ''
    prompt: Classify the digraph on vertices $\{a,b,c\}$ with arcs $(a,b),(b,c),(c,a)$ as strongly connected, weakly connected, both, or neither.
    answer: It is both strongly and weakly connected. Following the directed cycle reaches any vertex from any other.
  '37':
    instructions: ''
    prompt: A digraph has $V=\{a,b,c,d\}$ and arcs $(a,b),(b,a),(c,d)$. Is it weakly connected?
    answer: No. Ignoring directions produces two components, $\{a,b\}$ and $\{c,d\}$. It is consequently not strongly connected either.
  '38':
    instructions: ''
    prompt: A connected undirected graph is nonempty and has a path between every pair of vertices; a length-zero path from a vertex to itself is allowed. Classify a one-vertex edgeless graph and an empty graph for connectivity.
    answer: The one-vertex graph is connected using its length-0 path. The empty graph is defined to be disconnected and has zero components.
  '39':
    instructions: ''
    prompt: Strong connectivity requires a nonempty digraph with a directed path between every ordered pair of vertices. Weak connectivity requires its underlying undirected graph to be connected. Length-zero paths are allowed. Classify the empty digraph and a one-vertex digraph with no arcs under both notions.
    answer: 'The empty digraph is neither strongly nor weakly connected. The singleton is both: its only required reachability is supplied by a length-0 path.'
  '40':
    instructions: Use finite directed graphs with no self-loops.
    prompt: Does weak connectivity imply strong connectivity? Give a counterexample. Does strong connectivity imply weak connectivity?
    answer: "Weak does not imply strong: $a\\to b$ is a counterexample. Strong implies weak because every directed path remains an undirected path when directions are ignored."
  '41':
    instructions: ''
    prompt: A tree has 12 vertices. How many edges does it have?
    answer: 11, since every finite nonempty tree has $n-1$ edges.
  '42':
    instructions: Use finite simple undirected graphs.
    prompt: A forest has 14 vertices and 4 components. How many edges does it have?
    answer: $14-4=10$, using $m=n-c$.
  '43':
    instructions: Use finite simple undirected graphs.
    prompt: An acyclic graph has 9 vertices and 8 edges. Must it be a tree?
    answer: Yes. The forest identity gives $c=n-m=1$, so it is connected and acyclic.
  '44':
    instructions: Use finite simple undirected graphs.
    prompt: A connected graph has 9 vertices and 8 edges. Must it be a tree?
    answer: Yes. A connected graph contains a spanning tree with 8 edges. All of its edges must belong to that tree, so it is acyclic.
  '45':
    instructions: Use finite simple undirected graphs.
    prompt: Does having n-1 edges alone characterize an n-vertex tree? Give a counterexample.
    answer: No. A triangle plus an isolated vertex has 4 vertices and 3 edges, but it is disconnected and contains a cycle.
  '46':
    instructions: Use finite simple undirected graphs.
    prompt: Prove that a finite tree with at least two vertices has two leaves.
    answer: Take a longest path. An endpoint has its path neighbor; another neighbor on the path would create a cycle, and one outside it would extend the path. Both are impossible, so both endpoints have degree 1.
  '47':
    instructions: Use finite simple undirected graphs.
    prompt: Prove by induction that a tree on n vertices has n-1 edges.
    answer: The one-vertex tree has zero edges. For an arbitrary larger tree, the leaf lemma supplies a leaf to remove with its incident edge. Deletion cannot create a cycle, and a leaf cannot be an interior vertex of a path between remaining vertices, so connectivity remains. The smaller tree has $n-2$ edges by induction; restoring the edge gives $n-1$.
  '48':
    instructions: Use finite simple undirected graphs.
    prompt: Explain why deleting an edge lying on a cycle preserves connectivity in a connected undirected graph.
    answer: The remainder of that cycle supplies an alternate path between the deleted edge's endpoints. Any walk using the removed edge can replace it with that path, so reachability is preserved.
  '49':
    instructions: Use finite simple undirected graphs.
    prompt: Find a spanning tree of $V=\{a,b,c,d\}$ with edges $\{a,b\},\{b,c\},\{c,a\},\{c,d\}$.
    answer: Delete $\{a,c\}$. The remaining edges $\{a,b\},\{b,c\},\{c,d\}$ form a connected path on all four vertices.
  '50':
    instructions: A tree is nonempty; a forest is any finite acyclic undirected graph, including the empty graph.
    prompt: Classify the empty graph as a tree or forest, and check the forest edge-count formula.
    answer: It is a forest because it has no cycles, but not a tree because trees are nonempty and connected. It has $n=c=m=0$, so $m=n-c$ holds.
  '51':
    instructions: ''
    prompt: Root the tree with edges $\{a,b\},\{a,c\},\{b,d\},\{b,e\},\{c,f\}$ at $a$. Give every nonroot parent.
    answer: The vertices $b$ and $c$ have parent $a$; $d$ and $e$ have parent $b$; $f$ has parent $c$. Each parent is the preceding vertex on the unique path from the root $a$.
  '52':
    instructions: Root the tree on $V=\{a,b,c,d,e,f\}$ with edges $\{a,b\},\{a,c\},\{b,d\},\{b,e\},\{c,f\}$ at $a$.
    prompt: Give the depth of each vertex and list the rooted leaves.
    answer: Depths are $0,1,1,2,2,2$. Vertices $d,e,f$ have no children and are the rooted leaves.
  '53':
    instructions: Root the tree on $V=\{a,b,c,d,e,f\}$ with edges $\{a,b\},\{a,c\},\{b,d\},\{b,e\},\{c,f\}$ at $a$.
    prompt: Is this a binary tree? Is it full binary? Explain each answer.
    answer: It is binary because each vertex has at most two children. It is not full binary because $c$ has exactly one child, $f$.
  '54':
    instructions: Use finite simple undirected graphs.
    prompt: A full binary rooted tree has 7 internal vertices. How many leaves and total vertices does it have?
    answer: $L=I+1=8$, so the total is $7+8=15$.
  '55':
    instructions: ''
    prompt: A finite full binary rooted tree has exactly two children at each internal node. Prove that the number of leaves is one more than the number of internal nodes.
    answer: If there are $I$ internal vertices and $L$ leaves, each internal vertex has two children, so there are $2I$ edges. The tree count also gives $I+L-1$ edges. Equating gives $L=I+1$.
  '56':
    instructions: Use finite simple undirected graphs.
    prompt: A root has one child and no other incident edges. Is it an undirected degree-1 vertex? Is it a rooted-tree leaf?
    answer: It has undirected degree 1, but is not a rooted-tree leaf because it has a child. The two uses of leaf differ at the root.
  '57':
    instructions: ''
    prompt: For arcs $(a,c),(b,c),(c,d),(c,e),(d,e)$ on $a,b,c,d,e$, list all topological orderings.
    answer: $a,b,c,d,e$ and $b,a,c,d,e$. Both $a,b$ must precede $c$, which must precede $d$, which must precede $e$.
  '58':
    instructions: ''
    prompt: A digraph has vertices $\{a,b,c,d,e\}$ and arcs $(a,c),(b,c),(c,d),(c,e),(d,e)$. Add the arc $(d,a)$. Can the resulting digraph have a topological ordering? Explain.
    answer: No. The arcs $a\to c\to d\to a$ form a directed cycle, which cannot be placed consistently in any topological order.
  '59':
    instructions: ''
    prompt: Prove that every nonempty finite DAG has a vertex of in-degree zero.
    answer: Otherwise repeatedly follow an incoming arc backward from any vertex. Finiteness forces a repeated vertex, and the resulting closed directed segment contains a directed cycle, contradicting acyclicity.
  '60':
    instructions: ''
    prompt: Explain how repeatedly removing an in-degree-zero vertex constructs a topological ordering.
    answer: Place the removed vertex next in the order. No remaining arc enters it, so all prerequisites were already removed. The remaining graph is still a DAG; induction continues until all vertices are ordered.
  '61':
    instructions: Use the simple undirected graph $V=\{a,b,c,d,e,f\}$ with edges $\{a,b\},\{a,c\},\{b,d\},\{b,e\},\{c,e\},\{e,f\}$. Start at $a$, inspect neighbors alphabetically, and mark each vertex when first discovered.
    prompt: Give the BFS discovery order using a queue.
    answer: $a,b,c,d,e,f$. Processing $a$ discovers $b,c$; processing $b$ discovers $d,e$; processing $e$ later discovers $f$.
  '62':
    instructions: Use the simple undirected graph $V=\{a,b,c,d,e,f\}$ with edges $\{a,b\},\{a,c\},\{b,d\},\{b,e\},\{c,e\},\{e,f\}$. Start at $a$, inspect neighbors alphabetically, and mark each vertex when first discovered.
    prompt: Give the BFS distance from a to every vertex.
    answer: Distances at $a,b,c,d,e,f$ are $0,1,1,2,2,3$. These count edges in shortest paths.
  '63':
    instructions: Use the simple undirected graph $V=\{a,b,c,d,e,f\}$ with edges $\{a,b\},\{a,c\},\{b,d\},\{b,e\},\{c,e\},\{e,f\}$. Start at $a$, inspect neighbors alphabetically, and mark each vertex when first discovered.
    prompt: Give the BFS parent of each nonroot vertex with the stated neighbor order.
    answer: Parents are $b:a$, $c:a$, $d:b$, $e:b$, and $f:e$. Although $c$ also neighbors $e$, $e$ was already discovered from $b$.
  '64':
    instructions: Use the simple undirected graph $V=\{a,b,c,d,e,f\}$ with edges $\{a,b\},\{a,c\},\{b,d\},\{b,e\},\{c,e\},\{e,f\}$. Start at $a$, inspect neighbors alphabetically, and mark each vertex when first discovered.
    prompt: Give the discovery order for recursive DFS with the stated alphabetical neighbor order.
    answer: $a,b,d,e,c,f$. From $b$, DFS finishes leaf $d$ before exploring $e$; from $e$, it explores $c$ before $f$.
  '65':
    instructions: Use the simple undirected graph $V=\{a,b,c,d,e,f\}$ with edges $\{a,b\},\{a,c\},\{b,d\},\{b,e\},\{c,e\},\{e,f\}$.
    prompt: Write the adjacency list for each vertex and count its total neighbor entries.
    answer: $a:b,c$; $b:a,d,e$; $c:a,e$; $d:b$; $e:b,c,f$; $f:e$. There are 12 entries, twice the six undirected edges.
  '66':
    instructions: Use a finite simple undirected graph with $n$ vertices and $m$ edges.
    prompt: Compare adjacency-matrix and adjacency-list storage for this graph.
    answer: A matrix uses $n^2$ entries. Lists use storage proportional to $n+m$, with two neighbor entries per undirected edge and vertex-list overhead.
  '67':
    instructions: Use a finite simple undirected graph with $n$ vertices and $m$ edges.
    prompt: Under direct array indexing, what is the cost of checking one specified matrix adjacency entry? Contrast an unsorted neighbor list.
    answer: Matrix lookup has constant cost. An unsorted list may require scanning every neighbor of the queried vertex, taking time proportional to its degree in the worst case.
  '68':
    instructions: Use a finite simple undirected graph with $n$ vertices and $m$ edges.
    prompt: Explain the full-traversal time bound using adjacency lists and constant-cost marking.
    answer: Each vertex is discovered once and each neighbor-list entry scanned once. Thus the work is proportional to $n+m$; undirected edges are scanned twice, changing only the constant.
  '69':
    instructions: Use a finite simple undirected graph with $n$ vertices and $m$ edges.
    prompt: Why does scanning an adjacency matrix for all vertices give a quadratic full-traversal bound?
    answer: For each of $n$ vertices, the algorithm scans $n$ possible neighbors, giving $n^2$ entry inspections even when few edges exist.
  '70':
    instructions: ''
    prompt: Does BFS minimize total edge weight in every weighted graph? Give a concrete counterexample.
    answer: No. Let edges $a-b$ have weight 10, $a-c$ weight 1, and $c-b$ weight 1. BFS favors the one-edge route to $b$, but the two-edge route has smaller total weight 2.
  '71':
    instructions: ''
    prompt: Explain what an Euler trail uses exactly once and what a Hamiltonian cycle visits exactly once before returning.
    answer: An Euler trail uses every edge once but may revisit vertices. A Hamiltonian cycle visits every vertex once before returning to the start, but need not use every edge.
  '72':
    instructions: Use finite simple undirected graphs.
    prompt: For the graph with edges $\{a,b\},\{b,c\},\{c,d\},\{d,a\}$, exhibit an Euler circuit and a Hamiltonian cycle.
    answer: '$a,b,c,d,a$ serves as both: it uses every edge once and visits every vertex once before returning.'
  '73':
    instructions: Use finite simple undirected graphs.
    prompt: Does the complete graph on four vertices have an Euler trail? Does it have a Hamiltonian cycle?
    answer: 'It has no Euler trail: all four vertices have odd degree 3, whereas an Euler trail permits zero or two odd vertices. It has a Hamiltonian cycle, for example any cyclic ordering of the four vertices.'
  '74':
    instructions: Use finite simple undirected graphs.
    prompt: For edges $\{a,b\},\{a,c\},\{b,c\},\{c,d\},\{d,e\}$, find an Euler trail and its endpoints.
    answer: $c,a,b,c,d,e$ traverses each edge exactly once. Its endpoints are the two odd-degree vertices, $c,e$.
  '75':
    instructions: Use finite simple undirected graphs.
    prompt: Consider the undirected graph with $V=\{a,b,c,d,e\}$ and $E=\{\{a,b\},\{a,c\},\{b,c\},\{c,d\},\{d,e\}\}$. Can it have a Hamiltonian cycle? Explain.
    answer: No. Vertex $e$ has degree 1, so a cycle cannot both enter and leave it using two distinct incident edges.
  '76':
    instructions: Use finite simple undirected graphs.
    prompt: Two disjoint triangles have every degree even. Do they have one Euler circuit using all edges?
    answer: No. Their edge-bearing vertices are disconnected. The even-degree condition must be accompanied by connectivity of all non-isolated vertices.
  '77':
    instructions: Use finite simple undirected graphs.
    prompt: 'A triangle plus one isolated vertex: is there an Euler circuit using every edge? Is there a Hamiltonian cycle using every vertex?'
    answer: An Euler circuit can traverse the triangle, since isolated vertices do not contribute edges. A Hamiltonian cycle covering all vertices is impossible because it cannot include the isolated vertex.
  '78':
    instructions: Use finite simple undirected graphs.
    prompt: Explain the parity necessity for an open Euler trail with distinct endpoints.
    answer: At every internal visit, an arrival pairs with a departure. All incident edge uses pair except one at the start and one at the end. Exactly those endpoints have odd degree.
  '79':
    instructions: Use finite simple undirected graphs.
    prompt: Outline why a connected edge-bearing undirected graph with all even degrees admits an Euler circuit.
    answer: Follow unused edges until returning to the start; even degrees prevent getting stuck elsewhere. If edges remain, connectivity supplies a vertex on the current closed trail with unused incident edges. Build and splice another closed trail there. Finitely many repetitions exhaust all edges.
  '80':
    instructions: Use finite simple undirected graphs.
    prompt: Does an Euler-degree test decide whether a graph has a Hamiltonian cycle? Give evidence.
    answer: No. The complete graph on four vertices has a Hamiltonian cycle but fails the Euler odd-degree criterion. Euler tests concern covering edges, whereas Hamiltonian questions concern visiting vertices.
asymptotic-growth:
  '1':
    instructions: Inputs $n$ are positive integers. Functions are eventually nonnegative and comparison functions eventually positive. Constants do not depend on $n$.
    prompt: State the definition of $f(n)=O(g(n))$, including the order of the quantifiers.
    answer: There exist $c>0$ and an integer $n_0\geq1$ such that for every integer $n\geq n_0$, $0\leq f(n)\leq cg(n)$. The same constants work for every later index.
  '2':
    instructions: Inputs $n$ are positive integers. Functions are eventually nonnegative and comparison functions eventually positive. Constants do not depend on $n$.
    prompt: State the definition of $f(n)=\Omega(g(n))$.
    answer: There exist $c>0$ and an integer $n_0\geq1$ such that $0\leq cg(n)\leq f(n)$ for every integer $n\geq n_0$. It is an eventual lower bound.
  '3':
    instructions: Inputs $n$ are positive integers. Functions are eventually nonnegative and comparison functions eventually positive. Constants do not depend on $n$.
    prompt: State the definition of $f(n)=\Theta(g(n))$.
    answer: There exist $c_1,c_2>0$ and an integer $n_0\geq1$ such that $0\leq c_1g(n)\leq f(n)\leq c_2g(n)$ for every integer $n\geq n_0$.
  '4':
    instructions: Inputs $n$ are positive integers. Functions are eventually nonnegative and comparison functions eventually positive. Constants do not depend on $n$.
    prompt: Prove $3n+5=O(n)$ with specific constants.
    answer: For $n\geq1$, $3n+5\leq8n$. Choose $c=8,n_0=1$.
  '5':
    instructions: Inputs $n$ are positive integers. Functions are eventually nonnegative and comparison functions eventually positive. Constants do not depend on $n$.
    prompt: Prove $4n^2+2n+9=O(n^2)$ with specific constants.
    answer: For $n\geq1$, both $n\leq n^2$ and $1\leq n^2$, so the expression is at most $15n^2$. Choose $c=15,n_0=1$.
  '6':
    instructions: Inputs $n$ are positive integers. Functions are eventually nonnegative and comparison functions eventually positive. Constants do not depend on $n$.
    prompt: Give matching bounds proving $4n^2+2n+9=\Theta(n^2)$.
    answer: For $n\geq1$, $4n^2\leq4n^2+2n+9\leq15n^2$. Thus $c_1=4,c_2=15,n_0=1$ work.
  '7':
    instructions: Inputs $n$ are positive integers. Functions are eventually nonnegative and comparison functions eventually positive. Constants do not depend on $n$.
    prompt: Prove $2n^2-5n=\Theta(n^2)$ using a valid threshold.
    answer: For $n\geq5$, $n^2\leq2n^2-5n\leq2n^2$. Choose $c_1=1,c_2=2,n_0=5$. Small negative values do not affect eventual growth.
  '8':
    instructions: Inputs $n$ are positive integers. Functions are eventually nonnegative and comparison functions eventually positive. Constants do not depend on $n$.
    prompt: Is $n=O(n^2)$? Is this a tight upper bound? Explain.
    answer: "Yes: $n\\leq n^2$ for $n\\geq1$. It is not a tight order description, since $n$ cannot have a positive constant quadratic lower bound eventually."
  '9':
    instructions: Inputs $n$ are positive integers. Functions are eventually nonnegative and comparison functions eventually positive. Constants do not depend on $n$.
    prompt: Prove the constant function 7 is $\Theta(1)$.
    answer: For every positive integer, $7\cdot1\leq7\leq7\cdot1$. Take $c_1=c_2=7,n_0=1$.
  '10':
    instructions: Inputs $n$ are positive integers. Functions are eventually nonnegative and comparison functions eventually positive. Constants do not depend on $n$.
    prompt: Can choosing $c=n$ prove $n^2=O(n)$? Explain.
    answer: No. The multiplier must be fixed independently of the varying input size. Choosing a new multiplier for each index does not satisfy the definition.
  '11':
    instructions: Inputs $n$ are positive integers. Functions are eventually nonnegative and comparison functions eventually positive. Constants do not depend on $n$.
    prompt: Negate the claim $f=O(g)$ for eventually nonnegative $f$ and positive $g$, working beyond any threshold where their signs are valid.
    answer: For every $c>0$ and every sufficiently large integer threshold $n_0$, there exists an integer $n\geq n_0$ with $f(n)>cg(n)$. Every proposed eventual upper multiplier must fail.
  '12':
    instructions: Inputs $n$ are positive integers. Functions are eventually nonnegative and comparison functions eventually positive. Constants do not depend on $n$.
    prompt: Prove $n^2$ is not $O(n)$.
    answer: Given arbitrary $c>0,n_0\geq1$, choose an integer $n>\max(c,n_0)$. Then $n^2>cn$, defeating every proposed constant and threshold.
  '13':
    instructions: Inputs $n$ are positive integers. Functions are eventually nonnegative and comparison functions eventually positive. Constants do not depend on $n$.
    prompt: Prove $n$ is not $\Omega(n^2)$.
    answer: Given any proposed $c>0,n_0$, choose an integer $n>\max(1/c,n_0)$. Then $cn^2>n$, so the required lower-bound inequality fails.
  '14':
    instructions: Inputs $n$ are positive integers. Functions are eventually nonnegative and comparison functions eventually positive. Constants do not depend on $n$.
    prompt: Prove $n^3$ is not $O(n^2)$.
    answer: For arbitrary $c>0,n_0$, choose an integer $n>\max(c,n_0)$. Then $n^3>cn^2$. No fixed multiplier works eventually.
  '15':
    instructions: Inputs $n$ are positive integers. Functions are eventually nonnegative and comparison functions eventually positive. Constants do not depend on $n$.
    prompt: A function equals 1000000 at $n=1$ and equals $n$ for $n\geq2$. Is it $\Theta(n)$? Give constants.
    answer: Yes. For $n\geq2$, it equals $n$, so $c_1=c_2=1,n_0=2$ work. A finite initial exception does not change the class.
  '16':
    instructions: Inputs $n$ are positive integers. Functions are eventually nonnegative and comparison functions eventually positive. Constants do not depend on $n$.
    prompt: Let $f(n)=n$ for even $n$ and $2n$ for odd $n$. Prove a tight bound.
    answer: For every $n\geq1$, $n\leq f(n)\leq2n$. Hence $f=\Theta(n)$ with constants 1 and 2 and threshold 1.
  '17':
    instructions: Inputs $n$ are positive integers. Functions are eventually nonnegative and comparison functions eventually positive. Constants do not depend on $n$.
    prompt: Let $h(n)=n$ for even $n$ and $n^2$ for odd $n$. Give a quadratic upper bound and a linear lower bound.
    answer: For every $n\geq1$, $n\leq h(n)\leq n^2$. Thus $h=\Omega(n)$ and $h=O(n^2)$, both with multiplier 1 and threshold 1.
  '18':
    instructions: Inputs $n$ are positive integers. Functions are eventually nonnegative and comparison functions eventually positive. Constants do not depend on $n$.
    prompt: Let $h(n)=n$ for even positive integers $n$ and $h(n)=n^2$ for odd positive integers $n$. Prove that $h$ is not $O(n)$.
    answer: Given any $c>0,n_0$, choose an odd integer $n>\max(c,n_0)$. Then $h(n)=n^2>cn$, so a linear upper bound fails.
  '19':
    instructions: Inputs $n$ are positive integers. Functions are eventually nonnegative and comparison functions eventually positive. Constants do not depend on $n$.
    prompt: Let $h(n)=n$ for even positive integers $n$ and $h(n)=n^2$ for odd positive integers $n$. Prove that $h$ is not $\Omega(n^2)$.
    answer: Given any $c>0,n_0$, choose an even integer $n>\max(1/c,n_0)$. Then $h(n)=n<cn^2$, so a quadratic lower bound fails.
  '20':
    instructions: Inputs $n$ are positive integers. Functions are eventually nonnegative and comparison functions eventually positive. Constants do not depend on $n$.
    prompt: Why does checking an inequality at the first million input sizes fail to prove an asymptotic bound on an infinite domain?
    answer: The definition requires every sufficiently large index, including all untested ones. A function can match the tested data and grow differently afterward; finite evidence alone does not control its tail.
  '21':
    instructions: Inputs $n$ are positive integers. Functions are eventually nonnegative and comparison functions eventually positive. Constants do not depend on $n$.
    prompt: 'Prove transitivity: $f=O(g)$ and $g=O(h)$ imply $f=O(h)$.'
    answer: Above the larger threshold, let $f\leq ag$ and $g\leq bh$ for fixed positive $a,b$. Then $f\leq ab h$, which is the required eventual upper bound.
  '22':
    instructions: Inputs $n$ are positive integers. Functions are eventually nonnegative and comparison functions eventually positive. Constants do not depend on $n$.
    prompt: If $f\leq ag$ and $u\leq bv$ eventually, with all functions nonnegative, give a bound for $f+u$.
    answer: Above both thresholds, $f+u\leq ag+bv\leq\max(a,b)(g+v)$. Thus $f+u=O(g+v)$.
  '23':
    instructions: Inputs $n$ are positive integers. Functions are eventually nonnegative and comparison functions eventually positive. Constants do not depend on $n$.
    prompt: Suppose $f(n)\leq a g(n)$ and $u(n)\leq b v(n)$ eventually, where all functions are nonnegative and $a,b$ are fixed positive constants. Give an eventual bound for $f(n)u(n)$ in terms of $g(n)v(n)$ and state the corresponding big-O conclusion.
    answer: "Multiplication preserves the inequalities because quantities are nonnegative: $fu\\leq abgv$. Thus $fu=O(gv)$ above the larger threshold."
  '24':
    instructions: Inputs $n$ are positive integers. Functions are eventually nonnegative and comparison functions eventually positive. Constants do not depend on $n$.
    prompt: Prove $g+h=\Theta(\max(g,h))$ for nonnegative functions whose maximum is eventually positive.
    answer: Pointwise, $\max(g,h)\leq g+h\leq2\max(g,h)$. Constants 1 and 2 give both bounds wherever the comparison is positive.
  '25':
    instructions: Inputs $n$ are positive integers. Functions are eventually nonnegative and comparison functions eventually positive. Constants do not depend on $n$.
    prompt: Give a tight bound for $5n^3+7n^2+2$ with explicit constants.
    answer: For $n\geq1$, $5n^3\leq5n^3+7n^2+2\leq14n^3$. Thus it is $\Theta(n^3)$ with constants 5 and 14.
  '26':
    instructions: Inputs $n$ are positive integers. Functions are eventually nonnegative and comparison functions eventually positive. Constants do not depend on $n$.
    prompt: Both $n^2+1$ and $n^2$ are $\Theta(n^2)$. What is the growth of their difference, and what mistake does this illustrate?
    answer: The difference is 1, hence $\Theta(1)$. Subtracting asymptotic descriptions does not preserve a quadratic lower bound because dominant terms can cancel.
  '27':
    instructions: Inputs $n$ are positive integers. Functions are eventually nonnegative and comparison functions eventually positive. Constants do not depend on $n$.
    prompt: For fixed $a,b>1$, prove $\log_a n=\Theta(\log_b n)$.
    answer: Change of base gives $\log_a n=(1/\log_b a)\log_b n$. The multiplier is a fixed positive constant, so choose it for both bounds and use $n_0=2$.
  '28':
    instructions: Inputs $n$ are positive integers. Functions are eventually nonnegative and comparison functions eventually positive. Constants do not depend on $n$.
    prompt: Changing a fixed logarithm base multiplies by a constant. Why does this not establish $\log_n n=\Theta(\log_2 n)$? Compare the two functions for $n>1$.
    answer: The base now varies with $n$, so the multiplier is not fixed. In fact $\log_n n=1$ for $n>1$, while $\log_2 n$ grows without bound.
  '29':
    instructions: Inputs $n$ are positive integers. Functions are eventually nonnegative and comparison functions eventually positive. Constants do not depend on $n$.
    prompt: If $f=O(n)$, must $f=O(n^2)$? Must $f=\Theta(n)$?
    answer: "The quadratic upper bound follows from $n\\leq n^2$ eventually and transitivity. A linear tight bound does not follow: the constant function 1 is $O(n)$ but not $\\Theta(n)$."
  '30':
    instructions: Inputs $n$ are positive integers. Functions are eventually nonnegative and comparison functions eventually positive. Constants do not depend on $n$.
    prompt: If $f=\Theta(g)$ and $g=\Theta(h)$, prove $f=\Theta(h)$.
    answer: Above all thresholds, suppose $a_1g\leq f\leq a_2g$ and $b_1h\leq g\leq b_2h$. Then $a_1b_1h\leq f\leq a_2b_2h$, giving positive fixed bounds.
  '31':
    instructions: Inputs $n$ are positive integers. Functions are eventually nonnegative and comparison functions eventually positive. Constants do not depend on $n$.
    prompt: State the epsilon definition of $f=o(g)$.
    answer: For every $\varepsilon>0$, there exists an integer $n_0\geq1$ such that $0\leq f(n)\leq\varepsilon g(n)$ for every integer $n\geq n_0$.
  '32':
    instructions: Inputs $n$ are positive integers. Functions are eventually nonnegative and comparison functions eventually positive. Constants do not depend on $n$.
    prompt: Prove $n=o(n^2)$ by giving a threshold in terms of $\varepsilon$.
    answer: Choose an integer $n_0\geq\max(1,1/\varepsilon)$. Then for $n\geq n_0$, $1\leq\varepsilon n$, hence $n\leq\varepsilon n^2$.
  '33':
    instructions: Inputs $n$ are positive integers. Functions are eventually nonnegative and comparison functions eventually positive. Constants do not depend on $n$.
    prompt: Prove $1=o(n)$.
    answer: For any $\varepsilon>0$, choose an integer $n_0\geq\max(1,1/\varepsilon)$. Then $1\leq\varepsilon n$ for every $n\geq n_0$.
  '34':
    instructions: Inputs $n$ are positive integers. Functions are eventually nonnegative and comparison functions eventually positive. Constants do not depend on $n$.
    prompt: Is $n=o(n)$? Use one epsilon to decide.
    answer: No. With $\varepsilon=1/2$, the inequality $n\leq n/2$ fails at every positive index.
  '35':
    instructions: Inputs $n$ are positive integers. Functions are eventually nonnegative and comparison functions eventually positive. Constants do not depend on $n$.
    prompt: For fixed positive integer $d$, explain why $2^n\geq\binom n{d+1}$ when $n\geq d+1$.
    answer: The binomial theorem expresses $2^n$ as the sum of all nonnegative coefficients $\binom nj$. One term of a nonnegative sum cannot exceed the sum.
  '36':
    instructions: Inputs $n$ are positive integers. Functions are eventually nonnegative and comparison functions eventually positive. Constants do not depend on $n$.
    prompt: Fix a positive integer $d$. For integers $n\geq2(d+1)$, bound $\binom n{d+1}$ below by bounding each numerator factor using $n/2$.
    answer: Each of the $d+1$ factors in $n(n-1)\cdots(n-d)$ is at least $n/2$. Therefore $\binom n{d+1}\geq(n/2)^{d+1}/(d+1)!$.
  '37':
    instructions: Inputs $n$ are positive integers. Functions are eventually nonnegative and comparison functions eventually positive. Constants do not depend on $n$.
    prompt: Fix a positive integer $d$. For $n\geq2(d+1)$, you may use $2^n\geq\binom n{d+1}$ and $\binom n{d+1}\geq(n/2)^{d+1}/(d+1)!$. Use these bounds and the epsilon definition to prove $n^d=o(2^n)$.
    answer: They give $n^d/2^n\leq C/n$, where $C=2^{d+1}(d+1)!$. For any $\varepsilon>0$, choose an integer threshold at least $2(d+1)$ and $C/\varepsilon$. Then the ratio is at most $\varepsilon$.
  '38':
    instructions: Inputs $n$ are positive integers. Functions are eventually nonnegative and comparison functions eventually positive. Constants do not depend on $n$.
    prompt: Prove $3^n$ is not $O(2^n)$ using $(3/2)^n\geq1+n/2$.
    answer: Given $c>0,n_0$, choose an integer $n>\max(n_0,2c)$. Then $3^n/2^n\geq1+n/2>c$, so $3^n>c2^n$. Every proposed constant fails.
  '39':
    instructions: Inputs $n$ are positive integers. Functions are eventually nonnegative and comparison functions eventually positive. Constants do not depend on $n$.
    prompt: Order $n^2,1,2^n,n,\log_2 n,n\log_2 n$ from strictly slower to strictly faster eventual growth.
    answer: $1$, $\log_2 n$, $n$, $n\log_2 n$, $n^2$, $2^n$. Adjacent ratios become arbitrarily small in the forward direction; constants and finitely many small values do not alter this ordering.
  '40':
    instructions: Inputs $n$ are positive integers. Functions are eventually nonnegative and comparison functions eventually positive. Constants do not depend on $n$.
    prompt: Explain how $\log_2 n=o(n)$ implies $n\log_2 n=o(n^2)$.
    answer: The ratio $(n\log_2 n)/n^2$ equals $(\log_2 n)/n$. Thus the same epsilon threshold proving the latter comparison proves the former.
  '41':
    instructions: Let $n$ be a positive integer. Loop ranges include both endpoints. Each body operation and loop-control step has constant positive cost.
    prompt: A loop performs one body operation for i from 1 through n. Give its exact body count and tight growth.
    answer: There are $n$ body executions, hence $\Theta(n)$ work when loop control also has constant cost per iteration.
  '42':
    instructions: Let $n$ be a positive integer. Loop ranges include both endpoints. Each body operation and loop-control step has constant positive cost.
    prompt: Two consecutive loops perform one operation per iteration, the first n times and the second 3n times. Give the exact body-operation count and a tight asymptotic bound.
    answer: The total body count is $n+3n=4n$, hence $\Theta(n)$. Sequential phases add.
  '43':
    instructions: Let $n$ be a positive integer. Loop ranges include both endpoints. Each body operation and loop-control step has constant positive cost.
    prompt: Two consecutive loops have lengths n and n squared. Give the exact body-operation count and a tight asymptotic bound.
    answer: The body count is $n+n^2$. For $n\geq1$, it lies between $n^2$ and $2n^2$, so the total is $\Theta(n^2)$.
  '44':
    instructions: Let $n$ be a positive integer. Loop ranges include both endpoints. Each body operation and loop-control step has constant positive cost.
    prompt: An outer loop runs i from 1 through n; for each i, an inner loop runs j from 1 through n. Count the inner body.
    answer: The count is $n\cdot n=n^2$, hence $\Theta(n^2)$ because the full inner loop runs for each outer iteration.
  '45':
    instructions: Let $n$ be a positive integer. Loop ranges include both endpoints. Each body operation and loop-control step has constant positive cost.
    prompt: An outer loop runs i from 1 through n; the inner loop runs j from 1 through 3. Give the exact body-operation count and a tight asymptotic bound.
    answer: The body executes $3n$ times, giving $\Theta(n)$. Two nested loops do not automatically imply quadratic growth.
  '46':
    instructions: Let $n$ be a positive integer. Loop ranges include both endpoints. Each body operation and loop-control step has constant positive cost.
    prompt: An outer loop runs i from 1 through n; the inner loop runs j from 1 through i. Give the exact body count.
    answer: $\sum_{i=1}^n i=n(n+1)/2$. This lies between $n^2/2$ and $n^2$ for $n\geq1$, hence is $\Theta(n^2)$.
  '47':
    instructions: Let $n$ be a positive integer. Loop ranges include both endpoints. Each body operation and loop-control step has constant positive cost.
    prompt: An outer loop runs i from 1 through n; the inner loop runs j from i through n. Give the exact body count.
    answer: $\sum_{i=1}^n(n-i+1)=n(n+1)/2$, since the inner lengths are $n,n-1,\ldots,1$. Thus the growth is quadratic.
  '48':
    instructions: Let $n$ be a positive integer. Loop ranges include both endpoints. Each body operation and loop-control step has constant positive cost.
    prompt: An outer loop runs i from 1 through n; the inner loop runs j from 1 through twice i. Give the exact body-operation count and a tight asymptotic bound.
    answer: $\sum_{i=1}^n2i=n(n+1)$, between $n^2$ and $2n^2$ for positive $n$, so $\Theta(n^2)$.
  '49':
    instructions: Let $n$ be a positive integer. Loop ranges include both endpoints. Copying one element and each loop-control step have constant positive cost.
    prompt: An outer loop runs i from 1 through n. Each iteration copies an n-element array element by element. Classify element-copy work.
    answer: Each of the $n$ iterations copies $n$ elements, totaling $n^2$ writes and quadratic work. Treating the entire array copy as a unit step would change the cost model.
  '50':
    instructions: Let $n$ be a positive integer. Loop ranges include both endpoints. Each body operation and loop-control step has constant positive cost.
    prompt: Why does multiplying maximum inner-loop length by outer-loop count give an upper bound but not always a tight one?
    answer: It replaces every actual inner length by the maximum, possibly overestimating most iterations. A tight bound requires summing actual lengths or a matching lower-bound argument.
  '51':
    instructions: Let $n$ be a positive integer. Loop ranges include both endpoints. Each body operation and loop-control step has constant positive cost.
    prompt: Start i at 1 and repeatedly execute a body and double i while i is at most n. Count executions exactly.
    answer: The values are $2^0$ through $2^k$, where $k=\lfloor\log_2 n\rfloor$. There are $\lfloor\log_2 n\rfloor+1$ executions, hence $\Theta(\log n)$ for $n\geq2$.
  '52':
    instructions: Let $n$ be a positive integer. Loop ranges include both endpoints. Each body operation and loop-control step has constant positive cost.
    prompt: Start $i$ at 1. While $i\leq16$, execute the loop body once and then replace $i$ by $2i$. List the values of $i$ at which the body executes and give the total execution count.
    answer: The values are $1,2,4,8,16$, so there are five executions. Including the endpoint contributes the final execution.
  '53':
    instructions: Let $n$ be a positive integer. Loop ranges include both endpoints. Each body operation and loop-control step has constant positive cost.
    prompt: Start i at 1; while i is at most n, execute an inner body i times, then double i. Give an exact sum and tight bound.
    answer: With $k=\lfloor\log_2 n\rfloor$, the count is $\sum_{j=0}^k2^j=2^{k+1}-1$. It is at least $n/2$ and less than $2n$ for $n\geq1$, hence $\Theta(n)$.
  '54':
    instructions: Let $n$ be a positive integer. Loop ranges include both endpoints. Each body operation and loop-control step has constant positive cost.
    prompt: Start $i$ at 1. While $i\leq n$, execute an inner body $i$ times, then double $i$. A solver multiplies the logarithmic number of outer iterations by the maximum inner count $n$ and reports $\Theta(n\log n)$. Is that bound tight? Give the actual growth rate and justify it.
    answer: The claimed $\Theta(n\log n)$ bound is not tight. $O(n\log n)$ is a valid upper bound, but summing the actual inner lengths gives $\sum_{j=0}^{\lfloor\log_2 n\rfloor}2^j=2^{\lfloor\log_2 n\rfloor+1}-1=\Theta(n)$.
  '55':
    instructions: Let $n$ be a positive integer. Loop ranges include both endpoints. Each body operation and loop-control step has constant positive cost.
    prompt: For n a power of two, start i at n and halve it exactly while i is at least 1, doing one body operation each time. Count executions.
    answer: The values are $n,n/2,\ldots,1$, giving $\log_2 n+1$ executions and logarithmic growth on the stated domain.
  '56':
    instructions: Inputs are $n=2^k$ for integers $k\geq0$; the recurrences apply for $n\geq2$.
    prompt: For positive powers of two, let $T(1)=1$ and $T(n)=2T(n/2)+n$ for $n\geq2$. You may use the exact formula $T(n)=n\log_2 n+n$. Give a tight asymptotic bound with explicit constants and a threshold.
    answer: $T(n)=n\log_2 n+n$. For powers of two $n\geq2$, $n\log_2 n\leq T(n)\leq2n\log_2 n$. Thus $T=\Theta(n\log n)$ with constants 1 and 2.
  '57':
    instructions: Inputs are $n=2^k$ for integers $k\geq0$; the recurrences apply for $n\geq2$.
    prompt: For $S(1)=1$, $S(n)=S(n/2)+1$, give an exact and tight asymptotic solution.
    answer: $S(n)=\log_2 n+1$. For powers of two $n\geq2$, it lies between $\log_2 n$ and $2\log_2 n$, so $S=\Theta(\log n)$.
  '58':
    instructions: Inputs are $n=2^k$ for integers $k\geq0$; the recurrences apply for $n\geq2$.
    prompt: For $U(1)=1$, $U(n)=2U(n/2)+1$, give an exact and tight asymptotic solution.
    answer: $U(n)=2n-1$. For powers of two $n\geq1$, $n\leq U(n)\leq2n$, so $U=\Theta(n)$.
  '59':
    instructions: Inputs are $n=2^k$ for integers $k\geq0$; the recurrences apply for $n\geq2$.
    prompt: On positive powers of two, define $S(1)=U(1)=1$, $S(n)=S(n/2)+1$, and $U(n)=2U(n/2)+1$ for $n\geq2$. Why do their recursion trees have the same depth but different asymptotic total work?
    answer: Both halve the argument each level, but the two-child recurrence processes all nodes in a branching tree. Depth counts only levels; total work also counts how many nodes occupy them.
  '60':
    instructions: Inputs are $n=2^k$ for integers $k\geq0$; the recurrences apply for $n\geq2$.
    prompt: A nonnegative cost satisfies only $T(1)=1$ and $T(n)\leq2T(n/2)+n$ on powers of two. Is $T(n)=\Theta(n\log n)$ justified?
    answer: Only the corresponding upper bound is justified. The constant function $T(n)=1$ satisfies these inequalities, so a matching lower bound does not follow.
  '61':
    instructions: ''
    prompt: For linear search in a nonempty n-element array, give best- and worst-case comparison counts.
    answer: The best case is 1 when the first item matches. The worst case is $n$, for example when the target is absent. Hence the respective bounds are $\Theta(1)$ and $\Theta(n)$.
  '62':
    instructions: ''
    prompt: Does Big O mean worst case and Omega mean best case? Explain.
    answer: No. O and Omega specify upper and lower bounds on a chosen function. Best-case and worst-case functions can each receive either type of bound.
  '63':
    instructions: ''
    prompt: If the worst-case cost is Omega(n), does every size-n input eventually require linear work?
    answer: No. The maximum over size-$n$ inputs is bounded below, so some input incurs that much cost. Other inputs can be faster, as linear search demonstrates.
  '64':
    instructions: ''
    prompt: What extra information is needed to define average-case running time?
    answer: A probability distribution over inputs of each size is needed, so the expected cost is well defined. An unspecified average over possible inputs is not a complete model.
  '65':
    instructions: ''
    prompt: Why does an implementation using at most n squared comparisons not prove that every algorithm for its task needs quadratic work?
    answer: It establishes an upper bound for one implementation. A problem-wide lower bound must quantify over every permitted algorithm in a specified model.
  '66':
    instructions: ''
    prompt: Under a model where one operation writes at most one output element, prove a lower bound for copying an n-element array into a separate explicit array.
    answer: "The output requires $n$ element writes, so at least $n$ operations are necessary: $\\Omega(n)$. Writing each element once also gives an $O(n)$ algorithm, yielding $\\Theta(n)$."
  '67':
    instructions: ''
    prompt: Copying an $n$-element array into a separate explicit array requires $\Omega(n)$ operations when one operation writes at most one output element. Why does creating a shared reference to the existing array not require the same lower bound?
    answer: The required output is now a reference rather than $n$ separately written elements. The argument counted required element writes, which are not part of this changed task.
  '68':
    instructions: ''
    prompt: Find the binary bit length of the positive integer $N=1000$.
    answer: $2^9=512\leq1000<1024=2^{10}$, so its bit length is $\lfloor\log_2 1000\rfloor+1=10$.
  '69':
    instructions: ''
    prompt: An algorithm loops N times for a positive integer input N. Express the possible iteration magnitude in terms of its bit length b.
    answer: $2^{b-1}\leq N<2^b$. Thus the iteration count is $\Theta(2^b)$ as a function of bit length, despite being linear in the numeric value $N$.
  '70':
    instructions: ''
    prompt: Why can arbitrary-precision arithmetic invalidate a unit-cost assumption for additions inside a loop?
    answer: The operands may gain digits as execution proceeds. In a bit-operation model, adding longer numbers requires processing more bits, so one addition need not have bounded constant cost.
  '71':
    instructions: Inputs $n$ are positive integers. Functions are eventually nonnegative and comparison functions eventually positive. Constants do not depend on $n$.
    prompt: Prove $n^3+100n=\Theta(n^3)$ with explicit constants.
    answer: For $n\geq1$, $n^3\leq n^3+100n\leq101n^3$. Constants 1 and 101 and threshold 1 suffice.
  '72':
    instructions: Inputs $n$ are positive integers. Functions are eventually nonnegative and comparison functions eventually positive. Constants do not depend on $n$.
    prompt: Prove $n^2/(n+1)=\Theta(n)$ with explicit constants.
    answer: For $n\geq1$, $n\leq n+1\leq2n$. Therefore $n/2\leq n^2/(n+1)\leq n$, giving constants $1/2$ and 1.
  '73':
    instructions: Inputs $n$ are positive integers. Functions are eventually nonnegative and comparison functions eventually positive. Constants do not depend on $n$.
    prompt: Is $2^n+n^4=\Theta(2^n)$? Justify both bounds using the fixed-power growth result.
    answer: The expression is at least $2^n$. Since $n^4=o(2^n)$, choose its epsilon-1 threshold so $n^4\leq2^n$ afterward. Then the sum is at most $2\cdot2^n$, proving both bounds.
  '74':
    instructions: Inputs $n$ are positive integers. Functions are eventually nonnegative and comparison functions eventually positive. Constants do not depend on $n$.
    prompt: Is $n\log_2 n=O(n^2)$? Is it $\Theta(n^2)$?
    answer: The upper bound holds since $\log_2 n\leq n$ for positive integers. It is not a quadratic tight bound because $\log_2 n=o(n)$ gives $n\log_2 n=o(n^2)$.
  '75':
    instructions: Let $n\geq1$ be the number of vertices and $m\geq0$ the number of edges. Here a bound in two input quantities means fixed positive constants that work for all allowed graphs, independently of both $n$ and $m$.
    prompt: A complete adjacency-list traversal examines each vertex once and each undirected edge twice. State a tight bound under constant-cost inspections.
    answer: The count is $n+2m$, between $n+m$ and $2(n+m)$. Thus the traversal is $\Theta(n+m)$ when all vertices and adjacency entries are included.
  '76':
    instructions: Inputs $n$ are positive integers. Functions are eventually nonnegative and comparison functions eventually positive. Constants do not depend on $n$.
    prompt: Why can replacing an adjacency list by an adjacency matrix change full graph traversal cost from n+m to n squared?
    answer: A matrix traversal may inspect all $n$ possible neighbors for each vertex, including nonedges, giving $n^2$ inspections. Lists inspect only stored neighbor entries plus vertex overhead.
  '77':
    instructions: Inputs $n$ are positive integers. Functions are eventually nonnegative and comparison functions eventually positive. Constants do not depend on $n$.
    prompt: Give nonnegative functions $f,g$ such that $f=O(g)$ but $g$ is not $O(f)$, and justify.
    answer: Take $f(n)=n,g(n)=n^2$. The first inequality holds with multiplier 1 for $n\geq1$. For any proposed multiplier $c>0$ and threshold $n_0$, choose an integer $n>\max(c,n_0)$. Then $n^2>cn$, so the reverse bound fails beyond every proposed threshold.
  '78':
    instructions: Inputs $n$ are positive integers. Functions are eventually nonnegative and comparison functions eventually positive. Constants do not depend on $n$.
    prompt: If $f=o(g)$, prove $f=O(g)$. Does the converse hold?
    answer: "Apply the little-o definition with $\\varepsilon=1$ to get an eventual upper bound. The converse fails for $f=g=n$: it is $O(n)$ but fails little o at $\\varepsilon=1/2$."
  '79':
    instructions: Inputs $n$ are positive integers. Functions are eventually nonnegative and comparison functions eventually positive. Constants do not depend on $n$.
    prompt: An algorithm has a worst-case upper bound O(n log n). A benchmark on one input takes linear work. Does that contradict the bound?
    answer: No. An upper bound allows smaller costs, and a single input need not realize the worst case. Neither observation proves a matching worst-case lower bound.
  '80':
    instructions: Inputs $n$ are positive integers. Functions are eventually nonnegative and comparison functions eventually positive. Constants do not depend on $n$.
    prompt: Outline the steps needed to make a defensible asymptotic claim about a program with nested loops and growing integer operands.
    answer: Define the input-size parameter and the chosen best, worst, or expected cost function. State the operation model, count actual loop iterations with sums, include operand-size-dependent costs, and prove upper and any claimed lower bounds with constants and thresholds.
linear-algebra-vectors:
  '1':
    instructions: ''
    prompt: An arrow starts at (2,-1) and ends at (5,3). Give its displacement vector and explain whether moving its starting point changes the vector.
    answer: 'The displacement is (3,4): subtract the starting coordinates from the ending coordinates. Translating both endpoints by the same amount preserves these differences and therefore represents the same vector.'
  '2':
    instructions: ''
    prompt: A data vector lists (hours studied, exercises attempted). Explain why (2,5) and (5,2) are different observations, and state the number of components.
    answer: There are two components. The first observation records two hours and five attempts; the second records five hours and two attempts. Coordinates are ordered and have assigned meanings, so exchanging them changes the observation.
  '3':
    instructions: ''
    prompt: For u=(2,-3) and v=(-1,4), find u+v, u-v, and -2u. Explain the geometric effect of the negative scalar.
    answer: The sum is (1,1), the difference is (3,-7), and -2u=(-4,6). A negative factor reverses direction; its magnitude two doubles the length.
  '4':
    instructions: ''
    prompt: A traveler moves (4,1), then (-2,3), then (0,-1). Find the total displacement. Does it determine the distance traveled? Explain.
    answer: The total displacement is (2,3). It gives the change from start to finish, not the distance along the three parts of the route. Different routes can have the same total displacement.
  '5':
    instructions: ''
    prompt: Let u=(1,2) and v=(2,-1). Find 3u-2v, showing the component arithmetic.
    answer: Three u is (3,6), and negative two v is (-4,2). Adding gives (-1,8). Both components must be scaled before the vectors are added.
  '6':
    instructions: ''
    prompt: Can (3,1) be expressed as a linear combination of (1,1) and (2,2)? Justify your answer without testing only a few coefficients.
    answer: No. With arbitrary coefficients a and b, every combination has the form (a+2b,a+2b), so its two components agree. The target's components differ; no coefficient choice can produce it.
  '7':
    instructions: ''
    prompt: A product uses (3,2) units of wood and metal, in that order. A second product uses (1,4). Find the resources for two of the first and three of the second, and name one assumption of this calculation.
    answer: The resource vector is two times (3,2) plus three times (1,4), or (9,16). The model assumes additive resource use proportional to production, with no extra setup use or changing waste rate.
  '8':
    instructions: ''
    prompt: The resource model for products u and v allows a mathematical combination -u+2v. Explain why this need not describe a feasible production plan.
    answer: Real linear combinations permit negative coefficients. A negative number of manufactured products is not ordinarily feasible. Physical feasibility imposes additional constraints, such as nonnegative whole-number quantities, that are not part of vector addition itself.
linear-algebra-dot-products:
  '1':
    instructions: ''
    prompt: Compute the dot product of (1,-2,3) and (4,0,-1). Is the result a scalar or a vector?
    answer: The component products are 4, 0, and -3; their sum is 1. The result is a scalar, not a list of three products.
  '2':
    instructions: ''
    prompt: Let u=(1,2), v=(3,0), and w=(-1,4). Verify distributivity by calculating u dot (v+w) and (u dot v)+(u dot w) separately.
    answer: The sum v+w is (2,4), so u dot (v+w) is 2+8=10. The separate dot products are 3 and -1+8=7, which add to 10.
  '3':
    instructions: ''
    prompt: Find the norm of (6,8) and a unit vector in its direction. Explain why your normalized vector has length one.
    answer: The norm is the square root of 36+64, or 10. Dividing gives (3/5,4/5). The sum of its squared components is 9/25+16/25=1, so its norm is one.
  '4':
    instructions: ''
    prompt: Find the distance between the points (1,-1) and (4,3). Explain why either subtraction order gives the same distance.
    answer: Their difference is (3,4), with norm 5. Reversing the order gives (-3,-4); squaring the components gives the same norm, so distance does not depend on the subtraction order.
  '5':
    instructions: ''
    prompt: Determine whether u=(2,3) and v=(3,-2) are orthogonal. Does their orthogonality imply they are unit vectors?
    answer: Their dot product is 6-6=0, so they are orthogonal. Each has norm the square root of 13, not one. Perpendicularity and unit length are separate conditions.
  '6':
    instructions: ''
    prompt: The dot product of two nonzero vectors is negative. Is their angle acute, right, or obtuse? Explain using the angle identity.
    answer: It is obtuse. The product of the two positive norms is positive, so a negative dot product requires a negative cosine. For an angle between zero and 180 degrees, that occurs strictly above 90 degrees.
  '7':
    instructions: ''
    prompt: Prices are (3,2,5) and quantities are (2,4,1), paired in the same order. Compute the total cost and explain the role of the dot product.
    answer: The cost is 3 times 2 plus 2 times 4 plus 5 times 1, or 19. The dot product pairs each price with its own quantity and adds those item costs.
  '8':
    instructions: ''
    prompt: Compare u=(1,2) and v=(2,4). Find their cosine similarity and explain why a value of one does not make the vectors equal.
    answer: Their dot product is 10 and the product of their norms is also 10, so cosine similarity is one. They have the same direction, but v has twice u's length and different components.
linear-algebra-matrices:
  '1':
    instructions: ''
    prompt: A matrix has rows (1,2,3) and (4,5,6). State its shape, its entry in row two column three, and the rows of its transpose.
    answer: Its shape is two by three, and the specified entry is 6. Its transpose is three by two with rows (1,4), (2,5), and (3,6).
  '2':
    instructions: ''
    prompt: Let A have rows (1,-1),(2,0) and B have rows (3,2),(0,4). Find the rows of 2A+B.
    answer: Twice A has rows (2,-2),(4,0). Adding corresponding entries of B gives rows (5,0),(4,4). Equal shapes make the addition defined.
  '3':
    instructions: ''
    prompt: Let A have rows (1,2),(3,-1). Compute Ax for x=(2,3) using both the row-dot-product and column-combination readings.
    answer: Row dot products give 2+6=8 and 6-3=3. The column reading gives two times (1,3) plus three times (2,-1), again (8,3).
  '4':
    instructions: ''
    prompt: A three by two matrix has columns (1,0,2) and (-1,3,1). Find its output on (0,1) and explain why no full row calculation is necessary.
    answer: The output is its second column, (-1,3,1). The input selects zero copies of the first column and one copy of the second.
  '5':
    instructions: ''
    prompt: Let A have rows (1,1),(0,1), and let B have rows (2,0),(0,1). Compute AB and BA and state which transformation acts first in ABx.
    answer: AB has rows (2,1),(0,1), while BA has rows (2,2),(0,1). In ABx, B acts first and A acts on B's output. The two products are unequal.
  '6':
    instructions: ''
    prompt: A is two by three and B is three by four. State the shape of AB and explain whether BA is defined.
    answer: 'AB is two by four: the inner sizes three and three match. BA is not defined because B has four columns but A has two rows.'
  '7':
    instructions: ''
    prompt: A has rows (1,0),(0,0), and B has rows (0,0),(0,1). Compute AB. What scalar-style inference does this example disprove?
    answer: AB is the two by two zero matrix even though neither factor is zero. A zero product of matrices does not imply that at least one factor is the zero matrix.
  '8':
    instructions: ''
    prompt: A proposed matrix C has columns (2,3) and (5,7). What outputs should C give on (1,0) and (0,1), and how could these tests help check a claimed product?
    answer: The outputs should be (2,3) and (5,7), respectively. Apply the claimed component transformations in order to these standard inputs and compare the results with C's columns.
linear-algebra-systems:
  '1':
    instructions: ''
    prompt: Solve x+y=5 and x-y=1. Verify the same pair in both original equations.
    answer: Adding gives 2x=6, so x=3 and y=2. The checks are 3+2=5 and 3-2=1. A solution must use the same values in both equations.
  '2':
    instructions: ''
    prompt: Using variable order x then y, state the rows of the augmented matrix for 2x+3y=7 and -x+y=4.
    answer: The augmented rows are (2,3,7) and (-1,1,4). The first two columns contain coefficients, and the last column contains the right-hand-side constants.
  '3':
    instructions: ''
    prompt: Solve x+2y=4 and 3x+5y=11 by replacing the second equation with the second minus three times the first. Show the resulting equation.
    answer: The new second equation is -y=-1, so y=1. Substitution into the first gives x=2. The original equations check as 2+2=4 and 6+5=11.
  '4':
    instructions: ''
    prompt: Why is multiplying a row by zero not an allowed solution-preserving elementary row operation? Give a one-equation example.
    answer: It cannot be undone and may erase a restriction. For example, replacing x=1 with 0=0 turns a one-value solution set into all real values of x.
  '5':
    instructions: ''
    prompt: Classify the system x+y=2 and 2x+2y=5 as having no solution, one solution, or infinitely many. Justify using elimination.
    answer: There is no solution. Subtracting twice the first equation from the second yields 0=1, which is impossible.
  '6':
    instructions: ''
    prompt: Describe every real solution of x+2y=4 and 2x+4y=8 using a parameter. Identify the free variable.
    answer: The second equation is twice the first. Let y=t for arbitrary real t; then x=4-2t. The free variable is y, and every such pair satisfies both equations.
  '7':
    instructions: ''
    prompt: Find all solutions of x+y=0. Give one nontrivial solution and explain why the system must also have the zero solution.
    answer: Every solution is (-t,t) for real t. For instance (-1,1) is nontrivial. All homogeneous systems admit zero because multiplying zero inputs gives a zero output.
  '8':
    instructions: ''
    prompt: A matrix A satisfies Ap=b and Az=0, with z nonzero. Prove that p+3z is another solution of Ax=b and is different from p.
    answer: Distributivity gives A(p+3z)=Ap+3Az=b+0=b. Since z is nonzero, 3z is nonzero over the real numbers, so p+3z differs from p.
linear-algebra-span:
  '1':
    instructions: ''
    prompt: Does (3,4) lie in the span of u=(1,0) and v=(1,2)? Find coefficients or prove none exist.
    answer: Yes. The second coordinate forces the coefficient of v to be 2. The first then forces the coefficient of u to be 1, so u+2v=(3,4).
  '2':
    instructions: ''
    prompt: Describe the span of (2,-1) geometrically and decide whether (6,-3) and (1,1) belong to it.
    answer: 'The span is the line through the origin in direction (2,-1). The first target is three times that vector and belongs. The second cannot be a scalar multiple: its first coordinate would require scalar one half, producing second coordinate negative one half rather than one.'
  '3':
    instructions: ''
    prompt: Determine whether u=(1,2), v=(2,4) are linearly independent. Give a zero combination that supports your conclusion.
    answer: They are dependent because 2u-v=0 has coefficients 2 and -1, not both zero. The vector v supplies no direction beyond u.
  '4':
    instructions: ''
    prompt: Prove that (1,0,1) and (0,1,1) are linearly independent.
    answer: An arbitrary combination with coefficients a and b is (a,b,a+b). If it equals zero, its first two coordinates force a=0 and b=0. Thus the only zero combination is the trivial one.
  '5':
    instructions: ''
    prompt: Is the set of plane vectors (x,y) satisfying x+y=0 a subspace? Check zero, addition, and scalar multiplication.
    answer: Yes. Zero satisfies the equation. Adding two pairs whose coordinate sums are zero gives another with sum zero. Scaling such a pair multiplies its zero coordinate sum by the scalar, leaving zero.
  '6':
    instructions: ''
    prompt: Is the set of plane vectors with x at least zero a subspace? Give a decisive justification.
    answer: No. It contains (1,0), but multiplying this vector by -1 gives (-1,0), which is outside the set. Closure under every real scalar fails.
  '7':
    instructions: ''
    prompt: A matrix has three columns and its homogeneous system has one free variable. Are the columns independent? Explain using a nontrivial homogeneous solution.
    answer: They are dependent. Choosing a nonzero value for the free variable and solving for the pivot variables gives a nonzero coefficient vector sent to zero, a nontrivial zero combination of the columns.
  '8':
    instructions: ''
    prompt: Do the independent vectors (1,0,1) and (0,1,1) span all of three-dimensional space? Identify a condition on every vector they span and give an unreachable target.
    answer: No. Every combination is (a,b,a+b), so the third coordinate must equal the first plus the second. The target (0,0,1) violates that condition. Independence does not imply coverage of the entire ambient space.
linear-algebra-bases:
  '1':
    instructions: ''
    prompt: For the ordered basis p=(1,1), q=(1,-1), find the coordinates of (5,1). Distinguish them from standard coordinates.
    answer: Solving a+b=5 and a-b=1 gives a=3, b=2. The coordinates in the ordered basis (p,q) are (3,2); standard coordinates remain (5,1).
  '2':
    instructions: ''
    prompt: Give a basis and dimension for the subspace consisting of all multiples of (2,-1,3). Explain why one vector suffices.
    answer: The one-vector list containing (2,-1,3) is a basis. It spans by the definition of the subspace and is independent because that vector is nonzero. The dimension is one.
  '3':
    instructions: ''
    prompt: A matrix has five columns and three pivots. Find its rank and nullity. What do the free variables describe?
    answer: Rank is three and nullity is two. The two free variables parameterize the homogeneous solutions, describing input freedom that produces no output change.
  '4':
    instructions: ''
    prompt: A has columns (1,0), (0,1), and (1,1). Give a column-space basis using original columns and a null-space basis.
    answer: The first two columns form a column-space basis. Solving x1+x3=0 and x2+x3=0 gives all multiples of (-1,-1,1), so that one nonzero vector is a null-space basis.
  '5':
    instructions: ''
    prompt: Find the inverse of the matrix with rows (1,2),(0,1), and verify it by multiplication.
    answer: The inverse has rows (1,-2),(0,1). Multiplying in either order yields diagonal entries one and off-diagonal entries zero, the identity.
  '6':
    instructions: ''
    prompt: Is the matrix with rows (1,2),(2,4) invertible? Justify using both its determinant and its columns.
    answer: No. Its determinant is 4-4=0, and its second column is twice its first. Its rank is only one, so it loses an input direction and cannot be undone.
  '7':
    instructions: ''
    prompt: A three by two matrix has two independent columns. Can every three-component target have a solution? Can a target have two different solutions? Explain.
    answer: Its column space has dimension two, so it cannot reach every three-component target. Its null space is zero, so any reachable target has exactly one solution. Existence and uniqueness are different questions.
  '8':
    instructions: ''
    prompt: Why should a column-space basis be selected from the original matrix's pivot-indexed columns, rather than directly from its row-reduced columns?
    answer: Row operations preserve which columns depend on which others, so pivot indices identify an independent spanning selection. They can change the actual output vectors and hence the column space, so the corresponding original columns are needed.
linear-algebra-transformations:
  '1':
    instructions: ''
    prompt: Prove that T(x,y)=(2x-y,3y) is linear by checking addition and scalar multiplication for arbitrary inputs.
    answer: For inputs (x,y),(a,b), T(x+a,y+b)=(2x+2a-y-b,3y+3b), equal to the sum of their outputs. For any real c, T(cx,cy)=(c(2x-y),c(3y))=cT(x,y). Both required properties hold.
  '2':
    instructions: ''
    prompt: The rule T(x,y)=(x squared,y) takes zero to zero. Is it linear? Give a decisive argument.
    answer: No. T(2,0)=(4,0), while twice T(1,0)=(2,0), so scalar multiplication is not preserved. The zero test is necessary but not sufficient.
  '3':
    instructions: ''
    prompt: A linear transformation sends (1,0) to (2,1) and (0,1) to (-1,3). State its matrix rows and its output on (3,2).
    answer: The matrix has rows (2,-1),(1,3), placing the given outputs in columns. The output is three times (2,1) plus two times (-1,3), or (4,9).
  '4':
    instructions: ''
    prompt: Find the image of (3,-2) under a right-angle counterclockwise rotation, using its action on the two standard basis vectors.
    answer: The basis vectors go to (0,1) and (-1,0). Thus the input goes to three times (0,1) minus two times (-1,0), or (2,3).
  '5':
    instructions: ''
    prompt: For T(x,y,z)=(x,y), find the kernel and image. State whether T is injective and surjective when its codomain is the coordinate plane.
    answer: The kernel is all (0,0,t), with real t; the image is the whole plane. It is not injective because the third coordinate is lost, but it is surjective onto the stated codomain.
  '6':
    instructions: ''
    prompt: A linear transformation has a nonzero vector v in its kernel. Prove that it cannot be injective.
    answer: Both v and the zero vector have zero output. These are distinct inputs since v is nonzero, contradicting injectivity.
  '7':
    instructions: ''
    prompt: Is T(x,y)=(x+2,y-1) linear or affine but not linear? Explain using its value at zero.
    answer: It is affine but not linear. Its value at (0,0) is (2,-1), whereas a linear transformation must preserve zero. It is the identity linear rule plus a fixed nonzero offset.
  '8':
    instructions: ''
    prompt: P converts coordinates in a new basis to standard coordinates, and A represents a linear rule in standard coordinates. Explain the order of operations in the new-basis matrix P inverse times A times P.
    answer: First P converts the input to standard coordinates; then A applies the rule; finally P inverse converts the output back. Matrix products act right to left, giving that order without changing the underlying transformation.
linear-algebra-projections:
  '1':
    instructions: ''
    prompt: Project b=(4,2) onto the line spanned by u=(1,1). Find the residual and check its perpendicularity to u.
    answer: The coefficient is (4+2)/(1+1)=3. The projection is (3,3), and the residual is (1,-1). Its dot product with u is 1-1=0.
  '2':
    instructions: ''
    prompt: Why does replacing a nonzero line direction u by 2u leave the projection of a target onto that line unchanged?
    answer: In the projection formula the numerator doubles, the denominator quadruples, and the final direction vector doubles. These factors cancel. Geometrically, u and 2u span the same line.
  '3':
    instructions: ''
    prompt: Use Gram–Schmidt on u=(1,0) followed by v=(1,1). Give the resulting orthonormal vectors and show the subtraction step.
    answer: The first normalized direction is (1,0). The projection of v onto it is (1,0); subtracting leaves (0,1), already unit length. The resulting ordered list is (1,0),(0,1).
  '4':
    instructions: ''
    prompt: Q has the single column (1,0). Compute Q transpose times Q and Q times Q transpose. Explain why only one is an identity matrix of its size.
    answer: Q transpose Q is the one by one matrix containing 1, an identity. Q Q transpose has rows (1,0),(0,0), a projection onto the horizontal axis, not the two by two identity.
  '5':
    instructions: ''
    prompt: Find the least-squares constant fit c to observations 2,4,9. Give the fitted output and the residual b minus the fitted output.
    answer: The normal equation is 3c=15, giving c=5. The fitted output is (5,5,5), and the residual is (-3,-1,4). Its components sum to zero, making it perpendicular to the column of ones.
  '6':
    instructions: ''
    prompt: A has one column (1,2) and b=(1,1). Solve the scalar normal equation for the coefficient, then give the fitted output.
    answer: A transpose A is 5 and A transpose b is 3, so the coefficient is 3/5. The fitted output is (3/5,6/5). The residual (2/5,-1/5) has zero dot product with (1,2).
  '7':
    instructions: ''
    prompt: A least-squares calculation returns a nonzero residual. Does that alone mean the calculation is wrong? Explain.
    answer: No. If the target lies outside the column space, no exact fit exists and the closest permitted output has a nonzero residual. The residual should be orthogonal to the column space at a least-squares solution.
  '8':
    instructions: ''
    prompt: Why might two different coefficient vectors give the same unique closest output in a least-squares problem?
    answer: Dependent columns give a nonzero null-space direction. Adding such a direction to a coefficient vector does not change its output. The projection output can therefore be unique even when its coefficient representation is not.
linear-algebra-eigenvalues:
  '1':
    instructions: ''
    prompt: A has diagonal entries 2 and -1, with zeros off the diagonal. Which of (1,0), (0,1), and (1,1) are eigenvectors? Give each corresponding eigenvalue.
    answer: The first vector is an eigenvector with eigenvalue 2, and the second with eigenvalue -1. The third goes to (2,-1), which is not a single scalar multiple of (1,1), so it is not an eigenvector.
  '2':
    instructions: ''
    prompt: Explain why the zero vector is excluded from the definition of eigenvector, while zero is allowed as an eigenvalue.
    answer: Zero input satisfies A0=lambda times 0 for every scalar, so it identifies no special direction. Eigenvalue zero is meaningful when a nonzero input is sent to zero, indicating a nontrivial kernel.
  '3':
    instructions: ''
    prompt: Find the eigenvalues and a nonzero eigenvector for each for A with rows (4,1),(0,2). Show how the determinant condition and homogeneous equations are used.
    answer: The determinant of A-lambda I is (4-lambda)(2-lambda), giving eigenvalues 4 and 2. For 4, the second component is zero, so (1,0) works. For 2, 2x+y=0, so (1,-2) works. Direct multiplication confirms both.
  '4':
    instructions: ''
    prompt: For A with rows (3,0),(0,3), describe the eigenspace for eigenvalue 3 and identify which members are eigenvectors.
    answer: A-3I is zero, so the eigenspace is the entire coordinate plane. Every nonzero vector in it is an eigenvector; zero belongs to the eigenspace but is not an eigenvector.
  '5':
    instructions: ''
    prompt: Independent vectors u and v form a basis, with Au=2u and Av=3v. Find A applied three times to the input u-2v, expressed in that basis.
    answer: Each application scales the u coefficient by 2 and the v coefficient by 3. After three applications the result is 8u-54v. Linearity lets the two basis components be tracked separately.
  '6':
    instructions: ''
    prompt: P has eigenvectors of A as its columns, and D has their eigenvalues in the matching order. Explain why AP=PD and why independence of the columns is needed for diagonalization.
    answer: Column by column, both products contain the corresponding eigenvector multiplied by its eigenvalue. Independence makes P invertible, so the relation can be rewritten as A=P D P inverse and used as a coordinate change.
  '7':
    instructions: ''
    prompt: A has rows (1,1),(0,1). Determine its eigenvectors' directions and explain why it is not diagonalizable over the real numbers.
    answer: Its only eigenvalue is one. Solving (A-I)v=0 forces the second component to zero, so all eigenvectors lie on the horizontal axis. There cannot be two independent eigenvectors to form a plane basis.
  '8':
    instructions: ''
    prompt: Why does a right-angle rotation of the real coordinate plane have no real eigenvector?
    answer: It turns every nonzero vector to a perpendicular direction, which cannot be a real scalar multiple of the original nonzero vector. This claim concerns real eigenvectors, not the theory over complex numbers.
linear-algebra-svd:
  '1':
    instructions: ''
    prompt: For a three by two matrix, state the shapes of U, Sigma, and V in the full SVD. Explain which factor contains the length scale factors.
    answer: U is three by three, Sigma is three by two, and V is two by two. Sigma contains nonnegative singular values on its diagonal; the orthogonal U and V factors preserve length.
  '2':
    instructions: ''
    prompt: Does an orthogonal factor in an SVD have to be a rotation rather than a reflection? Explain what property is actually required.
    answer: No. Reflections are allowed. The required property is an orthonormal basis of columns, equivalently transpose times the matrix equals identity; this preserves lengths and angles.
  '3':
    instructions: ''
    prompt: Let U be identity, Sigma have diagonal entries 3 and 1, and V swap the two standard basis vectors. Compute the rows of U Sigma V transpose and its output on (2,4).
    answer: V transpose also swaps coordinates. The product has rows (0,3),(1,0), sending (2,4) to (12,2). The scale factors are 3 and 1 along the chosen right singular directions.
  '4':
    instructions: ''
    prompt: A diagonal matrix has diagonal entries 5 and 2. Describe the image of the unit circle and identify the greatest and least output lengths for unit inputs.
    answer: The image is an ellipse with horizontal semiaxis five and vertical semiaxis two. The greatest output length is five along the horizontal input direction, and the least is two along the vertical direction.
  '5':
    instructions: ''
    prompt: A real matrix has singular values 4,2,0 and has three columns. Find its rank and nullity, and give the eigenvalues of A transpose A.
    answer: Rank is two because two singular values are positive. Nullity is one by rank plus nullity equals three. The eigenvalues of A transpose A are 16,4,0, the squares of the singular values.
  '6':
    instructions: ''
    prompt: Why is it invalid to construct a left singular vector by dividing Av by sigma when sigma is zero? What does Av equal in that case?
    answer: Division by zero is undefined. A zero singular value corresponds to a right direction in the null space, so Av is zero. The remaining output basis directions must be completed separately.
  '7':
    instructions: ''
    prompt: A diagonal matrix has entries 6,3,1. Form a rank-one truncated SVD approximation and give its Frobenius error exactly.
    answer: Keep only the entry six, giving diagonal entries (6,0,0). The discarded squared singular values sum to 9+1=10, so the Frobenius error is the square root of ten.
  '8':
    instructions: ''
    prompt: Does discarding a small singular value prove the discarded information is scientifically unimportant? Explain the distinction between the approximation theorem and interpretation.
    answer: No. The theorem concerns an error norm and a rank limit, not scientific importance. A small component can carry meaningful information, and rescaling data can change singular values. Interpretation requires knowledge of the data and purpose.
