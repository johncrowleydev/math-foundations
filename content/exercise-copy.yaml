  '28':
    instructions: Sequence indices are nonnegative integers; the recurrence applies for every integer $n\geq1$.
    prompt: Why must the case $r=1$ be treated separately in the geometric-sum solution to $a_n=ra_{n-1}+b$?
    answer: The formula involving $(r^n-1)/(r-1)$ has zero denominator at $r=1$. Direct iteration instead gives $a_n=a_0+bn$.
  '29':
    instructions: Sequence indices are nonnegative integers; the recurrence applies for every integer $n\geq1$.
    prompt: For $a_0=5$, $a_n=0a_{n-1}-2$, give the solution and its equilibrium.
    answer: The equilibrium is $-2$. The sequence is $a_0=5$ and $a_n=-2$ for $n\geq1$. Stating the initial term separately avoids $0^0$.
  '30':
    instructions: Sequence indices are nonnegative integers; the recurrence applies for every integer $n\geq1$.
    prompt: Verify $a_n=3^{n+1}-1$ for $a_0=2$, $a_n=3a_{n-1}+2$.
    answer: At $n=0$ the value is 2. For $n\geq1$, $3(3^n-1)+2=3^{n+1}-1$. Initial agreement and the recurrence establish the formula by induction.
  '31':
    instructions: Sequence indices are nonnegative integers; the recurrence applies for every integer $n\geq1$.
    prompt: Solve $a_0=0$, $a_n=2a_{n-1}+2^n$ by normalizing.
