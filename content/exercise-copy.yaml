    prompt: Does the conclusion follow from the premises? Explain, giving a counterexample interpretation if it does not.
    answer: 'Valid: $a$ is a witness; existential introduction.'
  '93':
    instructions: Use a nonempty domain; the named object $a$, when present, belongs to it.
    prompt: Determine validity for a previously fixed $a$.
    answer: Invalid. On $D=\{a,b\}$, let $P$ hold only at $b$. The existential is true, but $P(a)$ is false.
  '94':
    instructions: Use a nonempty domain; the named object $a$, when present, belongs to it.
    prompt: Does the conclusion follow from the premises? Explain, giving a counterexample interpretation if it does not.
    answer: Valid. A witness for $P$ also satisfies $Q$ by the universal implication and modus ponens.
  '95':
    instructions: Use a nonempty domain; the named object $a$, when present, belongs to it.
    prompt: Does the conclusion follow from the premises? Explain, giving a counterexample interpretation if it does not.
    answer: Invalid. On $D=\{a\}$ take $P(a)=F$, $Q(a)=T$. Both premises are true; no $P$-witness exists.
  '96':
    instructions: Use a nonempty domain; the named object $a$, when present, belongs to it.
    prompt: Does the conclusion follow from the premises? Explain, giving a counterexample interpretation if it does not.
    answer: Invalid. Use two objects, with $P$ true only at one and $Q$ true only at the other.
  '97':
    instructions: ''
    prompt: From $\forall x(P(x)\lor Q(x))$ and $\forall x\neg P(x)$, may we conclude $\forall xQ(x)$?
    answer: Yes. For an arbitrary element, disjunctive syllogism gives $Q$; since the element was arbitrary, the conclusion is universal.
  '98':
    instructions: ''
    prompt: From $\forall x(P(x)\to Q(x))$ and $\forall x\neg Q(x)$, may we conclude $\forall x\neg P(x)$?
    answer: Yes. Apply modus tollens to an arbitrary element, then universally generalize.
  '99':
    instructions: ''
    prompt: A student verifies $P(0)$, $P(1)$, and $P(2)$ and concludes $\forall n\in\mathbb{Z}\,P(n)$. Is the inference valid?
    answer: "No. For example, $P(n): n\\geq0$ holds at all three tested values but fails at $n=-1$."
  '100':
    instructions: ''
    prompt: A proof selects witness $n=3$ for $\exists n\in\mathbb{Z}(n^2=9)$ and concludes $\forall n\in\mathbb{Z}(n^2=9)$. What went wrong?
    answer: The witness is specially chosen, not arbitrary. The universal conclusion is false at $n=0$.
  '101':
    instructions: Let $D=\{a,b,c\}$, with three distinct objects. The true cases are exactly $R(a,a)$, $R(a,b)$, $R(b,c)$, and $R(c,b)$; all other choices of inputs make $R$ false.
    prompt: Is this statement true or false? Explain your answer.
    answer: 'True: $R(a,b)$ is one of the stated true cases.'
  '102':
    instructions: Let $D=\{a,b,c\}$, with three distinct objects. The true cases are exactly $R(a,a)$, $R(a,b)$, $R(b,c)$, and $R(c,b)$; all other choices of inputs make $R$ false.
    prompt: Is this statement true or false? Explain your answer.
    answer: False. The stated true cases do not include $R(b,a)$.
  '103':
    instructions: Let $D=\{a,b,c\}$, with three distinct objects. The true cases are exactly $R(a,a)$, $R(a,b)$, $R(b,c)$, and $R(c,b)$; all other choices of inputs make $R$ false.
    prompt: Is this statement true or false? Explain your answer.
    answer: 'True. Witnesses: for $a$ choose $a$ (or $b$); for $b$ choose $c$; for $c$ choose $b$.'
  '104':
    instructions: Let $D=\{a,b,c\}$, with three distinct objects. The true cases are exactly $R(a,a)$, $R(a,b)$, $R(b,c)$, and $R(c,b)$; all other choices of inputs make $R$ false.
    prompt: Is this statement true or false? Explain your answer.
    answer: 'False. No column is all true: column $a$ fails at $b$, column $b$ fails at $b$, and column $c$ fails at $a$.'
  '105':
    instructions: Let $D=\{a,b,c\}$, with three distinct objects. The true cases are exactly $R(a,a)$, $R(a,b)$, $R(b,c)$, and $R(c,b)$; all other choices of inputs make $R$ false.
    prompt: Is this statement true or false? Explain your answer.
    answer: True. For column $a$ choose row $a$; for $b$ choose $a$ or $c$; for $c$ choose $b$.
  '106':
    instructions: Let $D=\{a,b,c\}$, with three distinct objects. The true cases are exactly $R(a,a)$, $R(a,b)$, $R(b,c)$, and $R(c,b)$; all other choices of inputs make $R$ false.
    prompt: Is this statement true or false? Explain your answer.
    answer: False. Row $a$ lacks $c$, row $b$ lacks $a$, and row $c$ lacks $a$.
  '107':
    instructions: Let $D=\{a,b,c\}$, with three distinct objects. The true cases are exactly $R(a,a)$, $R(a,b)$, $R(b,c)$, and $R(c,b)$; all other choices of inputs make $R$ false.
    prompt: Is this statement true or false? Explain your answer.
    answer: False. Row $a$ has two distinct witnesses, $a$ and $b$.
  '108':
    instructions: Let $D=\{a,b,c\}$, with three distinct objects. The true cases are exactly $R(a,a)$, $R(a,b)$, $R(b,c)$, and $R(c,b)$; all other choices of inputs make $R$ false.
    prompt: Is this statement true or false? Explain your answer.
    answer: 'True: $x=a$ is a witness because $R(a,a)$ is true. The other same-input cases, $R(b,b)$ and $R(c,c)$, are false.'
  '109':
    instructions: Let $D=\{a,b,c\}$, with three distinct objects. The true cases are exactly $R(a,a)$, $R(a,b)$, $R(b,c)$, and $R(c,b)$; all other choices of inputs make $R$ false.
    prompt: Is this statement true or false? Explain your answer.
    answer: 'False: $R(a,b)$ is true but $R(b,a)$ is false.'
  '110':
    instructions: Let $D=\{a,b,c\}$, with three distinct objects. The true cases are exactly $R(a,a)$, $R(a,b)$, $R(b,c)$, and $R(c,b)$; all other choices of inputs make $R$ false.
    prompt: Is this statement true or false? Explain your answer.
    answer: True. When $x=a$, choose $y=b$; when $x=b$, choose $y=c$; when $x=c$, choose $y=b$. Each choice is different from its input and makes $R(x,y)$ true.
  '111':
    instructions: ''
    prompt: Prove that every integer has a larger integer.
    answer: Let $n$ be an arbitrary integer and choose $m=n+1$. Then $m$ is an integer and $m>n$, proving $\forall n\in\mathbb{Z}\exists m\in\mathbb{Z}(m>n)$.
  '112':
    instructions: ''
    prompt: 'Prove: for every integer $n$, if $n$ is even, then $n^2$ is even.'
    answer: Take arbitrary integer $n$ and assume $n=2k$ for integer $k$. Then $n^2=4k^2=2(2k^2)$ is even. This proves the required universal implication.
  '113':
    instructions: ''
    prompt: 'Prove: for every integer $n$, if $n$ is odd, then $n^2$ is odd.'
    answer: Write the arbitrary odd integer as $n=2k+1$. Then $n^2=2(2k^2+2k)+1$ is odd, since $2k^2+2k$ is an integer.
  '114':
    instructions: ''
    prompt: Prove that for every real $x$ there is a real $y$ with $y>x^2$.
    answer: Given arbitrary real $x$, choose $y=x^2+1$. It is real and exceeds $x^2$ by 1.
  '115':
    instructions: ''
    prompt: Refute the claim that there is a smallest integer.
    answer: For any candidate $n$, the integer $m=n-1$ violates $n\leq m$. Thus no candidate works.
  '116':
    instructions: ''
    prompt: Let $R$ be the set of requests, $W$ the set of workers, and $A(r,w)$ mean worker $w$ is assigned to request $r$. Express "Every request has exactly one worker." Does this forbid one worker from serving two requests?
    answer: "$\\forall r\\in R\\exists!w\\in W\\,A(r,w)$. No: uniqueness is per request. The same worker may be the unique worker for several requests."
  '117':
    instructions: ''
    prompt: Let $R$ be the set of requests, $W$ the set of workers, and $A(r,w)$ mean worker $w$ is assigned to request $r$. Negate and interpret "Every request has an assigned worker."
    answer: $\exists r\in R\forall w\in W\,\neg A(r,w)$. There is at least one request with no assigned worker.
  '118':
    instructions: ''
    prompt: For an empty array, what do JavaScript's every and some return? Does checking every element of a finite sample prove a statement about all integers?
    answer: The every method returns true and some returns false. A finite exhaustive check proves the property only for the elements in that array; it does not establish an infinite universal claim.
  '119':
    instructions: ''
    prompt: A specification says every valid input produces a correct output. What would refute it? Would an incorrect output on an invalid input suffice?
    answer: A valid input producing an incorrect output refutes the implication. An invalid input does not satisfy its antecedent and therefore is not a counterexample.
  '120':
    instructions: ''
    prompt: Prove that each integer $n$ has exactly one integer $m$ with $n+m=0$. Does one fixed $m$ work for every $n$?
    answer: 'Existence: choose $m=-n$. Uniqueness: any solution of $n+m=0$ must satisfy $m=-n$. There is no global witness: $n=0$ requires $m=0$, whereas $n=1$ requires $m=-1$.'
sets-and-set-operations:
  '1':
    instructions: ''
    prompt: List $\{n\in\mathbb Z:-3\leq n\leq4\text{ and }n\text{ is even}\}$.
    answer: $\{-2,0,2,4\}$. Each listed integer satisfies both restrictions.
  '2':
    instructions: ''
    prompt: Are $\{1,1,2,3\}$ and $\{3,2,1\}$ equal? State their cardinality.
    answer: Yes. Order and repetitions do not affect membership; both have cardinality 3.
  '3':
    instructions: ''
    prompt: Let $A=\{1,\{2\},\varnothing\}$. Decide whether $2\in A$ and whether $\{2\}\in A$.
    answer: $2\notin A$, but $\{2\}\in A$. The listed element is the singleton set, not its element 2.
  '4':
    instructions: ''
    prompt: For $A=\{1,\{2\},\varnothing\}$, decide whether $\varnothing\subseteq A$ and whether $\varnothing\in A$.
    answer: Both are true. The empty set is a subset of every set and is also explicitly listed here.
  '5':
    instructions: ''
    prompt: Distinguish the cardinalities of $\varnothing$, $\{\varnothing\}$, and $\{\varnothing,\{\varnothing\}\}$.
    answer: They are 0, 1, and 2. The last set has two different elements, one empty and one nonempty.
  '6':
    instructions: ''
    prompt: Let $A=\{1,3\}$ and $B=\{1,2,3\}$. Which of $A\subseteq B$, $A\subsetneq B$, and $B\subseteq A$ hold?
    answer: The first two hold. The third fails because $2\in B$ but $2\notin A$.
  '7':
    instructions: ''
    prompt: Write a set-builder description of all integers divisible by 5.
    answer: $\{n\in\mathbb Z:\exists k\in\mathbb Z,\ n=5k\}$, equivalently $\{5k:k\in\mathbb Z\}$.
  '8':
    instructions: ''
    prompt: List the solutions of $x^2=9$ first in $\mathbb Z$, then in the positive integers.
    answer: In $\mathbb Z$ the set is $\{-3,3\}$. Among positive integers it is $\{3\}$. The domain changes the set.
  '9':
    instructions: ''
    prompt: Negate $A\subseteq B$ as a statement about an element.
    answer: There exists $x$ with $x\in A$ and $x\notin B$. One such witness refutes inclusion.
  '10':
    instructions: ''
    prompt: Explain why $A\subseteq A$ holds even when $A$ is empty.
    answer: Every implication $x\in A\to x\in A$ is true. If $A$ is empty, there are no elements violating it.
  '11':
    instructions: ''
    prompt: Let $A=\{1,2,4,6\}$ and $B=\{2,3,6,7\}$. Find $A\cup B$.
    answer: $\{1,2,3,4,6,7\}$, containing each element that belongs to at least one input set.
  '12':
    instructions: ''
    prompt: Let $A=\{1,2,4,6\}$ and $B=\{2,3,6,7\}$. Find $A\cap B$.
    answer: $\{2,6\}$; only these elements occur in both.
  '13':
    instructions: ''
    prompt: Let $A=\{1,2,4,6\}$ and $B=\{2,3,6,7\}$. Find both directional differences.
    answer: $A\setminus B=\{1,4\}$ and $B\setminus A=\{3,7\}$.
  '14':
    instructions: ''
    prompt: Let $U=\{1,2,3,4,5,6,7,8\}$ and $A=\{1,2,4,6\}$. Find $A^c$.
    answer: $\{3,5,7,8\}$, the members of the stated universe missing from $A$.
  '15':
    instructions: ''
    prompt: Let $A=\{1,2,4,6\}$ and $B=\{2,3,6,7\}$. Find $A\mathbin{\triangle}B$.
    answer: $\{1,3,4,7\}$; the common elements 2 and 6 are excluded.
  '16':
    instructions: ''
    prompt: With $U=\{1,2,3,4,5,6,7,8\}$, $A=\{1,2,4,6\}$, and $B=\{2,3,6,7\}$, compute $(A\cup B)^c$ and $A^c\cap B^c$.
    answer: Both are $\{5,8\}$, illustrating De Morgan's law.
  '17':
    instructions: ''
    prompt: Let $U=\{1,2,3,4,5,6,7,8\}$, $A=\{1,2,4,6\}$, and $B=\{2,3,6,7\}$. Compute $(A\cap B)^c$ relative to $U$.
    answer: $\{1,3,4,5,7,8\}$ because only 2 and 6 are excluded from $U$.
  '18':
    instructions: ''
    prompt: Let $A=\{1,2,3\}$, $B=\{2,3,4\}$, and $C=\{3,5\}$. Compute $(A\cup B)\setminus C$.
    answer: $\{1,2,4\}$. First form $\{1,2,3,4\}$, then remove 3.
  '19':
    instructions: ''
    prompt: Let $A=\{1,2,3\}$, $B=\{2,3,4\}$, and $C=\{3,5\}$. Compute $A\setminus(B\setminus C)$ and $(A\setminus B)\setminus C$.
    answer: The first is $\{1,3\}$ since $B\setminus C=\{2,4\}$. The second is $\{1\}$. Difference is not associative.
  '20':
    instructions: ''
    prompt: Is $A=\{2,4\}$ disjoint from $B=\{4,6\}$? Is the empty set disjoint from itself?
    answer: The first pair is not disjoint because its intersection is $\{4\}$. The empty set is disjoint from itself because its intersection with itself is empty.
  '21':
    instructions: ''
    prompt: Prove $A\cap B\subseteq A$ by choosing an arbitrary element.
    answer: If $x\in A\cap B$, the definition of intersection gives $x\in A$ and $x\in B$. In particular $x\in A$, proving the inclusion for every such element.
  '22':
    instructions: ''
    prompt: Prove $A\subseteq A\cup B$ for arbitrary sets.
    answer: Let $x\in A$. Then $x\in A$ or $x\in B$ is true, so $x\in A\cup B$. This covers every element of $A$.
  '23':
    instructions: ''
    prompt: For $A,B\subseteq U$, prove $A\setminus B=A\cap B^c$.
    answer: An element is in the left side exactly when it is in $A$ and not in $B$. Since members of $A$ lie in $U$, this is exactly membership in both $A$ and $B^c$. The equivalence proves both inclusions.
  '24':
    instructions: ''
    prompt: Prove the absorption identity $A\cup(A\cap B)=A$.
    answer: Every element of the left side is either in $A$ already or in $A\cap B$, hence in $A$. Conversely, every member of $A$ belongs to the union. Both inclusions give equality.
  '25':
    instructions: ''
    prompt: For subsets of $U$, prove $(A\cap B)^c=A^c\cup B^c$.
    answer: For $x\in U$, failure to belong to $A\cap B$ means that $x$ is missing from at least one of $A,B$. This is exactly $x\in A^c$ or $x\in B^c$, hence membership in their union.
  '26':
    instructions: ''
    prompt: Prove $A\cap(B\cup C)=(A\cap B)\cup(A\cap C)$.
    answer: Membership in the left means $x\in A$ and at least one of $x\in B,x\in C$. Distributing AND over OR gives membership in $A\cap B$ or in $A\cap C$, exactly the right side. Each step is an equivalence.
  '27':
    instructions: ''
    prompt: Simplify $(A\cap B)\cup(A\cap B^c)$ for subsets of one universe, citing laws.
    answer: By distributivity it is $A\cap(B\cup B^c)=A\cap U=A$. The complement and identity laws justify the last steps.
  '28':
    instructions: ''
    prompt: Simplify $A\setminus(A\setminus B)$ and justify the result.
    answer: It is $A\cap B$. A member must be in $A$ but fail the condition of being in $A$ and outside $B$, so it must also be in $B$; the reverse implication follows directly.
  '29':
    instructions: ''
    prompt: Is $A\setminus(B\cup C)=(A\setminus B)\cup(A\setminus C)$ always true? Refute or prove.
    answer: False. Take $A=\{1,2\}$, $B=\{1\}$, and $C=\{2\}$. The left side is empty; the right is $\{1,2\}$. The correct connective on the right is intersection.
  '30':
    instructions: ''
    prompt: Prove that $A\subseteq B$ implies $B^c\subseteq A^c$ when complements use the same $U$.
    answer: If $x\in B^c$, then $x\in U$ and $x\notin B$. Were $x$ in $A$, the assumed inclusion would put it in $B$. Thus $x\notin A$ and $x\in A^c$.
  '31':
    instructions: ''
    prompt: List $\mathcal P(\{a,b\})$.
    answer: $\{\varnothing,\{a\},\{b\},\{a,b\}\}$. These are the four possible subsets.
  '32':
    instructions: ''
    prompt: List $\mathcal P(\varnothing)$ and state its size.
    answer: $\mathcal P(\varnothing)=\{\varnothing\}$ has size 1, since the empty set has exactly one subset.
  '33':
    instructions: ''
    prompt: If a finite set has five elements, how many subsets does it have? Explain.
    answer: $2^5=32$. Each element is independently included or excluded.
  '34':
    instructions: ''
    prompt: Let $A=\{1,2\}$. Decide whether $\{1\}\in\mathcal P(A)$ and whether $1\in\mathcal P(A)$.
    answer: "The first is true because $\\{1\\}\\subseteq A$. The second is false under the ordinary distinction between these numbers and subsets: members of the displayed power set are $\\varnothing,\\{1\\},\\{2\\},\\{1,2\\}$."
  '35':
    instructions: ''
    prompt: List $\{0,1\}\times\{a,b\}$.
    answer: $\{(0,a),(0,b),(1,a),(1,b)\}$. Each first coordinate is paired with each second coordinate.
  '36':
    instructions: ''
    prompt: If $|A|=3$ and $|B|=4$, find $|A\times B|$ and $|\mathcal P(A\times B)|$.
    answer: The product has $3\cdot4=12$ elements, so its power set has $2^{12}=4096$ elements.
  '37':
    instructions: ''
    prompt: Prove $A\times\varnothing=\varnothing$ for every set $A$.
    answer: A member would need a second coordinate in the empty set, which is impossible. Therefore the product has no members.
  '38':
    instructions: ''
    prompt: Give nonempty sets for which $A\times B\ne B\times A$ even though both products have equal size.
    answer: Let $A=\{1\}$ and $B=\{2\}$. The products are $\{(1,2)\}$ and $\{(2,1)\}$, distinct singleton sets.
  '39':
    instructions: ''
    prompt: Prove $A\subseteq B$ implies $\mathcal P(A)\subseteq\mathcal P(B)$.
    answer: If $S\in\mathcal P(A)$, then $S\subseteq A$. Together with $A\subseteq B$, this gives $S\subseteq B$, so $S\in\mathcal P(B)$.
  '40':
    instructions: ''
    prompt: Prove $\mathcal P(A\cap B)=\mathcal P(A)\cap\mathcal P(B)$.
    answer: A set $S$ is a subset of $A\cap B$ exactly when every member of $S$ belongs to both $A$ and $B$. This is exactly $S\subseteq A$ and $S\subseteq B$, the condition for the right side.
  '41':
    instructions: ''
    prompt: In a class, 24 use Python, 18 use JavaScript, and 10 use both. How many use at least one?
    answer: $24+18-10=32$. The overlap must be subtracted once.
  '42':
    instructions: ''
    prompt: In a class, 24 students use Python, 18 use JavaScript, and 10 use both. How many use exactly one of these languages?
    answer: $(24-10)+(18-10)=22$, counting the two disjoint exclusive groups.
  '43':
    instructions: ''
    prompt: A universe has 50 members. Sets have sizes 24 and 18, with overlap 10. How many universe members are in neither?
    answer: Their union has 32 members, so $50-32=18$ are in neither.
  '44':
    instructions: ''
    prompt: Finite sets satisfy $|A|=17$, $|B|=14$, and $|A\cup B|=25$. Find $|A\cap B|$.
    answer: $17+14-25=6$. Rearranging inclusion-exclusion gives the overlap.
  '45':
    instructions: ''
    prompt: Can subsets of a 20-element universe have sizes 15 and 12 and be disjoint? Explain a lower bound on their intersection.
    answer: No. Their union is at most 20, so the intersection is at least $15+12-20=7$.
  '46':
    instructions: ''
    prompt: Three finite sets have sizes 20, 16, 12; pairwise intersections have sizes 8, 5, 4; the triple intersection has size 2. Find the union size.
    answer: $20+16+12-8-5-4+2=33$. Pairwise counts include the triple members.
  '47':
    instructions: ''
    prompt: Suppose $|A\cap B|=8$, $|A\cap C|=5$, $|B\cap C|=4$, and the triple overlap has size 2. How many members are in exactly two sets?
    answer: $(8-2)+(5-2)+(4-2)=11$. Each triple member is removed from each of the three pairwise counts.
  '48':
    instructions: ''
    prompt: For sizes 20, 16, 12, pairwise intersections 8, 5, 4, and triple intersection 2, how many members are in exactly one set?
    answer: The exclusive sizes are $20-8-5+2=9$, $16-8-4+2=6$, and $12-5-4+2=5$. Their sum is 20.
  '49':
    instructions: ''
    prompt: Explain the coefficient of an element belonging to all three sets in the three-set inclusion-exclusion formula.
    answer: It is counted three times in individual sizes, subtracted three times in pairwise intersections, and added once in the triple term. Its net coefficient is $3-3+1=1$.
  '50':
    instructions: ''
    prompt: Explain why equal finite cardinalities do not prove two sets equal, and give an example.
    answer: $\{1,2\}$ and $\{3,4\}$ both have size 2 but have different members. Equality requires identical membership, not merely matching counts.
  '51':
    instructions: ''
    prompt: Does $\{\{1,3\},\{2,4\}\}$ partition $\{1,2,3,4\}$? Check every requirement.
    answer: Yes. Both blocks are nonempty, their intersection is empty, and their union is the stated set.
  '52':
    instructions: ''
    prompt: Does $\{\{1,2\},\{2,3\}\}$ partition $\{1,2,3\}$?
    answer: No. The blocks overlap at 2, violating pairwise disjointness.
  '53':
    instructions: ''
    prompt: Does $\{\{1\},\{2\}\}$ partition $\{1,2,3\}$?
    answer: No. Their union misses 3, so coverage fails.
  '54':
    instructions: ''
    prompt: Does $\{\varnothing,\{1,2\}\}$ form a partition of $\{1,2\}$? Explain which requirement holds or fails.
    answer: No. A partition has only nonempty blocks; the empty block violates that condition.
  '55':
    instructions: ''
    prompt: Describe the partition of the empty set. Explain how it meets the definition.
    answer: The empty collection of blocks. It has no empty block; its union is empty, and the nonemptiness and disjointness conditions have no counterexamples.
  '56':
    instructions: ''
    prompt: Partition $\mathbb Z$ into even and odd integers, and justify coverage and disjointness.
    answer: The blocks are $\{2k:k\in\mathbb Z\}$ and $\{2k+1:k\in\mathbb Z\}$. Both are nonempty. Division by 2 gives exactly one remainder 0 or 1, so every integer is in exactly one block.
  '57':
    instructions: ''
    prompt: Let $A_i=\{1,\ldots,i\}$ for $i=1,2,3,4$. Compute their union and intersection.
    answer: The union is $\{1,2,3,4\}$ and the intersection is $\{1\}$. The sets are nested, so the largest controls the union and smallest controls the intersection.
  '58':
    instructions: ''
    prompt: Let $A_i=\{i,i+1\}$ for $i=1,2,3$. Compute their union and intersection.
    answer: "The union is $\\{1,2,3,4\\}$. The intersection is empty: no element belongs to all three sets."
  '59':
    instructions: ''
    prompt: For a fixed universe $U$, what are the union and intersection of an empty indexed family of subsets? Explain.
    answer: The union is empty since no indexed set can supply a member. The intersection is $U$ since every $x\in U$ satisfies the requirement of belonging to all zero indexed sets.
  '60':
    instructions: ''
    prompt: Explain why pairwise intersections being nonempty does not force a three-way intersection to be nonempty.
    answer: Take $A=\{1,2\}$, $B=\{2,3\}$, and $C=\{1,3\}$. Their pairwise intersections are $\{2\},\{1\},\{3\}$, but no element belongs to all three.
  '61':
    instructions: Let $U$ be all users. The subsets $E,T,S,X$ contain employees, trained users, suspended users, and users given a training exception, respectively. Complements are relative to $U$.
    prompt: Write a set expression for the trained employees who are not suspended.
    answer: $E\cap T\cap S^c$. Each of the three membership conditions must hold.
  '62':
    instructions: Let $U$ be all users. The subsets $E,T,S,X$ contain employees, trained users, suspended users, and users given a training exception, respectively. Complements are relative to $U$.
    prompt: A policy permits exactly $E\cap T\cap S^c$. Express the denied users using unions and complements.
    answer: $E^c\cup T^c\cup S$, by De Morgan's law. Failing any one requirement causes denial.
  '63':
    instructions: Let $U$ be all users. The subsets $E,T,S,X$ contain employees, trained users, suspended users, and users given a training exception, respectively. Complements are relative to $U$.
    prompt: Only employees may enter. Users with a training exception may skip training but must still pass the suspension check. Express the allowed set.
    answer: $E\cap(T\cup X)\cap S^c$. The exception changes only the training condition.
  '64':
    instructions: Let $U$ be all users. The subsets $E,T,S,X$ contain employees, trained users, suspended users, and users given a training exception, respectively. Complements are relative to $U$.
    prompt: Give a counterexample showing that $(E\cap T\cap S^c)\cup X$ can admit a suspended user.
    answer: Take $U=\{u\}$ and $S=X=\{u\}$, with $E=T=\varnothing$. The expression includes $u$ through $X$, although $u$ is suspended.
  '65':
    instructions: ''
    prompt: Prove that $A\setminus B$ and $A\cap B$ partition $A$ if both sets are nonempty. Explain the qualification.
    answer: Every member of $A$ is either in $B$ or outside $B$, so the two sets cover $A$ and are disjoint. They are blocks only if nonempty; otherwise discard an empty piece to obtain a partition.
  '66':
    instructions: ''
    prompt: Refute the claim that $A\cup B=A\cup C$ implies $B=C$.
    answer: Let $A=\{1\}$, $B=\varnothing$, and $C=\{1\}$. Both unions equal $\{1\}$, but $B\ne C$.
  '67':
    instructions: ''
    prompt: Prove that if $A\subseteq B$ and $B\subseteq C$, then $A\subseteq C$.
    answer: Choose $x\in A$. The first inclusion puts $x$ in $B$, and the second puts it in $C$. Hence every member of $A$ belongs to $C$.
  '68':
    instructions: ''
    prompt: Is $A\times(B\cap C)=(A\times B)\cap(A\times C)$ always true? Give an element proof.
    answer: Yes. A pair $(a,b)$ belongs to the left exactly when $a\in A$ and $b$ belongs to both $B,C$. That is exactly membership in both products on the right.
  '69':
    instructions: ''
    prompt: Refute $\mathcal P(A\cup B)=\mathcal P(A)\cup\mathcal P(B)$ in general.
    answer: Let $A=\{1\}$ and $B=\{2\}$. The subset $\{1,2\}$ belongs to the left power set but neither power set on the right.
  '70':
    instructions: ''
    prompt: Prove that if $A\mathbin{\triangle}B=\varnothing$, then $A=B$.
    answer: If an element belonged to $A$ but not $B$, or to $B$ but not $A$, it would belong to the symmetric difference. None does, so both inclusions hold and the sets are equal.
  '71':
    instructions: ''
    prompt: A student claims $\varnothing\in A$ because the empty set is a subset of every set. Identify and repair the mistake.
    answer: Membership and inclusion were confused. The universally true claim is $\varnothing\subseteq A$. Membership fails, for example, for $A=\{1\}$.
  '72':
    instructions: ''
    prompt: A claimed equality proof establishes only $A\subseteq B$. What remains, and why?
    answer: It must establish $B\subseteq A$. For example, $\{1\}\subseteq\{1,2\}$ holds but equality fails because of the extra element 2.
  '73':
    instructions: ''
    prompt: Let $A=\{x\in\mathbb Z:x^2<5\}$ and $B=\{x\in\mathbb Z:x\text{ is even}\}$. Compute $A\cap B$ and $A\setminus B$.
    answer: $A=\{-2,-1,0,1,2\}$. The intersection is $\{-2,0,2\}$ and the difference is $\{-1,1\}$.
  '74':
    instructions: ''
    prompt: Suppose finite disjoint sets have sizes 5 and 7. Find the number of subsets of their union.
    answer: The union has 12 elements, so it has $2^{12}=4096$ subsets. Disjointness justifies adding the sizes.
  '75':
    instructions: ''
    prompt: A feature set has six elements. How many subsets must include a particular feature and exclude a different particular feature?
    answer: $2^4=16$. Two membership choices are fixed, leaving four independent binary choices.
  '76':
    instructions: ''
    prompt: Prove $A\cap B=A$ if and only if $A\subseteq B$.
    answer: If the intersection equals $A$, each $x\in A$ lies in the intersection and hence in $B$. Conversely, if $A\subseteq B$, every member of $A$ is in both sets, while every member of the intersection is already in $A$; equality follows.
  '77':
    instructions: ''
    prompt: For finite sets, can $|A\cap B|>|A|$ occur? Explain without a formula.
    answer: No. The intersection is a subset of $A$, so all its distinct elements are already among the $|A|$ members of $A$.
  '78':
    instructions: ''
    prompt: Let a partition of a finite set have nonempty blocks of sizes 3, 4, and 5. Find the set size and explain why overlaps need no correction.
    answer: The size is $3+4+5=12$. Partition blocks are pairwise disjoint, so each element is counted exactly once.
  '79':
    instructions: ''
    prompt: If $A\times B=\varnothing$ and $A\ne\varnothing$, prove $B=\varnothing$.
    answer: Choose $a\in A$. If some $b\in B$ existed, then $(a,b)$ would belong to the product, contradicting its emptiness. Thus $B$ has no elements.
  '80':
    instructions: ''
    prompt: Prove that equal complements imply equal sets when both complements use the same universe. Explain why the universe must be fixed.
    answer: "If $A^c=B^c$ in $U$, complementing again gives $A=B$. Different universes can give equal complements for unequal sets: with $U=\\{1\\}, A=U$ and $V=\\{2\\}, B=V$, both relative complements are empty but $A\\ne B$."
relations:
  '1':
    instructions: ''
    prompt: Let $A=\{1,2\}$ and $B=\{u,v,w\}$. How many pairs are available for a relation from $A$ to $B$?
    answer: $|A\times B|=2\cdot3=6$. A relation selects any subset of these six pairs.
  '2':
    instructions: ''
    prompt: Let $R=\{(1,u),(2,v),(2,w)\}$. Which of $1Ru$, $1Rv$, and $2Rw$ hold?
    answer: $1Ru$ and $2Rw$ hold; $1Rv$ does not, because its pair is absent.
  '3':
    instructions: ''
    prompt: For $R=\{(1,u),(2,v),(2,w)\}$ from $\{1,2\}$ to $\{u,v,w\}$, list the related outputs of each input.
    answer: Input 1 relates to $u$. Input 2 relates to both $v,w$. Multiple outputs are permitted for a general relation.
  '4':
    instructions: ''
    prompt: Write the Boolean matrix of $R=\{(1,1),(1,3),(2,2),(3,1)\}$ on $\{1,2,3\}$ using that row and column order.
    answer: The rows are $(1,0,1)$, $(0,1,0)$, and $(1,0,0)$. Entry $(i,j)$ is 1 exactly when $iRj$.
  '5':
    instructions: ''
    prompt: A relation on $\{a,b\}$ has matrix rows $(0,1)$ and $(1,1)$ in order $a,b$. List its pairs.
    answer: $\{(a,b),(b,a),(b,b)\}$. The last pair is a loop.
  '6':
    instructions: ''
    prompt: A directed graph on $\{a,b,c\}$ has arrows $a\to b$, $b\to c$, and a loop at $c$. Write its relation.
    answer: $\{(a,b),(b,c),(c,c)\}$. Arrows encode ordered pairs with source first.
  '7':
    instructions: ''
    prompt: Let $R=\{(a,1),(a,2),(b,2)\}$. Find $R^{-1}$.
    answer: $\{(1,a),(2,a),(2,b)\}$, obtained by reversing every pair.
  '8':
    instructions: ''
    prompt: How many relations exist from a two-element set to a three-element set? Justify.
    answer: $2^6=64$. Each of the six pairs is independently included or excluded.
  '9':
    instructions: ''
    prompt: How many relations exist from the empty set to a five-element set?
    answer: 'Exactly one: the empty relation. The Cartesian product is empty and has one subset.'
  '10':
    instructions: ''
    prompt: Does the pair list alone determine reflexivity without knowing the underlying set? Use $R=\{(1,1)\}$ as an example.
    answer: No. It is reflexive on $\{1\}$ but not on $\{1,2\}$, where the loop at 2 is missing.
  '11':
    instructions: ''
    prompt: On $A=\{1,2\}$, classify $R=\{(1,1),(2,2),(1,2)\}$ as reflexive, symmetric, antisymmetric, and transitive.
    answer: Reflexive, antisymmetric, and transitive; not symmetric since $(2,1)$ is absent. Every available two-step chain already has its shortcut.
  '12':
    instructions: ''
    prompt: On $A=\{1,2\}$, classify $R=\{(1,2),(2,1)\}$. Decide separately whether it is reflexive, symmetric, antisymmetric, and transitive. Justify each decision.
    answer: Not reflexive; symmetric; not antisymmetric because distinct elements relate both ways; not transitive because $1R2$ and $2R1$ require the missing $(1,1)$.
  '13':
    instructions: ''
    prompt: Classify equality on $\{1,2,3\}$. Decide separately whether it is reflexive, symmetric, antisymmetric, and transitive. Justify each decision.
    answer: All four hold. Only loops occur, so every reverse and composable shortcut is already present, and bidirectionality forces equal objects.
  '14':
    instructions: ''
    prompt: Classify the full relation $A\times A$ on $A=\{1,2\}$. Decide separately whether it is reflexive, symmetric, antisymmetric, and transitive. Justify each decision.
    answer: Reflexive, symmetric, and transitive. Not antisymmetric because both $(1,2)$ and $(2,1)$ occur with $1\ne2$.
  '15':
    instructions: ''
    prompt: Classify the empty relation on $\{1,2\}$. Decide separately whether it is reflexive, symmetric, antisymmetric, and transitive. Justify each decision.
    answer: Not reflexive because loops are missing. Symmetric, antisymmetric, and transitive hold vacuously since no antecedent involving a related pair is true.
  '16':
    instructions: ''
    prompt: On $\{1,2,3\}$, does $R=\{(1,2),(2,3),(1,3)\}$ satisfy transitivity? Also decide reflexivity.
    answer: 'It is transitive: the only composable two-step chain is $1R2R3$, and $(1,3)$ is present. It is not reflexive because all loops are missing.'
  '17':
    instructions: ''
    prompt: On $\{1,2,3\}$, let $R$ contain all loops and also $(1,2),(2,3)$. Give a witness to failure of transitivity.
    answer: $1R2$ and $2R3$ hold, but $1R3$ does not. Adding $(1,3)$ repairs this particular failure.
  '18':
    instructions: ''
    prompt: On $\{1,2,3\}$, classify $R=\{(1,2),(2,1),(2,3)\}$ as symmetric or antisymmetric.
    answer: Neither. Symmetry fails at $(2,3)$ because $(3,2)$ is absent. Antisymmetry fails at the distinct pair 1,2 with both directions present.
  '19':
    instructions: ''
    prompt: Is $R=\{(1,2)\}$ transitive on $\{1,2,3\}$? Explain why checking for a shortcut is vacuous here.
    answer: Yes. No pair starts at 2, so no two listed pairs can form a two-step chain. Every transitivity implication has a false antecedent.
  '20':
    instructions: ''
    prompt: On $\{1,2\}$, is $R=\{(1,1)\}$ reflexive, irreflexive, or neither?
    answer: Neither. It misses the required loop at 2 but contains the forbidden loop at 1. Not reflexive does not mean irreflexive.
  '21':
    instructions: ''
    prompt: Classify $\leq$ on $\mathbb Z$. Decide separately whether it is reflexive, symmetric, antisymmetric, and transitive. Justify each decision.
    answer: "Reflexive, antisymmetric, and transitive. Not symmetric: $1\\leq2$ is true but $2\\leq1$ is false."
  '22':
    instructions: ''
    prompt: Classify $<$ on $\mathbb Z$ as reflexive, irreflexive, symmetric, antisymmetric, asymmetric, and transitive.
    answer: Irreflexive, antisymmetric, asymmetric, and transitive; neither reflexive nor symmetric. Strict inequalities cannot hold in both directions.
  '23':
    instructions: ''
    prompt: Is the relation $aRb$ defined by $a\ne b$ on $\mathbb Z$ transitive? Give a witness.
    answer: No. $1\ne2$ and $2\ne1$, but $1\ne1$ is false. Repeated objects are permitted in the test.
  '24':
    instructions: ''
    prompt: On $\mathbb Z$, define $aRb$ by $a+b$ even. Prove symmetry and decide reflexivity.
    answer: Symmetry holds since $a+b=b+a$. Reflexivity holds because $a+a=2a$ is even.
  '25':
    instructions: ''
    prompt: For $aRb$ meaning $a+b$ even on $\mathbb Z$, prove transitivity.
    answer: If $a+b=2r$ and $b+c=2s$, then $a+c=2(r+s-b)$, an even integer. Thus $aRc$.
  '26':
    instructions: ''
    prompt: On $\mathbb R$, define $xRy$ by $|x-y|\leq1$. Is it transitive?
    answer: No. $0R1$ and $1R2$ hold, but $0R2$ fails since $|0-2|=2>1$.
  '27':
    instructions: ''
    prompt: On positive integers, explain why divisibility is antisymmetric.
    answer: If $b=ak$ and $a=b\ell$ with positive integer factors, substitution gives $k\ell=1$. Hence both factors are 1 and $a=b$.
  '28':
    instructions: ''
    prompt: Why does divisibility on all integers fail antisymmetry?
    answer: $2\mid-2$ and $-2\mid2$ but $2\ne-2$. Allowing both signs breaks the positive-domain argument.
  '29':
    instructions: ''
    prompt: Which of reflexive, symmetric, antisymmetric, and transitive hold for the empty relation on the empty set?
    answer: All four hold. There are no objects or tuples that can violate any quantified condition.
  '30':
    instructions: ''
    prompt: Prove that an asymmetric relation is irreflexive.
    answer: If some $aRa$ held, asymmetry applied with both variables equal to $a$ would imply $\neg aRa$, a contradiction. Therefore every loop is absent.
  '31':
    instructions: ''
    prompt: Define $aRb$ on $\mathbb Z$ by $4\mid(a-b)$. Which of $1R9$, $2R7$, and $-3R5$ hold?
    answer: $1R9$ and $-3R5$ hold because their differences are $-8$. $2R7$ fails because $-5$ is not divisible by 4.
  '32':
    instructions: ''
    prompt: For congruence modulo 4, describe the class $[2]$ and list four of its members.
    answer: $[2]=\{4k+2:k\in\mathbb Z\}$. Examples are $-6,-2,2,6$.
  '33':
    instructions: ''
    prompt: For congruence modulo 4, are $[1]$ and $[9]$ equal? Explain.
    answer: Yes. Since $1\equiv9\pmod4$, they describe the same integers with remainder 1. Representatives need not be equal.
  '34':
    instructions: ''
    prompt: Prove reflexivity of congruence modulo any positive integer $m$.
    answer: For every integer $a$, $a-a=0=m\cdot0$, so $m\mid(a-a)$ and $a\equiv a\pmod m$.
  '35':
    instructions: ''
    prompt: Prove symmetry of congruence modulo positive $m$.
    answer: If $a-b=mk$, then $b-a=m(-k)$. The negative of an integer is integral, so $b\equiv a\pmod m$.
  '36':
    instructions: ''
    prompt: Prove transitivity of congruence modulo positive $m$.
    answer: If $a-b=mk$ and $b-c=m\ell$, then $a-c=m(k+\ell)$. Thus $a\equiv c\pmod m$.
  '37':
    instructions: ''
    prompt: Partition $\{0,1,2,3,4,5,6,7\}$ by congruence modulo 3.
    answer: The blocks are $\{0,3,6\}$, $\{1,4,7\}$, and $\{2,5\}$. They are nonempty, share no elements, and together contain the whole set.
  '38':
    instructions: ''
    prompt: On finite binary strings, define equivalence by equal length. Describe the class of the string 01.
    answer: The class is $\{00,01,10,11\}$, all binary strings of length 2. The characters themselves do not affect this equivalence.
  '39':
    instructions: ''
    prompt: For an equivalence relation, prove that $aRb$ implies $[a]=[b]$, using $[a]=\{x:xRa\}$.
    answer: If $xRa$, then $aRb$ and transitivity give $xRb$, so $[a]\subseteq[b]$. Symmetry gives $bRa$, and the same argument yields the reverse inclusion.
  '40':
    instructions: ''
    prompt: A partition has blocks $\{a,c\}$ and $\{b\}$. List all pairs in the induced equivalence relation.
    answer: $\{(a,a),(a,c),(c,a),(c,c),(b,b)\}$. Two objects relate exactly when they occupy the same block.
  '41':
    instructions: ''
    prompt: Explain why subset inclusion on $\mathcal P(\{1,2\})$ is a partial order but not a total order.
    answer: Inclusion is reflexive and transitive, and mutual inclusion gives equality. The subsets $\{1\}$ and $\{2\}$ are incomparable, so the order is not total.
  '42':
    instructions: ''
    prompt: List the cover pairs of inclusion on $\mathcal P(\{1,2\})$, writing the smaller set first.
    answer: The four pairs are $(\varnothing,\{1\})$, $(\varnothing,\{2\})$, $(\{1\},\{1,2\})$, and $(\{2\},\{1,2\})$.
  '43':
    instructions: ''
    prompt: In the divisibility order on $\{1,2,3,6\}$, list covers and the least and greatest elements.
    answer: Covers are $(1,2),(1,3),(2,6),(3,6)$. The least element is 1 and greatest is 6. The pair $(1,6)$ is implied and is not a cover.
  '44':
    instructions: ''
    prompt: In the divisibility order on $\{2,3,6\}$, identify all minimal elements and decide whether a least element exists.
    answer: The minimal elements are 2 and 3. Neither divides the other, so neither is below every element; no least element exists.
  '45':
    instructions: ''
    prompt: In the divisibility order on $\{1,2,3\}$, identify maximal elements and decide whether a greatest exists.
    answer: The maximal elements are 2 and 3, but there is no greatest element because neither is above the other.
  '46':
    instructions: ''
    prompt: Prove that a partial order has at most one least element.
    answer: If $a$ and $b$ are both least, then $a\preceq b$ and $b\preceq a$. Antisymmetry forces $a=b$.
  '47':
    instructions: ''
    prompt: Is divisibility on $\{1,2,4,8\}$ a total order?
    answer: Yes. Each earlier number in the displayed sequence divides every later one, so every pair is comparable.
  '48':
    instructions: ''
    prompt: In the Hasse diagram of $\mathcal P(\{1,2\})$ ordered by inclusion, why is there no direct edge from $\varnothing$ to $\{1,2\}$?
    answer: There are intermediate subsets $\{1\}$ and $\{2\}$. The comparison holds, but it is not a cover and is recovered from upward paths.
  '49':
    instructions: ''
    prompt: A poset on $\{a,b,c,d\}$ has exactly the upward cover edges $a\to b$, $a\to c$, $b\to d$, and $c\to d$. Are $b,c$ comparable? Is $a\preceq d$? Explain both answers.
    answer: $b,c$ are incomparable because neither has an upward path to the other. $a\preceq d$ holds by either two-edge upward path.
  '50':
    instructions: ''
    prompt: Explain why a partial order's strict upward graph cannot contain a directed cycle.
    answer: A cycle through distinct elements gives comparability in both directions by transitivity. Antisymmetry then forces those elements equal, contradicting strict upward movement.
  '51':
    instructions: ''
    prompt: Use the convention that $S\circ R$ means first $R$, then $S$. Let $R=\{(1,a),(2,b)\}$ and $S=\{(a,u),(b,v)\}$. Compute $S\circ R$.
    answer: $\{(1,u),(2,v)\}$. Each pair follows a two-stage path through the matching middle symbol.
  '52':
    instructions: ''
    prompt: Let $R=\{(1,a),(1,b),(2,b)\}$ and $S=\{(a,u),(b,v)\}$. Compute $S\circ R$.
    answer: $\{(1,u),(1,v),(2,v)\}$. Input 1 has two available intermediate choices.
  '53':
    instructions: ''
    prompt: Let $R=\{(1,a),(1,b)\}$ and $S=\{(a,u),(b,u)\}$. How many pairs belong to $S\circ R$?
    answer: 'One: $(1,u)$. Two witnesses do not produce duplicate members in a set of pairs.'
  '54':
    instructions: ''
    prompt: On $\{1,2,3\}$, let $R=\{(1,2),(2,3)\}$. Find $R\circ R$.
    answer: $\{(1,3)\}$. The only two-step path goes from 1 through 2 to 3.
  '55':
    instructions: ''
    prompt: On $\{1,2\}$, let $R=\{(1,2),(2,1)\}$. Find $R\circ R$.
    answer: $\{(1,1),(2,2)\}$. Each two-step walk returns to its starting object.
  '56':
    instructions: ''
    prompt: Let $R\subseteq A\times B$ and let $I_B$ be equality on $B$. Prove $I_B\circ R=R$.
    answer: A pair $(a,b)$ belongs to the composition exactly when some $c$ satisfies $aRc$ and $c=b$. This is equivalent to $aRb$, proving equality.
  '57':
    instructions: ''
    prompt: Give an example showing relation composition is not commutative on one set.
    answer: On $\{1,2\}$, take $R=\{(1,2)\}$ and $S=\{(2,1)\}$. Then $S\circ R=\{(1,1)\}$, while $R\circ S=\{(2,2)\}$.
  '58':
    instructions: ''
    prompt: For compatible relations, what is $S\circ\varnothing$? Justify.
    answer: It is empty. A witnessing intermediate object would require a pair in the empty first relation, which is impossible.
  '59':
    instructions: ''
    prompt: Prove that transitivity of a relation $R$ on $A$ is equivalent to $R\circ R\subseteq R$.
    answer: Membership in $R\circ R$ means some two-step chain $aRbRc$ exists. Transitivity says exactly that each resulting pair $(a,c)$ belongs to $R$. Both statements impose the same condition.
  '60':
    instructions: ''
    prompt: For compatible $R,S$, prove $(S\circ R)^{-1}=R^{-1}\circ S^{-1}$.
    answer: A reversed pair $(c,a)$ belongs to the left exactly when some $b$ satisfies $aRb$ and $bSc$. Reversing those pairs gives $cS^{-1}b$ and $bR^{-1}a$, exactly the condition on the right.
  '61':
    instructions: ''
    prompt: On $A=\{a,b,c\}$, find the reflexive closure of $R=\{(a,b),(b,c)\}$.
    answer: Add $(a,a),(b,b),(c,c)$ to the two original pairs. These are exactly the missing loops.
  '62':
    instructions: ''
    prompt: On $\{a,b,c\}$, find the symmetric closure of $R=\{(a,b),(b,c)\}$.
    answer: $\{(a,b),(b,a),(b,c),(c,b)\}$. Every original pair and its reverse are included.
  '63':
    instructions: ''
    prompt: On $\{a,b,c\}$, find the transitive closure of $R=\{(a,b),(b,c)\}$.
    answer: $\{(a,b),(b,c),(a,c)\}$. Add the sole missing shortcut; no loops are required by this acyclic relation.
  '64':
    instructions: ''
    prompt: On $\{1,2,3,4\}$, find the pairs added by transitive closure to $R=\{(1,2),(2,3),(3,4)\}$.
    answer: Add $(1,3),(2,4),(1,4)$. They correspond to paths of length two or three.
  '65':
    instructions: ''
    prompt: On $\{a,b\}$, find the transitive closure of $R=\{(a,b),(b,a)\}$.
    answer: The closure is the full four-pair relation. Two-step cycles require both loops, and no further pairs exist.
  '66':
    instructions: ''
    prompt: On $\{1,2,3\}$, find the reflexive-transitive closure of $R=\{(1,2)\}$.
    answer: $\{(1,1),(2,2),(3,3),(1,2)\}$. Include zero-step reachability for every vertex and the original one-step connection.
  '67':
    instructions: ''
    prompt: On $\{a,b,c\}$, find the smallest equivalence relation containing $(a,b)$ and $(b,c)$.
    answer: All nine pairs in $\{a,b,c\}\times\{a,b,c\}$. Symmetry and transitivity connect every object to every other, and reflexivity supplies loops.
  '68':
    instructions: ''
    prompt: Can adding pairs repair an antisymmetry violation caused by distinct $a,b$ with $aRb$ and $bRa$?
    answer: No. Both offending pairs remain after any additions, so the violation persists. A repair must remove a pair or change the model.
  '69':
    instructions: ''
    prompt: Explain why repeatedly adding transitivity-required pairs terminates on a finite $n$-element set.
    answer: Only $n^2$ distinct pairs are possible. Each productive step adds a previously missing pair and never removes one, so only finitely many productive steps can occur.
  '70':
    instructions: ''
    prompt: An immediate-prerequisite graph contains edges $A\to B$ and $B\to C$ but no edge $A\to C$. Does that refute that $A$ must precede $C$?
    answer: No. Immediate edges need not be transitive. The reachability relation records that $A$ precedes $C$ through $B$, even without a direct edge.
  '71':
    instructions: ''
    prompt: A student says antisymmetric means no arrow has a reverse, including loops. Correct the definition.
    answer: Antisymmetry allows loops and says bidirectional relatedness forces equality. Forbidding every reverse is asymmetry, which also forbids loops.
  '72':
    instructions: ''
    prompt: Prove that a relation which is both symmetric and antisymmetric contains only loops.
    answer: If $aRb$, symmetry gives $bRa$, and antisymmetry gives $a=b$. Thus every related pair has equal coordinates.
  '73':
    instructions: ''
    prompt: Prove that any relation containing only loops is transitive, even if some loops are missing.
    answer: If $aRb$ and $bRc$, loop-only membership forces $a=b=c$. The required pair $(a,c)$ is then identical to the already present $(a,b)$.
  '74':
    instructions: ''
    prompt: Give a reflexive symmetric relation on $\{1,2,3\}$ that is not transitive, with an explicit witness.
    answer: Take all loops plus $(1,2),(2,1),(2,3),(3,2)$. It is reflexive and symmetric, but $1R2R3$ lacks $(1,3)$.
  '75':
    instructions: ''
    prompt: Show that the relation of having at least one common element on nonempty subsets of $\{1,2\}$ is not an equivalence relation.
    answer: $\{1\}$ intersects $\{1,2\}$, and $\{1,2\}$ intersects $\{2\}$, but $\{1\}$ does not intersect $\{2\}$. Transitivity fails.
  '76':
    instructions: ''
    prompt: For an equivalence relation, prove every object belongs to its own class. Why does this help establish a partition?
    answer: Reflexivity gives $aRa$, hence $a\in[a]$. Each class is nonempty and every object lies in a class, proving nonemptiness and coverage; disjointness of distinct classes needs the separate overlap argument.
  '77':
    instructions: ''
    prompt: Prove that a partition defines a transitive relation when related means belonging to the same block.
    answer: If $a,b$ share one block and $b,c$ share another, the two blocks intersect at $b$. Partition blocks are disjoint unless equal, so all three lie in one block and $a,c$ relate.
  '78':
    instructions: ''
    prompt: Can a two-element nonempty set carry a relation that is both an equivalence relation and a partial order? Characterize it.
    answer: Yes, exactly equality. Symmetry and antisymmetry permit only loops, while reflexivity requires both loops. Equality also satisfies transitivity.
  '79':
    instructions: ''
    prompt: On $\mathbb N_0$, use ordinary $\leq$. Find a least element and decide whether a greatest or maximal element exists.
    answer: Zero is least. There is no greatest or maximal element because each $n$ has a strictly larger allowed element $n+1$.
  '80':
    instructions: ''
    prompt: A transitivity check examines only triples of distinct objects. Explain the flaw with the smallest useful counterexample.
    answer: On $\{a,b\}$, take $R=\{(a,b),(b,a)\}$. There are no triples of distinct objects, yet $aRbRa$ requires the missing loop at $a$. Repeated variables are allowed in the definition.
functions:
  '1':
    instructions: ''
    prompt: Does $\{(1,a),(2,a),(3,b)\}$ define a function from $\{1,2,3\}$ to $\{a,b\}$? Explain.
    answer: Yes. Every domain element has exactly one output. Sharing output $a$ does not violate the function definition.
  '2':
    instructions: ''
    prompt: Does $\{(1,a),(1,b),(2,a)\}$ define a function from $\{1,2\}$ to $\{a,b\}$?
    answer: No. Input 1 has two different outputs, violating uniqueness.
  '3':
    instructions: ''
    prompt: Does $\{(1,a),(2,b)\}$ define a total function from $\{1,2,3\}$ to $\{a,b\}$?
    answer: No. Input 3 has no output, violating existence for every domain element.
  '4':
    instructions: ''
    prompt: Does $f:\mathbb Z\to\mathbb Z$, $f(n)=n/2$, define a function with the specified codomain?
    answer: No. For odd inputs such as 1, the output $1/2$ is not an integer. Changing the codomain to $\mathbb Q$ would fix this issue.
  '5':
    instructions: ''
    prompt: Give the largest real domain on which $f(x)=1/(x-3)$ defines a real-valued function.
    answer: $\mathbb R\setminus\{3\}$, because exactly at 3 the denominator is zero.
  '6':
    instructions: ''
    prompt: Give the largest real domain for the real-valued rule $f(x)=\sqrt{x-2}$.
    answer: $[2,\infty)$, since $x-2$ must be nonnegative.
  '7':
    instructions: ''
    prompt: For $f:\mathbb Z\to\mathbb Z$, $f(n)=2n+1$, identify the domain, codomain, and image.
    answer: Domain and codomain are both $\mathbb Z$. The image is the odd integers $\{2k+1:k\in\mathbb Z\}$.
  '8':
    instructions: ''
    prompt: Why are $f:\mathbb R\to\mathbb R$, $f(x)=x^2$, and $g:\mathbb R\to[0,\infty)$, $g(x)=x^2$, different specifications?
    answer: Their output rule and domain agree, but their declared codomains differ. Consequently $g$ is onto while $f$ is not.
  '9':
    instructions: ''
    prompt: Write the quantified existence-and-uniqueness condition for a relation $F\subseteq A\times B$ to be a function.
    answer: $\forall a\in A,\ \exists!b\in B,\ (a,b)\in F$. Each allowed input must have one and only one related output.
  '10':
    instructions: ''
    prompt: Define the identity function on $A=\{a,b,c\}$ by listing its pairs. For any function $f:A\to B$, explain why $f\circ\operatorname{id}_A=f$ and $\operatorname{id}_B\circ f=f$.
    answer: The pairs are $\{(a,a),(b,b),(c,c)\}$. For every $x\in A$, $f(\operatorname{id}_A(x))=f(x)$ and $\operatorname{id}_B(f(x))=f(x)$. The domains, codomains, and values agree in each identity.
  '11':
    instructions: ''
    prompt: Let $f:\mathbb Z\to\mathbb Z$ satisfy $f(n)=2n+1$. Find $f(\{-2,0,3\})$.
    answer: $\{-3,1,7\}$, obtained by evaluating the rule at each input.
  '12':
    instructions: ''
    prompt: For $f(n)=2n+1$ on $\mathbb Z$, find $f^{-1}(\{1,5,8\})$.
    answer: $\{0,2\}$. Targets 1 and 5 come from 0 and 2; 8 would require the noninteger input $7/2$.
  '13':
    instructions: ''
    prompt: For $g:\mathbb R\to\mathbb R$, $g(x)=x^2$, find $g^{-1}(\{9\})$.
    answer: $\{-3,3\}$, since both real inputs square to 9.
  '14':
    instructions: ''
    prompt: For $g:\mathbb R\to\mathbb R$, $g(x)=x^2$, find $g^{-1}(\{-4\})$.
    answer: The empty set, because no real square is negative.
  '15':
    instructions: ''
    prompt: For $g:\mathbb R\to\mathbb R$, $g(x)=x^2$, find $g^{-1}([1,4])$.
    answer: $[-2,-1]\cup[1,2]$. The condition $1\leq x^2\leq4$ means $1\leq|x|\leq2$.
  '16':
    instructions: ''
    prompt: For $g:\mathbb R\to\mathbb R$, $g(x)=x^2$, find $g([-2,3])$.
    answer: $[0,9]$. Zero is achieved, and every target $y\in[0,9]$ has input $\sqrt y\in[0,3]$. No larger square occurs in the input interval.
  '17':
    instructions: ''
    prompt: For an arbitrary function $f:A\to B$, find $f(\varnothing)$ and $f^{-1}(\varnothing)$.
    answer: Both are empty. The first has no inputs supplying outputs; the second has no outputs in the target set.
  '18':
    instructions: ''
    prompt: For $f:A\to B$, prove $f^{-1}(B)=A$.
    answer: Every $a\in A$ has output in $B$, so every domain element belongs to the preimage. A preimage contains only domain elements, giving the reverse inclusion.
  '19':
    instructions: ''
    prompt: For $f:\{a,b,c\}\to\{1,2,3\}$ with $f(a)=1$, $f(b)=1$, $f(c)=3$, find the preimages of $\{1\}$, $\{2\}$, and $\{1,3\}$.
    answer: They are respectively $\{a,b\}$, $\varnothing$, and $\{a,b,c\}$. The unused codomain value 2 has no preimage.
  '20':
    instructions: ''
    prompt: Explain why the notation $f^{-1}(T)$ for a target set does not require an inverse function.
    answer: It means the set of all domain inputs whose outputs belong to $T$. That set is well-defined even when a target has zero or multiple preimages, as with the square function.
  '21':
    instructions: ''
    prompt: Classify $f:\mathbb Z\to\mathbb Z$, $f(n)=3n+1$, as injective and/or surjective.
    answer: 'Injective: equal outputs imply $3a+1=3b+1$, hence $a=b$. Not surjective: 0 would require $n=-1/3$, outside the domain.'
  '22':
    instructions: ''
    prompt: |-
      Determine whether the following function is injective, surjective, both, or neither. Justify your answer.

      $f:\mathbb R\to\mathbb R$, $f(x)=3x+1$.
    answer: Bijective. Equal outputs give equal inputs, and every target $y$ has real preimage $(y-1)/3$.
  '23':
    instructions: ''
    prompt: |-
      Determine whether the following function is injective, surjective, both, or neither. Justify your answer.

      $f:\mathbb R\to\mathbb R$, $f(x)=x^2$.
    answer: Neither injective nor surjective. Inputs $-1,1$ collide, and the codomain target $-1$ is missed.
  '24':
    instructions: ''
    prompt: |-
      Determine whether the following function is injective, surjective, both, or neither. Justify your answer.

      $f:\mathbb R\to[0,\infty)$, $f(x)=x^2$.
    answer: Surjective but not injective. Each target $y\geq0$ is reached by $\sqrt y$, but $-1$ and 1 still collide.
  '25':
    instructions: ''
    prompt: |-
      Determine whether the following function is injective, surjective, both, or neither. Justify your answer.

      $f:[0,\infty)\to[0,\infty)$, $f(x)=x^2$.
    answer: Bijective. Nonnegative equal-square inputs are equal, and every nonnegative target has its nonnegative square root as preimage.
  '26':
    instructions: ''
    prompt: |-
      Determine whether the following function is injective, surjective, both, or neither. Justify your answer.

      $f:\mathbb N_0\to\mathbb N_0$, $f(n)=n+1$.
    answer: Injective, since cancellation gives equal inputs; not surjective, since 0 is missed.
  '27':
    instructions: ''
    prompt: |-
      Determine whether the following function is injective, surjective, both, or neither. Justify your answer.

      $f:\mathbb Z\to\mathbb N_0$, $f(n)=|n|$.
    answer: Surjective because target $k\geq0$ is reached at input $k$. Not injective because 1 and $-1$ collide.
  '28':
    instructions: ''
    prompt: |-
      Determine whether the following function is injective, surjective, both, or neither. Justify your answer.

      the constant function $f:A\to\{0\}$ when $A$ has exactly three elements.
    answer: Surjective because its sole target is reached. Not injective because distinct inputs share output 0.
  '29':
    instructions: ''
    prompt: Negate the assertion that $f:A\to B$ is injective.
    answer: There exist $x,y\in A$ with $x\ne y$ and $f(x)=f(y)$. Both distinctness and equal outputs are required for a collision.
  '30':
    instructions: ''
    prompt: Negate the assertion that $f:A\to B$ is surjective.
    answer: There exists $b\in B$ such that every $a\in A$ satisfies $f(a)\ne b$. This is a target with no preimage.
  '31':
    instructions: ''
    prompt: Find the inverse of $f:\mathbb R\to\mathbb R$, $f(x)=5x-2$, and verify both compositions.
    answer: $f^{-1}(y)=(y+2)/5$. Then $f^{-1}(f(x))=(5x-2+2)/5=x$, and $f(f^{-1}(y))=5(y+2)/5-2=y$.
  '32':
    instructions: ''
    prompt: Find the inverse of $f:\mathbb Z\to\mathbb Z$, $f(n)=n-7$.
    answer: $f^{-1}(m)=m+7$. Addition and subtraction by 7 undo each other on integers.
  '33':
    instructions: ''
    prompt: The function $f:\mathbb Z\to\mathbb Z$, $f(n)=2n$, is injective. Restrict its codomain to its image, then specify the resulting bijection's inverse domain, codomain, and formula.
    answer: With codomain restricted to the even integers $2\mathbb Z$, the bijection has inverse $h:2\mathbb Z\to\mathbb Z$, $h(m)=m/2$. The original specification has no inverse on all of $\mathbb Z$ because odd targets are missed.
  '34':
    instructions: ''
    prompt: Why does $g:\mathbb R\to[0,\infty)$, $g(x)=x^2$, have no inverse function into $\mathbb R$?
    answer: A positive target has two different preimages. An inverse undoing $g$ on every real input would need to return both 1 and $-1$ at target 1, violating uniqueness.
  '35':
    instructions: ''
    prompt: Restrict the domain of the real square function to obtain a bijection onto $[0,\infty)$, and give its inverse.
    answer: Choose domain $[0,\infty)$. The resulting bijection has inverse $y\mapsto\sqrt y$. A restriction to nonpositive reals with inverse $-\sqrt y$ also works.
  '36':
    instructions: ''
    prompt: For $f:\mathbb R\to\mathbb R$, $f(x)=x$, restrict the domain to $[0,1]$ but retain codomain $\mathbb R$. Which property is lost?
    answer: 'Surjectivity is lost: values such as 2 are no longer reached. Injectivity remains because restricting inputs cannot introduce a new collision.'
  '37':
    instructions: ''
    prompt: Can the codomain of $f:\mathbb R\to\mathbb R$, $f(x)=x^2$, be changed to $[1,\infty)$ without changing its domain or rule?
    answer: No. Input 0 still gives output 0, which is outside the proposed codomain. A codomain must contain every output.
  '38':
    instructions: ''
    prompt: Prove that a restriction of an injective function remains injective.
    answer: Equal outputs of two inputs in the restricted domain are also equal outputs in the original domain. Original injectivity forces those inputs equal.
  '39':
    instructions: ''
    prompt: Let $f:\{a,b\}\to\{1,2\}$ satisfy $f(a)=2$ and $f(b)=1$. List the inverse pairs.
    answer: $\{(2,a),(1,b)\}$. Each codomain element has one preimage, so reversing the pairs is a function.
  '40':
    instructions: ''
    prompt: Explain why $f^{-1}(f(x))=x$ alone for all inputs does not prove a proposed inverse is an inverse on the entire codomain.
    answer: It shows the proposed reverse rule undoes $f$ on reached outputs. One must also verify $f(f^{-1}(y))=y$ for every codomain $y$; otherwise missed targets may remain.
  '41':
    instructions: ''
    prompt: Let $f,g,h:\mathbb R\to\mathbb R$ satisfy $f(x)=x+2$, $g(x)=3x$, and $h(x)=x-1$. Compute $g\circ f$, then verify $h\circ(g\circ f)=(h\circ g)\circ f$.
    answer: The first composite is $(g\circ f)(x)=3x+6$. Then $h(g(f(x)))=3x+5$. Also $(h\circ g)(y)=3y-1$, so substituting $y=f(x)=x+2$ gives $3(x+2)-1=3x+5$. Both groupings have the same values and types.
  '42':
    instructions: ''
    prompt: For $f(x)=x+2$ and $g(x)=3x$ on $\mathbb R$, compute $f\circ g$ and compare it with $g\circ f$.
    answer: $(f\circ g)(x)=3x+2$, whereas $(g\circ f)(x)=3x+6$. They are different, so composition is not commutative.
  '43':
    instructions: ''
    prompt: Let $f:\mathbb R\to[0,\infty)$, $f(x)=x^2$, and $g:[0,\infty)\to[0,\infty)$, $g(y)=\sqrt y$. Find $g(f(x))$.
    answer: $\sqrt{x^2}=|x|$. It is not always $x$, since negative inputs become nonnegative.
  '44':
    instructions: ''
    prompt: With $f(x)=x^2$ on $\mathbb R$ and $g(y)=\sqrt y$ on $[0,\infty)$, find $f(g(y))$ for $y\geq0$.
    answer: $(\sqrt y)^2=y$. This identity holds for every allowed nonnegative target.
  '45':
    instructions: ''
    prompt: Let $f:\mathbb R\to\mathbb R$, $f(x)=x-2$, and $g:[0,\infty)\to\mathbb R$, $g(y)=\sqrt y$. Is $g\circ f$ defined on all reals? Give its largest real domain.
    answer: No. The intermediate value must satisfy $x-2\geq0$. Its largest real domain is $[2,\infty)$, where the composite is $\sqrt{x-2}$.
  '46':
    instructions: ''
    prompt: Let $f:\{a,b\}\to\{1,2,3\}$ have values 1,2 respectively. Let $g:\{1,2,3\}\to\{u,v\}$ satisfy $g(1)=u$, $g(2)=v$, $g(3)=u$. Find the pairs of $g\circ f$.
    answer: $\{(a,u),(b,v)\}$. The unused intermediate value 3 does not appear in any composite evaluation.
  '47':
    instructions: ''
    prompt: Prove that composing two injective functions gives an injective function, assuming their domains and codomains match.
    answer: If $g(f(x))=g(f(y))$, injectivity of $g$ gives $f(x)=f(y)$, and injectivity of $f$ gives $x=y$.
  '48':
    instructions: ''
    prompt: Prove that composing two surjective functions gives a surjective function, with matching types $f:A\to B$, $g:B\to C$.
    answer: Given any $c\in C$, choose $b\in B$ with $g(b)=c$, then $a\in A$ with $f(a)=b$. The composite sends that $a$ to $c$.
  '49':
    instructions: ''
    prompt: For bijections $f:A\to B$ and $g:B\to C$, state the inverse of $g\circ f$ and explain the order.
    answer: It is $f^{-1}\circ g^{-1}:C\to A$. First undo the final step $g$, then undo the initial step $f$. Both inverse identities follow by cancelling these adjacent inverse pairs.
  '50':
    instructions: ''
    prompt: For functions $f:A\to B$ and $g:B\to C$, prove that injectivity of $g\circ f$ implies injectivity of $f$.
    answer: Assume $f(x)=f(y)$. Applying $g$ gives equal composite outputs, so composite injectivity forces $x=y$.
  '51':
    instructions: ''
    prompt: How many functions exist from $\varnothing$ to $\{1,2,3\}$, and is such a function injective?
    answer: Exactly one, the empty function. It is injective because no two distinct domain elements can collide.
  '52':
    instructions: ''
    prompt: Is the empty function $\varnothing\to\{1\}$ surjective?
    answer: No. Codomain element 1 has no domain preimage.
  '53':
    instructions: ''
    prompt: Describe the function $\varnothing\to\varnothing$. Is it injective, surjective, both, or neither? Explain.
    answer: 'The unique empty function is bijective: injectivity and surjectivity both hold without counterexamples. It is its own inverse.'
  '54':
    instructions: ''
    prompt: Can a function exist from $\{a\}$ to $\varnothing$?
    answer: No. The sole input would require an output in the empty codomain, which is impossible.
  '55':
    instructions: ''
    prompt: How many functions exist from a three-element set to a four-element set?
    answer: $4^3=64$. Each of the three inputs independently chooses one of four targets.
  '56':
    instructions: ''
    prompt: How many injective functions exist from a three-element set to a four-element set? Explain the count.
    answer: $4\cdot3\cdot2=24$. After each output choice, later inputs must avoid the used outputs.
  '57':
    instructions: ''
    prompt: Can a function from a five-element set to a three-element set be injective?
    answer: No. Five distinct outputs cannot fit among three codomain elements. At least two inputs must share a target.
  '58':
    instructions: ''
    prompt: Can a function from a three-element set to a five-element set be surjective?
    answer: No. Three inputs can reach at most three distinct targets, so at least two targets are missed.
  '59':
    instructions: ''
    prompt: Prove that an injective function between two finite sets of the same size is surjective.
    answer: If both sizes are $n$, injectivity gives $n$ distinct outputs in an $n$-element codomain. Those outputs exhaust the codomain, so every target is reached.
  '60':
    instructions: ''
    prompt: For finite sets of equal size, every injective function between them is surjective. Show that the analogous assertion fails for infinite sets by giving an injection from an infinite set to itself that is not surjective.
    answer: On $\mathbb N_0$, $f(n)=n+1$ is injective by cancellation but misses 0. Having the same infinite domain and codomain does not force surjectivity.
  '61':
    instructions: ''
    prompt: Compute $\lfloor3.8\rfloor$ and $\lceil3.8\rceil$.
    answer: They are 3 and 4, the surrounding integers below and above 3.8.
  '62':
    instructions: ''
    prompt: Compute $\lfloor-3.8\rfloor$ and $\lceil-3.8\rceil$.
    answer: They are $-4$ and $-3$. Floor moves to the greatest integer at most the input, not toward zero.
  '63':
    instructions: ''
    prompt: Compute floor and ceiling of the integer $-5$.
    answer: Both equal $-5$. An integer is already an eligible closest bound in both directions.
  '64':
    instructions: ''
    prompt: For an integer $k$, describe all real $x$ with $\lfloor x\rfloor=k$.
    answer: $x\in[k,k+1)$. The left endpoint is included and the right is excluded.
  '65':
    instructions: ''
    prompt: For an integer $k$, describe all real $x$ with $\lceil x\rceil=k$.
    answer: $x\in(k-1,k]$. The right endpoint is included and the left is excluded.
  '66':
    instructions: ''
    prompt: Is the floor function $\mathbb R\to\mathbb Z$ injective, surjective, both, or neither? Justify your answer.
    answer: Surjective because every integer $k$ maps to itself. Not injective because, for example, 2.1 and 2.9 both map to 2.
  '67':
    instructions: ''
    prompt: How many containers of capacity 6 are needed for 25 items, assuming items can be assigned freely?
    answer: $\lceil25/6\rceil=5$. Four containers hold only 24 items; five suffice.
  '68':
    instructions: ''
    prompt: Containers each hold at most $k$ items, where $k$ is a positive integer. For $n$ items, the usual container count is $\lceil n/k\rceil$. How many containers are needed when $n=0$, and why does the formula still apply?
    answer: "Zero: $\\lceil0/k\\rceil=0$. No container is needed when there are no items."
  '69':
    instructions: ''
    prompt: Prove $\lceil x\rceil=-\lfloor-x\rfloor$ for every real $x$.
    answer: Let $m=\lfloor-x\rfloor$, so $m\leq-x<m+1$. Negating gives $-m-1<x\leq-m$, exactly the characterization of $\lceil x\rceil=-m$.
  '70':
    instructions: ''
    prompt: For $f:\mathbb N_0\to\mathbb N_0$, $f(n)=\lfloor n/2\rfloor$, classify injectivity and surjectivity.
    answer: Surjective because target $k$ is reached at $n=2k$. Not injective because $2k$ and $2k+1$ both map to $k$.
  '71':
    instructions: ''
    prompt: For $f:A\to B$ and $T,V\subseteq B$, prove that preimages preserve intersections and unions. Also prove $f^{-1}(B\setminus T)=A\setminus f^{-1}(T)$.
    answer: For $x\in A$, having $f(x)$ in both $T,V$ is equivalent to $x$ belonging to both preimages, so $f^{-1}(T\cap V)=f^{-1}(T)\cap f^{-1}(V)$. Replacing both with at least one gives $f^{-1}(T\cup V)=f^{-1}(T)\cup f^{-1}(V)$. Finally, $f(x)\in B$ always, so $f(x)\in B\setminus T$ holds exactly when $f(x)\notin T$, equivalent to $x\in A\setminus f^{-1}(T)$. Each membership equivalence proves equality.
  '72':
    instructions: ''
    prompt: For $f:A\to B$ and $S,W\subseteq A$, prove $f(S\cup W)=f(S)\cup f(W)$.
    answer: Any output from $S\cup W$ has a witnessing input in at least one of $S,W$, hence belongs to the corresponding image. Conversely, an output from either image has its witness in the union.
  '73':
    instructions: ''
    prompt: Give a function $f:A\to B$ and subsets $S,W\subseteq A$ for which $f(S\cap W)\ne f(S)\cap f(W)$. Calculate both sides to verify your counterexample.
    answer: Take the real square function with $S=\{-1\}$ and $W=\{1\}$. The left side is empty, but the right is $\{1\}$. Equal outputs need not have the same input.
  '74':
    instructions: ''
    prompt: Let $f:A\to B$ be injective and let $S,W\subseteq A$. Prove $f(S\cap W)=f(S)\cap f(W)$ by proving both inclusions.
    answer: If $y=f(x)$ for some $x\in S\cap W$, that same input witnesses $y\in f(S)$ and $y\in f(W)$, proving the forward inclusion. For the reverse, an output in both images has witnesses $s\in S$, $w\in W$ with $f(s)=f(w)$. Injectivity gives $s=w\in S\cap W$, so that output belongs to the intersection's image.
  '75':
    instructions: ''
    prompt: If $g\circ f$ is surjective, prove that $g$ is surjective, with types $f:A\to B$ and $g:B\to C$.
    answer: Given $c\in C$, composite surjectivity supplies $a\in A$ with $g(f(a))=c$. Then $b=f(a)\in B$ is a preimage under $g$.
  '76':
    instructions: ''
    prompt: Give finite $f:A\to B$ and $g:B\to C$ with a bijective composite even though $f$ is not onto and $g$ is not injective.
    answer: Let $A=\{a,b\}$, $B=\{1,2,3\}$, $C=\{u,v\}$. Set $f(a)=1,f(b)=2$ and $g(1)=u,g(2)=v,g(3)=u$. The composite is a bijection, but 3 is missed by $f$ and 1,3 collide under $g$.
  '77':
    instructions: ''
    prompt: For $f:\mathbb Z\to\mathbb Z$, $f(n)=2n$, a student solves $2n=y$ as $n=y/2$ and concludes that $f$ is surjective. What condition on a preimage has the student failed to check?
    answer: The proposed preimage must be an integer. For odd targets such as 1, $y/2$ is not in the domain, so the function is not onto $\mathbb Z$.
  '78':
    instructions: ''
    prompt: For $f:A\to B$ and $S\subseteq A$, prove $S\subseteq f^{-1}(f(S))$. Give a case where equality fails.
    answer: Every $s\in S$ has output in $f(S)$, proving inclusion. For the real square function and $S=\{1\}$, the preimage of its image is $\{-1,1\}$, strictly larger.
  '79':
    instructions: ''
    prompt: For $f:A\to B$ and $T\subseteq B$, prove $f(f^{-1}(T))=T\cap f(A)$.
    answer: An output on the left is reached by an input whose output lies in $T$, so it is in both $T$ and the image. Conversely, a member of $T\cap f(A)$ has a witnessing input that lies in $f^{-1}(T)$, proving the other inclusion.
  '80':
    instructions: ''
    prompt: Let $f:\mathbb Z\to\mathbb Z$ be $f(n)=-n$. Prove that it is a bijection and its own inverse.
    answer: Applying it twice gives $f(f(n))=-(-n)=n$. Equal outputs imply equal inputs by negation, and any target $m$ is reached at $-m$. Thus it is bijective with $f^{-1}=f$.
sequences-and-summations:
  '1':
    instructions: All indices are integers.
    prompt: For $a_n=3n-2$ with $n\geq0$, list the first five terms.
    answer: $-2,1,4,7,10$, corresponding to indices 0 through 4.
  '2':
    instructions: All indices are integers.
    prompt: For $a_n=3n-2$ with $n\geq1$, list the first five terms and explain the difference from zero-based indexing.
    answer: $1,4,7,10,13$. The starting index is now 1, so the term at index 0 is excluded.
  '3':
    instructions: All indices are integers.
    prompt: For $a_n=(-1)^n(n+2)$ with $n\geq0$, compute $a_0,a_1,a_2,a_5$.
    answer: They are $2,-3,4,-7$. Even indices give a positive sign and odd indices a negative sign.
  '4':
    instructions: All indices are integers.
    prompt: The sequence satisfies $a_0=2$ and $a_{n+1}=3a_n+1$ for $n\geq0$. Compute through $a_3$.
    answer: $a_0=2$, $a_1=7$, $a_2=22$, and $a_3=67$. Each new value uses the immediately previous value.
  '5':
    instructions: All indices are integers.
    prompt: Let $b_1=5$ and $b_{n+1}=b_n-2$ for $n\geq1$. Find $b_4$ and an explicit formula.
    answer: $b_4=-1$ and $b_n=5-2(n-1)=7-2n$. There are $n-1$ steps after the initial term.
  '6':
    instructions: All indices are integers.
    prompt: Why does the recurrence $a_{n+1}=a_n+3$ alone fail to specify a unique sequence? Give two possibilities.
    answer: Its initial value is missing. Both $a_n=3n$ and $a_n=1+3n$ for $n\geq0$ satisfy the recurrence but differ at every index.
  '7':
    instructions: All indices are integers.
    prompt: Define $F_0=0$, $F_1=1$, and $F_{n+2}=F_{n+1}+F_n$ for $n\geq0$. Find $F_6$.
    answer: The terms are $0,1,1,2,3,5,8$, so $F_6=8$.
  '8':
    instructions: All indices are integers.
    prompt: A recurrence is $a_{n+2}=a_{n+1}+a_n$ for $n\geq0$, with only $a_0=1$ supplied. Explain the missing information.
    answer: The value $a_1$ is also needed. Choosing $a_1=0$ gives $1,0,1,1,\ldots$, while $a_1=1$ gives $1,1,2,3,\ldots$.
  '9':
    instructions: All indices are integers.
    prompt: Are the finite sequences $(1,2,1)$ and $(1,1,2)$ equal? Compare their sets of values.
    answer: The sequences differ at positions 2 and 3 under one-based indexing. Their sets of values are both $\{1,2\}$, which forget order and repetitions.
  '10':
    instructions: All indices are integers.
    prompt: Give two explicit rules for $n\geq0$ that agree at indices 0,1,2 but differ later.
    answer: $a_n=n$ and $b_n=n+n(n-1)(n-2)$ agree at those indices because the added product is zero. At index 3 they give 3 and 9.
  '11':
    instructions: Use nonnegative integer indices.
    prompt: An arithmetic sequence has $a_0=7$ and difference 4. Find $a_n$ and $a_{10}$.
    answer: $a_n=7+4n$ and $a_{10}=47$. The index counts increments from the zero-based initial value.
  '12':
    instructions: All indices are integers.
    prompt: An arithmetic sequence has $a_1=7$ and difference 4. Find $a_n$ and $a_{10}$.
    answer: $a_n=7+4(n-1)$ and $a_{10}=43$. There are nine increments before the tenth term.
  '13':
    instructions: All indices are integers.
    prompt: An arithmetic sequence has $a_3=11$ and $a_8=31$. Find its difference and $a_0$.
    answer: Five increments total $31-11=20$, so the difference is 4. Then $a_0=11-3\cdot4=-1$.
  '14':
    instructions: All indices are integers.
    prompt: Find the sum of the first seven terms starting at 10 with arithmetic difference $-2$.
    answer: The last term is $10+6(-2)=-2$. The sum is $7(10-2)/2=28$.
  '15':
    instructions: All indices are integers.
    prompt: Sum $a_n=5+2n$ over indices 3 through 8.
    answer: There are six terms, from 11 through 21. Their sum is $6(11+21)/2=96$.
  '16':
    instructions: All indices are integers.
    prompt: A geometric sequence has $a_0=3$ and multiplier $-2$. Find $a_5$.
    answer: $a_5=3(-2)^5=-96$. The odd exponent gives a negative sign.
  '17':
    instructions: All indices are integers.
    prompt: A geometric sequence has $a_1=64$ and multiplier $1/2$. Find $a_7$.
    answer: $a_7=64(1/2)^6=1$, since six multiplications follow the first term.
  '18':
    instructions: All indices are integers.
    prompt: Let $a_0=9$ and $a_{n+1}=0a_n$ for integers $n\geq0$. Describe all terms without relying on $0^0$.
    answer: The initial term is 9 by definition, and every term with index at least 1 is 0 by the recurrence.
  '19':
    instructions: All indices are integers.
    prompt: Give a recurrence and initial value for $a_n=2\cdot5^n$ on $n\geq0$.
    answer: $a_0=2$ and $a_{n+1}=5a_n$. Multiplying the explicit formula by 5 raises its exponent by one.
  '20':
    instructions: All indices are integers.
    prompt: Determine whether $2,4,8,16$ can be the first four terms of an arithmetic sequence or a geometric sequence.
    answer: It is geometric with multiplier 2. It is not arithmetic because successive differences are 2,4,8 rather than constant.
  '21':
    instructions: All indices are integers.
    prompt: Expand and evaluate $\sum_{k=2}^{5}(2k-1)$.
    answer: $3+5+7+9=24$. The inclusive bounds give four terms.
  '22':
    instructions: All indices are integers.
    prompt: Evaluate $\sum_{k=4}^{9}3$ and state the term count.
    answer: There are $9-4+1=6$ terms, so the sum is $6\cdot3=18$.
  '23':
    instructions: All indices are integers.
    prompt: Evaluate $\sum_{k=1}^{0}(k+5)$ and explain why the index range is empty.
    answer: Zero. The index range is empty, so no values are added.
  '24':
    instructions: All indices are integers.
    prompt: Write $5+8+11+14+17$ as a sum with lower index 0.
    answer: $\sum_{k=0}^{4}(5+3k)$. There are five terms with four increments after the first.
  '25':
    instructions: All indices are integers.
    prompt: Evaluate $\sum_{k=1}^{20}k$.
    answer: $20\cdot21/2=210$, by the arithmetic-sum formula.
  '26':
    instructions: All indices are integers.
    prompt: Evaluate $\sum_{k=1}^{20}(2k-1)$.
    answer: $2(20\cdot21/2)-20=400$. Linearity separates the varying term from the twenty copies of 1.
  '27':
    instructions: All indices are integers.
    prompt: For $n\geq0$, simplify $\sum_{k=1}^{n}(4k+3)$.
    answer: It is $4n(n+1)/2+3n=2n^2+5n$. At $n=0$, both the empty sum and formula are zero.
  '28':
    instructions: All indices are integers.
    prompt: For $n\geq5$, split $\sum_{k=1}^{n}a_k$ immediately after the fourth term.
    answer: $\sum_{k=1}^{4}a_k+\sum_{k=5}^{n}a_k$. Starting the second sum at 4 would count $a_4$ twice.
  '29':
    instructions: All indices are integers.
    prompt: A student writes $\sum_{k=1}^{n}k=nk$. Explain why this is not a valid use of a constant-sum rule.
    answer: The index $k$ changes from term to term and is not a constant that can be pulled out. The correct value is $n(n+1)/2$; at $n=3$ the terms are 1,2,3 and sum to 6.
  '30':
    instructions: All indices are integers.
    prompt: Derive $\sum_{k=1}^{n}k=n(n+1)/2$ for $n\geq1$ by reversing a copy of the sum.
    answer: Let the sum be $S$. Adding forward and reversed copies pairs 1 with $n$, 2 with $n-1$, and so on. Each of the $n$ pairs is $n+1$, giving $2S=n(n+1)$ and the formula.
  '31':
    instructions: All indices are integers.
    prompt: Evaluate $\sum_{k=0}^{6}2^k$.
    answer: $2^7-1=127$. There are seven terms, from exponent 0 through 6.
  '32':
    instructions: All indices are integers.
    prompt: Evaluate $\sum_{k=2}^{5}3^k$.
    answer: $9+27+81+243=360$, equivalently $9(3^4-1)/(3-1)$.
  '33':
    instructions: All indices are integers.
    prompt: Find $3+6+12+24+48+96$ using a finite geometric formula.
    answer: There are six terms with initial value 3 and multiplier 2. The sum is $3(2^6-1)/(2-1)=189$.
  '34':
    instructions: All indices are integers.
    prompt: Evaluate $\sum_{k=1}^{4}(1/2)^k$.
    answer: $1/2+1/4+1/8+1/16=15/16$. The initial term is $1/2$, not 1.
  '35':
    instructions: All indices are integers.
    prompt: For a real $r\ne1$ and integer $N\geq1$, derive the sum $1+r+\cdots+r^{N-1}$.
    answer: Writing this sum as $S$ and subtracting $rS$ cancels all interior powers, giving $(1-r)S=1-r^N$. Dividing by nonzero $1-r$ gives $S=(1-r^N)/(1-r)$.
  '36':
    instructions: All indices are integers.
    prompt: What is $1+r+\cdots+r^{N-1}$ when $r=1$ and $N\geq1$? Why is the usual quotient unavailable?
    answer: The sum is $N$, since every term is 1. The quotient has denominator $1-r=0$, so direct substitution into it is invalid.
  '37':
    instructions: All indices are integers.
    prompt: Evaluate the five-term expression $1+r+r^2+r^3+r^4$ when $r=0$, and separately state the value of a zero-term sum.
    answer: The five-term expression is 1. Its explicitly written initial term is 1 and all positive powers vanish. A zero-term sum is 0.
  '38':
    instructions: All indices are integers.
    prompt: Evaluate $\sum_{k=0}^{6}(-1)^k$.
    answer: 'The sum is 1: the first six terms form three cancelling pairs, leaving the final $+1$.'
  '39':
    instructions: All indices are integers.
    prompt: For $n\geq0$, simplify $\sum_{k=0}^{n}5\cdot2^k$.
    answer: $5(2^{n+1}-1)$. The constant factor 5 multiplies the sum of $n+1$ powers of 2.
  '40':
    instructions: All indices are integers.
    prompt: Why does a finite geometric-sum derivation alone not justify assigning a value to an infinite series?
    answer: The calculation evaluates only finitely many terms. An infinite sum requires a definition and a proof that the finite partial sums approach a particular real value; finite cancellation alone provides neither.
  '41':
    instructions: All indices are integers.
    prompt: Reindex $\sum_{k=3}^{7}(k+2)$ using $j=k-3$, and evaluate.
    answer: It becomes $\sum_{j=0}^{4}(j+5)=5+6+7+8+9=35$. Both bounds and the summand change.
  '42':
    instructions: All indices are integers.
    prompt: For $n\geq2$, reindex $\sum_{k=2}^{n}a_k$ using $j=k-2$.
    answer: $\sum_{j=0}^{n-2}a_{j+2}$. The original first and last terms remain $a_2$ and $a_n$.
  '43':
    instructions: All indices are integers.
    prompt: For $n\geq1$, reindex $\sum_{k=1}^{n}k^2$ using $j=n+1-k$.
    answer: $\sum_{j=1}^{n}(n+1-j)^2$. The new index visits the same terms in reverse order; finite addition permits the reversal.
  '44':
    instructions: All indices are integers.
    prompt: Evaluate $\sum_{k=1}^{5}((k+1)^2-k^2)$ by telescoping.
    answer: The interior squares cancel, leaving $6^2-1^2=35$.
  '45':
    instructions: Let $m\leq n$ be integers, and let the real values $b_m,\ldots,b_{n+1}$ be defined.
    prompt: Simplify $\sum_{k=m}^{n}(b_{k+1}-b_k)$.
    answer: $b_{n+1}-b_m$. Every intermediate value appears once with each sign.
  '46':
    instructions: All indices are integers.
    prompt: Evaluate $\sum_{k=1}^{4}1/(k(k+1))$.
    answer: Rewrite each term as $1/k-1/(k+1)$. The sum is $1-1/5=4/5$.
  '47':
    instructions: All indices are integers.
    prompt: For $n\geq2$, simplify $\sum_{k=2}^{n}1/(k(k+1))$.
    answer: Telescoping gives $1/2-1/(n+1)$. The surviving first term corresponds to index 2.
  '48':
    instructions: All indices are integers.
    prompt: Why can the identity $1/(k(k+1))=1/k-1/(k+1)$ not justify a sum that includes $k=0$?
    answer: Both sides are undefined at 0 because of division by zero. Formal cancellation cannot supply a value to an undefined original term.
  '49':
    instructions: All indices are integers.
    prompt: For $n\geq1$, simplify $\sum_{k=1}^{n}(3^{k+1}-3^k)$ in two ways.
    answer: Telescoping gives $3^{n+1}-3$. Alternatively each term is $2\cdot3^k$, whose geometric sum is $2\cdot3(3^n-1)/(3-1)=3^{n+1}-3$.
  '50':
    instructions: All indices are integers.
    prompt: A student reindexes $\sum_{k=2}^{5}a_k$ by setting $j=k-2$ but writes $\sum_{j=0}^{3}a_j$. Repair it.
    answer: The correct summand is $a_{j+2}$, so the result is $\sum_{j=0}^{3}a_{j+2}$. The student's expression sums $a_0$ through $a_3$ instead.
  '51':
    instructions: All indices are integers.
    prompt: Evaluate $\prod_{k=1}^{4}k$.
    answer: $1\cdot2\cdot3\cdot4=24=4!$.
  '52':
    instructions: All indices are integers.
    prompt: Evaluate $\prod_{k=2}^{5}k$.
    answer: $2\cdot3\cdot4\cdot5=120$. This is $5!/1!$.
  '53':
    instructions: All indices are integers.
    prompt: Evaluate the empty product $\prod_{k=1}^{0}(k+3)$ and compare it with the corresponding empty sum.
    answer: The product is 1 and the sum is 0, the respective multiplicative and additive identities.
  '54':
    instructions: All indices are integers.
    prompt: Explain why $0!=1$ under the product definition of factorial.
    answer: $0!$ is the product over the empty range from 1 to 0. Its value is therefore the empty-product value 1.
  '55':
    instructions: All indices are integers.
    prompt: Evaluate $\prod_{k=1}^{4}(2k)$.
    answer: $2\cdot4\cdot6\cdot8=384$, equivalently $2^4\cdot4!$.
  '56':
    instructions: All indices are integers.
    prompt: For $n\geq1$, simplify $\prod_{k=1}^{n}\frac{k+1}{k}$.
    answer: $(2/1)(3/2)\cdots((n+1)/n)=n+1$. All nonzero interior factors cancel.
  '57':
    instructions: All indices are integers.
    prompt: For $n\geq2$, simplify $\prod_{k=2}^{n}\frac{k-1}{k}$.
    answer: $(1/2)(2/3)\cdots((n-1)/n)=1/n$.
  '58':
    instructions: All indices are integers.
    prompt: Evaluate $\prod_{k=-2}^{2}k$, and explain which fact makes a long multiplication unnecessary.
    answer: Zero, because the factor for $k=0$ is zero. Any finite product containing a zero factor is zero.
  '59':
    instructions: All indices are integers.
    prompt: Refute the claim $\prod_{k=1}^{2}(a_k+b_k)=\prod_{k=1}^{2}a_k+\prod_{k=1}^{2}b_k$ in general.
    answer: Set all four input values to 1. The left side is $2\cdot2=4$, while the right is $1+1=2$. Expansion has mixed terms the proposed rule omits.
  '60':
    instructions: All indices are integers.
    prompt: For integers $n\geq1$, prove $n!=n(n-1)!$ from the product definition.
    answer: Separate the last factor $n$ from the product of 1 through $n$. The remaining product is $(n-1)!$. For $n=1$, that remaining product is empty and equals 1, so the identity still holds.
  '61':
    instructions: All indices are integers.
    prompt: Evaluate $\sum_{i=1}^{4}\sum_{j=1}^{i}1$.
    answer: The inner counts are 1,2,3,4, giving 10. The index pairs form a triangular region.
  '62':
    instructions: All indices are integers.
    prompt: Evaluate $\sum_{i=1}^{3}\sum_{j=1}^{i}j$.
    answer: The inner sums are 1,3,6, so the total is 10. Here the inner summand varies, unlike an iteration count of 1.
  '63':
    instructions: All indices are integers.
    prompt: Evaluate $\sum_{i=1}^{2}\sum_{j=1}^{3}(i+j)$.
    answer: For $i=1$, the row sum is $2+3+4=9$. For $i=2$, it is $3+4+5=12$. Total 21.
  '64':
    instructions: All indices are integers.
    prompt: For $n\geq1$, reverse the order in $\sum_{i=1}^{n}\sum_{j=1}^{i}a_{i,j}$.
    answer: $\sum_{j=1}^{n}\sum_{i=j}^{n}a_{i,j}$. Both expressions visit exactly the pairs with $1\leq j\leq i\leq n$.
  '65':
    instructions: All indices are integers.
    prompt: For $n\geq2$, reverse the order in $\sum_{i=2}^{n}\sum_{j=1}^{i-1}a_{i,j}$.
    answer: $\sum_{j=1}^{n-1}\sum_{i=j+1}^{n}a_{i,j}$. The same pairs satisfy $1\leq j<i\leq n$.
  '66':
    instructions: All indices are integers.
    prompt: If each of twelve real terms lies between $-2$ and 5, bound their sum.
    answer: The sum lies between $12(-2)=-24$ and $12(5)=60$. Add the twelve individual lower and upper inequalities.
  '67':
    instructions: All indices are integers.
    prompt: For $n\geq1$, prove $\sum_{k=1}^{n}k^2\leq n^3$.
    answer: Each of the $n$ terms is at most $n^2$. Adding these upper bounds gives at most $n\cdot n^2=n^3$.
  '68':
    instructions: All indices are integers.
    prompt: For $n\geq2$, prove $\sum_{k=1}^{n}k^2\geq n^3/8$ by using only the indices from $\lceil n/2\rceil$ to $n$.
    answer: There are at least $n/2$ selected terms, each at least $(n/2)^2$. Their sum is at least $n^3/8$. All omitted squares are nonnegative, so keeping only these terms gives a valid lower bound.
  '69':
    instructions: All indices are integers.
    prompt: Is discarding terms always a valid lower-bound operation on a sum of real numbers? Give a counterexample if not.
    answer: No. In $-5+2=-3$, discarding the negative term leaves 2, which is larger than the original sum. Discarding terms gives a lower bound exactly when their total is nonnegative. Requiring each discarded term to be nonnegative is a sufficient condition.
  '70':
    instructions: All indices are integers.
    prompt: For $n\geq1$, give simple bounds on $\sum_{k=1}^{n}1/k$ using the smallest and largest terms.
    answer: Each term lies between $1/n$ and 1, so the sum lies between 1 and $n$. These are valid finite bounds, though a more detailed argument can often give tighter bounds.
  '71':
    instructions: All indices are integers.
    prompt: A loop uses outer indices $i=0,\ldots,n-1$ and inner indices $j=0,\ldots,i-1$, adding 1 each time. For integer $n\geq0$, find the total.
    answer: The inner count is $i$, including zero at $i=0$. The total is $\sum_{i=0}^{n-1}i=n(n-1)/2$, also zero for $n=0$.
  '72':
    instructions: All indices are integers.
    prompt: For an integer $n\geq0$, a loop uses outer indices $i=0,\ldots,n-1$ and inner indices $j=0,\ldots,i$, executing its body once for each pair. Find its total body count. How much larger is it than the count $n(n-1)/2$ obtained with inner indices $j=0,\ldots,i-1$?
    answer: The inner count becomes $i+1$. Summing over $i=0,\ldots,n-1$ gives $n(n+1)/2$, an increase of $n$ executions.
  '73':
    instructions: All indices are integers.
    prompt: For fixed integer $i\geq1$, evaluate $\sum_{j=0}^{i-1}(i+j)$ in terms of $i$.
    answer: The fixed outer value contributes $i$ copies of $i$, or $i^2$. The varying part sums to $i(i-1)/2$, so the total is $(3i^2-i)/2$.
  '74':
    instructions: All indices are integers.
    prompt: Verify that $a_n=4+3n$ satisfies $a_0=4$ and $a_{n+1}=a_n+3$ for $n\geq0$.
    answer: At zero the formula gives 4. Also $a_{n+1}=4+3(n+1)=(4+3n)+3=a_n+3$. Both the initial condition and recurrence agree.
  '75':
    instructions: All indices are integers.
    prompt: For $n\geq0$, derive $\sum_{k=1}^{n}(2k-1)=n^2$ from linearity and the arithmetic-sum formula.
    answer: The sum equals $2\sum_{k=1}^{n}k-\sum_{k=1}^{n}1=n(n+1)-n=n^2$. At zero both constituent sums are empty, so the same expression is valid.
  '76':
    instructions: All indices are integers.
    prompt: A student uses $N(c+Nd)/2$ to sum $N\geq1$ arithmetic terms starting at $c$ with difference $d$. Give the correct formula and identify both issues.
    answer: The final term is $c+(N-1)d$, not $Nd$. Twice the average is first plus last, so the correct sum is $N(2c+(N-1)d)/2$. The proposed expression loses one copy of $c$ and miscounts the increments.
  '77':
    instructions: All indices are integers.
    prompt: A student claims $\sum_{k=0}^{n}2^k=2^n-1$. Find a smallest allowed counterexample and repair the formula.
    answer: At $n=0$, the left side is 1 but the proposed right side is 0. There are $n+1$ terms, so the correct result is $2^{n+1}-1$.
  '78':
    instructions: All indices are integers.
    prompt: For $n\geq1$, simplify $\sum_{k=1}^{n}(a_{k+2}-a_k)$ by cancellation.
    answer: The result is $a_{n+1}+a_{n+2}-a_1-a_2$. Interior terms cancel. At $n=1$, the displayed $a_2$ terms cancel as well, leaving the correct $a_3-a_1$.
  '79':
    instructions: All indices are integers.
    prompt: Let $a_0=1$ and $a_{n+1}=2a_n$ for $n\geq0$. Find the sum of terms indexed 0 through 9, and explain why there are not nine terms.
    answer: There are $9-0+1=10$ terms. Since $a_n=2^n$, the sum is $2^{10}-1=1023$. Inclusive endpoints determine the count.
  '80':
    instructions: All indices are integers.
    prompt: For $n\geq1$, show that $\sum_{i=1}^{n}\sum_{j=1}^{n}ij$ equals the square of $\sum_{k=1}^{n}k$.
    answer: For fixed $i$, factor it out to get $i\sum_{j=1}^{n}j$. The inner sum is independent of $i$, so the outer sum gives $(\sum_{i=1}^{n}i)(\sum_{j=1}^{n}j)=[n(n+1)/2]^2$. The product of sums appears because every pair of terms is included.
direct-proof:
  '1':
    instructions: ''
    prompt: 'State the hypotheses and conclusion of: for integers $a,b$, if both are odd then $a+b$ is even.'
    answer: Choose arbitrary integers $a,b$; assume each is odd. The goal is an integer $t$ with $a+b=2t$. Oddness is a hypothesis, not a conclusion.
  '2':
    instructions: Let $d,n$ be integers.
    prompt: Expand $d\mid n$ using an existential quantifier over integers. Is $d=0$ excluded by this definition?
    answer: "$d\\mid n$ means $\\exists k\\in\\mathbb Z,\\ n=dk$. Zero is allowed: $0\\mid n$ holds exactly when $n=0$."
  '3':
    instructions: ''
    prompt: Give witnesses showing that $-8$ is even and $-7$ is odd.
    answer: $-8=2(-4)$ and $-7=2(-4)+1$. Both witnesses are integers, as required by the definitions.
  '4':
    instructions: ''
    prompt: What two conditions must a fraction $a/b$ meet to establish rationality?
    answer: Its numerator and denominator must be integers, and $b\ne0$. A formal fraction with an unspecified or zero denominator does not suffice.
  '5':
    instructions: ''
    prompt: Why must independent odd integers usually be written $2r+1$ and $2s+1$, not both $2k+1$?
    answer: Independent existential hypotheses may have different witnesses. Reusing $k$ would force the two integers to be equal and would prove only a restricted case.
  '6':
    instructions: ''
    prompt: State the proof obligations for $A=B$ using subset inclusions.
    answer: Establish $A\subseteq B$ and $B\subseteq A$. In each direction choose an arbitrary element of the first set and show membership in the other.
  '7':
    instructions: ''
    prompt: State what must be proved for an integer to be the unique solution of an equation.
    answer: Show existence by verifying an integer solution, then show at most one by taking any two integer solutions and proving they are equal.
  '8':
    instructions: ''
    prompt: Translate the goal that the product of two even integers is divisible by 4 into a witness equation.
    answer: For arbitrary even integers $a,b$, the goal is $ab=4t$ for some integer $t$. Merely showing $ab=2t$ proves only evenness.
  '9':
    instructions: ''
    prompt: Explain why an arbitrary integer differs from a randomly selected example in a universal proof.
    answer: The arbitrary integer has no extra property beyond the stated assumptions, so the deduction covers every allowed integer. A sampled example establishes only its own instance.
  '10':
    instructions: ''
    prompt: Identify a genuine counterexample's two requirements for $P(x)\to Q(x)$ on domain $D$.
    answer: It must be an allowed $x\in D$ with $P(x)$ true and $Q(x)$ false. An input outside $D$ or with false hypothesis does not refute the claim.
  '11':
    instructions: ''
    prompt: Prove that the sum of two even integers is even.
    answer: Let $a=2r,b=2s$ for integers $r,s$. Then $a+b=2(r+s)$. Since $r+s$ is integral, the sum is even.
  '12':
    instructions: ''
    prompt: Prove that the sum of an even integer and an odd integer is odd.
    answer: Let $a=2r,b=2s+1$ for integers $r,s$. Then $a+b=2(r+s)+1$, with integer witness $r+s$, so the sum is odd.
  '13':
    instructions: ''
    prompt: Prove that the difference of two odd integers is even.
    answer: Let $a=2r+1,b=2s+1$ for integers $r,s$. Their difference is $2(r-s)$, and $r-s$ is an integer.
  '14':
    instructions: ''
    prompt: Prove that the product of an even integer and any integer is even.
    answer: Let $a=2r$ with $r\in\mathbb Z$ and let $b\in\mathbb Z$ be arbitrary. Then $ab=2(rb)$, with integer witness $rb$.
  '15':
    instructions: ''
    prompt: Prove that the product of two odd integers is odd.
    answer: Write the arbitrary odd integers as $2r+1$ and $2s+1$. Their product is $2(2rs+r+s)+1$. The parenthesized expression is integral, proving oddness.
  '16':
    instructions: ''
    prompt: Prove that the square of an odd integer leaves remainder 1 on division by 8.
    answer: Let $n=2k+1$. Then $n^2=4k(k+1)+1$. One of consecutive integers $k,k+1$ is even, so $k(k+1)=2t$ for integer $t$. Thus $n^2=8t+1$.
  '17':
    instructions: ''
    prompt: Prove that $n(n+1)$ is even for every integer $n$, using cases.
    answer: If $n=2k$, the product is $2[k(n+1)]$. If $n=2k+1$, it is $2[n(k+1)]$. Every integer is even or odd, and both witnesses are integers.
  '18':
    instructions: ''
    prompt: Prove that $n^2+n+1$ is odd for every integer $n$.
    answer: For arbitrary integer $n$, the consecutive product $n(n+1)$ is even, so it equals $2t$ for integer $t$. Hence $n^2+n+1=2t+1$ is odd.
  '19':
    instructions: ''
    prompt: Prove that the sum of three odd integers is odd.
    answer: Write the arbitrary odd integers as $2r+1,2s+1,2t+1$. Their sum is $2(r+s+t+1)+1$, with an integer witness.
  '20':
    instructions: ''
    prompt: Prove that if $n$ is even, then $n^2$ is divisible by 4.
    answer: Write the arbitrary even integer as $n=2k$. Then $n^2=4k^2$, where $k^2\in\mathbb Z$, so $4\mid n^2$.
  '21':
    instructions: Let $a,b,c$ be integers.
    prompt: "Prove transitivity of divisibility: $a\\mid b$ and $b\\mid c$ imply $a\\mid c$."
    answer: For arbitrary integers satisfying the hypotheses, write $b=ar$ and $c=bs$ with integers $r,s$. Then $c=a(rs)$, giving the required integer witness.
  '22':
    instructions: Let $d,a,b$ be integers.
    prompt: Prove that $d\mid a$ and $d\mid b$ imply $d\mid(a-b)$.
    answer: Write $a=dr,b=ds$ for integers $r,s$. Then $a-b=d(r-s)$, and $r-s$ is an integer. No division by $d$ is needed.
  '23':
    instructions: Let $d,a,b$ be integers.
    prompt: Prove that $d\mid a$ and $d\mid b$ imply $d\mid(5a-2b)$.
    answer: Choose integer witnesses $a=dr,b=ds$. Then $5a-2b=d(5r-2s)$. The coefficient is integral, proving divisibility.
  '24':
    instructions: ''
    prompt: Prove that $a\mid b$ implies $a^2\mid b^2$ for integers $a,b$.
    answer: Write $b=ak$ with integer $k$. Squaring gives $b^2=a^2k^2$, whose integer witness is $k^2$. This also covers $a=0$ when the hypothesis holds.
  '25':
    instructions: ''
    prompt: Prove that a common integer divisor of $n$ and $n+1$ divides 1.
    answer: Write $n=dr,n+1=ds$ with integer witnesses. Subtract to get $1=d(s-r)$, so $d\mid1$. In particular any positive common divisor is 1.
  '26':
    instructions: ''
    prompt: Prove that the product of two rational numbers is rational.
    answer: For arbitrary rationals $x=a/b,y=c/d$ with integer numerators and nonzero integer denominators, $xy=ac/(bd)$. Both entries are integers and $bd\ne0$, proving rationality.
  '27':
    instructions: ''
    prompt: Prove that the difference of two rational numbers is rational.
    answer: Write arbitrary rationals as $a/b,c/d$, with $b,d\ne0$. Their difference is $(ad-bc)/(bd)$, an integer numerator over a nonzero integer denominator.
  '28':
    instructions: ''
    prompt: Prove that a nonzero rational number has a rational reciprocal.
    answer: Let $x=a/b\ne0$, with integers $a,b$ and $b\ne0$. Since $x\ne0$, also $a\ne0$. The reciprocal is $b/a$, a rational number.
  '29':
    instructions: ''
    prompt: Prove that $x/y$ is rational when $x,y$ are rational and $y\ne0$.
    answer: Write $x=a/b,y=c/d$, with integer entries and $b,d\ne0$. Nonzero $y$ gives $c\ne0$. Then $x/y=ad/(bc)$ has integer numerator and nonzero integer denominator.
  '30':
    instructions: ''
    prompt: Prove that the average of two rational numbers is rational.
    answer: For arbitrary rationals $x=a/b,y=c/d$ with nonzero integer denominators, $(x+y)/2=(ad+bc)/(2bd)$. Its numerator is integer and denominator is nonzero integer.
  '31':
    instructions: ''
    prompt: Prove $A\cap B\subseteq A\cup B$ by an element argument.
    answer: Choose arbitrary $x\in A\cap B$. Then $x\in A$ and $x\in B$; in particular it belongs to at least one, so $x\in A\cup B$.
  '32':
    instructions: ''
    prompt: Prove that $A\subseteq B$ and $B\subseteq C$ imply $A\subseteq C$.
    answer: Choose arbitrary $x\in A$. The first inclusion gives $x\in B$, and the second gives $x\in C$. This covers every element of $A$.
  '33':
    instructions: ''
    prompt: Prove $A\cap(B\cup C)=(A\cap B)\cup(A\cap C)$.
    answer: An arbitrary $x$ belongs to the left side exactly when $x\in A$ and either $x\in B$ or $x\in C$. By distribution this means either membership in both $A,B$ or in both $A,C$, exactly the right side. Each step is reversible.
  '34':
    instructions: ''
    prompt: Prove $A\setminus(B\cup C)=(A\setminus B)\cap(A\setminus C)$.
    answer: Membership on the left means $x\in A$, $x\notin B$, and $x\notin C$. This is equivalent to membership in both differences on the right. The equivalence holds for arbitrary ambient $x$.
  '35':
    instructions: ''
    prompt: Prove that $A\subseteq B$ if and only if $A\cup B=B$.
    answer: If $A\subseteq B$, any element in the union is in $B$, and every $B$ element is in the union. Conversely, if the union equals $B$, each $x\in A$ lies in the union and hence in $B$.
  '36':
    instructions: ''
    prompt: Prove that an integer $n$ is odd if and only if $n+1$ is even.
    answer: If $n=2k+1$, then $n+1=2(k+1)$ is even. Conversely, if $n+1=2k$, then $n=2(k-1)+1$ is odd. All witnesses are integers.
  '37':
    instructions: Let $n$ be an integer.
    prompt: Prove that $6\mid n$ implies both $2\mid n$ and $3\mid n$.
    answer: For arbitrary integer $n=6k$, we have $n=2(3k)$ and $n=3(2k)$. The two coefficients are integers, proving both parts of the conclusion.
  '38':
    instructions: ''
    prompt: Prove $|x|\geq x$ for every real $x$, defining absolute value by cases.
    answer: If $x\geq0$, then $|x|=x$. If $x<0$, then $|x|=-x>x$. These cases cover all real numbers, so the inequality always holds.
  '39':
    instructions: ''
    prompt: Prove that $n^2\geq n$ for every integer $n$, using cases.
    answer: If $n\leq0$, then $n^2\geq0\geq n$. Otherwise integrality gives $n\geq1$, so multiplying $n\geq1$ by positive $n$ gives $n^2\geq n$.
  '40':
    instructions: Let $A,B$ be subsets of a common universe $U$, with $B^c=U\setminus B$.
    prompt: Prove that $A\cap B=\varnothing$ if and only if $A\subseteq B^c$.
    answer: Empty intersection means no element of $A$ is in $B$, so every $A$ element lies in $B^c$. Conversely, that inclusion makes membership in both $A$ and $B$ impossible, so the intersection is empty.
  '41':
    instructions: ''
    prompt: Prove that every integer has a larger even integer.
    answer: Let $n$ be an arbitrary integer. If $n\geq0$, choose $m=2n+2=2(n+1)$; it is an even integer and $m-n=n+2>0$. If $n<0$, choose $m=2$, which is even and greater than $n$. These cases cover every integer.
  '42':
    instructions: ''
    prompt: Prove that between real numbers $a<b$ there is a real number.
    answer: Choose $c=(a+b)/2$. Both $c-a$ and $b-c$ equal the positive number $(b-a)/2$, so $a<c<b$ and $c$ is real.
  '43':
    instructions: ''
    prompt: Prove that between rational numbers $a<b$ there is a rational number.
    answer: Choose $c=(a+b)/2$, rational by rational closure. The differences $c-a=b-c=(b-a)/2$ are positive, so the rational witness lies strictly between them.
  '44':
    instructions: ''
    prompt: Prove that every integer $n$ can be expressed as a difference of two odd integers exactly when $n$ is even.
    answer: A difference of odd integers is even. Conversely, if $n=2k$, choose the odd integers $2k+1$ and 1; their difference is $n$. This proves both directions.
  '45':
    instructions: ''
    prompt: Prove that each integer $n$ has a unique integer $m$ satisfying $n+m=0$.
    answer: 'Existence: $m=-n$ is integral and satisfies the equation. Uniqueness: any solutions $a,b$ satisfy $n+a=n+b=0$, so subtraction of $n$ gives $a=b$.'
  '46':
    instructions: ''
    prompt: Prove that for every real $y$ there is exactly one real $x$ with $3x+2=y$.
    answer: 'Existence: $x=(y-2)/3$ is real and substitution gives $y$. If $3a+2=y=3b+2$, then $3a=3b$ and $a=b$, proving uniqueness.'
  '47':
    instructions: ''
    prompt: Prove that there exists an integer divisible by both 4 and 6 but not by 5.
    answer: Choose 12. It equals $4\cdot3$ and $6\cdot2$. It is not divisible by 5 because $12=5\cdot2+2$ has nonzero remainder.
  '48':
    instructions: ''
    prompt: Prove that every positive integer $n$ divides some larger positive integer.
    answer: For arbitrary positive $n$, choose $m=2n$. It is positive, $n\mid m$ with witness 2, and $m-n=n>0$.
  '49':
    instructions: ''
    prompt: Prove that a nonempty finite set of integers can have at most one least element.
    answer: If $a,b$ are both least, then $a\leq b$ and $b\leq a$. Antisymmetry of integer order gives $a=b$. This proves at most one; no existence argument is needed for the stated claim.
  '50':
    instructions: ''
    prompt: Prove that $f:\mathbb Z\to\mathbb Z$, $f(n)=5n-3$, is injective.
    answer: Let arbitrary integers $a,b$ satisfy $f(a)=f(b)$. Then $5a-3=5b-3$, so $5(a-b)=0$ and $a=b$. This is exactly injectivity.
  '51':
    instructions: ''
    prompt: 'Refute: every integer is the sum of two even integers.'
    answer: The integer 1 is a counterexample. Any sum $2r+2s=2(r+s)$ is even, while 1 is odd, so no such representation exists.
  '52':
    instructions: ''
    prompt: 'Refute: if $ab$ is even, then both integers $a,b$ are even.'
    answer: Choose $a=2,b=3$. Their product 6 is even but $b$ is odd, so the conclusion that both are even fails.
  '53':
    instructions: Let $a,b$ range over the integers.
    prompt: "Refute: if $a\\mid b$, then $b\\mid a$."
    answer: Choose $a=2,b=6$. We have $6=2\cdot3$, but no integer $k$ has $2=6k$. Thus the hypothesis holds and conclusion fails.
  '54':
    instructions: ''
    prompt: 'Refute: the quotient of any two rational numbers is rational. State a repair.'
    answer: Taking divisor 0 makes the quotient undefined, so the assertion is not valid as written. Require the divisor to be a nonzero rational number; rational division closure then applies.
  '55':
    instructions: ''
    prompt: 'Refute: between any distinct integers there is another integer.'
    answer: 'Between 2 and 3 no integer exists: an integer greater than 2 is at least 3. The midpoint 2.5 is not an allowed integer witness.'
  '56':
    instructions: ''
    prompt: Refute $A\setminus B=B\setminus A$ for arbitrary sets.
    answer: Set $A=\{1\}$ and $B=\varnothing$. Then $A\setminus B=\{1\}$ while $B\setminus A=\varnothing$.
  '57':
    instructions: ''
    prompt: "Refute: $A\\cup B=A\\cup C$ always implies $B=C$."
    answer: Let $A=\{1\},B=\varnothing,C=\{1\}$. Both unions are $\{1\}$, but $B\ne C$.
  '58':
    instructions: ''
    prompt: "Refute: if $n^2\\geq n$, then the real number $n$ is an integer."
    answer: Choose $n=3/2$. Its square is $9/4\geq3/2$, but $3/2$ is not an integer.
  '59':
    instructions: ''
    prompt: 'Refute: a function is injective if one output has exactly one preimage.'
    answer: Define $f:\{1,2,3\}\to\{a,b\}$ by $f(1)=a,f(2)=b,f(3)=b$. Output $a$ has one preimage, but distinct inputs 2 and 3 collide, so the function is not injective.
  '60':
    instructions: ''
    prompt: "Refute: $A\\subseteq B$ proves $A=B$."
    answer: Let $A=\{1\}$ and $B=\{1,2\}$. Every element of $A$ belongs to $B$, but 2 belongs only to $B$. The reverse inclusion is missing.
  '61':
    instructions: ''
    prompt: An even-square proof chooses $n=8$ and checks $64$. Repair its universal step.
    answer: The example covers only 8. Instead choose any even integer $n=2k$ with $k\in\mathbb Z$. Then $n^2=2(2k^2)$, which is even because its witness is integral.
  '62':
    instructions: ''
    prompt: A proof writes $a=2k+1,b=2k+1$ for arbitrary odd $a,b$. Repair the sum argument.
    answer: Use independent integer witnesses $a=2r+1,b=2s+1$. Then $a+b=2(r+s+1)$ is even. A shared witness unjustifiably assumed $a=b$.
  '63':
    instructions: ''
    prompt: A proof claims $n^2=2k$ implies $n=2\sqrt{k/2}$ and hence evenness. What is missing?
    answer: "There are two gaps. Taking the positive square root loses negative solutions: $n=-2,k=2$ satisfies $n^2=2k$ but not the claimed equation for $n$. Even for $n\\geq0$, the argument does not show that $\\sqrt{k/2}$ is an integer, as the evenness definition requires. This attempted proof therefore does not establish the claim."
  '64':
    instructions: ''
    prompt: A proof of rational addition omits the denominator check. Complete it.
    answer: Write $x=a/b,y=c/d$ with all entries integral and $b,d\ne0$. Then $x+y=(ad+bc)/(bd)$ has integral numerator and denominator, and $bd\ne0$, which completes the rationality definition.
  '65':
    instructions: ''
    prompt: A proof of $x^2\geq0$ splits real $x$ into positive and negative cases. Repair it.
    answer: Add $x=0$, where $x^2=0$. If $x>0$, multiplying positives gives $x^2>0$. If $x<0$, then $-x>0$ and $x^2=(-x)^2>0$. All real inputs are covered.
  '66':
    instructions: ''
    prompt: A proof cancels $a$ from $ab=ac$ without hypotheses. State the missing assumption and a counterexample without it.
    answer: Require $a\ne0$ to divide by $a$. Without it, $a=0,b=1,c=2$ gives equal products but $b\ne c$.
  '67':
    instructions: ''
    prompt: A proof of set equality establishes only the left-to-right inclusion. What remains, and why?
    answer: Prove every element of the right-hand set belongs to the left-hand set. One inclusion permits extra elements on the right, as $\{1\}\subseteq\{1,2\}$ shows.
  '68':
    instructions: ''
    prompt: A witness proof for $\forall n\in\mathbb Z\exists m\in\mathbb Z,\ m>n$ chooses $m=10$. Repair it.
    answer: The fixed choice fails for $n\geq10$. After arbitrary $n$ is given, choose $m=n+1$; it is integral and exceeds $n$.
  '69':
    instructions: ''
    prompt: A uniqueness proof shows any two solutions equal but never finds a solution. What does it establish?
    answer: It proves at most one solution, which also allows zero solutions. To claim exactly one, separately exhibit a solution or otherwise prove existence.
  '70':
    instructions: ''
    prompt: Someone claims that every even integer is divisible by 4 and proposes $n=3$ as a counterexample. Explain why this fails, and give a valid counterexample.
    answer: 'The hypothesis is false at 3, so it is not a counterexample. Choose 6: it is even but leaves remainder 2 on division by 4.'
  '71':
    instructions: ''
    prompt: Prove that the sum of two integers with the same parity is even.
    answer: Let arbitrary integers $a,b$ have the same parity. If both are even, write $a=2r,b=2s$, giving sum $2(r+s)$. If both are odd, write $a=2r+1,b=2s+1$, giving sum $2(r+s+1)$. Both exhaustive cases have integer witnesses.
  '72':
    instructions: ''
    prompt: Prove that $d\mid a$ implies $d\mid a^2$ for all integers $d,a$.
    answer: For arbitrary $d,a$ satisfying the hypothesis, write $a=dk$ with integer $k$. Then $a^2=d(ka)$, where $ka$ is an integer. This handles zero and negative values without division.
  '73':
    instructions: ''
    prompt: Prove that if $a,b$ are rational and $a<b$, there are two distinct rationals strictly between them.
    answer: Choose $u=(2a+b)/3$ and $v=(a+2b)/3$. Rational closure gives rational witnesses. Each of $u-a,v-u,b-v$ equals $(b-a)/3>0$, so $a<u<v<b$.
  '74':
    instructions: ''
    prompt: Prove that $A\subseteq B$ implies $A\cap C\subseteq B\cap C$.
    answer: Let arbitrary $x\in A\cap C$. Then $x\in A$ and $x\in C$. The assumed inclusion gives $x\in B$, so $x\in B\cap C$, proving the inclusion.
  '75':
    instructions: ''
    prompt: Prove that $A\subseteq B$ implies $A\cup C\subseteq B\cup C$.
    answer: Choose arbitrary $x\in A\cup C$. If $x\in A$, then $x\in B$ and hence the target union. If $x\in C$, it belongs to the target union directly. These cases cover the source union.
  '76':
    instructions: ''
    prompt: Prove that the composition of injective functions $f:A\to B$ and $g:B\to C$ is injective.
    answer: For arbitrary $x,y\in A$, suppose $g(f(x))=g(f(y))$. Injectivity of $g$ gives $f(x)=f(y)$; injectivity of $f$ gives $x=y$. Thus equal composite outputs force equal inputs.
  '77':
    instructions: ''
    prompt: Prove that the composition of surjective functions $f:A\to B$ and $g:B\to C$ is surjective.
    answer: Given arbitrary $c\in C$, surjectivity of $g$ supplies $b\in B$ with $g(b)=c$. Surjectivity of $f$ supplies $a\in A$ with $f(a)=b$. Then $g(f(a))=c$, giving an allowed preimage for every target.
  '78':
    instructions: ''
    prompt: Prove that for real $x,y$, if $x\geq y\geq0$ then $x^2\geq y^2$.
    answer: For arbitrary real $x,y$ meeting the hypotheses, $x-y\geq0$ and $x+y\geq0$. Their product is nonnegative, so $x^2-y^2=(x-y)(x+y)\geq0$.
  '79':
    instructions: ''
    prompt: Prove that an integer is divisible by 4 if and only if it is twice an even integer.
    answer: If $n=4k$, choose the even integer $m=2k$, so $n=2m$. Conversely, if $n=2m$ with even $m=2k$, then $n=4k$. Both constructions use integer witnesses.
  '80':
    instructions: ''
    prompt: Prove that $f:\mathbb R\to\mathbb R$, $f(x)=2x-5$, is a bijection and give its inverse.
    answer: Equal outputs $2a-5=2b-5$ force $a=b$, proving injectivity. For arbitrary real target $y$, $x=(y+5)/2$ is real and maps to $y$, proving surjectivity. Thus $f^{-1}(y)=(y+5)/2$; substitution verifies both inverse identities.
proof-by-contrapositive:
  '1':
    instructions: ''
    prompt: Give the contrapositive of $P\to Q$ and explain why it is equivalent.
    answer: It is $\neg Q\to\neg P$. Both implications fail exactly when $P$ is true and $Q$ is false, so their truth values agree in every assignment.
  '2':
    instructions: ''
    prompt: Give the converse and inverse of $P\to Q$. Are they generally equivalent to the original?
    answer: The converse is $Q\to P$ and inverse is $\neg P\to\neg Q$. They are equivalent to each other, but not generally to the original; $P=F,Q=T$ distinguishes the pairs.
  '3':
    instructions: ''
    prompt: 'State the contrapositive of: if an integer is divisible by 4, it is even.'
    answer: If an integer is not even, it is not divisible by 4. Equivalently, for integers, an odd integer is not divisible by 4.
  '4':
    instructions: ''
    prompt: 'State the contrapositive of: if a real number has irrational square, it is irrational.'
    answer: If the real number is rational, its square is rational. Both negations stay within the real domain.
  '5':
    instructions: ''
    prompt: Distinguish the contrapositive from the negation of $P\to Q$.
    answer: The contrapositive is $\neg Q\to\neg P$, equivalent to the original. Its negation is $P\land\neg Q$, true exactly when the original fails.
  '6':
    instructions: ''
    prompt: In a contrapositive proof of $\forall x\in D(P(x)\to Q(x))$, does the outer quantifier become existential?
    answer: No. Prove $\neg Q(x)\to\neg P(x)$ for arbitrary $x\in D$; the outer quantifier stays universal. An existential appears when negating the whole theorem, a different operation.
  '7':
    instructions: ''
    prompt: Why may an integer being not even be replaced by being odd, but not an arbitrary real number?
    answer: Every integer has remainder 0 or 1 modulo 2, giving exactly even or odd. Parity is not an exhaustive classification of arbitrary real numbers such as $1/2$.
  '8':
    instructions: ''
    prompt: Give a true implication whose converse is false, with a verified counterexample to the converse.
    answer: "Divisibility by 4 implies evenness. Its converse fails at 6: $6=2\\cdot3$ is even but is not divisible by 4."
  '9':
    instructions: ''
    prompt: Explain the assumptions of a contrapositive proof versus a contradiction proof of $P\to Q$.
    answer: Contraposition assumes $\neg Q$ and derives $\neg P$. Contradiction assumes both $P$ and $\neg Q$ and derives an impossibility. Their logical organization differs.
  '10':
    instructions: ''
    prompt: Is proving the inverse enough to establish the original implication? Explain.
    answer: No. For $P=T,Q=F$, the inverse $\neg P\to\neg Q$ is true, but the original $P\to Q$ is false. Thus establishing the inverse alone does not establish the original.
  '11':
    instructions: ''
    prompt: Give the contrapositive of $P\to(Q\lor R)$. Push negations inward so that none applies to a compound statement.
    answer: $(\neg Q\land\neg R)\to\neg P$. For $Q\lor R$ to be false, both $Q$ and $R$ must be false.
  '12':
    instructions: ''
    prompt: Give the contrapositive of $(P\land R)\to Q$. Push negations inward so that none applies to a compound statement.
    answer: $\neg Q\to(\neg P\lor\neg R)$. Negating the conjunction in the original hypothesis gives a disjunction.
  '13':
    instructions: ''
    prompt: Give the contrapositive of $(P\lor R)\to(Q\land S)$. Push negations inward so that none applies to a compound statement.
    answer: $(\neg Q\lor\neg S)\to(\neg P\land\neg R)$. Apply De Morgan's law separately to the original conclusion and hypothesis.
  '14':
    instructions: ''
    prompt: 'Give the contrapositive of: for real $x$, if $x>3$ then $x^2>9$. Push negations inward so that none applies to a compound statement.'
    answer: For real $x$, if $x^2\leq9$, then $x\leq3$. The weak inequalities include the equality boundary cases.
  '15':
    instructions: ''
    prompt: 'Give the contrapositive of: for integers $a,b$, if $ab$ is odd, both $a$ and $b$ are odd. Push negations inward so that none applies to a compound statement.'
    answer: If $a$ is even or $b$ is even, then $ab$ is even. Negating both factors odd gives at least one factor even.
  '16':
    instructions: ''
    prompt: 'Give the contrapositive of: for integers $a,b$, if $ab$ is even, at least one of $a,b$ is even. Push negations inward so that none applies to a compound statement.'
    answer: If both $a$ and $b$ are odd, then $ab$ is odd. Both odd factors are needed; assuming only one does not negate the conclusion.
  '17':
    instructions: 'Let $A$ be a proposition and $R(c,x)$ a predicate of two real numbers.'
    prompt: For a fixed real $c$, give the contrapositive of $A\to\forall x\in\mathbb R,\ R(c,x)$. Push negations inward so that none applies to a compound statement.
    answer: If $\exists x\in\mathbb R,\neg R(c,x)$, then $\neg A$. The negation of the universal conclusion supplies one failing witness.
  '18':
    instructions: 'Let $D$ be a domain, $P(x)$ a predicate on $D$, and $Q$ a proposition.'
    prompt: Give the contrapositive of $(\exists x\in D\,P(x))\to Q$. Push negations inward so that none applies to a compound statement.
    answer: $\neg Q\to\forall x\in D,\neg P(x)$. Negating existence says that every allowed candidate fails.
  '19':
    instructions: 'Let $A$ be a proposition, let $D,E$ be domains, and let $R(x,y)$ be a predicate for $x\in D$ and $y\in E$.'
    prompt: Give the contrapositive of $A\to\forall x\in D\exists y\in E\,R(x,y)$. Push negations inward so that none applies to a compound statement.
    answer: If $\exists x\in D\forall y\in E,\neg R(x,y)$, then $\neg A$. Quantifier order is retained while each quantifier switches kind.
  '20':
    instructions: ''
    prompt: 'Give the contrapositive of: if a user is an administrator and active, access is allowed.'
    answer: If access is not allowed, the user is not an administrator or is not active. It need not be the case that both original conditions fail.
  '21':
    instructions: All variables are integers.
    prompt: 'Prove by contrapositive: if $n^2$ is even, then $n$ is even.'
    answer: 'Contrapositive: odd $n$ has odd square. Write $n=2k+1$ for integer $k$. Then $n^2=2(2k^2+2k)+1$, which is odd with an integer witness. Contraposition gives the claim.'
  '22':
    instructions: All variables are integers.
    prompt: 'Prove by contrapositive: if $n^2$ is odd, then $n$ is odd.'
    answer: 'Contrapositive: even $n$ has even square. If $n=2k$ with integer $k$, then $n^2=2(2k^2)$ is even. Since every integer is even or odd, the contrapositive proves the statement.'
  '23':
    instructions: All variables are integers.
    prompt: 'Prove by contrapositive: if $ab$ is even, at least one factor is even.'
    answer: 'Contrapositive: both factors odd implies odd product. Write $a=2r+1,b=2s+1$. Then $ab=2(2rs+r+s)+1$ is odd, with integral coefficient. Thus an even product cannot have two odd factors.'
  '24':
    instructions: All variables are integers.
    prompt: 'Prove by contrapositive: if $ab$ is odd, both factors are odd.'
    answer: 'Contrapositive: at least one even factor makes the product even. If $a=2r$, then $ab=2(rb)$; if $b=2s$, then $ab=2(as)$. Each witness is integral, and the cases cover the negated conclusion.'
  '25':
    instructions: All variables are integers.
    prompt: 'Prove by contrapositive: if $a+b$ is odd, then $a,b$ have different parity.'
    answer: 'Contrapositive: same parity gives even sum. For even $a=2r,b=2s$, the sum is $2(r+s)$. For odd $a=2r+1,b=2s+1$, it is $2(r+s+1)$. Thus the original follows.'
  '26':
    instructions: All variables are integers.
    prompt: 'Prove by contrapositive: if $a+b$ is even, then $a,b$ have the same parity.'
    answer: 'Contrapositive: different parity gives odd sum. Write the even member as $2r$ and odd member as $2s+1$; their sum is $2(r+s)+1$, regardless of order. All witnesses are integers.'
  '27':
    instructions: All variables are integers.
    prompt: 'Prove by contrapositive: if $n^3$ is even, then $n$ is even.'
    answer: 'Contrapositive: if $n=2k+1$ is odd, then $n^3=2(4k^3+6k^2+3k)+1$ is odd. The coefficient is an integer, so contraposition establishes the claim.'
  '28':
    instructions: All variables are integers.
    prompt: 'Prove by contrapositive: if $n^2+1$ is even, then $n$ is odd.'
    answer: 'Contrapositive: if $n=2k$ is even, then $n^2+1=2(2k^2)+1$ is odd. Therefore an even value of $n^2+1$ requires odd $n$.'
  '29':
    instructions: All variables are integers.
    prompt: 'Prove by contrapositive: if $3n+2$ is odd, then $n$ is odd.'
    answer: 'Contrapositive: if $n=2k$ is even, then $3n+2=2(3k+1)$ is even. The integer witness proves the contrapositive.'
  '30':
    instructions: All variables are integers.
    prompt: 'Prove by contrapositive: if $5n+1$ is even, then $n$ is odd.'
    answer: 'Contrapositive: even $n=2k$ gives $5n+1=2(5k)+1$ odd. This covers every even integer and hence proves the original implication.'
  '31':
    instructions: All variables are integers.
    prompt: Prove by contrapositive that $3\mid n^2$ implies $3\mid n$.
    answer: If $3\nmid n$, write $n=3k+1$ or $3k+2$. The squares are respectively $3(3k^2+2k)+1$ and $3(3k^2+4k+1)+1$. Both have remainder 1, so neither is divisible by 3.
  '32':
    instructions: All variables are integers.
    prompt: Prove by contrapositive that $4\mid n^2$ implies $n$ is even.
    answer: If $n$ is odd, write $n=2k+1$. Then $n^2=4(k^2+k)+1$ has remainder 1 on division by 4. Thus $4\nmid n^2$, proving the contrapositive.
  '33':
    instructions: All variables are integers.
    prompt: Prove that $6\nmid n$ follows whenever $3\nmid n$, using an equivalent direct statement.
    answer: The contrapositive is $6\mid n\to3\mid n$. For arbitrary integer $n=6k$, $n=3(2k)$ with integer witness $2k$. Therefore failure of divisibility by 3 prevents divisibility by 6.
  '34':
    instructions: All variables are integers.
    prompt: "Prove: if $d\\nmid a^2$, then $d\\nmid a$ for integers $d,a$."
    answer: "Contrapositive: $d\\mid a$ implies $d\\mid a^2$. If $a=dk$ with integer $k$, then $a^2=d(ka)$, with integer witness $ka$. No nonzero condition on $d$ is needed."
  '35':
    instructions: All variables are integers.
    prompt: "Prove: if $d\\nmid(a+b)$, then $d\\nmid a$ or $d\\nmid b$."
    answer: 'Contrapositive: if $a=dr$ and $b=ds$ with integer witnesses, then $a+b=d(r+s)$. Thus divisibility of both summands ensures divisibility of the sum, proving the original disjunction.'
  '36':
    instructions: All variables are integers.
    prompt: "Prove: if $d\\nmid(a-b)$, then $d\\nmid a$ or $d\\nmid b$."
    answer: "Contrapositive: if $d\\mid a$ and $d\\mid b$, write $a=dr,b=ds$. Then $a-b=d(r-s)$ with an integer coefficient, so it is divisible by $d$."
  '37':
    instructions: All variables are integers.
    prompt: Prove that $3\mid n^2+2$ implies $3\nmid n$.
    answer: 'Contrapositive: if $n=3k$, then $n^2+2=3(3k^2)+2$, which has nonzero remainder modulo 3. Hence it is not divisible by 3.'
  '38':
    instructions: All variables are integers.
    prompt: Prove that $5\mid n^2$ implies $5\mid n$.
    answer: If $5\nmid n$, its remainder is 1, 2, 3, or 4. Squaring these remainders gives remainders 1, 4, 4, 1 modulo 5. None is zero; expanding $(5k+r)^2$ shows its remainder equals that of $r^2$. Thus the contrapositive holds.
  '39':
    instructions: All variables are integers.
    prompt: "Refute the proposed generalization: for every positive integer $d$, $d\\mid n^2$ implies $d\\mid n$."
    answer: Take $d=4,n=2$. Then $4\mid4=n^2$, but $4\nmid2$. The prime-divisor examples do not justify this assertion for arbitrary positive divisors.
  '40':
    instructions: All variables are integers.
    prompt: "Refute: if $6\\mid ab$, then $6\\mid a$ or $6\\mid b$."
    answer: Choose $a=2,b=3$. The product is 6, but neither factor is divisible by 6. Consequently its proposed contrapositive is false too.
  '41':
    instructions: Let $A,B\subseteq U$ and take complements relative to $U$.
    prompt: Prove $A\subseteq B\to B^c\subseteq A^c$ by elementwise contraposition.
    answer: Assume $A\subseteq B$ and choose arbitrary $x\in B^c$. Thus $x\notin B$. The contrapositive of $x\in A\to x\in B$ gives $x\notin A$. Since $x$ is in the universe, $x\in A^c$.
  '42':
    instructions: ''
    prompt: Write an elementwise contrapositive formulation of $A\cap B\subseteq C$.
    answer: For every ambient $x$, if $x\notin C$, then $x\notin A$ or $x\notin B$. Negating intersection membership gives the disjunction.
  '43':
    instructions: ''
    prompt: Write an elementwise contrapositive formulation of $A\cup B\subseteq C$.
    answer: If ambient $x\notin C$, then $x\notin A$ and $x\notin B$. Both memberships must fail because the original source is a union.
  '44':
    instructions: ''
    prompt: Prove that $f:\mathbb Z\to\mathbb Z$, $f(n)=7n+2$, is injective by distinct inputs.
    answer: Let arbitrary integers $a\ne b$. Then $f(a)-f(b)=7(a-b)\ne0$, so $f(a)\ne f(b)$. This is the contrapositive of equal outputs implying equal inputs.
  '45':
    instructions: ''
    prompt: Prove injectivity of $f:[0,\infty)\to[0,\infty)$, $f(x)=x^2$, using distinct inputs.
    answer: Let nonnegative $a\ne b$. Then $a+b>0$ and $a-b\ne0$, so $a^2-b^2=(a-b)(a+b)\ne0$. Thus distinct allowed inputs have distinct outputs.
  '46':
    instructions: ''
    prompt: For distinct nonnegative $a,b$, the argument $a+b>0$ and $a-b\ne0$ gives $a^2-b^2=(a-b)(a+b)\ne0$, proving that squaring is injective on $[0,\infty)$. Why does this argument fail for $f:\mathbb R\to\mathbb R$, $f(x)=x^2$? Give explicit inputs.
    answer: Distinct real inputs can satisfy $a+b=0$, for example $a=1,b=-1$. Their square difference is zero, so distinctness alone does not ensure different outputs.
  '47':
    instructions: ''
    prompt: For $f:A\to B$ and $g:B\to C$, prove by contrapositive that injectivity of $g\circ f$ implies injectivity of $f$.
    answer: If $f$ is not injective, some distinct $a,b$ satisfy $f(a)=f(b)$. Applying $g$ gives equal composite outputs at those same distinct inputs, so $g\circ f$ is not injective. This proves the contrapositive.
  '48':
    instructions: ''
    prompt: For $f:A\to B$ and $g:B\to C$, prove by contraposition that surjectivity of $g\circ f$ onto $C$ implies surjectivity of $g$.
    answer: If $g$ is not surjective, choose $c\in C$ missed by every $b\in B$. Each $f(a)$ belongs to $B$, so $g(f(a))\ne c$ for every $a$. The composition misses $c$ and is not surjective.
  '49':
    instructions: ''
    prompt: For $f:A\to B$ and $T\subseteq B$, prove $f(x)\notin T\to x\notin f^{-1}(T)$ for $x\in A$.
    answer: The contrapositive is $x\in f^{-1}(T)\to f(x)\in T$, exactly the definition of preimage. Equivalently, assuming $f(x)\notin T$ directly excludes preimage membership.
  '50':
    instructions: ''
    prompt: "Refute: if $g\\circ f$ is injective, then $g$ is injective on its entire domain."
    answer: Let $A=\{a\},B=\{1,2\},C=\{u\}$, $f(a)=1$, and $g(1)=g(2)=u$. The singleton-domain composition is injective, but $g$ has a collision.
  '51':
    instructions: ''
    prompt: 'Prove: if $x^2$ is irrational, then real $x$ is irrational.'
    answer: "Contrapositive: if $x=a/b$ with integers $a,b$ and $b\\ne0$, then $x^2=a^2/b^2$ is rational because its denominator is nonzero. Thus the original follows."
  '52':
    instructions: ''
    prompt: 'Prove: if $3x+1$ is irrational, then real $x$ is irrational.'
    answer: If $x=a/b$ is rational, with $b\ne0$, then $3x+1=(3a+b)/b$ is rational. This proves the contrapositive for every real $x$.
  '53':
    instructions: ''
    prompt: 'Prove: if $x+y$ is irrational and real $y$ is rational, then $x$ is irrational.'
    answer: Fix rational $y$. The contrapositive assumes rational $x$; rational closure under addition makes $x+y$ rational. Therefore an irrational sum with rational $y$ forces irrational $x$.
  '54':
    instructions: ''
    prompt: 'Prove: if a product $xy$ of real numbers is irrational, at least one factor is irrational.'
    answer: 'Contrapositive: both rational factors have rational product. Writing $x=a/b,y=c/d$ with nonzero integer denominators gives $xy=ac/(bd)$, a rational number.'
  '55':
    instructions: ''
    prompt: "Refute: if real $x$ is irrational, then $x^2$ is irrational. You may use irrationality of $\\sqrt2$."
    answer: Choose $x=\sqrt2$. It is irrational by the supplied fact, but its square is the rational number 2.
  '56':
    instructions: ''
    prompt: "Prove by contraposition: for real $x$, $x^2\\leq9$ implies $x\\leq3$."
    answer: Assume $x>3$. Both $x-3$ and $x+3$ are positive, so $x^2-9=(x-3)(x+3)>0$. Thus $x^2>9$, establishing the contrapositive.
  '57':
    instructions: ''
    prompt: 'Prove: if $x+y>0$ for real $x,y$, then $x>0$ or $y>0$.'
    answer: "Contrapositive: if $x\\leq0$ and $y\\leq0$, adding gives $x+y\\leq0$. These are precisely the negations of the original conclusion and hypothesis."
  '58':
    instructions: ''
    prompt: "Prove: if real $xy<0$, then $x\\ne0$ and $y\\ne0$."
    answer: "Contrapositive: if $x=0$ or $y=0$, then $xy=0\\geq0$. Either case negates the strict-negative hypothesis, so both factors of a negative product must be nonzero."
  '59':
    instructions: ''
    prompt: 'Prove: if $x^2+y^2=0$ for real $x,y$, then $x=y=0$, using contraposition.'
    answer: If $x\ne0$ or $y\ne0$, at least one square is strictly positive and the other is nonnegative. Their sum is strictly positive, hence not zero. This proves the contrapositive.
  '60':
    instructions: ''
    prompt: 'Refute: if $x^2>9$ for real $x$, then $x>3$.'
    answer: Let $x=-4$. Its square is $16>9$, but $-4>3$ is false. Squaring loses the sign information needed by the claimed conclusion.
  '61':
    instructions: The root is an integer.
    prompt: A proof of even square implies even root assumes the root is even. What statement is it actually proving?
    answer: It attempts the converse, even root implies even square. To prove the original by contrapositive, assume an odd root $n=2k+1$ and derive $n^2=2(2k^2+2k)+1$ odd.
  '62':
    instructions: ''
    prompt: A proof negates $x>3$ as $x<3$. Explain and correct the error.
    answer: The equality case was omitted. The exact negation over reals is $x\leq3$, so any transformed implication must include $x=3$ in that negated condition.
  '63':
    instructions: The variables and factors are integers.
    prompt: A proof negates both factors even as both factors odd. Correct the negation.
    answer: The negation is at least one factor not even, hence at least one odd for integers. De Morgan's law changes the conjunction to a disjunction.
  '64':
    instructions: The variables and factors are integers.
    prompt: A proof of even product implies an even factor assumes only that the first factor is odd. Why is that insufficient?
    answer: Negating the conclusion requires both factors odd. If only the first is odd, the second could be even, as $3\cdot2=6$ shows; an odd product does not follow.
  '65':
    instructions: The variables and factors are integers.
    prompt: A proof of $3\mid n^2\to3\mid n$ checks only $n=3k+1$. What remains?
    answer: The nondivisible case $n=3k+2$ is missing. Its square is $3(3k^2+4k+1)+1$, also not divisible by 3. Both nonzero remainders are required.
  '66':
    instructions: ''
    prompt: A proof says negative integers cannot be written $3k+1$ or $3k+2$. Correct it with examples.
    answer: 'Division with nonnegative remainder applies to all integers: $-2=3(-1)+1$ and $-1=3(-1)+2$. The quotient can be negative; the remainder cases still cover the domain.'
  '67':
    instructions: ''
    prompt: A rational-square argument writes $x=a/b$ without requiring $b\ne0$. Repair the proof.
    answer: Rationality supplies integers $a,b$ with $b\ne0$. Then $x^2=a^2/b^2$ has nonzero denominator. The missing condition must come from the definition, not be ignored.
  '68':
    instructions: ''
    prompt: A proof concludes that the original theorem is false because its attempted contrapositive proof stalled. Is this justified?
    answer: No. An unsuccessful proof attempt is not a counterexample. Falsity requires an allowed input making the original hypothesis true and conclusion false, or another valid refutation.
  '69':
    instructions: 'Let $A$ be a proposition and $P(x)$ a predicate on a fixed domain. Both quantifiers range over that same domain.'
    prompt: A proposed contrapositive of $A\to\exists xP(x)$ is $(\exists x\neg P(x))\to\neg A$. Repair it.
    answer: The correct form is $(\forall x\neg P(x))\to\neg A$. One failed candidate does not negate existence of a successful candidate.
  '70':
    instructions: ''
    prompt: A proof changes the integer domain to the reals after taking the contrapositive. Explain the problem.
    answer: Contraposition itself preserves the domain; enlarging it is a separate change. A real-domain statement may introduce invalid parity language or additional cases. A valid proof over a larger domain would imply the original restricted claim, but only if the expressions are meaningful there and every added case is actually proved.
  '71':
    instructions: ''
    prompt: Prove that an integer is even if and only if its square is even.
    answer: 'Forward: $n=2k$ gives $n^2=2(2k^2)$ even. Reverse by contrapositive: $n=2k+1$ gives $n^2=2(2k^2+2k)+1$ odd. Integer witnesses prove both directions.'
  '72':
    instructions: ''
    prompt: Prove that an integer is odd if and only if its cube is odd.
    answer: 'Forward: odd $n=2k+1$ gives $n^3=2(4k^3+6k^2+3k)+1$. Reverse by contrapositive: even $n=2k$ gives $n^3=2(4k^3)$ even. Thus both implications hold.'
  '73':
    instructions: Let $n$ be an integer.
    prompt: Prove that $3\mid n$ if and only if $3\mid n^2$.
    answer: 'Forward: $n=3k$ gives $n^2=3(3k^2)$. Reverse: if $n$ has remainder 1 or 2 modulo 3, its square has remainder 1, as expansion of $(3k+r)^2$ shows. This proves the reverse by contrapositive.'
  '74':
    instructions: ''
    prompt: For integers $a,b$, prove that $ab$ is odd if and only if both factors are odd.
    answer: Two odd factors $(2r+1)(2s+1)$ give $2(2rs+r+s)+1$ odd. Conversely, if either factor is even, its product with an integer is even. Contraposition gives that an odd product has both factors odd.
  '75':
    instructions: Let $A,B\subseteq U$ and take complements relative to $U$.
    prompt: Prove that $A\subseteq B$ if and only if $B^c\subseteq A^c$.
    answer: Forward uses the contrapositive of $x\in A\to x\in B$. Reverse applies the same argument to $B^c\subseteq A^c$, obtaining $(A^c)^c\subseteq(B^c)^c$, hence $A\subseteq B$ in the fixed universe.
  '76':
    instructions: ''
    prompt: Prove that $f$ is injective if and only if distinct domain inputs have distinct outputs.
    answer: Injectivity states $f(x)=f(y)\to x=y$ for every allowed pair. Its contrapositive is $x\ne y\to f(x)\ne f(y)$. The two pointwise implications are equivalent, so their universal statements are equivalent.
  '77':
    instructions: ''
    prompt: For real $x,y$, prove $xy\ne0$ if and only if $x\ne0$ and $y\ne0$.
    answer: If either factor is zero, the product is zero, proving the forward direction by contrapositive. Conversely, if both are nonzero, their reciprocals exist; a zero product would give $y=0$ after division by $x$. Thus the product is nonzero.
  '78':
    instructions: ''
    prompt: For an integer $n$, prove that if $n^2$ is not divisible by 4, then $n$ is odd.
    answer: 'Contrapositive: even $n=2k$ gives $n^2=4k^2$, divisible by 4. Since not odd means even for integers, this is the exact contrapositive of the proposed statement.'
  '79':
    instructions: ''
    prompt: Prove that a real $x$ is rational if and only if $2x+1$ is rational.
    answer: If $x$ is rational, closure gives rational $2x+1$. Conversely, if $2x+1=r$ is rational, then $x=(r-1)/2$ is rational by closure and nonzero division. Thus both directions hold, and equivalently irrationality is preserved here too.
  '80':
    instructions: ''
    prompt: "Choose and carry out a proof of: if $d\\nmid(ra+sb)$, then $d\\nmid a$ or $d\\nmid b$, for integers $d,r,s,a,b$."
    answer: Contraposition exposes defining witnesses. Assume $a=du,b=dv$ for integers $u,v$. Then $ra+sb=d(ru+sv)$, and the coefficient is integral. Thus divisibility of both $a,b$ implies divisibility of the combination, proving the original statement.
proof-by-contradiction:
  '1':
    instructions: ''
    prompt: 'Negate: every integer has a larger integer.'
    answer: There exists an integer $n$ such that every integer $m$ satisfies $m\leq n$. This asserts a greatest integer, not merely two equal integers.
  '2':
    instructions: ''
    prompt: 'Negate: no rational number has square 2.'
    answer: There exists a rational number $x$ with $x^2=2$. Choose such a witness only within the temporary contradiction assumption.
  '3':
    instructions: ''
    prompt: 'Negate: for every integer $n$, if $n^2$ is even then $n$ is even.'
    answer: There exists an integer $n$ whose square is even but which is not even, hence odd. The hypothesis and failed conclusion must concern the same integer.
  '4':
    instructions: ''
    prompt: 'Negate: there are infinitely many primes.'
    answer: There are finitely many primes. The negation does not assert that there is exactly one prime or that no primes exist.
  '5':
    instructions: ''
    prompt: 'Negate: a given equation has at most one integer solution.'
    answer: There exist two distinct integers that both solve the equation. A single solution does not contradict at-most-one.
  '6':
    instructions: ''
    prompt: 'Negate: a given equation has exactly one integer solution.'
    answer: Either it has no integer solution, or it has at least two distinct integer solutions. Exactly one combines existence and at most one, so either component may fail.
  '7':
    instructions: ''
    prompt: Negate $A\subseteq B$ using a witness.
    answer: There exists $x\in A$ with $x\notin B$. An object outside $A$ cannot witness the failed inclusion.
  '8':
    instructions: ''
    prompt: Negate injectivity of $f:A\to B$.
    answer: There exist distinct $a,b\in A$ such that $f(a)=f(b)$. A contradiction proof may temporarily choose these colliding inputs.
  '9':
    instructions: ''
    prompt: Negate surjectivity of $f:A\to B$.
    answer: There exists $b\in B$ such that $f(a)\ne b$ for every $a\in A$. The missing output must belong to the declared codomain.
  '10':
    instructions: ''
    prompt: Explain why deriving a negative number is not automatically a contradiction.
    answer: Negative numbers exist. It is contradictory only if the same number was also proved nonnegative or otherwise forbidden by the assumptions. State the incompatible pair explicitly.
  '11':
    instructions: ''
    prompt: Prove by contradiction there is no greatest integer.
    answer: Suppose integer $M$ is greatest. The integer $M+1$ is then at most $M$, but arithmetic gives $M+1>M$. This contradiction rules out a greatest integer.
  '12':
    instructions: ''
    prompt: Prove by contradiction there is no least positive real number.
    answer: Suppose $r>0$ is least positive. Then $r/2>0$ but $r/2<r$, contradicting leastness. Thus no such positive real exists.
  '13':
    instructions: ''
    prompt: Prove by contradiction that no integer is both even and odd. You may use that no integer lies strictly between 0 and 1.
    answer: Suppose $n=2a=2b+1$ for integers $a,b$. Then $a-b=1/2$, an integer strictly between 0 and 1, impossible. Thus no integer has both parities.
  '14':
    instructions: ''
    prompt: Prove by contradiction that a positive integer greater than 1 cannot divide 1.
    answer: Suppose $d>1$ and $1=dk$ for integer $k$. Positivity forces $k\geq1$, so $1=dk\geq d>1$, a contradiction.
  '15':
    instructions: ''
    prompt: Prove by contradiction that if $a<b$ are real, then $b\leq a$ is false.
    answer: Suppose $a<b$ and $b\leq a$. Combining gives $a<b\leq a$, hence $a<a$, impossible for real order. Thus the proposed reverse weak comparison cannot hold.
  '16':
    instructions: ''
    prompt: Prove by contradiction that no real number satisfies $x^2+1=0$.
    answer: Suppose real $x$ satisfies it. Then $x^2=-1$, while every real square is nonnegative. These incompatible facts contradict the assumption.
  '17':
    instructions: ''
    prompt: Prove by contradiction that if $x,y>0$, then $x+y\ne0$.
    answer: Suppose positive $x,y$ satisfy $x+y=0$. Adding their positivity gives $x+y>0$, contradicting equality to zero. Hence the sum cannot vanish.
  '18':
    instructions: ''
    prompt: Prove by contradiction that $A\subseteq B$ and $B\subseteq C$ preclude an element of $A$ outside $C$.
    answer: Suppose such an $x$ exists. Since $x\in A$, the first inclusion gives $x\in B$; the second gives $x\in C$. This contradicts its chosen nonmembership in $C$.
  '19':
    instructions: ''
    prompt: Prove by contradiction that an injective function cannot send three distinct inputs to one output.
    answer: Suppose three distinct inputs share an output. In particular the first two have equal outputs; injectivity forces them equal, contradicting their stipulated distinctness.
  '20':
    instructions: ''
    prompt: Prove by contradiction that a nonempty finite set cannot be disjoint from itself.
    answer: Suppose nonempty $A$ has $A\cap A=\varnothing$. Choose $a\in A$. Then $a$ lies in both copies, hence in the empty intersection, a contradiction. Finiteness is not needed for this argument.
  '21':
    instructions: ''
    prompt: What does choosing a rational representation in lowest terms mean, and why can the denominator be positive?
    answer: Choose integers $a,b$ with $b>0$, $x=a/b$, and no common positive divisor greater than 1. If a denominator is negative, negating both entries preserves the value and makes it positive.
  '22':
    instructions: ''
    prompt: Explain why dividing numerator and denominator by their greatest positive common divisor leaves no common divisor greater than 1.
    answer: If the reduced entries shared $h>1$, then the original entries would share $gh>g$, contradicting that $g$ was greatest. The common-divisor set is nonempty and finite because its positive members divide the positive denominator.
  '23':
    instructions: ''
    prompt: Prove $\sqrt2$ is irrational.
    answer: "Suppose $\\sqrt2=a/b$ in lowest terms with integers $a,b$ and $b>0$. Then $a^2=2b^2$, so $a$ is even: $a=2k$. Substitution yields $b^2=2k^2$, so $b$ is even too. Both share divisor 2, contradicting lowest terms."
  '24':
    instructions: ''
    prompt: A contradiction proof assumes $\sqrt2=a/b$ for integers $a,b$ with $b\ne0$ and $\gcd(a,b)=1$. From $a^2=2b^2$ it deduces that both $a$ and $b$ are even. Why does that contradict the assumption?
    answer: They were chosen in lowest terms, which forbids a common positive divisor greater than 1. Evenness of both gives common divisor 2. Without the lowest-terms condition there would be no contradiction.
  '25':
    instructions: "You may use this fact: if $3\\mid n^2$ for an integer $n$, then $3\\mid n$."
    prompt: Prove that $\sqrt3$ is irrational.
    answer: Suppose $\sqrt3=a/b$ in lowest terms, $b>0$. Then $a^2=3b^2$, so $a=3k$. Substitution gives $b^2=3k^2$, so 3 divides $b$ as well. The common divisor 3 contradicts lowest terms.
  '26':
    instructions: ''
    prompt: Prove $\sqrt6$ is irrational using parity.
    answer: Suppose $\sqrt6=a/b$ in lowest terms, $b>0$. Then $a^2=6b^2$ is even, so $a=2k$. Thus $2k^2=3b^2$. If $b$ were odd, $3b^2$ would be odd, contradicting its evenness. Hence both $a,b$ are even, contradicting lowest terms.
  '27':
    instructions: ''
    prompt: Prove $\sqrt8$ is irrational, using irrationality of $\sqrt2$.
    answer: Since $\sqrt8=2\sqrt2$, suppose $\sqrt8=r$ were rational. Then $\sqrt2=r/2$ would be rational by nonzero rational division, contradicting the established irrationality.
  '28':
    instructions: 'You may use the facts that $\sqrt2$, $\sqrt3$, and $\sqrt6$ are irrational.'
    prompt: Prove $\sqrt{12}$ is irrational, using irrationality of $\sqrt3$.
    answer: We have $\sqrt{12}=2\sqrt3$. If it equaled rational $r$, then $\sqrt3=r/2$ would be rational, contradicting irrationality of $\sqrt3$.
  '29':
    instructions: ''
    prompt: To prove $\sqrt2$ irrational, one assumes $\sqrt2=a/b$ in lowest terms and derives that both $a,b$ are even from $a^2=2b^2$. Why can this pattern not prove $\sqrt4$ irrational? Examine $a^2=4b^2$.
    answer: "The number is rational: $\\sqrt4=2/1$. From $a^2=4b^2$ we get even $a$, but substitution $a=2k$ gives $k^2=b^2$, which does not force even $b$."
  '30':
    instructions: ''
    prompt: For a prime $p$, suppose $\sqrt p=a/b$ in lowest terms, so $a^2=pb^2$. What divisibility lemma would let you conclude that both $a,b$ are divisible by $p$, giving a contradiction?
    answer: "One needs: if prime $p$ divides an integer square $a^2$, then $p\\mid a$. With it, $a^2=pb^2$ forces $a=pk$ and then $b^2=pk^2$, so both entries share $p$. Calling $p$ prime alone does not replace this lemma's proof."
  '31':
    instructions: ''
    prompt: Prove that irrational $x$ plus rational $r$ is irrational.
    answer: Suppose $x+r$ is rational. Subtracting rational $r$ makes $x=(x+r)-r$ rational, contradicting the hypothesis. Thus the sum is irrational.
  '32':
    instructions: ''
    prompt: Prove that irrational $x$ minus rational $r$ is irrational.
    answer: Suppose $x-r$ is rational. Then $x=(x-r)+r$ is a sum of rationals, contradicting irrationality of $x$.
  '33':
    instructions: ''
    prompt: Prove that nonzero rational $r$ times irrational $x$ is irrational.
    answer: Suppose $rx$ is rational. Since $r\ne0$, rational closure under division makes $x=(rx)/r$ rational, a contradiction. The nonzero hypothesis justifies division.
  '34':
    instructions: ''
    prompt: The product of a nonzero rational number $r$ and an irrational real number $x$ is irrational. Show why the restriction $r\ne0$ is necessary by giving a counterexample with $r=0$.
    answer: Take $r=0,x=\sqrt2$. Then $rx=0$ is rational, despite irrational $x$. Thus the nonzero restriction is necessary.
  '35':
    instructions: ''
    prompt: Prove that the reciprocal of an irrational real is irrational.
    answer: An irrational $x$ is nonzero because 0 is rational. Suppose $1/x=r$ were rational. It is nonzero, so $x=1/r$ would be rational, contradicting the hypothesis.
  '36':
    instructions: ''
    prompt: Prove $5-2\sqrt2$ irrational.
    answer: If $5-2\sqrt2=r$ were rational, then $\sqrt2=(5-r)/2$ would be rational by closure, contradicting its established irrationality.
  '37':
    instructions: 'You may use the facts that $\sqrt2$, $\sqrt3$, and $\sqrt6$ are irrational.'
    prompt: Prove that $\sqrt2+\sqrt3$ is irrational, using irrationality of $\sqrt6$.
    answer: Suppose its value $r$ is rational. Squaring gives $r^2=5+2\sqrt6$, hence $\sqrt6=(r^2-5)/2$ is rational, a contradiction.
  '38':
    instructions: 'You may use the facts that $\sqrt2$, $\sqrt3$, and $\sqrt6$ are irrational.'
    prompt: Prove that $\sqrt3-\sqrt2$ is irrational, using irrationality of $\sqrt6$.
    answer: Suppose its value $r$ is rational. Then $r^2=5-2\sqrt6$, so $\sqrt6=(5-r^2)/2$ is rational, contradicting the stated fact.
  '39':
    instructions: ''
    prompt: Give irrational numbers whose sum is rational, and justify each input's irrationality.
    answer: Use $\sqrt2$ and $-\sqrt2$, summing to 0. The first is established irrational; if the second were rational, its negative $\sqrt2$ would be rational too, a contradiction.
  '40':
    instructions: 'You may use the facts that $\sqrt2$, $\sqrt3$, and $\sqrt6$ are irrational.'
    prompt: Give irrational numbers whose product is rational and irrational numbers whose product is irrational.
    answer: $\sqrt2\cdot\sqrt2=2$ is rational. $\sqrt2\cdot\sqrt3=\sqrt6$ is irrational by the established square-root results. All inputs in both examples are irrational.
  '41':
    instructions: ''
    prompt: Explain why an integer $N>1$ has a smallest positive divisor greater than 1.
    answer: The candidate set contains $N$ and lies within the finite set $\{2,\ldots,N\}$. Therefore it is nonempty and finite, so it has a least member.
  '42':
    instructions: ''
    prompt: Prove that the smallest divisor $d>1$ of $N>1$ is prime.
    answer: If $d$ were composite, some integer $a$ with $1<a<d$ would divide $d$. Since $d\mid N$, divisibility transitivity gives $a\mid N$. This contradicts minimality of $d$, so it is prime.
  '43':
    instructions: ''
    prompt: Distinguish the claims that every integer greater than 1 has a prime divisor and that every such integer is prime.
    answer: 'The first allows composite numbers: 12 has prime divisors 2 and 3. The second is false because 12 has positive divisors other than 1 and itself. A prime divisor need not equal the original integer.'
  '44':
    instructions: ''
    prompt: If $p_1,\ldots,p_k$ were all primes, why does $N=p_1\cdots p_k+1$ exceed 1?
    answer: The list is nonempty because 2 is prime, and its product is a positive integer at least 2. Adding 1 gives $N\geq3>1$, so the prime-divisor lemma applies.
  '45':
    instructions: ''
    prompt: Prove that no listed prime $p_i$ divides $N=p_1\cdots p_k+1$.
    answer: Each $p_i$ divides the product. If it also divided $N$, it would divide their difference 1. A prime is greater than 1 and cannot divide 1, so this is impossible.
  '46':
    instructions: ''
    prompt: Give the full contradiction proof that there are infinitely many primes.
    answer: Suppose all primes form a finite list $p_1,\ldots,p_k$. The number $N=p_1\cdots p_k+1>1$ has a prime divisor $q$. Completeness puts $q$ on the list, so it divides both $N$ and the product, hence their difference 1. This contradicts $q>1$.
  '47':
    instructions: ''
    prompt: Compute the product plus 1 for primes 2, 3, 5. What does this example illustrate, and what does it not prove?
    answer: $2\cdot3\cdot5+1=31$, which has no divisor 2, 3, or 5 and is prime. It illustrates the construction but does not prove that every such product-plus-one is prime or that every possible finite list fails without the general argument.
  '48':
    instructions: ''
    prompt: The product of the primes $2,3,5,7,11,13$, plus 1, is $30031$. Verify $30031=59\cdot509$. Explain why this disproves the claim that multiplying all primes on a finite list and adding 1 always gives a prime.
    answer: Multiplication gives $59\cdot509=30031=2\cdot3\cdot5\cdot7\cdot11\cdot13+1$. Thus the constructed number need not be prime. The infinitude proof uses a prime divisor absent from the list.
  '49':
    instructions: ''
    prompt: Prove that for every positive integer $M$, there is a prime greater than $M$, using infinitely many primes.
    answer: Suppose for some positive $M$ every prime were at most $M$. Then all primes would lie in the finite set $\{2,\ldots,M\}$, making them finite, contrary to infinitude. Thus a larger prime exists.
  '50':
    instructions: ''
    prompt: Why would assuming exactly two primes be insufficient to prove infinitely many primes by contradiction?
    answer: Refuting exactly two rules out only that count. There could still be 3, 4, or another finite number. The needed assumption is an arbitrary finite complete list, whose length is not fixed in advance.
  '51':
    instructions: ''
    prompt: Prove that a real number has at most one additive inverse by contradiction.
    answer: Suppose distinct real $a,b$ both satisfy $x+a=x+b=0$. Subtracting $x$ gives $a=b$, contradicting distinctness. Thus at most one inverse exists.
  '52':
    instructions: ''
    prompt: Prove every nonzero real $x$ has exactly one reciprocal.
    answer: 'Existence: $1/x$ satisfies $x(1/x)=1$. If distinct $a,b$ both satisfied $xa=xb=1$, division by nonzero $x$ would give $a=b$, a contradiction. Thus the reciprocal is unique.'
  '53':
    instructions: ''
    prompt: Prove that a partially ordered set has at most one least element.
    answer: Suppose distinct elements $a,b$ are both least. Leastness gives $a\preceq b$ and $b\preceq a$. Antisymmetry forces $a=b$, a contradiction.
  '54':
    instructions: ''
    prompt: Prove that two different equivalence classes cannot overlap.
    answer: Suppose $[a]\ne[b]$ share $z$. Then $zRa,zRb$; symmetry and transitivity give $aRb$. Any $xRa$ then gives $xRb$, and the reverse follows likewise. Thus the classes are equal, contradicting their assumed difference.
  '55':
    instructions: ''
    prompt: Prove that an injective function cannot have an output with two distinct preimages.
    answer: Suppose output $b$ has distinct preimages $x,y$. Then $f(x)=b=f(y)$, and injectivity forces $x=y$, contradicting distinctness. This covers any output in the codomain.
  '56':
    instructions: ''
    prompt: Prove that the equation $2x+3=7$ has exactly one real solution.
    answer: 'Existence: $x=2$ gives 7. If distinct $a,b$ both solved it, then $2a+3=2b+3$, so $a=b$ after subtraction and division by 2, a contradiction.'
  '57':
    instructions: ''
    prompt: Prove that no set is a proper subset of itself.
    answer: Suppose $A\subsetneq A$. Proper inclusion requires both $A\subseteq A$ and $A\ne A$. The second contradicts reflexivity of equality, so no such set exists.
  '58':
    instructions: ''
    prompt: Prove that two disjoint sets have no shared element by contradiction.
    answer: Suppose $A\cap B=\varnothing$ but some $x$ belongs to both. By the definition of intersection, $x\in A\cap B=\varnothing$, impossible.
  '59':
    instructions: ''
    prompt: Prove that if real $x>0$ and $xy=0$, then $y=0$.
    answer: Suppose instead $y\ne0$. Since $x>0$, $x\ne0$; dividing the equality by $x$ gives $y=0$, contradicting the temporary assumption. Thus $y=0$.
  '60':
    instructions: ''
    prompt: Does proving at most one solution establish that a solution exists? Give a counterexample.
    answer: No. The real equation $x^2=-1$ has no solutions and therefore at most one, but not exactly one. Existence is a separate obligation.
  '61':
    instructions: ''
    prompt: A square-root-of-2 proof chooses an arbitrary fraction and ends with both entries even. Why is that insufficient?
    answer: Even entries are possible in an unreduced fraction. Choose the representation in lowest terms first; then common divisor 2 contradicts the defining choice.
  '62':
    instructions: ''
    prompt: A proof assumes a finite list contains all primes, multiplies them together, and adds 1. It then asserts that the result is prime. Explain the error and supply the weaker fact that completes the proof.
    answer: Replace that assertion with the proved lemma that every integer greater than 1 has a prime divisor. Any such divisor cannot be on the proposed complete list, because it would then divide 1.
  '63':
    instructions: ''
    prompt: A proof of $P\to Q$ assumes only $\neg P$ and derives a contradiction. What is wrong with its planned negation?
    answer: The negation of the implication is $P\land\neg Q$, not $\neg P$. Refuting $\neg P$ would establish $P$, which alone does not establish $Q$ or the implication.
  '64':
    instructions: ''
    prompt: A proof of no least positive real chooses $r-1$ as a smaller positive real. Repair it.
    answer: $r-1$ may not be positive when $r\leq1$. Choose $r/2$ instead; for every positive $r$, it is positive and strictly smaller.
  '65':
    instructions: ''
    prompt: A proof of irrational $rx$ divides by rational $r$ without knowing it is nonzero. Repair the statement.
    answer: Require $r\ne0$. Then rational $rx$ would give rational $x=(rx)/r$, a contradiction. With $r=0$, the conclusion is false since the product is 0.
  '66':
    instructions: ''
    prompt: A proof says $a$ is even and $b$ is odd, therefore a contradiction. When would a contradiction follow?
    answer: Those facts about different integers are compatible. A contradiction would follow if it also established $a=b$, or that one same integer is both even and odd.
  '67':
    instructions: ''
    prompt: A proof of irrationality cites that the same number is irrational as its key lemma. Explain the failure.
    answer: It assumes the conclusion it is meant to prove, giving circular reasoning. Replace the citation with independently established facts such as parity and lowest-term representation.
  '68':
    instructions: ''
    prompt: A proof starts with $a=b=1$, then divides by $a-b$ to derive $2=1$. Identify the invalid step.
    answer: Here $a-b=0$, so division by $a-b$ is undefined. The apparent contradiction comes from an invalid algebraic operation, not from a legitimate contradiction proof.
  '69':
    instructions: ''
    prompt: A proof negates every request has a worker as no request has a worker. Repair the assumption.
    answer: "The negation is that at least one request has no worker. Write $A(r,w)$ for “worker $w$ is assigned to request $r$,” with $r$ ranging over requests and $w$ over workers. Then the negation is $\\exists r\\forall w\\neg A(r,w)$. The proposed assumption is stronger and may fail even when the original claim is false."
  '70':
    instructions: ''
    prompt: A uniqueness argument proves two solutions equal, then concludes there are no solutions. Explain.
    answer: Equality of arbitrary solutions establishes at most one, not zero. It contradicts an assumption of two distinct solutions; it does not contradict existence of a single solution.
  '71':
    instructions: ''
    prompt: Prove that $1+\sqrt2$ cannot be rational.
    answer: Suppose it equals rational $r$. Then $\sqrt2=r-1$ is rational by subtraction closure, contradicting established irrationality of $\sqrt2$. Hence the proposed rationality is impossible.
  '72':
    instructions: ''
    prompt: Prove that if $r$ is rational and $x$ irrational, then $r-x$ is irrational.
    answer: Suppose $r-x=s$ were rational. Then $x=r-s$ would be rational by closure, contradicting the given irrationality. This works for every rational $r$ and irrational $x$.
  '73':
    instructions: ''
    prompt: Prove that no odd integer has a square divisible by 4.
    answer: Suppose odd $n=2k+1$ has $n^2=4t$ with integers $k,t$. Expanding gives $n^2=4(k^2+k)+1$, hence $1=4(t-k^2-k)$. This says 4 divides 1, impossible.
  '74':
    instructions: ''
    prompt: Prove that an integer and its successor cannot both be divisible by a positive integer $d>1$.
    answer: Suppose $n=da$ and $n+1=db$ for integer witnesses. Subtracting gives $1=d(b-a)$, so $d\mid1$, contradicting $d>1$. Thus no such consecutive multiples exist.
  '75':
    instructions: ''
    prompt: Prove that if $A\subseteq B$ and $B\subseteq A$, then $A=B$, by ruling out inequality.
    answer: Suppose $A\ne B$. By the definition of set equality, some element belongs to exactly one set. If in $A$ only, $A\subseteq B$ is violated; if in $B$ only, $B\subseteq A$ is violated. Both cases contradict the hypotheses.
  '76':
    instructions: ''
    prompt: Prove that if $f:A\to B$ has a left inverse $g:B\to A$ with $g(f(a))=a$, then $f$ is injective.
    answer: Suppose $f$ is not injective. Choose distinct $a,b\in A$ with equal outputs. Applying $g$ gives $g(f(a))=g(f(b))$, hence $a=b$ by the left-inverse identities. This contradicts distinctness.
  '77':
    instructions: ''
    prompt: Prove that if $f:A\to B$ has a right inverse $g:B\to A$ with $f(g(b))=b$, then $f$ is surjective.
    answer: Suppose some $b\in B$ has no preimage under $f$. But $g(b)\in A$ and $f(g(b))=b$, supplying exactly such a preimage and contradicting its absence.
  '78':
    instructions: ''
    prompt: Prove that no rational number $x$ satisfies $x^2=2$, without assuming $x$ positive.
    answer: Suppose rational $x=a/b$ in lowest terms, with integers $a,b$ and $b>0$, satisfies it. Then $a^2=2b^2$. The parity lemma makes $a$ even; substituting $a=2k$ makes $b^2=2k^2$ and hence $b$ even. Lowest terms is contradicted regardless of the sign of $a$.
  '79':
    instructions: ''
    prompt: Prove that there is no largest rational number less than 1.
    answer: Suppose rational $r<1$ were the largest. Set $s=(r+1)/2$, which is rational. Since $s-r=(1-r)/2>0$ and $1-s=(1-r)/2>0$, we have $r<s<1$, contradicting largestness.
  '80':
    instructions: ''
    prompt: Prove that a strictly increasing function $f:\mathbb R\to\mathbb R$ is injective. Strictly increasing means $a<b\to f(a)<f(b)$.
    answer: Suppose distinct real $a,b$ have equal outputs. Since distinct real numbers can be ordered, either $a<b$ or $b<a$. Strict increase gives respectively $f(a)<f(b)$ or $f(b)<f(a)$, each contradicting output equality. Therefore no collision exists.
mathematical-induction:
  '1':
    instructions: ''
    prompt: State the two obligations for proving $P(n)$ for every integer $n\geq3$ by ordinary induction.
    answer: Prove $P(3)$, then for arbitrary integer $k\geq3$ assume $P(k)$ and prove $P(k+1)$. Conclude all integer cases from 3 onward.
  '2':
    instructions: ''
    prompt: For $P(n):\sum_{i=1}^n i=n(n+1)/2$, write $P(k+1)$ exactly.
    answer: The target is $\sum_{i=1}^{k+1}i=(k+1)(k+2)/2$. Every occurrence of $n$ is replaced by $k+1$, including the second factor.
  '3':
    instructions: ''
    prompt: For $P(n):3\mid4^n-1$, give an algebraic induction hypothesis.
    answer: For arbitrary integer $k$ in the induction range, assume $4^k-1=3t$ for some integer $t$. The witness comes from divisibility, not from assuming $4^k$ itself is divisible by 3.
  '4':
    instructions: ''
    prompt: Why is assuming $P(k)$ in the inductive step not circular?
    answer: The step proves only the conditional $P(k)\to P(k+1)$ for arbitrary $k$. The base and induction principle establish the whole family. Assuming $P(k+1)$ without justification would be circular.
  '5':
    instructions: ''
    prompt: Does a proof beginning at $n=2$ establish the case $n=0$? Explain.
    answer: No. It establishes only the stated cases $n\geq2$. Earlier cases require separate checks or a proof with an earlier valid base and connecting steps.
  '6':
    instructions: ''
    prompt: Why cannot ordinary integer induction establish a claim for all real $x\geq0$ by adding 1?
    answer: Starting at 0 and repeatedly adding 1 reaches only nonnegative integers, missing values such as 1/2. Real order has no immediate next real value.
  '7':
    instructions: ''
    prompt: If the base is $P(0)$ and the step is $P(k)\to P(k+2)$, which indices are reached?
    answer: Only even nonnegative indices are reached from 0. A separate base $P(1)$ would seed the odd chain, provided the step is valid there too.
  '8':
    instructions: ''
    prompt: For $a_0=5$ and $a_{n+1}=2a_n$ at integer indices $n\geq0$, distinguish the definition from the proposed formula $a_n=5\cdot2^n$.
    answer: The initial value and recurrence are given facts defining the sequence. The closed formula is the statement to prove; it may be assumed only at the induction index during the conditional step.
  '9':
    instructions: ''
    prompt: Why must an inequality proof justify multiplying by a factor's sign?
    answer: Multiplication by a nonnegative factor preserves the inequality, while a negative factor reverses it. An unjustified sign assumption can invalidate the inductive bound.
  '10':
    instructions: ''
    prompt: How can a stronger induction statement help even if the original goal is weaker?
    answer: Extra information may supply a quantity needed in the next step. Proving a conjunction or exact formula can provide that information and imply the original goal afterward.
  '11':
    instructions: ''
    prompt: Prove by induction $\sum_{i=1}^n i=n(n+1)/2$ for integers $n\geq1$.
    answer: "Base 1: both sides are 1. Assume the formula at arbitrary $k\\geq1$. Adding $k+1$ gives $k(k+1)/2+(k+1)=(k+1)(k+2)/2$, exactly the next formula. Induction proves all cases."
  '12':
    instructions: ''
    prompt: Prove by induction $\sum_{i=1}^n(2i-1)=n^2$ for integers $n\geq0$.
    answer: "Base 0: the empty sum is 0. Assuming the sum at $k$ is $k^2$, add the next term $2k+1$. The result $k^2+2k+1=(k+1)^2$ proves the step for arbitrary $k\\geq0$."
  '13':
    instructions: ''
    prompt: Prove by induction $\sum_{i=1}^n2i=n(n+1)$ for integers $n\geq0$.
    answer: 'Base 0: both sides are 0. Assuming the identity at $k$, the next sum is $k(k+1)+2(k+1)=(k+1)(k+2)$. This proves the step and all nonnegative cases.'
  '14':
    instructions: ''
    prompt: Prove by induction $\sum_{i=0}^n2^i=2^{n+1}-1$ for integers $n\geq0$.
    answer: "Base 0: $1=2^1-1$. Assume the formula at arbitrary $k\\geq0$. Adding $2^{k+1}$ gives $(2^{k+1}-1)+2^{k+1}=2^{k+2}-1$, the next case."
  '15':
    instructions: ''
    prompt: Prove by induction $\sum_{i=0}^n3^i=(3^{n+1}-1)/2$ for integers $n\geq0$.
    answer: "Base 0: both sides are 1. Assume the formula at $k$. Adding $3^{k+1}$ gives $(3^{k+1}-1+2\\cdot3^{k+1})/2=(3^{k+2}-1)/2$. Thus induction applies."
  '16':
    instructions: ''
    prompt: Prove by induction $\sum_{i=1}^n i^2=n(n+1)(2n+1)/6$ for integers $n\geq0$.
    answer: 'Base 0: both sides vanish. Assume the formula at $k$. Adding $(k+1)^2$ and factoring $k+1$ gives $(k+1)[k(2k+1)+6(k+1)]/6$. The bracket is $2k^2+7k+6=(k+2)(2k+3)$, yielding the required next formula.'
  '17':
    instructions: ''
    prompt: Prove by induction $\sum_{i=1}^n i^3=n^2(n+1)^2/4$ for integers $n\geq0$.
    answer: 'Base 0: both sides vanish. Assume the formula at $k$. Add $(k+1)^3$ and factor $(k+1)^2/4$, obtaining $(k+1)^2[k^2+4(k+1)]/4$. Since the bracket is $(k+2)^2$, this is the formula at $k+1$.'
  '18':
    instructions: ''
    prompt: Prove by induction $\sum_{i=1}^n1/[i(i+1)]=n/(n+1)$ for integers $n\geq0$.
    answer: "Base 0: the sum and right side are 0. Assuming the formula at $k$, the next sum is $k/(k+1)+1/[(k+1)(k+2)]$. Combining fractions yields $(k+1)/(k+2)$. Denominators are nonzero for $k\\geq0$."
  '19':
    instructions: ''
    prompt: Prove by induction $\prod_{i=1}^n(i+1)/i=n+1$ for integers $n\geq0$.
    answer: 'Base 0: the empty product is 1. Assume the product at $k$ equals $k+1$. Multiplying by the next factor $(k+2)/(k+1)$ gives $k+2$. The denominator is positive, so cancellation is valid.'
  '20':
    instructions: ''
    prompt: Prove by induction $\sum_{i=1}^n(3i-1)=n(3n+1)/2$ for integers $n\geq0$.
    answer: 'Base 0: both sides are 0. Assuming the formula at $k$, add $3k+2$. The result is $(3k^2+7k+4)/2=(k+1)(3k+4)/2$, which is the required next expression.'
  '21':
    instructions: ''
    prompt: Prove by induction $3\mid4^n-1$ for every integer $n\geq0$.
    answer: 'Base 0: the difference is 0. Assume $4^k-1=3t$ with integer $t$. Then $4^{k+1}-1=4(4^k-1)+3=3(4t+1)$. Its witness is integral, so induction proves the claim.'
  '22':
    instructions: ''
    prompt: Prove by induction $5\mid6^n-1$ for every integer $n\geq0$.
    answer: "Base 0: $6^0-1=0$. Assuming $6^k-1=5t$, the next difference is $6(6^k-1)+5=5(6t+1)$. This integer witness proves the step for arbitrary $k\\geq0$."
  '23':
    instructions: ''
    prompt: Prove by induction $7\mid8^n-1$ for every integer $n\geq0$.
    answer: 'Base 0: the difference is 0. If $8^k-1=7t$, then $8^{k+1}-1=8(8^k-1)+7=7(8t+1)$. The coefficient is integer, completing induction.'
  '24':
    instructions: ''
    prompt: Prove by induction $3\mid n^3-n$ for integers $n\geq0$.
    answer: 'Base 0: the expression is 0. The next expression is $(k^3-k)+3k(k+1)$. The first term is divisible by 3 by hypothesis, and the second visibly is too. Their sum is divisible by 3, proving the step.'
  '25':
    instructions: ''
    prompt: Prove by induction $6\mid n^3-n$ for integers $n\geq0$.
    answer: 'Base 0: the expression is 0. The difference between next and current expressions is $3k(k+1)$. The consecutive product $k(k+1)$ is even, making this difference divisible by 6. Adding it to the divisible induction expression proves the step.'
  '26':
    instructions: ''
    prompt: Prove $2\mid n(n+1)$ for integers $n\geq0$ by induction.
    answer: 'Base 0: the product is 0. The next product satisfies $(k+1)(k+2)=k(k+1)+2(k+1)$. The first term is even by hypothesis and the second is even, so their sum is even.'
  '27':
    instructions: ''
    prompt: Prove by induction $4\mid5^n-1$ for integers $n\geq0$.
    answer: 'Base 0: the difference is 0. If $5^k-1=4t$, then $5^{k+1}-1=5(5^k-1)+4=4(5t+1)$, proving the next case with an integer witness.'
  '28':
    instructions: ''
    prompt: Prove by induction $3\mid2^{2n}-1$ for integers $n\geq0$.
    answer: 'Base 0: the difference is 0. Assuming the current difference divisible by 3, write the next as $2^{2(k+1)}-1=4(2^{2k}-1)+3$. Both terms are divisible by 3, so the next case follows.'
  '29':
    instructions: ''
    prompt: Prove by induction $9\mid10^n-1$ for integers $n\geq0$ and explain the common pattern.
    answer: Base 0 gives 0. If $10^k-1=9t$, the next difference is $10(10^k-1)+9=9(10t+1)$. Generally an integer base one greater than a divisor yields the same rearrangement; this observation explains rather than replaces the proof.
  '30':
    instructions: ''
    prompt: A theorem is stated for $n\geq0$. Why does an induction proof of $3\mid n^3-n$ not automatically cover negative integers? Extend it.
    answer: The induction chain does not reach negative indices. For negative $n$, let $m=-n>0$. Then $n^3-n=-(m^3-m)$, divisible by 3 by the established positive case and closure under negation. This separately covers negatives.
  '31':
    instructions: ''
    prompt: Prove by induction $2^n\geq n+1$ for integers $n\geq0$.
    answer: "Base 0: $1\\geq1$. Assume $2^k\\geq k+1$. Then $2^{k+1}\\geq2k+2\\geq k+2$, since $k\\geq0$. The last expression is the next target, completing induction."
  '32':
    instructions: ''
    prompt: Prove by induction $3^n\geq2n+1$ for integers $n\geq0$.
    answer: "Base 0: both sides are 1. Assuming the bound at $k$, $3^{k+1}\\geq6k+3\\geq2k+3$, because $4k\\geq0$. This is the bound at $k+1$."
  '33':
    instructions: ''
    prompt: Prove by induction $2^n\geq n^2$ for integers $n\geq4$.
    answer: "Base 4: $16=16$. Assume the bound at arbitrary $k\\geq4$. Then $2^{k+1}\\geq2k^2$. Also $2k^2-(k+1)^2=(k-1)^2-2\\geq7>0$, so the next square is bounded. Induction completes the proof."
  '34':
    instructions: ''
    prompt: Prove by induction $n!\geq2^{n-1}$ for integers $n\geq1$.
    answer: "Base 1: both sides are 1. Assuming the bound at $k\\geq1$, $(k+1)!=(k+1)k!\\geq2\\cdot2^{k-1}=2^k$, since $k+1\\geq2$."
  '35':
    instructions: ''
    prompt: Prove by induction $n!\geq n^2$ for integers $n\geq4$.
    answer: "Base 4: $24\\geq16$. Assume $k!\\geq k^2$ at arbitrary $k\\geq4$. Then $(k+1)!\\geq(k+1)k^2$. The bridge follows from $k^2-k-1=k(k-1)-1\\geq11>0$, so $k^2\\geq k+1$. Multiplying by positive $k+1$ yields $(k+1)!\\geq(k+1)^2$, completing the step."
  '36':
    instructions: ''
    prompt: For fixed real $x\geq0$, prove $(1+x)^n\geq1+nx$ for integers $n\geq0$.
    answer: "Base 0: both sides are 1. Multiply the induction bound by nonnegative $1+x$, obtaining $(1+x)^{k+1}\\geq1+(k+1)x+kx^2$. The final term is nonnegative, so dropping it gives the next bound."
  '37':
    instructions: ''
    prompt: Prove $\sum_{i=1}^n1/i\leq n$ for integers $n\geq1$ by induction.
    answer: "Base 1: equality holds. Assuming the bound at $k\\geq1$, the next sum is at most $k+1/(k+1)\\leq k+1$, since the new reciprocal is at most 1. This proves the step."
  '38':
    instructions: ''
    prompt: Prove $n^2\geq2n-1$ for integers $n\geq1$ by induction.
    answer: "Base 1: equality holds. If $k^2\\geq2k-1$, then $(k+1)^2=k^2+2k+1\\geq4k\\geq2k+1$, since $k\\geq1$. The last quantity is the required next bound."
  '39':
    instructions: ''
    prompt: The claim $2^n\geq n^2$ fails at $n=3$. Does this prevent proving it from $n=4$? Explain.
    answer: No. Induction from 4 needs the base at 4 and steps for $k\geq4$ only. The failed case 3 is outside that theorem's domain, so no transition from 3 is required.
  '40':
    instructions: ''
    prompt: In the bound $2^{k+1}\geq2k^2$, why is the inductive step for $2^n\geq n^2$ not finished?
    answer: The target is $(k+1)^2$, not $2k^2$. One must additionally show $2k^2\geq(k+1)^2$ in the permitted range. Without that bridge, the obtained bound may be insufficient.
  '41':
    instructions: The sequence has nonnegative integer indices; the update applies for every integer $n\geq0$.
    prompt: Let $a_0=3$ and $a_{n+1}=a_n+4$. Prove by induction $a_n=3+4n$.
    answer: "Base 0: the formula gives 3. Assume $a_k=3+4k$ for arbitrary $k\\geq0$. The recurrence gives $a_{k+1}=3+4k+4=3+4(k+1)$, proving the next case."
  '42':
    instructions: The sequence has nonnegative integer indices; the update applies for every integer $n\geq0$.
    prompt: Let $a_0=5$ and $a_{n+1}=2a_n$. Prove by induction $a_n=5\cdot2^n$.
    answer: "Base 0: $5\\cdot2^0=5$. Assuming the formula at $k$, the recurrence gives $a_{k+1}=2(5\\cdot2^k)=5\\cdot2^{k+1}$. Thus induction proves the formula."
  '43':
    instructions: The sequence has nonnegative integer indices; the update applies for every integer $n\geq0$.
    prompt: Let $a_0=1$ and $a_{n+1}=2a_n+1$. Prove by induction $a_n=2^{n+1}-1$.
    answer: 'Base 0: $2^1-1=1$. If $a_k=2^{k+1}-1$, then $a_{k+1}=2(2^{k+1}-1)+1=2^{k+2}-1$, the next formula.'
  '44':
    instructions: The sequence has nonnegative integer indices; the update applies for every integer $n\geq0$.
    prompt: Let $a_0=2$ and $a_{n+1}=3a_n+1$. Prove by induction $a_n=(5\cdot3^n-1)/2$.
    answer: "Base 0: the formula gives 2. Assuming it at $k$, substitution yields $a_{k+1}=3(5\\cdot3^k-1)/2+1=(5\\cdot3^{k+1}-1)/2$. This verifies the step for arbitrary $k\\geq0$."
  '45':
    instructions: The sequence has nonnegative integer indices; the update applies for every integer $n\geq0$.
    prompt: Let $a_0=0$ and $a_{n+1}=a_n+2n+1$. Prove by induction $a_n=n^2$.
    answer: 'Base 0: $a_0=0^2$. Assume $a_k=k^2$. The recurrence gives $a_{k+1}=k^2+2k+1=(k+1)^2$. Induction establishes all cases.'
  '46':
    instructions: The sequence has nonnegative integer indices; the update applies for every integer $n\geq0$.
    prompt: Let $a_0=0$ and $a_{n+1}=a_n+n+1$. Prove by induction $a_n=n(n+1)/2$.
    answer: 'Base 0: both values are 0. Assuming $a_k=k(k+1)/2$, the recurrence yields $a_{k+1}=k(k+1)/2+(k+1)=(k+1)(k+2)/2$.'
  '47':
    instructions: The sequence has nonnegative integer indices; the update applies for every integer $n\geq0$.
    prompt: Let $a_0=1$ and $a_{n+1}=(n+1)a_n$. Prove by induction $a_n=n!$.
    answer: 'Base 0: $a_0=1=0!$. If $a_k=k!$, then $a_{k+1}=(k+1)k!=(k+1)!$. This uses the defining factorial recurrence and proves the next case.'
  '48':
    instructions: The sequence has nonnegative integer indices; the update applies for every integer $n\geq0$.
    prompt: Let $a_0=2$ and $a_{n+1}=-a_n$. Prove by induction $a_n=2(-1)^n$.
    answer: 'Base 0: the formula gives 2. Assuming it at $k$, $a_{k+1}=-2(-1)^k=2(-1)^{k+1}$. Hence induction proves the alternating formula.'
  '49':
    instructions: The sequence has nonnegative integer indices; the update applies for every integer $n\geq0$.
    prompt: Let $a_0=0$ and $a_{n+1}=a_n+3\cdot2^n$. Prove by induction $a_n=3(2^n-1)$.
    answer: "Base 0: the formula is 0. If it holds at $k$, then $a_{k+1}=3(2^k-1)+3\\cdot2^k=3(2^{k+1}-1)$, proving the step."
  '50':
    instructions: The sequence has nonnegative integer indices; the update applies for every integer $n\geq0$.
    prompt: For $a_0=3,a_{n+1}=a_n+4$, a candidate is $a_n=4n$. What do the initial and recurrence checks show?
    answer: The candidate satisfies the recurrence because $4(n+1)=4n+4$, but gives $a_0=0$ instead of 3. Meeting the recurrence alone does not establish the specified sequence.
  '51':
    instructions: Both sequences have nonnegative integer indices, and both updates apply for every integer $n\geq0$.
    prompt: Let $u_0=0,v_0=1$, $u_{n+1}=u_n+v_n$, $v_{n+1}=2v_n$. Prove by simultaneous induction both $u_n=2^n-1$ and $v_n=2^n$.
    answer: Base 0 gives 0 and 1 as claimed. Assume both formulas at arbitrary $k$. Then $u_{k+1}=(2^k-1)+2^k=2^{k+1}-1$, and $v_{k+1}=2\cdot2^k=2^{k+1}$. This proves the conjunction by induction.
  '52':
    instructions: ''
    prompt: Define $u_0=0,v_0=1$ and $u_{n+1}=u_n+v_n$, $v_{n+1}=2v_n$ for integers $n\geq0$. Why is an induction proving $u_n=2^n-1$ and $v_n=2^n$ together more useful than a hypothesis containing only the formula for $u_n$?
    answer: The update for $u_{k+1}$ uses $v_k$. The $u_k$ formula alone does not specify that quantity. A conjunction supplies the exact value needed in the step and keeps both claims synchronized.
  '53':
    instructions: Iteration counts are nonnegative integers, and arithmetic is exact. A finite limit $N$ may be zero.
    prompt: A variable starts at 0 and after iteration $i$ adds $i$, for $i=1,\ldots,N$. Prove by induction its value after $k$ iterations is $k(k+1)/2$.
    answer: 'Base $k=0$: initialization gives 0. Assume the invariant after $k<N$ iterations. Adding $k+1$ gives $k(k+1)/2+k+1=(k+1)(k+2)/2$. Thus it holds through $N$, where the final value is $N(N+1)/2$.'
  '54':
    instructions: Iteration counts are nonnegative integers, and arithmetic is exact.
    prompt: A variable starts at 1 and doubles once per iteration. Prove by induction its value after $k\geq0$ iterations is $2^k$.
    answer: 'Base 0: initialized 1 equals $2^0$. If the value after $k$ iterations is $2^k$, the next doubling gives $2^{k+1}$. Induction proves the invariant for every allowed iteration count.'
  '55':
    instructions: Iteration counts are nonnegative integers, and arithmetic is exact. A finite limit $N$ may be zero.
    prompt: A variable starts at 0 and adds $2i-1$ on iteration $i$, for $i=1,\ldots,N$. Prove by induction the final value is $N^2$.
    answer: Prove after $k$ iterations the value is $k^2$. Base 0 holds. The next addition is $2k+1$, giving $k^2+2k+1=(k+1)^2$. At termination $k=N$, giving the specified value.
  '56':
    instructions: Iteration counts are nonnegative integers, and arithmetic is exact. A finite limit $N$ may be zero.
    prompt: A variable starts at 1 and multiplies by $i$ on iteration $i$, for $i=1,\ldots,N$. Prove by induction the output is $N!$, including $N=0$.
    answer: The invariant after $k$ iterations is value $k!$. Base 0 holds because the empty product is 1. Multiplying by $k+1$ changes $k!$ to $(k+1)!$. Thus the final value is $N!$, including initialized 1 when no iteration runs.
  '57':
    instructions: ''
    prompt: Explain what must be checked before an exact-integer induction proof applies to code using bounded machine integers.
    answer: The implementation must avoid overflow in every relevant intermediate and final operation, or use a representation with adequate range. Otherwise machine operations may not equal the mathematical integer operations used in the proof.
  '58':
    instructions: Both the sequence indices and the update indices are nonnegative integers.
    prompt: For $a_0=0,a_{n+1}=a_n+2n+1$, prove $a_n\geq0$ by establishing the stronger equality $a_n=n^2$.
    answer: At 0 the equality holds. If $a_k=k^2$, the recurrence gives $a_{k+1}=k^2+2k+1=(k+1)^2$. Induction proves the equality; every real square is nonnegative, so the requested bound follows.
  '59':
    instructions: Both the sequence indices and the update indices are nonnegative integers.
    prompt: Let $a_0=1,b_0=2$, $a_{n+1}=a_n+1$, $b_{n+1}=b_n+2$. Prove $b_n=2a_n$ by induction without finding both closed forms.
    answer: "Base 0: $2=2\\cdot1$. Assume $b_k=2a_k$. Then $b_{k+1}=b_k+2=2a_k+2=2(a_k+1)=2a_{k+1}$. The invariant therefore holds for all nonnegative indices."
  '60':
    instructions: ''
    prompt: An invariant is initialized and preserved whenever a loop executes. Does that alone prove the loop terminates?
    answer: No. It proves the property at each reached iteration, conditional on execution. Termination needs a separate argument, such as a finite iteration bound or decreasing nonnegative integer measure.
  '61':
    instructions: ''
    prompt: A proof establishes $P(k)\to P(k+1)$ but checks no base. Why is it incomplete?
    answer: A valid implication does not supply a true starting statement. For example, false equalities $k=k+1$ imply the next false equality after adding 1, yet no case is true. A verified base is essential.
  '62':
    instructions: ''
    prompt: A sum proof assumes the target formula at $k+1$ and simplifies it to the known case at $k$. What must be added?
    answer: Every transformation must be reversible and shown as an equivalence, or the argument must be rewritten forward from the induction hypothesis. Merely deriving a true consequence from the target does not prove the target.
  '63':
    instructions: ''
    prompt: A proof uses $P(k-1)$ while stating only the ordinary hypothesis $P(k)$. How can it be repaired?
    answer: Supply the extra earlier statement, for example by ordinary induction on a paired statement with enough base cases. It is not available from the stated hypothesis automatically.
  '64':
    instructions: ''
    prompt: A claimed step works only for $k\geq4$, but the proof checks only $P(1)$. What is missing?
    answer: The transitions to 2, 3, and 4 are not covered. Verify enough initial cases to reach 4, or provide separate valid steps for the missing transitions, before using the general step.
  '65':
    instructions: ''
    prompt: A proposed induction claims that every finite group of horses has the same color. For a group of $k+1$ horses, it removes the first horse and then the last horse, using the induction hypothesis on both groups of $k$. It claims that a shared horse forces the two colors to agree. Why does the transition from one horse to two fail?
    answer: The two one-horse subgroups inside a two-horse group have no shared horse. The argument needs an overlap to transfer color equality, so the first required inductive step is invalid.
  '66':
    instructions: ''
    prompt: A proof claims $2^{k+1}\geq2k^2=(k+1)^2$ for $k\geq4$. Correct the faulty equality.
    answer: Equality is generally false. The required inequality is $2k^2\geq(k+1)^2$, justified by difference $(k-1)^2-2\geq7$ for $k\geq4$.
  '67':
    instructions: ''
    prompt: A proof of $3\mid4^n-1$ substitutes $4^k=3t$. Identify the exact wrong assumption.
    answer: The hypothesis is $4^k-1=3t$, so $4^k=3t+1$, not $3t$. Use $4^{k+1}-1=4(4^k-1)+3$ to exploit the correct hypothesis.
  '68':
    instructions: ''
    prompt: A zero-based geometric-sum proof checks an empty sum at $n=0$ for $\sum_{i=0}^n2^i$. Repair the base.
    answer: At $n=0$ there is one term, $2^0=1$. The right side $2^{n+1}-1$ is also 1. The sum is not empty because its lower and upper bounds coincide.
  '69':
    instructions: ''
    prompt: A proof checks $n=1,2,3,4,5$ and calls this induction. What general argument is missing?
    answer: It must prove $P(k)\to P(k+1)$ for an arbitrary allowed integer $k$, not only five examples. Finite checks alone leave all later cases unsupported.
  '70':
    instructions: ''
    prompt: A valid induction proves a formula for $n\geq1$. Its author concludes it also holds for all negative integers. Explain the gap.
    answer: Forward steps from a positive base never reach negatives. Those values need a separate argument or a different reparameterization. A theorem's range must match the cases actually covered.
  '71':
    instructions: ''
    prompt: Prove by induction $\sum_{i=1}^n i(i+1)=n(n+1)(n+2)/3$ for integers $n\geq0$.
    answer: 'Base 0: both sides are 0. Assuming the formula at $k$, add $(k+1)(k+2)$. Factoring gives $(k+1)(k+2)(k+3)/3$, exactly the next formula. Thus induction proves every nonnegative case.'
  '72':
    instructions: ''
    prompt: Prove by induction $\sum_{i=1}^n(4i-3)=n(2n-1)$ for integers $n\geq0$.
    answer: Base 0 holds. Assume the formula at $k$ and add next term $4k+1$. The result is $2k^2-k+4k+1=2k^2+3k+1=(k+1)(2k+1)$, the target at $k+1$.
  '73':
    instructions: ''
    prompt: Prove by induction that the sum of $n$ even integers is even for every $n\geq0$.
    answer: 'Base 0: the empty sum 0 is even. Assume every sum of $k$ even integers is even. For arbitrary $k+1$ even integers, the first $k$ sum to an even integer by hypothesis; adding the last even integer stays even. Thus all finite lengths are covered.'
  '74':
    instructions: ''
    prompt: Prove by induction that a composition of $n$ injective functions with compatible domains is injective for every $n\geq1$.
    answer: Base 1 is the given injectivity. Assume any compatible composition of $k$ such functions is injective. In a composition of $k+1$, the first $k$ compose injectively by hypothesis, and composing with the last injective function preserves injectivity by the two-function theorem.
  '75':
    instructions: ''
    prompt: Prove by induction that a set with $n$ elements has $2^n$ subsets for integers $n\geq0$.
    answer: 'Base 0: the empty set has one subset. For an arbitrary set of size $k+1$, remove an element $a$. By hypothesis the remaining $k$ elements have $2^k$ subsets. Subsets of the original either omit $a$ or uniquely add it to one of these subsets, giving two disjoint groups and $2^{k+1}$ total.'
  '76':
    instructions: ''
    prompt: Prove by induction that $n$ nonnegative real numbers have nonnegative sum, including $n=0$.
    answer: 'Base 0: the empty sum is 0. Assume every sum of $k$ nonnegative reals is nonnegative. For arbitrary $k+1$ inputs, the first $k$ sum is nonnegative and so is the last input. Their sum is nonnegative, completing induction.'
  '77':
    instructions: ''
    prompt: Prove by induction $2^n>n$ for integers $n\geq0$.
    answer: "Base 0: $1>0$. Assume $2^k>k$. For $k=0$, the next case is $2>1$. For $k\\geq1$, doubling gives $2^{k+1}>2k\\geq k+1$. Thus every step is valid and induction proves the claim."
  '78':
    instructions: The sequence has nonnegative integer indices, and the update applies for every integer $n\geq0$.
    prompt: Let $a_0=1$ and $a_{n+1}=a_n/(1+a_n)$. Prove $a_n=1/(n+1)$ and that every update is defined.
    answer: 'Base 0: the value is 1. Assume $a_k=1/(k+1)>0$. Then $1+a_k>0$, so the next update is defined, and substitution gives $a_{k+1}=1/(k+2)$. Induction establishes both formula and positivity.'
  '79':
    instructions: ''
    prompt: For a fixed integer $m\geq2$, prove $(m-1)\mid m^n-1$ for integers $n\geq0$.
    answer: 'Base 0: the difference is 0. If $m^k-1=(m-1)t$ with integer $t$, then $m^{k+1}-1=m(m^k-1)+(m-1)=(m-1)(mt+1)$. The coefficient is integral, proving the step.'
  '80':
    instructions: ''
    prompt: Prove by induction the finite De Morgan law $(A_1\cup\cdots\cup A_n)^c=A_1^c\cap\cdots\cap A_n^c$ for $n\geq1$ in a fixed universe.
    answer: Base 1 is the same set on both sides. Assume the law for any $k$ sets. Apply the two-set De Morgan law to the union of the first $k$ sets and $A_{k+1}$, obtaining the complement of the first union intersected with $A_{k+1}^c$. Substitute the induction identity to get all $k+1$ complements intersected.
strong-induction:
  '1':
    instructions: ''
    prompt: State a strong induction hypothesis for proving $P(n)$ for integers $n\geq2$.
    answer: At arbitrary target $n>2$, assume $P(j)$ for every integer $j$ with $2\leq j<n$. Prove $P(n)$ and verify the necessary starting cases separately.
  '2':
    instructions: ''
    prompt: How does strong induction differ from ordinary induction in the available hypothesis?
    answer: Ordinary induction provides the immediately previous case. Strong induction provides every earlier case within the theorem's domain. It may use only a few of them, but each used index must be smaller than the target.
  '3':
    instructions: ''
    prompt: Explain why strong induction is not logically more powerful than ordinary induction.
    answer: Define $Q(n)$ as the conjunction of all statements $P(j)$ from the starting index through $n$. Ordinary induction on $Q$ makes the whole earlier collection available, reproducing the strong step.
  '4':
    instructions: ''
    prompt: State the well-ordering principle for nonnegative integers.
    answer: Every nonempty subset of $\mathbb N_0$ has a least element. It applies also to integer sets bounded below after shifting their indices.
  '5':
    instructions: ''
    prompt: Explain why a nonempty set of positive real numbers need not have a least element. Give an example.
    answer: 'The set of all positive reals has no least element: for any member $r$, the smaller positive number $r/2$ also belongs. The integer well-ordering property does not transfer to this domain.'
  '6':
    instructions: ''
    prompt: In a smallest-counterexample proof, why do all smaller allowed indices satisfy the claim?
    answer: A failing smaller allowed index would contradict the chosen counterexample's minimality. The hypothesis is justified by that least choice, not by assuming the whole theorem.
  '7':
    instructions: ''
    prompt: Can strong induction on $n\geq2$ use $P(1)$? Explain.
    answer: Not from its stated hypothesis. Index 1 lies outside the theorem's domain; it must be proved and included separately if the argument needs it.
  '8':
    instructions: ''
    prompt: Can the strong step for target $n$ use $P(n)$? Explain.
    answer: No. The hypothesis covers only indices strictly smaller than $n$. Using $P(n)$ assumes the target itself and is circular.
  '9':
    instructions: ''
    prompt: If a recurrence uses indices $n-1$ and $n-2$, what must be checked before invoking the hypothesis?
    answer: Both indices must be in the covered domain and below $n$. Verify enough bases that the general step first runs where both earlier terms are available.
  '10':
    instructions: ''
    prompt: Explain how the base appears in the formulation that proves all-smaller-cases imply $P(n)$ for every $n\geq n_0$.
    answer: At $n=n_0$ the earlier collection is empty. Therefore that case requires proving $P(n_0)$ with no earlier hypothesis. The base is included rather than omitted.
  '11':
    instructions: ''
    prompt: Prove every integer $n\geq2$ is a product of primes by strong induction.
    answer: Base 2 is prime. For arbitrary $n>2$, assume all integers from 2 to $n-1$ factor. If $n$ is prime, it is a one-factor product. Otherwise $n=ab$ with $2\leq a,b<n$; factor each by hypothesis and concatenate the factors. Thus every case holds.
  '12':
    instructions: ''
    prompt: A strong-induction proof of prime-factorization existence treats a composite integer $n\geq2$ by writing $n=ab$ with integers $a,b>1$. Explain why both factors are strictly smaller than $n$ and therefore eligible for the induction hypothesis.
    answer: Choose a proper nontrivial divisor $a$ with $1<a<n$ and let $b=n/a$. Both are integers greater than 1. Since each multiplies another integer greater than 1 to give $n$, each is strictly less than $n$.
  '13':
    instructions: ''
    prompt: In a strong-induction proof that every integer at least 2 is a product of primes, why can the factorization $n=1\cdot n$ not be used to invoke the hypothesis on both factors?
    answer: The factor 1 is outside the claim's domain, while the factor $n$ is not smaller than the target. Neither factor receives the needed factorization claim from the stated hypothesis.
  '14':
    instructions: ''
    prompt: Does the prime-factorization induction prove uniqueness of prime factors? Explain.
    answer: No. It constructs at least one prime product. Comparing two products and proving their prime factors and the number of occurrences of each prime equal requires an additional argument, commonly a prime-divides-product lemma.
  '15':
    instructions: ''
    prompt: Express 84 as a product of primes by repeatedly decomposing a composite factor into smaller factors. Show the decomposition.
    answer: Split $84=7\cdot12$, then $12=3\cdot4$ and $4=2\cdot2$. This gives $84=7\cdot3\cdot2\cdot2$. Each composite split uses smaller positive factors, and the final factors are prime.
  '16':
    instructions: ''
    prompt: The prime-factorization existence theorem says every integer at least 2 is a nonempty product of primes. Why can its domain not be extended to include 1?
    answer: The positive integer 1 is not a nonempty prime product because every prime factor exceeds 1. If empty products are allowed, 1 is the empty product, but that is a distinct stated convention.
  '17':
    instructions: ''
    prompt: Prove every positive integer is a sum of distinct powers of 2.
    answer: Base 1 is $2^0$. For $n\geq2$, write $n=2q+r$ with $r\in\{0,1\}$ and $1\leq q<n$. By hypothesis $q$ is a sum of distinct powers of 2. Doubling shifts each exponent up by 1; if $r=1$, add $2^0$, distinct from all shifted powers. This constructs the required representation.
  '18':
    instructions: ''
    prompt: Express 23 as a sum of distinct powers of 2. Use repeated division by 2, recording each remainder to construct the representation.
    answer: Repeated quotient-and-remainder division gives $23=2\cdot11+1$, $11=2\cdot5+1$, $5=2\cdot2+1$, and $2=2\cdot1$. Therefore $23=16+4+2+1=2^4+2^2+2^1+2^0$.
  '19':
    instructions: ''
    prompt: Prove every integer $n\geq2$ has a prime divisor using a smallest-counterexample argument.
    answer: Suppose a failing integer exists and choose least $n\geq2$. It is not prime, since a prime divides itself. Thus $n=ab$ with $2\leq a<n$. Minimality gives a prime divisor of $a$, which by transitivity also divides $n$, contradicting failure.
  '20':
    instructions: ''
    prompt: A binary-representation proof constructs some representation. What extra issue remains before claiming its uniqueness?
    answer: It must show two different collections of distinct exponents cannot yield the same integer. The construction proves existence alone; repeated parity and division can support a separate uniqueness proof, but it is not automatic.
  '21':
    instructions: An unlimited supply of stamps of the specified values is available.
    prompt: 'Using 4-unit and 7-unit stamps, give a combination for each amount: 18, 19, 20, and 21.'
    answer: $18=4+7+7$, $19=4+4+4+7$, $20=4+4+4+4+4$, and $21=7+7+7$. These are four consecutive valid bases.
  '22':
    instructions: An unlimited supply of stamps of the specified values is available.
    prompt: Prove every integer amount $n\geq18$ can be made from 4-unit and 7-unit stamps.
    answer: "Bases: $18=4+7+7$, $19=4+4+4+7$, $20=4+4+4+4+4$, and $21=7+7+7$. For $n\\geq22$, assume every amount from 18 through $n-1$ is representable. Since $18\\leq n-4<n$, represent $n-4$ by hypothesis and add one 4-unit stamp. Strong induction proves the claim."
  '23':
    instructions: An unlimited supply of stamps of the specified values is available.
    prompt: A proof aims to make every integer amount from 18 onward using 4-unit and 7-unit stamps. It checks amount 18 and then repeatedly adds 4. Which amounts can this argument reach, and why is it insufficient?
    answer: 'They reach only amounts congruent to 18 modulo 4: 18, 22, 26, and so on. Bases for the other residue classes are needed; 19, 20, 21 supply them in the valid proof.'
  '24':
    instructions: An unlimited supply of stamps of the specified values is available.
    prompt: Show that 17 cannot be made from stamps of values 4 and 7.
    answer: If $4a+7b=17$ with nonnegative integers $a,b$, then $b$ is 0, 1, or 2. The remaining amounts are 17, 10, or 3, none divisible by 4. Thus no allowed pair of stamp counts works.
  '25':
    instructions: An unlimited supply of stamps of the specified values is available.
    prompt: Prove every integer amount $n\geq8$ can be made from stamps of values 3 and 5.
    answer: "Bases: $8=3+5$, $9=3+3+3$, $10=5+5$. For $n\\geq11$, the smaller amount $n-3\\geq8$ is representable by the strong hypothesis; add one 3-unit stamp. These bases and step cover all amounts from 8."
  '26':
    instructions: An unlimited supply of stamps of the specified values is available.
    prompt: Prove every integer amount $n\geq12$ can be made from stamps of values 4 and 5.
    answer: "Bases: $12=3\\cdot4$, $13=2\\cdot4+5$, $14=4+2\\cdot5$, $15=3\\cdot5$. For $n\\geq16$, the hypothesis represents $n-4\\geq12$; add a 4-unit stamp. This proves the claim."
  '27':
    instructions: An unlimited supply of stamps of the specified values is available.
    prompt: Prove every integer amount $n\geq28$ can be made from stamps of values 5 and 8.
    answer: "Bases: $28=4\\cdot5+8$, $29=5+3\\cdot8$, $30=6\\cdot5$, $31=3\\cdot5+2\\cdot8$, $32=4\\cdot8$. For $n\\geq33$, represent $n-5\\geq28$ by hypothesis and add one 5-unit stamp. All used indices are smaller and covered."
  '28':
    instructions: An unlimited supply of stamps of the specified values is available.
    prompt: Prove every multiple of 3 at least 6 can be made using 6-unit and 9-unit stamps.
    answer: "Write the target as $3m$ with $m\\geq2$. Prove every $m\\geq2$ is $2a+3b$: bases 2 and 3 are immediate; for $m\\geq4$, represent $m-2\\geq2$ by strong induction and add 2. Multiplying the representation by 3 yields stamps totaling $3m$."
  '29':
    instructions: An unlimited supply of stamps of the specified values is available.
    prompt: Can 6-unit and 9-unit stamps make every integer amount beyond some threshold? Explain.
    answer: No. Every amount made from 6-unit and 9-unit stamps is divisible by 3. Arbitrarily large integers are not divisible by 3, so no threshold can make every integer amount representable.
  '30':
    instructions: ''
    prompt: A strong step subtracts 7 from a target and assumes every amount at least 30 is representable. At what target may this step first be used, and which consecutive bases suffice?
    answer: The first usable target is 37, since $n-7\geq30$ is required. Verifying 30 through 36 provides seven consecutive bases for this step, assuming those amounts really are representable.
  '31':
    instructions: Sequence indices are nonnegative integers; each recurrence applies for integer $n\geq2$.
    prompt: For $F_0=0,F_1=1,F_n=F_{n-1}+F_{n-2}$, prove $F_n\geq0$ for $n\geq0$.
    answer: Bases 0 and 1 are nonnegative. For $n\geq2$, assume earlier terms nonnegative. Both recursive terms have smaller nonnegative indices, so their sum $F_n$ is nonnegative. Strong induction proves all cases.
  '32':
    instructions: Sequence indices are nonnegative integers; each recurrence applies for integer $n\geq2$.
    prompt: Define $F_0=0,F_1=1$ and $F_n=F_{n-1}+F_{n-2}$ for integers $n\geq2$. Prove by strong induction $F_n>0$ for integers $n\geq1$.
    answer: "Bases: $F_1=1$ and $F_2=1$ are positive. For $n\\geq3$, both $n-1,n-2$ lie at least 1 and below $n$, so the hypothesis makes both summands positive. Their sum is positive."
  '33':
    instructions: Sequence indices are nonnegative integers; each recurrence applies for integer $n\geq2$.
    prompt: Define $F_0=0,F_1=1$ and $F_n=F_{n-1}+F_{n-2}$ for integers $n\geq2$. Prove by strong induction $F_n\leq2^{n-1}$ for integers $n\geq1$.
    answer: Bases 1 and 2 give 1 at most 1 and 2 respectively. For $n\geq3$, use both earlier bounds to get $F_n\leq2^{n-2}+2^{n-3}=3\cdot2^{n-3}\leq2^{n-1}$. The hypothesis applies to both indices, completing induction.
  '34':
    instructions: Sequence indices are nonnegative integers; each recurrence applies for integer $n\geq2$.
    prompt: Define $F_0=0,F_1=1$ and $F_n=F_{n-1}+F_{n-2}$ for integers $n\geq2$. Prove by strong induction $F_n\geq n-1$ for integers $n\geq1$.
    answer: Bases 1, 2, 3 give $1\geq0$, $1\geq1$, $2\geq2$. For $n\geq4$, earlier bounds give $F_n\geq(n-2)+(n-3)=2n-5\geq n-1$. Three bases place the step in the range where the final comparison holds.
  '35':
    instructions: Sequence indices are nonnegative integers; each recurrence applies for integer $n\geq2$.
    prompt: Let $a_0=1,a_1=2,a_n=2a_{n-1}-a_{n-2}$ for $n\geq2$. Prove by strong induction $a_n=n+1$.
    answer: Bases 0 and 1 match 1 and 2. For $n\geq2$, assume the formula at all smaller indices. Substitution gives $a_n=2n-(n-1)=n+1$. Both earlier indices are covered, so strong induction proves the identity.
  '36':
    instructions: Sequence indices are nonnegative integers; each recurrence applies for integer $n\geq2$.
    prompt: Let $a_0=0,a_1=1,a_n=3a_{n-1}-2a_{n-2}$. Prove by strong induction $a_n=2^n-1$.
    answer: "Bases 0 and 1 give 0 and 1. For $n\\geq2$, substitute the earlier formulas: $a_n=3(2^{n-1}-1)-2(2^{n-2}-1)$. Simplifying powers gives $2^n-1$, which completes the strong step."
  '37':
    instructions: Sequence indices are nonnegative integers; each recurrence applies for integer $n\geq2$.
    prompt: Let $a_0=2,a_1=3,a_n=a_{n-1}+2a_{n-2}$. Check the proposed formula $a_n=2^{n+1}+(-1)^n$ against its base cases.
    answer: At $n=0$, the formula gives $2^1+1=3$, not the specified 2, so it is false for this sequence. At $n=1$, it gives $2^2-1=3$, which does match $a_1$. One failed base is enough to rule out the formula even though the other base agrees.
  '38':
    instructions: Sequence indices are nonnegative integers; each recurrence applies for integer $n\geq2$.
    prompt: Define $a_0=3,a_1=3$ and $a_n=a_{n-1}+2a_{n-2}$ for integers $n\geq2$. Prove by strong induction $a_n=2^{n+1}+(-1)^n$ for every integer $n\geq0$.
    answer: Bases 0 and 1 give 3 and 3. At $n\geq2$, the power terms combine as $2^n+2\cdot2^{n-1}=2^{n+1}$. The sign terms give $(-1)^{n-1}+2(-1)^{n-2}=(-1)^n$. Substitution of both earlier formulas therefore proves the next formula.
  '39':
    instructions: Sequence indices are nonnegative integers; each recurrence applies for integer $n\geq2$.
    prompt: Let $a_0=0,a_1=1,a_n=2a_{n-1}+a_{n-2}$. Prove by strong induction $a_n\leq3^{n-1}$ for integers $n\geq1$.
    answer: Bases 1 and 2 give $1\leq1$ and $2\leq3$. For $n\geq3$, earlier bounds yield $a_n\leq2\cdot3^{n-2}+3^{n-3}=7\cdot3^{n-3}\leq3^{n-1}$. This proves the step.
  '40':
    instructions: ''
    prompt: Why can upper bounds not simply be substituted into both terms of $a_n=2a_{n-1}-a_{n-2}$ to obtain an upper bound?
    answer: The negative coefficient reverses the useful direction for the second term. An upper bound on $a_{n-2}$ gives a lower bound on its negative; an upper bound on $a_n$ needs a lower bound there instead, or exact formulas.
  '41':
    instructions: ''
    prompt: For integer $n\geq1$, prove $0\leq\lfloor n/2\rfloor<n$.
    answer: Nonnegative $n/2$ has nonnegative floor. Also $\lfloor n/2\rfloor\leq n/2<n$ because $n>0$. Thus the recursive half-input is a smaller nonnegative integer.
  '42':
    instructions: ''
    prompt: A procedure returns immediately at integer input 0. At input $n>0$, it performs finitely many ordinary operations, makes one recursive call on $\lfloor n/2\rfloor$, and returns after finitely many further operations if that call returns. Prove termination for all $n\geq0$.
    answer: Base 0 returns. For $n\geq1$, assume all smaller nonnegative calls terminate. Its recursive input is a smaller nonnegative integer by the floor bound, so that call terminates; the finitely many remaining operations then finish. Strong induction proves termination.
  '43':
    instructions: ''
    prompt: Define $P(0)=1$. At positive integer $n$, compute $q=\lfloor n/2\rfloor,t=P(q)$ and return $t^2$ for even $n$, $2t^2$ for odd $n$. Prove $P(n)=2^n$.
    answer: Base 0 returns $1=2^0$. For positive $n$, $q<n$, so the hypothesis gives $t=2^q$. If $n=2q$, the return is $2^{2q}=2^n$; if $n=2q+1$, it is $2^{2q+1}=2^n$. These cases cover all positive inputs; the smaller integer call also ensures termination.
  '44':
    instructions: ''
    prompt: Why does repeatedly halving a positive real input and stopping only at zero not establish termination?
    answer: A positive real remains positive under any finite number of halvings. The decreasing values need not reach 0; the nonnegative integer measure used in the valid algorithm is absent.
  '45':
    instructions: ''
    prompt: Define $S(0)=0$ and $S(n)=n+S(n-1)$ for positive integers. Prove termination and $S(n)=n(n+1)/2$.
    answer: Base 0 terminates with 0. For positive $n$, the smaller call terminates and returns $(n-1)n/2$ by induction. Adding $n$ gives $n(n+1)/2$. This proves termination and correctness together.
  '46':
    instructions: ''
    prompt: Define $L(0)=0$ and $L(n)=1+L(\lfloor n/2\rfloor)$ for positive integers. Prove $L(n)\leq n$ for $n\geq0$.
    answer: Base 0 gives 0. For positive $n$, set $q=\lfloor n/2\rfloor<n$. The hypothesis gives $L(q)\leq q$, hence $L(n)\leq1+q\leq n$, since the smaller integer $q$ is at most $n-1$. The same decrease ensures termination.
  '47':
    instructions: ''
    prompt: A list procedure removes its first element until the list is empty, returning 0 for empty and 1 plus the recursive result otherwise. Prove it returns the list's length.
    answer: Induct on nonnegative length. Empty length 0 returns 0. At length $n>0$, removing the first element gives length $n-1$; the hypothesis supplies termination and result $n-1$. Adding 1 returns $n$, so all finite lengths are correct.
  '48':
    instructions: ''
    prompt: A recursive sum splits a finite list of at least two real numbers into two nonempty smaller lists that partition its entries, sums each recursively, and adds using exact arithmetic. A singleton returns its element. Prove correctness for every allowed split.
    answer: Base length 1 is correct. At length $n\geq2$, any legal split has lengths $a,b$ with $1\leq a,b<n$. By hypothesis both calls return their sublist sums. Adding them gives the whole-list sum because the split partitions its entries. Both calls terminate on smaller sizes.
  '49':
    instructions: ''
    prompt: A recursive sum returns the element of a singleton list. For any longer finite list of real numbers, it may partition the entries into any two nonempty smaller lists, sum each recursively, and add the results using exact arithmetic. Why must a correctness proof allow arbitrary legal split lengths rather than only equal halves?
    answer: The specification permits unequal splits too. A proof for equal halves covers only one strategy and may not cover odd lengths. Correctness for every allowed execution requires all $a,b\geq1$ with $a+b=n$.
  '50':
    instructions: ''
    prompt: A procedure on input $n>0$ calls itself on $n$ before returning. Can strong induction justify termination?
    answer: No. The call is not on a smaller measure, so the hypothesis does not apply. With no other state change or base reached, this specified call repeats indefinitely.
  '51':
    instructions: Let $n$ be a positive integer.
    prompt: A length-$n$ board is split between cells into nonempty pieces until all pieces are unit cells. Prove every such process uses $n-1$ splits.
    answer: Base 1 uses 0 splits. For $n\geq2$, the first split gives lengths $a,b\geq1$ below $n$, with $a+b=n$. By hypothesis the two subproblems use $a-1$ and $b-1$ splits. Including the first yields $1+(a-1)+(b-1)=n-1$.
  '52':
    instructions: Let $n$ be a positive integer.
    prompt: A length-$n$ board is split between cells until every piece is a unit cell. If the first split produces lengths $a,b\geq1$ with $a+b=n$, the two smaller pieces require $a-1$ and $b-1$ further splits. Why must the total also include the first split?
    answer: The recursive counts include only later splits within the two produced pieces. Omitting the initial split would give $a+b-2=n-2$, one less than the actual total.
  '53':
    instructions: ''
    prompt: Prove that any expression formed from $n\geq1$ leaves using only binary operations has $n-1$ operation nodes.
    answer: Base 1 is a single leaf with 0 operations. A larger expression combines subexpressions with $a,b\geq1$ leaves and $a+b=n$. By hypothesis they have $a-1,b-1$ operations. Adding the root operation gives $n-1$, independent of the chosen structure.
  '54':
    instructions: ''
    prompt: A finite full binary tree is either one leaf or a root with exactly two full binary subtrees. Prove it has one more leaf than internal nodes.
    answer: Induct on total node count. A leaf has 1 leaf and 0 internal nodes. Otherwise each smaller subtree has leaves $I_1+1,I_2+1$ by hypothesis. The whole tree has $I_1+I_2+1$ internal nodes and $I_1+I_2+2$ leaves, differing by 1.
  '55':
    instructions: ''
    prompt: A finite full binary tree has exactly two children at each internal node, and it has one more leaf than internal nodes. Give a tree with a one-child node showing why this identity does not extend to arbitrary rooted trees.
    answer: A chain consisting of one internal root and one leaf has equal counts 1 and 1, not one extra leaf. The two-child construction rule is essential to the count.
  '56':
    instructions: ''
    prompt: Let $t_n$ count tilings of a $2$-by-$n$ rectangle by $2$-by-$1$ dominoes, with rotations allowed. Justify $t_0=1,t_1=1$ and $t_n=t_{n-1}+t_{n-2}$ for $n\geq2$.
    answer: The empty rectangle has one empty tiling; width 1 forces one vertical domino. For width $n\geq2$, either the left column is one vertical domino, leaving width $n-1$, or its top cell starts a horizontal domino, forcing a second below it and leaving width $n-2$. These disjoint exhaustive cases give the recurrence.
  '57':
    instructions: ''
    prompt: Let $t_n$ count tilings of a $2$-by-$n$ rectangle by $2$-by-$1$ dominoes, with rotations allowed. Use $t_0=t_1=1$ and $t_n=t_{n-1}+t_{n-2}$ for $n\geq2$ to calculate $t_2,t_3,t_4$. Explain why the empty rectangle contributes one tiling.
    answer: The values are $2,3,5$. At width 2, the two-horizontal-domino case leaves width 0 and contributes its one empty completion. Setting $t_0=0$ would incorrectly discard that valid tiling.
  '58':
    instructions: ''
    prompt: Let $t_n$ count tilings of a $2$-by-$n$ rectangle by $2$-by-$1$ dominoes, with rotations allowed, so $t_0=t_1=1$ and $t_n=t_{n-1}+t_{n-2}$ for $n\geq2$. Define $F_0=0,F_1=1$ and $F_n=F_{n-1}+F_{n-2}$ for $n\geq2$. Prove $t_n=F_{n+1}$ for every integer $n\geq0$.
    answer: Bases 0 and 1 give $t_0=1=F_1$ and $t_1=1=F_2$. For $n\geq2$, the earlier identities and recurrence give $t_n=t_{n-1}+t_{n-2}=F_n+F_{n-1}=F_{n+1}$. Strong induction proves all widths.
  '59':
    instructions: ''
    prompt: A finite nested object is either an atom of weight 1 or a pair whose weight is the sum of its children's weights. Prove its weight equals its number of atom occurrences.
    answer: Induct on the number of construction nodes. For an atom, both quantities are 1. For a pair, both children have fewer nodes; by hypothesis their weights equal their atom counts. Adding gives the pair's total weight and total atom count, so they agree.
  '60':
    instructions: ''
    prompt: A finite nested object is either an atom of weight 1 or a pair whose weight is the sum of its children's weights. Why does its total weight equal the number of atom occurrences rather than the number of distinct atom labels? Give an example with a repeated label.
    answer: An atom label may occur in both children and contributes weight once per occurrence. For example, a pair consisting of two atoms both labeled $a$ has weight $1+1=2$ and two atom occurrences, but only one distinct label. Counting occurrences matches addition under pairing; counting distinct labels would discard duplicates.
  '61':
    instructions: Let $P(n)$ mean that amount $n$ can be made with an unlimited supply of 4-unit and 7-unit stamps.
    prompt: A postage proof for amounts at least 18 uses $P(n-4)$ already at $n=19$. What is wrong?
    answer: It invokes $P(15)$, outside the promised range. Verify 18 through 21 as bases and start the subtract 4 step at 22, where the smaller target is at least 18.
  '62':
    instructions: ''
    prompt: Let $F_0=0,F_1=1$ and $F_n=F_{n-1}+F_{n-2}$ for integers $n\geq2$. A strong-induction proof of a bound stated only for $n\geq1$ tries to use that bound on $F_{n-2}$ at $n=2$. Explain the range error and how to organize the bases and step to avoid it.
    answer: The index 0 lies outside the bound's domain. Verify the bound at 1 and 2 separately, then start the general step at 3 so both required indices are at least 1.
  '63':
    instructions: ''
    prompt: A prime-factor proof assumes every integer at most $n$ factors before proving $n$ factors. Explain.
    answer: Including $n$ in the hypothesis assumes the target itself. The correct strong hypothesis stops at $n-1$; compositeness then supplies factors strictly below $n$.
  '64':
    instructions: ''
    prompt: A proof says strong induction needs no base because all earlier cases are assumed. Why is this false?
    answer: At the starting index there are no earlier cases to use. That first case still must be proved directly. More bases may be required before recursive dependencies fall inside the domain.
  '65':
    instructions: ''
    prompt: A recursive argument uses input size that decreases but may be any positive real. What condition is missing?
    answer: Strict decrease in positive reals does not guarantee termination. Use a well-founded measure, such as a nonnegative integer that strictly decreases on every recursive call.
  '66':
    instructions: ''
    prompt: A proof of factorization says the smaller factors are prime, solely because they are smaller. Repair it.
    answer: Smaller does not imply prime, as 12 is smaller than 84 but composite. The induction hypothesis says the smaller factors are products of primes; concatenate those products instead.
  '67':
    instructions: ''
    prompt: A smallest-counterexample proof chooses a least negative real counterexample without justification. Why is this invalid?
    answer: A nonempty set of negative reals need not have a least element. The least-choice step needs a proved minimum property, such as well-ordering for nonnegative integer indices, not nonemptiness alone.
  '68':
    instructions: ''
    prompt: A board of integer length $n\geq2$ is first split into lengths $a,b\geq1$ with $a+b=n$. A proof claims that each smaller board needs $n-1$ further splits to reach unit cells. Correct the smaller-board counts and obtain the total number of splits.
    answer: The subboards have lengths $a,b<n$, so their counts are $a-1,b-1$ by hypothesis. With the initial split the total is $1+(a-1)+(b-1)=n-1$.
  '69':
    instructions: ''
    prompt: A recurrence bound substitutes an upper bound into a term with a negative coefficient. How should the proof be repaired?
    answer: Track the inequality direction. A negative coefficient needs a lower bound on the original term to yield an upper bound after multiplication, or use an exact formula. Substituting upper bounds blindly is invalid.
  '70':
    instructions: ''
    prompt: A proof establishes that a recursive algorithm returns the right value if it returns, then claims termination follows. Explain the separate obligation.
    answer: Conditional correctness does not ensure a return occurs. Prove every recursive call decreases a well-founded measure and reaches covered base cases, then combine that termination argument with correctness.
  '71':
    instructions: ''
    prompt: Prove every integer $n\geq12$ is $4a+5b$ for nonnegative integers $a,b$, using a smallest counterexample.
    answer: The bases are $12=3\cdot4$, $13=2\cdot4+5$, $14=4+2\cdot5$, and $15=3\cdot5$. Suppose a least failing $n\geq12$ exists. These bases force $n\geq16$. Then $n-4\geq12$ is smaller and thus representable, say $4a+5b$. Adding 4 gives $n=4(a+1)+5b$, contradicting failure.
  '72':
    instructions: ''
    prompt: Prove ordinary induction implies strong induction by defining an accumulating statement.
    answer: Let $Q(k)$ assert all $P(j)$ from the starting index $n_0$ through $k$. The base $P(n_0)$ gives $Q(n_0)$. Assuming $Q(k)$ supplies all cases needed by the strong step to prove $P(k+1)$; together they give $Q(k+1)$. Ordinary induction proves every $Q$, hence every $P$.
  '73':
    instructions: ''
    prompt: Prove well-ordering implies the strong induction principle for integer indices $n\geq n_0$.
    answer: Suppose the base and strong step hold but some allowed case fails. The failing indices, after shifting by $n_0$, form a nonempty set of nonnegative integers, so there is a least failing $m$. It is not a verified base; all smaller allowed cases hold. The strong step then proves $P(m)$, contradicting failure.
  '74':
    instructions: ''
    prompt: Prove well-ordering of nonnegative integers from ordinary induction by ruling out a nonempty subset with no least element.
    answer: Suppose nonempty $S\subseteq\mathbb N_0$ has no least element. Then 0 is absent. If 0 through $k$ are absent, $k+1$ must also be absent, or it would be least. Induction says every nonnegative integer is absent, making $S$ empty, a contradiction.
  '75':
    instructions: ''
    prompt: Prove every integer $n\geq1$ can be reduced to 1 by repeatedly subtracting 1 from odd values greater than 1 and halving even values.
    answer: Base 1 is already reached. For $n>1$, if even, the next value $n/2$ is a positive integer below $n$; if odd, the next value $n-1$ is positive and below $n$. The strong hypothesis supplies a finite reduction from that next value to 1. Prepending one operation completes the proof.
  '76':
    instructions: ''
    prompt: Prove that repeatedly splitting a positive integer into two smaller positive summands eventually reaches only 1s, for any sequence of recursive splits.
    answer: Induct on the starting integer. At 1 no split is possible. At $n>1$, a split gives $a,b\geq1$ below $n$. By hypothesis each recursive branch finishes with 1s after finitely many splits. Combining their finite processes with the initial split gives termination for every legal first split.
  '77':
    instructions: ''
    prompt: Define $a_1=1$ and for $n\geq2$, $a_n=1+\max\{a_1,\ldots,a_{n-1}\}$. Prove $a_n=n$.
    answer: Base 1 holds. For $n\geq2$, assume $a_j=j$ for every $1\leq j<n$. The maximum of those values is $n-1$, so $a_n=1+(n-1)=n$. The set is finite and nonempty, justifying its maximum.
  '78':
    instructions: ''
    prompt: Prove every integer $n\geq2$ is a sum of 2s and 3s. Then explain why this is an existence theorem only.
    answer: "Bases 2 and 3 hold. At $n\\geq4$, the smaller integer $n-2\\geq2$ has such a sum by hypothesis; append 2. This proves existence for all targets. It does not imply uniqueness: 6 equals $3+3$ and $2+2+2$."
  '79':
    instructions: ''
    prompt: Prove binary representations as sums of distinct nonnegative powers of 2 are unique, given existence.
    answer: Use strong induction on the represented nonnegative integer, allowing the empty sum for 0. At 0 only the empty sum works since powers are positive. For $n>0$, parity determines whether $2^0$ occurs. Remove that common term if present and divide all remaining powers by 2. The two resulting representations concern $\lfloor n/2\rfloor<n$, so they agree by hypothesis; shifting back proves the originals agree.
  '80':
    instructions: ''
    prompt: Explain when to choose ordinary induction, strong induction, or a smallest-counterexample proof, using three examples.
    answer: A sum formula naturally adds one new term and uses ordinary induction. Prime-factorization existence uses arbitrary smaller factors, so strong induction fits. A postage theorem can be proved by a least failing amount and subtracting a stamp value into the established range. The methods prove the same integer-indexed claims but organize their dependencies differently.
combinatorics:
  '1':
    instructions: Every soup and sandwich is a different menu item.
    prompt: A menu has 4 soups and 7 sandwiches. Count choices of exactly one item.
    answer: '$4+7=11$: the two item categories are disjoint.'
  '2':
    instructions: ''
    prompt: A menu offers 4 distinct soups and 7 distinct sandwiches. How many meals contain one soup and one sandwich? Explain your count.
    answer: "$4\\cdot7=28$: each soup can accompany each sandwich."
  '3':
    instructions: ''
    prompt: A route starts with A or B. A has 3 possible continuations and B has 5. Count complete routes.
    answer: $3+5=8$. The branches are disjoint but have different sizes.
  '4':
    instructions: ''
    prompt: Count length-5 strings over a 4-symbol alphabet when repetition is allowed.
    answer: $4^5=1024$, by four independent choices at each labeled position.
  '5':
    instructions: ''
    prompt: Count length-8 binary strings containing at least one 1.
    answer: $2^8-1=255$. Remove the unique all-zero string.
  '6':
    instructions: ''
    prompt: Count length-4 digit strings with no repeated digit; leading zero is allowed.
    answer: $10\cdot9\cdot8\cdot7=5040$. Each choice removes one available digit.
  '7':
    instructions: ''
    prompt: Count length-4 digit strings with at least one repeated digit; leading zero is allowed.
    answer: $10^4-5040=4960$, subtracting the no-repetition strings from all strings.
  '8':
    instructions: ''
    prompt: Count four-digit positive integers with no repeated digit.
    answer: $9\cdot9\cdot8\cdot7=4536$. The first digit has 9 nonzero choices; zero is available in the second position.
  '9':
    instructions: ''
    prompt: Of 30 students, 18 study French, 15 study German, and 8 study both. How many study neither?
    answer: $30-(18+15-8)=5$. Adding the language totals alone would double-count the intersection.
  '10':
    instructions: ''
    prompt: A code is either two letters or three digits. Letters come from 26 symbols; leading zero and repetition are allowed. Count codes.
    answer: $26^2+10^3=1676$. The two formats are disjoint, and positions within each format use the product principle.
  '11':
    instructions: ''
    prompt: How many ways can three distinct named offices be assigned to 9 people if nobody may hold two offices? Explain your count.
    answer: $P(9,3)=9\cdot8\cdot7=504$. Offices distinguish the positions.
  '12':
    instructions: ''
    prompt: How many unordered three-person committees can be chosen from 9 distinct people? No person can be chosen more than once.
    answer: $\binom93=84$. There are $9\cdot8\cdot7=504$ ordered selections, and each committee appears in $3!=6$ orders.
  '13':
    instructions: ''
    prompt: How many orders can six distinct books have on one shelf?
    answer: $6!=720$, choosing the first through sixth positions successively.
  '14':
    instructions: ''
    prompt: Count arrangements of six distinct books in which two specified books are adjacent.
    answer: 'Treat the pair as a block: $5!$ orders of the block and other books, times 2 internal orders, gives 240.'
  '15':
    instructions: ''
    prompt: Count arrangements of six distinct books in which two specified books are not adjacent.
    answer: $6!-2\cdot5!=720-240=480$, removing the adjacent arrangements.
  '16':
    instructions: ''
    prompt: How many committees contain exactly two engineers and two designers chosen from disjoint groups of 6 engineers and 5 designers? Explain your count.
    answer: $\binom62\binom52=15\cdot10=150$. The two group selections uniquely determine the committee.
  '17':
    instructions: ''
    prompt: How many four-person committees can be chosen from disjoint groups of 6 engineers and 5 designers if at least one member must be a designer? Explain your count.
    answer: $\binom{11}4-\binom64=330-15=315$. Exclude the all-engineer committees.
  '18':
    instructions: ''
    prompt: How many injective functions map a 4-element labeled domain into a 7-element codomain?
    answer: $7\cdot6\cdot5\cdot4=840$. Distinct inputs must receive distinct outputs.
  '19':
    instructions: ''
    prompt: How many injective functions map a 7-element domain into a 4-element codomain? Explain.
    answer: Zero. Seven distinct outputs would be needed but only four exist; the pigeonhole principle forces a repeated output.
  '20':
    instructions: ''
    prompt: Explain both $\binom n0=1$ and $\binom nn=1$ for $n\geq0$.
    answer: The only zero-element subset is the empty set; the only full-size subset is the whole set. This includes $n=0$, when these are the same subset.
  '21':
    instructions: Copies of the same letter are indistinguishable.
    prompt: Count distinct arrangements of the letters BANANA.
    answer: $6!/(3!2!1!)=60$, dividing out permutations of identical A and N copies.
  '22':
    instructions: ''
    prompt: Count distinct arrangements of the letters MISSISSIPPI.
    answer: '$11!/(4!4!2!)=34650$: there are four I, four S, two P, and one M.'
  '23':
    instructions: ''
    prompt: Count length-8 binary strings with exactly three 1s.
    answer: $\binom83=56$, choosing the three positions occupied by 1.
  '24':
    instructions: ''
    prompt: Arrange five distinct people around an unnumbered round table. Rotations agree; reflections differ. Count arrangements.
    answer: 'Fix one person as an anchor and order the others clockwise: $4!=24$.'
  '25':
    instructions: ''
    prompt: Arrange five distinct people in five numbered seats around a table. Count the arrangements. Explain why this differs from seating them at an unnumbered round table where rotations agree and reflections differ.
    answer: $5!=120$. Rotating everyone changes their numbered seats, so those assignments are distinct.
  '26':
    instructions: ''
    prompt: Six distinct people sit around an unnumbered round table, rotations identified and reflections distinct. Two specified people must sit together. Count arrangements.
    answer: 'Collapse the adjacent pair into one block. Five circular units give $4!$ arrangements, with two orders inside the pair: 48.'
  '27':
    instructions: ''
    prompt: How many ways can you distribute seven identical tokens into three labeled boxes, allowing empty boxes? Explain your count.
    answer: $\binom{7+3-1}{3-1}=\binom92=36$ by stars and bars.
  '28':
    instructions: ''
    prompt: How many ways can you distribute seven identical tokens into three labeled boxes, with every box nonempty? Explain your count.
    answer: "Place one token in each box, then distribute the remaining four: $\\binom62=15$."
  '29':
    instructions: ''
    prompt: How many ways can you distribute seven distinct tokens into three labeled boxes, allowing empty boxes? Explain your count.
    answer: $3^7=2187$. Each labeled token independently chooses a box; stars and bars would lose token identities.
  '30':
    instructions: ''
    prompt: Count nonnegative integer solutions to $x+y+z=8$ with $x\geq2$.
    answer: Set $u=x-2\geq0$. Then $u+y+z=6$, giving $\binom82=28$ solutions.
  '31':
    instructions: ''
    prompt: Compute $\binom{10}3$ and explain its factorial denominator.
    answer: $\binom{10}3=120$. Ordered selections count each three-element subset $3!$ times, so divide $10\cdot9\cdot8$ by 6.
  '32':
    instructions: ''
    prompt: Prove $\binom nr=\binom n{n-r}$ for $0\leq r\leq n$ by a bijection.
    answer: Map each $r$-element subset to its complement in the fixed $n$-element universe. Complementation is its own inverse and gives an $(n-r)$-element subset.
  '33':
    instructions: ''
    prompt: Prove Pascal's identity by partitioning the $r$-subsets of an $n$-element set, where $1\leq r<n$.
    answer: Fix one element. Subsets containing it correspond to $(r-1)$-subsets of the other $n-1$ elements; those excluding it correspond to $r$-subsets of them. The cases give $\binom nr=\binom{n-1}{r-1}+\binom{n-1}r$.
  '34':
    instructions: ''
    prompt: Expand $(a+b)^4$.
    answer: $a^4+4a^3b+6a^2b^2+4ab^3+b^4$, using coefficients $\binom4k$.
  '35':
    instructions: ''
    prompt: Find the coefficient of $x^3$ in $(2+x)^5$.
    answer: "$\\binom53 2^2=40$: choose three factors to supply $x$ and two to supply 2."
  '36':
    instructions: ''
    prompt: Find the coefficient of $x^2$ in $(1-3x)^4$.
    answer: $\binom42(-3)^2=54$. Two selected factors contribute $-3x$.
  '37':
    instructions: ''
    prompt: Prove $\sum_{r=0}^n\binom nr=2^n$ by counting subsets.
    answer: The sum groups all subsets by their cardinality. Alternatively, each of the $n$ elements independently is included or excluded, giving $2^n$ subsets.
  '38':
    instructions: ''
    prompt: For $n\geq1$, count pairs $(S,x)$ where $S$ is a subset of an $n$-element set and $x\in S$. Derive an identity.
    answer: By subset size the count is $\sum_{r=1}^n r\binom nr$. Choosing $x$ first gives $n$ choices and leaves $2^{n-1}$ choices for the remaining membership decisions. Hence the sum equals $n2^{n-1}$.
  '39':
    instructions: ''
    prompt: Use Pascal's identity to express $\binom73$ as a sum of two binomial coefficients with top index 6, then calculate its value.
    answer: $\binom73=\binom62+\binom63=15+20=35$.
  '40':
    instructions: ''
    prompt: Explain why dividing an overcount by a fixed number requires a uniform number of representations per outcome.
    answer: The original count equals a sum of representation counts over desired outcomes. Division by $d$ recovers the number of outcomes when each count equals $d$; varying multiplicities are not generally corrected by one common divisor.
  '41':
    instructions: ''
    prompt: Among integers 1 through 100 inclusive, count those divisible by 2 or 3.
    answer: $50+33-16=67$. Multiples of both are precisely multiples of 6.
  '42':
    instructions: ''
    prompt: Among integers 1 through 120 inclusive, count those divisible by 4 or 6.
    answer: $30+20-10=40$. The intersection consists of multiples of 12.
  '43':
    instructions: ''
    prompt: Among integers 1 through 120 inclusive, count those divisible by neither 4 nor 6.
    answer: There are $30$ multiples of 4, $20$ multiples of 6, and $10$ multiples of 12 among 1 through 120. Thus $30+20-10=40$ integers are divisible by 4 or 6, leaving $120-40=80$ divisible by neither.
  '44':
    instructions: ''
    prompt: For finite sets, $|A|=20$, $|B|=18$, $|C|=15$, $|A\cap B|=8$, $|A\cap C|=6$, $|B\cap C|=5$, and $|A\cap B\cap C|=3$. Find $|A\cup B\cup C|$ and show how you account for overlaps.
    answer: $20+18+15-8-6-5+3=37$. Pairwise intersections include the triple intersection.
  '45':
    instructions: ''
    prompt: Explain why three-set inclusion-exclusion adds the triple intersection after subtracting the pairwise intersections.
    answer: An element in all three sets contributes $3-3=0$ before the final correction. Adding the triple intersection changes its contribution to 1, as required.
  '46':
    instructions: ''
    prompt: Count length-5 strings over the symbols A, B, C that contain at least one A and at least one B.
    answer: $3^5-2^5-2^5+1^5=180$. Exclude strings missing A or missing B, then restore the all-C string subtracted twice.
  '47':
    instructions: ''
    prompt: Count length-5 digit strings having exactly two zeros and at least one 7; leading zero and repetition are allowed.
    answer: "Choose the zero positions, then fill the others with nonzero digits including a 7: $\\binom52(9^3-8^3)=2170$."
  '48':
    instructions: ''
    prompt: Count length-5 strings of distinct digits with exactly two even digits; leading zero is allowed.
    answer: "Choose two of the five even digits and three of the five odd digits, then arrange them: $\\binom52\\binom53 5!=12000$."
  '49':
    instructions: ''
    prompt: Count length-6 binary strings with exactly two 1s that are not adjacent.
    answer: All choices number $\binom62=15$. The adjacent pairs can start in positions 1 through 5, so the answer is $15-5=10$.
  '50':
    instructions: ''
    prompt: Choose three people from a group of 8, excluding committees containing both of two specified people.
    answer: There are $\binom83=56$ committees. A forbidden committee contains the specified pair and one of the other six people, so $56-6=50$ remain.
  '51':
    instructions: ''
    prompt: Among 25 people, how many must share a birth month?
    answer: At least $\lceil25/12\rceil=3$. If each month contained at most two birthdays there would be at most 24 people.
  '52':
    instructions: ''
    prompt: How many people guarantee that at least five share a birth month? Show minimality.
    answer: '49: twelve months can contain four each for 48 people without forcing five. A 49th person forces one month to have at least five.'
  '53':
    instructions: ''
    prompt: Place 37 objects into 8 boxes. What lower bound on the maximum occupancy is guaranteed, and can it be achieved?
    answer: At least $\lceil37/8\rceil=5$. Occupancies $5,5,5,5,5,4,4,4$ achieve maximum 5, so no larger guarantee is possible.
  '54':
    instructions: ''
    prompt: Prove that among any six integers, two have difference divisible by 5.
    answer: Partition by the five possible remainders modulo 5. Two integers have the same remainder, say $5q+r$ and $5s+r$; their difference is $5(q-s)$.
  '55':
    instructions: ''
    prompt: A hash function maps 1001 distinct inputs to 1000 hash values. What must happen?
    answer: At least two inputs receive the same value, since an injective assignment would require 1001 distinct outputs. This is a guaranteed collision, not a probability estimate.
  '56':
    instructions: ''
    prompt: A hash function maps 1000 inputs to 1000 values. Must a collision occur?
    answer: No. A bijection assigns a different value to every input. Equal numbers of inputs and outputs do not force a collision.
  '57':
    instructions: ''
    prompt: Choose six distinct integers from 1 through 10. Prove two sum to 11.
    answer: Use five boxes $\{1,10\},\{2,9\},\{3,8\},\{4,7\},\{5,6\}$. Six selected integers force both members of one box, whose sum is 11.
  '58':
    instructions: ''
    prompt: Prove the bound $\lceil N/k\rceil$ for $N>0$ objects in $k\geq1$ boxes.
    answer: If every box held at most $\lceil N/k\rceil-1$, the total would be at most $k(\lceil N/k\rceil-1)<N$, a contradiction. Therefore some box has at least the stated number.
  '59':
    instructions: ''
    prompt: Ten students receive integer scores from 0 through 100. Does pigeonhole force two equal scores? Explain.
    answer: No. There are 101 possible scores, more than ten students. Ten different scores are possible, for example 0 through 9.
  '60':
    instructions: ''
    prompt: What is the minimum number of distinct integers that guarantees at least four selected integers have the same remainder modulo 7? Justify minimality.
    answer: 22. Seven remainder classes can hold three each for 21 integers; a 22nd forces four. Taking three representatives per class shows 21 is insufficient.
  '61':
    instructions: ''
    prompt: A program has 12 independent Boolean inputs. How many complete input assignments exist?
    answer: $2^{12}=4096$, one binary choice per labeled input.
  '62':
    instructions: ''
    prompt: How many functions map a 5-element domain into a 3-element codomain?
    answer: $3^5=243$, since every input has three independently chosen outputs.
  '63':
    instructions: ''
    prompt: How many subsets of an 8-element set contain one specified element?
    answer: $2^7=128$. Include the specified element, then decide membership of each other element independently.
  '64':
    instructions: ''
    prompt: How many subsets of an 8-element set contain exactly one of two specified elements?
    answer: "$2\\cdot2^6=128$: choose which specified element to include, then choose any subset of the six others."
  '65':
    instructions: ''
    prompt: Count nonempty proper subsets of a 6-element set.
    answer: $2^6-2=62$, excluding the empty set and the full set.
  '66':
    instructions: ''
    prompt: Count length-7 binary strings with at most two 1s.
    answer: $\binom70+\binom71+\binom72=1+7+21=29$. The cases by number of 1s are disjoint.
  '67':
    instructions: ''
    prompt: Count functions from a 4-element domain onto a 2-element codomain.
    answer: $2^4-2=14$. The only non-surjective functions are the two constant functions.
  '68':
    instructions: ''
    prompt: Count bijections between two 5-element sets.
    answer: '$5!=120$: order the outputs assigned to the five labeled domain elements.'
  '69':
    instructions: ''
    prompt: A test uses one browser from 3 choices, one operating system from 4, and one of 2 modes. Every browser/system/mode configuration is supported. How many tests are there?
    answer: $3\cdot4\cdot2=24$. One test records a choice in each of three independent categories.
  '70':
    instructions: ''
    prompt: A test selects one of 3 browsers, one of 4 operating systems, and one of 2 modes. One browser supports only 2 operating systems; each other browser supports all 4. Both modes work for every supported browser/system pair. How many supported tests are there?
    answer: $(2+4+4)\cdot2=20$. Partition by browser because operating-system choice counts differ.
  '71':
    instructions: ''
    prompt: Count nonnegative integer solutions to $x_1+x_2+x_3+x_4=6$.
    answer: $\binom{6+4-1}{4-1}=\binom93=84$, by arranging six stars and three separators.
  '72':
    instructions: ''
    prompt: Count positive integer solutions to $x_1+x_2+x_3+x_4=6$.
    answer: Subtract 1 from each variable. The remaining total is 2, so there are $\binom53=10$ solutions.
  '73':
    instructions: ''
    prompt: How many arrangements of AABBC have the two A copies adjacent?
    answer: Treat AA as one block with B, B, C. There are $4!/2!=12$ arrangements; the A copies have no distinct internal order.
  '74':
    instructions: ''
    prompt: How many arrangements of AABBC have the two A copies separated?
    answer: Total arrangements number $5!/(2!2!)=30$. Subtract the 12 adjacent arrangements to obtain 18.
  '75':
    instructions: ''
    prompt: Choose a four-person committee from 10 people and then its chair. Count the possible committee-and-chair choices in two ways, explaining what each calculation counts.
    answer: "Choose the committee then chair: $4\\binom{10}4=840$. Choose the chair then three companions: $10\\binom93=840$. Both count a committee with one distinguished member."
  '76':
    instructions: ''
    prompt: Count length-6 digit strings containing at least one zero; leading zero is allowed.
    answer: $10^6-9^6=468559$. Subtract strings that use only the nine nonzero digits.
  '77':
    instructions: ''
    prompt: Count six-digit positive integers containing at least one zero.
    answer: There are $9\cdot10^5$ six-digit positive integers and $9^6$ with no zero. The difference is $368559$.
  '78':
    instructions: ''
    prompt: A proposed solution counts unordered pairs from 6 objects as $6\cdot5$. Diagnose and correct it.
    answer: Each pair is counted twice, once per order. Divide by 2 to obtain $\binom62=15$.
  '79':
    instructions: ''
    prompt: A proposed solution says any five integers contain two with equal remainders modulo 5. Give a counterexample.
    answer: The integers $0,1,2,3,4$ have five different remainders. More objects than boxes are needed to force repetition.
  '80':
    instructions: ''
    prompt: Count 4-element subsets of a 10-element set that contain at least one of two specified elements, using two methods.
    answer: "Complement: $\\binom{10}4-\\binom84=210-70=140$. Disjoint cases: exactly one gives $2\\binom83=112$, and both give $\\binom82=28$; total 140."
