  - title: Connection to rank and eigenvalues
    questions:
      - id: 29
        type: freeform
        prompt: A real matrix has singular values 4,2,0 and has three columns. Find its rank and nullity, and give the eigenvalues of A transpose A.
        answerLines: 5
        answer: Rank is two because two singular values are positive. Nullity is one by rank plus nullity equals three. The eigenvalues of A transpose A are 16,4,0, the squares of the singular values.
      - id: 30
        type: freeform
        prompt: Why is it invalid to construct a left singular vector by dividing Av by sigma when sigma is zero? What does Av equal in that case?
        answerLines: 5
        answer: Division by zero is undefined. A zero singular value corresponds to a right direction in the null space, so Av is zero. The remaining output basis directions must be completed separately.
      - id: 31
        type: freeform
        prompt: A is the 2-by-3 rectangular diagonal matrix with diagonal (3, 2) and all other entries zero. Find rank, nullity, and all eigenvalues of A transpose A, counting zeros.
        answerLines: 5
        answer: Rank is 2. Nullity is 1, from number of columns minus rank. A transpose A is 3 by 3 with diagonal (9, 4, 0). In a wide matrix, extra zero eigenvalues arise from input directions beyond the rectangular diagonal.
      - id: 32
        type: freeform
        prompt: A is the 3-by-2 rectangular diagonal matrix with diagonal (4, 0) and all other entries zero. Find rank, nullity, and all eigenvalues of A transpose A, counting zeros.
        answerLines: 5
        answer: Rank is 1. Nullity is 1, from number of columns minus rank. A transpose A is 2 by 2 with diagonal (16, 0). In a wide matrix, extra zero eigenvalues arise from input directions beyond the rectangular diagonal.
      - id: 33
        type: freeform
        prompt: A is the 3-by-4 rectangular diagonal matrix with diagonal (5, 2, 0) and all other entries zero. Find rank, nullity, and all eigenvalues of A transpose A, counting zeros.
        answerLines: 5
        answer: Rank is 2. Nullity is 2, from number of columns minus rank. A transpose A is 4 by 4 with diagonal (25, 4, 0, 0). In a wide matrix, extra zero eigenvalues arise from input directions beyond the rectangular diagonal.
      - id: 34
        type: freeform
        prompt: A is the 4-by-3 rectangular diagonal matrix with diagonal (3, 2, 1) and all other entries zero. Find rank, nullity, and all eigenvalues of A transpose A, counting zeros.
        answerLines: 5
        answer: Rank is 3. Nullity is 0, from number of columns minus rank. A transpose A is 3 by 3 with diagonal (9, 4, 1). In a wide matrix, extra zero eigenvalues arise from input directions beyond the rectangular diagonal.
      - id: 35
        type: freeform
        prompt: A is the 2-by-4 rectangular diagonal matrix with diagonal (2, 1) and all other entries zero. Find rank, nullity, and all eigenvalues of A transpose A, counting zeros.
        answerLines: 5
        answer: Rank is 2. Nullity is 2, from number of columns minus rank. A transpose A is 4 by 4 with diagonal (4, 1, 0, 0). In a wide matrix, extra zero eigenvalues arise from input directions beyond the rectangular diagonal.
      - id: 36
        type: freeform
        prompt: A is the 3-by-3 rectangular diagonal matrix with diagonal (0, 0, 0) and all other entries zero. Find rank, nullity, and all eigenvalues of A transpose A, counting zeros.
        answerLines: 5
        answer: Rank is 0. Nullity is 3, from number of columns minus rank. A transpose A is 3 by 3 with diagonal (0, 0, 0). In a wide matrix, extra zero eigenvalues arise from input directions beyond the rectangular diagonal.
      - id: 37
        type: freeform
        prompt: For A with rows (0, 3), (1, 0), the right singular vector (0,1) has positive singular value 3. Construct its left singular vector and verify its length and defining equation.
        answerLines: 5
        answer: A(0,1)=(3,0). Dividing by 3 gives u=(1,0), which has norm one. The equation Av=3u holds. This construction is legal because 3 is positive.
      - id: 38
        type: freeform
        prompt: For A with rows (0, 4), (2, 0), the right singular vector (0,1) has positive singular value 4. Construct its left singular vector and verify its length and defining equation.
        answerLines: 5
        answer: A(0,1)=(4,0). Dividing by 4 gives u=(1,0), which has norm one. The equation Av=4u holds. This construction is legal because 4 is positive.
      - id: 39
