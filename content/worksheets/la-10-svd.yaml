        answerLines: 5
        answer: A(0,1)=(2,0). Dividing by 2 gives u=(1,0), which has norm one. The equation Av=2u holds. This construction is legal because 2 is positive.
      - id: 40
        type: freeform
        prompt: For A with rows (0, 5), (3, 0), the right singular vector (0,1) has positive singular value 5. Construct its left singular vector and verify its length and defining equation.
        answerLines: 5
        answer: A(0,1)=(5,0). Dividing by 5 gives u=(1,0), which has norm one. The equation Av=5u holds. This construction is legal because 5 is positive.
      - id: 41
