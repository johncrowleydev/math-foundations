  - title: Approximation and responsible interpretation
    questions:
      - id: 43
        type: freeform
        prompt: A diagonal matrix has entries 6,3,1. Form a rank-one truncated SVD approximation and give its Frobenius error exactly.
        answerLines: 5
        answer: Keep only the entry six, giving diagonal entries (6,0,0). The discarded squared singular values sum to 9+1=10, so the Frobenius error is the square root of ten.
      - id: 44
        type: freeform
        prompt: Does discarding a small singular value prove the discarded information is scientifically unimportant? Explain the distinction between the approximation theorem and interpretation.
        answerLines: 5
        answer: No. The theorem concerns an error norm and a rank limit, not scientific importance. A small component can carry meaningful information, and rescaling data can change singular values. Interpretation requires knowledge of the data and purpose.
      - id: 45
        type: freeform
        prompt: A is diagonal with entries (6, 3, 1) in descending order. Give one rank-at-most-one truncated SVD approximation, its exact Frobenius error, and the error after keeping two directions.
        answerLines: 5
        answer: One approximation has diagonal (6,0,0). The discarded squared entries sum to 10, so its Frobenius error is square root of 10. Keeping the first two gives error 1. If a cutoff splits tied positive singular values, other equally good choices can exist.
      - id: 46
        type: freeform
        prompt: A is diagonal with entries (5, 2, 1) in descending order. Give one rank-at-most-one truncated SVD approximation, its exact Frobenius error, and the error after keeping two directions.
        answerLines: 5
        answer: One approximation has diagonal (5,0,0). The discarded squared entries sum to 5, so its Frobenius error is square root of 5. Keeping the first two gives error 1. If a cutoff splits tied positive singular values, other equally good choices can exist.
      - id: 47
