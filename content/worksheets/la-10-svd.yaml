      - id: 51
        type: freeform
        prompt: A is diagonal with entries one and 1/2. If the second component of b changes by 1/2, with the first unchanged, how much does the recovered second component of the solution of Ax=b change? Relate this to the weak singular direction.
        answerLines: 5
        answer: The second equation is x2/2=b2, so x2=2b2. The stated output change produces input change one. The smallest singular value is 1/2, and its reciprocal 2 is the amplification in that inverse direction.
      - id: 52
