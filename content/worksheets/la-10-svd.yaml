      - id: 57
        type: freeform
        prompt: Can a two-by-three matrix have two positive listed singular values and still have a nontrivial null space? Explain.
        answerLines: 5
        answer: Yes. Its rank is two but it has three input coordinates, giving nullity one. Sigma has only two diagonal positions; the extra input direction is also erased.
      - id: 58
        type: freeform
        prompt: Why must A transpose A have nonnegative eigenvalues?
        answerLines: 5
        answer: For a unit eigenvector v with eigenvalue lambda, lambda=v transpose A transpose A v, which is the squared norm of Av and is nonnegative. The symmetric spectral theorem supplies the eigenbasis.
      - id: 59
        type: freeform
        prompt: Why do A transpose A and A A transpose have the same positive eigenvalues but potentially different numbers of zeros?
        answerLines: 5
        answer: Positive singular values contribute their squares to both. The two products act on input and output spaces of potentially different dimensions, so the leftover zero directions can differ.
      - id: 60
        type: freeform
        prompt: Why is a negative eigenvalue compatible with a nonnegative singular value?
        answerLines: 5
        answer: Eigenvalues include direction reversal relative to the same input line. Singular values measure nonnegative lengths between independently chosen input and output directions; reversals belong in the orthogonal factors.
      - id: 61
        type: freeform
        prompt: Is an SVD unique if two positive singular values are equal? Explain.
        answerLines: 5
        answer: Not generally. Orthonormal directions within the equal-stretch subspaces can be changed consistently without changing the matrix. Even simple sign changes can give multiple valid factors.
      - id: 62
        type: freeform
        prompt: Why is division by a zero singular value not a method for constructing its left singular vector?
        answerLines: 5
        answer: The corresponding Av is zero, so the formula would be zero divided by zero. Remaining output directions must instead be chosen to complete an orthonormal basis.
      - id: 63
        type: freeform
        prompt: If all positive singular directions are retained, what is the truncation error?
        answerLines: 5
        answer: Zero. No nonzero contribution is discarded, so the reconstructed matrix is exact.
      - id: 64
        type: freeform
        prompt: Why is the Frobenius norm of a discarded diagonal (0,3,4) five rather than seven or twenty-five?
        answerLines: 5
        answer: The squared entries sum to 9+16=25; the norm is their square root, five. Seven is a sum of magnitudes and twenty-five is the squared norm.
      - id: 65
        type: freeform
        prompt: Does the best low-rank approximation theorem prove that discarded features are irrelevant to the task?
        answerLines: 5
        answer: No. It minimizes a specified matrix error under a rank constraint. Scientific importance, causal meaning, and task-specific predictive value are separate judgments.
      - id: 66
        type: freeform
        prompt: Can a zero matrix have an SVD? Describe one.
        answerLines: 5
        answer: Yes. Choose identity orthogonal factors of the required input and output sizes and a zero rectangular Sigma. The product is zero and all singular values are zero.
      - id: 67
        type: freeform
        prompt: What does retaining zero directions produce, and what is its error?
        answerLines: 5
        answer: It produces the zero matrix. The error is the original matrix’s Frobenius norm, the square root of the sum of all squared singular values.
      - id: 68
        type: freeform
        prompt: Explain why calling every orthogonal factor a rotation is too restrictive.
        answerLines: 5
        answer: A reflection also has orthonormal columns and preserves lengths and angles. Orthogonal matrices allow both orientation-preserving and orientation-reversing actions.
      - id: 69
        type: freeform
        prompt: Can a real matrix without a real eigenbasis still have a real SVD? Explain the conceptual difference.
        answerLines: 5
        answer: Yes. The real SVD exists for every real matrix, using distinct orthonormal input and output bases. An eigenbasis requires the same directions to return as scalar multiples, a stronger and different condition.
      - id: 70
        type: freeform
        prompt: Why can a finite singular-value tolerance change numerical rank without changing exact mathematical rank?
        answerLines: 5
        answer: Numerical rank treats sufficiently small computed values as effectively zero based on scale and rounding. Exact rank counts all exactly positive singular values, however small.
      - id: 71
        type: freeform
        prompt: For a full-rank tall matrix, must every output direction be reachable? Explain.
        answerLines: 5
        answer: No. Full column rank means independent inputs are preserved, but when rows outnumber columns the image dimension is still smaller than the output space. Extra left basis directions are outside the image.
      - id: 72
        type: freeform
        prompt: Why should a supplied SVD be checked for orthogonality as well as multiplication?
        answerLines: 5
        answer: Many factorizations multiply to A. An SVD additionally requires orthogonal U,V and nonnegative rectangular diagonal Sigma, which give its geometric and rank interpretations.
