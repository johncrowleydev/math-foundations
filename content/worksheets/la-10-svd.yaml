        answerLines: 5
        answer: One choice is U with rows (0, 1), (-1, 0), Sigma with rows (3, 0), (0, 0), and V with rows (0, 1), (1, 0). Permutations put the stretches in descending order; sign changes in U reconstruct negative original entries. Direct multiplication gives the original diagonal matrix.
      - id: 27
