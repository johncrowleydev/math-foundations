title: Singular Value Decomposition
sections:
  - title: Perpendicular directions and scale factors
    questions:
      - id: 1
        type: freeform
        prompt: For a three by two matrix, state the shapes of U, Sigma, and V in the full SVD. Explain which factor contains the length scale factors.
        answerLines: 5
        answer: U is three by three, Sigma is three by two, and V is two by two. Sigma contains nonnegative singular values on its diagonal; the orthogonal U and V factors preserve length.
      - id: 2
        type: freeform
        prompt: Does an orthogonal factor in an SVD have to be a rotation rather than a reflection? Explain what property is actually required.
        answerLines: 5
        answer: No. Reflections are allowed. The required property is an orthonormal basis of columns, equivalently transpose times the matrix equals identity; this preserves lengths and angles.
      - id: 3
        type: freeform
        prompt: For a real 3-by-2 matrix, state the full SVD shapes of U, Sigma, V, and V transpose. How many diagonal positions does Sigma have, and how many columns does each full basis matrix contain?
        answerLines: 5
        answer: U is 3 by 3; Sigma 3 by 2; V and its transpose 2 by 2. There are 2 diagonal positions. The full output basis has 3 columns and the input basis 2. Extra input directions in a wide matrix can be erased even without a listed zero diagonal value.
      - id: 4
        type: freeform
        prompt: For a real 2-by-3 matrix, state the full SVD shapes of U, Sigma, V, and V transpose. How many diagonal positions does Sigma have, and how many columns does each full basis matrix contain?
        answerLines: 5
        answer: U is 2 by 2; Sigma 2 by 3; V and its transpose 3 by 3. There are 2 diagonal positions. The full output basis has 2 columns and the input basis 3. Extra input directions in a wide matrix can be erased even without a listed zero diagonal value.
      - id: 5
        type: freeform
        prompt: For a real 4-by-2 matrix, state the full SVD shapes of U, Sigma, V, and V transpose. How many diagonal positions does Sigma have, and how many columns does each full basis matrix contain?
        answerLines: 5
        answer: U is 4 by 4; Sigma 4 by 2; V and its transpose 2 by 2. There are 2 diagonal positions. The full output basis has 4 columns and the input basis 2. Extra input directions in a wide matrix can be erased even without a listed zero diagonal value.
      - id: 6
        type: freeform
        prompt: For a real 2-by-4 matrix, state the full SVD shapes of U, Sigma, V, and V transpose. How many diagonal positions does Sigma have, and how many columns does each full basis matrix contain?
        answerLines: 5
        answer: U is 2 by 2; Sigma 2 by 4; V and its transpose 4 by 4. There are 2 diagonal positions. The full output basis has 2 columns and the input basis 4. Extra input directions in a wide matrix can be erased even without a listed zero diagonal value.
      - id: 7
        type: freeform
        prompt: For a real 3-by-3 matrix, state the full SVD shapes of U, Sigma, V, and V transpose. How many diagonal positions does Sigma have, and how many columns does each full basis matrix contain?
        answerLines: 5
        answer: U is 3 by 3; Sigma 3 by 3; V and its transpose 3 by 3. There are 3 diagonal positions. The full output basis has 3 columns and the input basis 3. Extra input directions in a wide matrix can be erased even without a listed zero diagonal value.
      - id: 8
        type: freeform
        prompt: For a real 1-by-4 matrix, state the full SVD shapes of U, Sigma, V, and V transpose. How many diagonal positions does Sigma have, and how many columns does each full basis matrix contain?
        answerLines: 5
        answer: U is 1 by 1; Sigma 1 by 4; V and its transpose 4 by 4. There are 1 diagonal positions. The full output basis has 1 columns and the input basis 4. Extra input directions in a wide matrix can be erased even without a listed zero diagonal value.
      - id: 9
        type: freeform
        prompt: A full two-dimensional SVD has singular values 4,2. Describe the possible output lengths of unit inputs at the strongest and weakest directions. Does either orthogonal factor cause these changes in length?
        answerLines: 5
        answer: The maximum is 4 and the minimum is 2. These extrema occur along the corresponding right singular directions. Orthogonal U and V preserve length; Sigma produces the stretches.
      - id: 10
        type: freeform
        prompt: A full two-dimensional SVD has singular values 3,1. Describe the possible output lengths of unit inputs at the strongest and weakest directions. Does either orthogonal factor cause these changes in length?
        answerLines: 5
        answer: The maximum is 3 and the minimum is 1. These extrema occur along the corresponding right singular directions. Orthogonal U and V preserve length; Sigma produces the stretches.
      - id: 11
        type: freeform
        prompt: A full two-dimensional SVD has singular values 5,0. Describe the possible output lengths of unit inputs at the strongest and weakest directions. Does either orthogonal factor cause these changes in length?
        answerLines: 5
        answer: The maximum is 5 and the minimum is 0. A unit input in a null direction collapses to zero. Orthogonal U and V preserve length; Sigma produces the stretches.
      - id: 12
        type: freeform
        prompt: A full two-dimensional SVD has singular values 2,2. Describe the possible output lengths of unit inputs at the strongest and weakest directions. Does either orthogonal factor cause these changes in length?
        answerLines: 5
        answer: The maximum is 2 and the minimum is 2. These extrema occur along the corresponding right singular directions. Orthogonal U and V preserve length; Sigma produces the stretches.
      - id: 13
        type: freeform
        prompt: A full two-dimensional SVD has singular values 1,0. Describe the possible output lengths of unit inputs at the strongest and weakest directions. Does either orthogonal factor cause these changes in length?
        answerLines: 5
        answer: The maximum is 1 and the minimum is 0. A unit input in a null direction collapses to zero. Orthogonal U and V preserve length; Sigma produces the stretches.
      - id: 14
        type: freeform
        prompt: A full two-dimensional SVD has singular values 6,3. Describe the possible output lengths of unit inputs at the strongest and weakest directions. Does either orthogonal factor cause these changes in length?
        answerLines: 5
        answer: The maximum is 6 and the minimum is 3. These extrema occur along the corresponding right singular directions. Orthogonal U and V preserve length; Sigma produces the stretches.
  - title: A small example you can verify
    questions:
      - id: 15
        type: freeform
        prompt: Let U be identity, Sigma have diagonal entries 3 and 1, and V swap the two standard basis vectors. Compute the rows of U Sigma V transpose and its output on (2,4).
        answerLines: 5
        answer: V transpose also swaps coordinates. The product has rows (0,3),(1,0), sending (2,4) to (12,2). The scale factors are 3 and 1 along the chosen right singular directions.
      - id: 16
        type: freeform
        prompt: A diagonal matrix has diagonal entries 5 and 2. Describe the image of the unit circle and identify the greatest and least output lengths for unit inputs.
        answerLines: 5
        answer: The image is an ellipse with horizontal semiaxis five and vertical semiaxis two. The greatest output length is five along the horizontal input direction, and the least is two along the vertical direction.
      - id: 17
        type: freeform
        prompt: U is identity, Sigma is diagonal with entries 3,1, and V swaps the two standard directions. Reconstruct A and find its output on (2, -1).
        answerLines: 5
        answer: V transpose first swaps the coordinates. Sigma then scales them, so A has rows (0, 3), (1, 0) and the output is (-3, 2). The nonnegative diagonal entries are ordered as required.
      - id: 18
        type: freeform
        prompt: U is identity, Sigma is diagonal with entries 4,2, and V swaps the two standard directions. Reconstruct A and find its output on (2, -1).
        answerLines: 5
        answer: V transpose first swaps the coordinates. Sigma then scales them, so A has rows (0, 4), (2, 0) and the output is (-4, 4). The nonnegative diagonal entries are ordered as required.
      - id: 19
        type: freeform
        prompt: U is identity, Sigma is diagonal with entries 2,0, and V swaps the two standard directions. Reconstruct A and find its output on (2, -1).
        answerLines: 5
        answer: V transpose first swaps the coordinates. Sigma then scales them, so A has rows (0, 2), (0, 0) and the output is (-2, 0). The nonnegative diagonal entries are ordered as required.
      - id: 20
        type: freeform
        prompt: U is identity, Sigma is diagonal with entries 5,3, and V swaps the two standard directions. Reconstruct A and find its output on (2, -1).
        answerLines: 5
        answer: V transpose first swaps the coordinates. Sigma then scales them, so A has rows (0, 5), (3, 0) and the output is (-5, 6). The nonnegative diagonal entries are ordered as required.
      - id: 21
        type: freeform
        prompt: U is identity, Sigma is diagonal with entries 1,1, and V swaps the two standard directions. Reconstruct A and find its output on (2, -1).
        answerLines: 5
        answer: V transpose first swaps the coordinates. Sigma then scales them, so A has rows (0, 1), (1, 0) and the output is (-1, 2). The nonnegative diagonal entries are ordered as required.
      - id: 22
        type: freeform
        prompt: U is identity, Sigma is diagonal with entries 6,2, and V swaps the two standard directions. Reconstruct A and find its output on (2, -1).
        answerLines: 5
        answer: V transpose first swaps the coordinates. Sigma then scales them, so A has rows (0, 6), (2, 0) and the output is (-6, 4). The nonnegative diagonal entries are ordered as required.
      - id: 23
        type: freeform
        prompt: Give a valid SVD of the diagonal matrix with entries -4,2, using nonnegative singular values in descending order. Explain how the original signs are retained.
        answerLines: 5
        answer: One choice is U with rows (-1, 0), (0, 1), Sigma with rows (4, 0), (0, 2), and V with rows (1, 0), (0, 1). Permutations put the stretches in descending order; sign changes in U reconstruct negative original entries. Direct multiplication gives the original diagonal matrix.
      - id: 24
        type: freeform
        prompt: Give a valid SVD of the diagonal matrix with entries 3,-1, using nonnegative singular values in descending order. Explain how the original signs are retained.
        answerLines: 5
        answer: One choice is U with rows (1, 0), (0, -1), Sigma with rows (3, 0), (0, 1), and V with rows (1, 0), (0, 1). Permutations put the stretches in descending order; sign changes in U reconstruct negative original entries. Direct multiplication gives the original diagonal matrix.
