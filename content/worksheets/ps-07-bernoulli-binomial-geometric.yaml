title: Bernoulli, Binomial, and Geometric Models
sections:
  - title: Bernoulli variables model one binary event
    questions:
      - id: 1
        type: freeform
        prompt: $X\sim\operatorname{Bernoulli}(2/7)$. Find $P(X=0)$.
        answerLines: 5
        answer: The complementary mass is $1-2/7=5/7$.
      - id: 2
        type: freeform
        prompt: $X\sim\operatorname{Bernoulli}(2/7)$. Find its mean.
        answerLines: 5
        answer: The mean of a Bernoulli indicator is its success probability, $2/7$.
      - id: 3
        type: freeform
        prompt: $X\sim\operatorname{Bernoulli}(2/7)$. Find its variance.
        answerLines: 5
        answer: The variance is $(2/7)(5/7)=10/49$.
      - id: 4
        type: freeform
        prompt: If $X\sim\operatorname{Bernoulli}(1/4)$, find $E[X^2]$.
        answerLines: 5
        answer: Since $X^2=X$, the second moment is $1/4$.
      - id: 5
        type: freeform
        prompt: If $X\sim\operatorname{Bernoulli}(1/4)$ and $Y=2+8X$, find $E[Y]$.
        answerLines: 5
        answer: The mean is $2+8(1/4)=4$.
      - id: 6
        type: freeform
        prompt: $X\sim\operatorname{Bernoulli}(1/4)$ and $Y=2+8X$. Find its variance.
        answerLines: 5
        answer: The Bernoulli variance is $3/16$; scaling by eight multiplies it by $64$, giving $12$.
      - id: 7
        type: freeform
        prompt: Find the largest possible Bernoulli variance.
        answerLines: 5
        answer: "Complete the square: $p(1-p)=1/4-(p-1/2)^2\\leq1/4$, achieved at $p=1/2$."
      - id: 8
        type: freeform
        prompt: If $X\sim\operatorname{Bernoulli}(1)$, find its variance.
        answerLines: 5
        answer: The variable is constantly one, so its variance is $0$.
      - id: 9
        type: freeform
        prompt: 'True or false: the event coded as success must be desirable.'
        answerLines: 5
        answer: False. It is simply the event represented by one; a defect indicator is an equally valid Bernoulli variable.
      - id: 10
        type: freeform
        prompt: Derive the Bernoulli mean and variance from its two masses.
        answerLines: 5
        answer: The mean is $0(1-p)+1p=p$. Since the second moment is also $p$, the variance is $p-p^2=p(1-p)$.
  - title: Binomial counts combine fixed independent trials
    questions:
      - id: 11
        type: freeform
        prompt: $X\sim\operatorname{Binomial}(4,1/2)$. Find $P(X=2)$.
        answerLines: 5
        answer: The count has $\binom42=6$ patterns, each probability $1/16$, giving $3/8$.
      - id: 12
        type: freeform
        prompt: $X\sim\operatorname{Binomial}(3,1/4)$. Find $P(X=1)$.
        answerLines: 5
        answer: The formula gives $3(1/4)(3/4)^2=27/64$.
      - id: 13
        type: freeform
        prompt: $X\sim\operatorname{Binomial}(3,1/4)$. Find $P(X=3)$.
        answerLines: 5
        answer: All three succeed with probability $(1/4)^3=1/64$.
      - id: 14
        type: freeform
        prompt: $X\sim\operatorname{Binomial}(12,1/3)$. Find its mean.
        answerLines: 5
        answer: The mean is $np=12/3=4$.
      - id: 15
        type: freeform
        prompt: $X\sim\operatorname{Binomial}(12,1/3)$. Find its variance.
        answerLines: 5
        answer: The variance is $12(1/3)(2/3)=8/3$.
      - id: 16
        type: freeform
        prompt: Five independent fair trials occur. Find the probability of the specified pattern $SFSFF$.
        answerLines: 5
        answer: A single ordered pattern has probability $(1/2)^5=1/32$.
      - id: 17
        type: freeform
        prompt: Five independent fair binary trials occur. Find the probability of exactly two successes.
        answerLines: 5
        answer: There are $\binom52=10$ such patterns, so the probability is $10/32=5/16$.
      - id: 18
        type: freeform
        prompt: A binomial count has $n=20$ and mean $5$. Find $p$.
        answerLines: 5
        answer: Since $np=5$, the common success probability is $5/20=1/4$.
      - id: 19
        type: freeform
        prompt: 'True or false: independent binary trials with probabilities $0.2,0.5,0.8$ necessarily have a binomial success count.'
        answerLines: 5
        answer: False. A binomial model requires a common success probability; independence alone does not supply it.
      - id: 20
        type: freeform
        prompt: Explain the combination coefficient in the binomial PMF.
        answerLines: 5
        answer: It counts which $k$ of the $n$ trial positions contain successes. Each choice defines a disjoint ordered pattern with the same probability under the common-rate independent model.
  - title: Binomial tails and model checks
    questions:
      - id: 21
        type: freeform
        prompt: $X\sim\operatorname{Binomial}(3,1/2)$. Find $P(X\geq1)$.
        answerLines: 5
        answer: The no-success probability is $1/8$, so the complement is $7/8$.
      - id: 22
        type: freeform
        prompt: $X\sim\operatorname{Binomial}(3,1/2)$. Find $P(X>1)$.
        answerLines: 5
        answer: Counts two and three have masses $3/8,1/8$, totaling $1/2$.
      - id: 23
        type: freeform
        prompt: $X\sim\operatorname{Binomial}(4,1/3)$. Find $P(X=0)$.
        answerLines: 5
        answer: All four fail with probability $(2/3)^4=16/81$.
      - id: 24
        type: freeform
        prompt: $X\sim\operatorname{Binomial}(4,1/3)$. Find $P(X\geq1)$.
        answerLines: 5
        answer: 'Take the complement of zero: $1-16/81=65/81$.'
      - id: 25
        type: freeform
        prompt: $X\sim\operatorname{Binomial}(4,1/3)$. Find $P(X\leq1)$.
        answerLines: 5
        answer: 'Add zero and one: $16/81+4(1/3)(2/3)^3=16/81+32/81=16/27$.'
      - id: 26
        type: freeform
        prompt: $X\sim\operatorname{Binomial}(4,1/3)$. Find $P(X\geq2)$.
        answerLines: 5
        answer: The complement is $1-16/27=11/27$.
      - id: 27
        type: freeform
        prompt: $X\sim\operatorname{Binomial}(25,0.4)$. Find $E[X/25]$.
        answerLines: 5
        answer: The proportion mean is the common success probability, $0.4=2/5$.
      - id: 28
        type: freeform
        prompt: $X\sim\operatorname{Binomial}(25,0.4)$. Find $\operatorname{Var}(X/25)$.
        answerLines: 5
        answer: The proportion variance is $0.4(0.6)/25=6/625$.
      - id: 29
        type: freeform
        prompt: Explain why ten draws from a finite bag without replacement do not generally produce a binomial count.
        answerLines: 5
        answer: The available category counts change after draws, so later success probabilities depend on the earlier history. A uniform without-replacement count is hypergeometric, introduced next.
      - id: 30
        type: freeform
        prompt: 'True or false: a binomial count can equal $n+1$.'
        answerLines: 5
        answer: False. With only $n$ binary trials, at most $n$ successes can occur.
  - title: Geometric waiting time counts through first success
    questions:
      - id: 31
        type: freeform
        prompt: $T\sim\operatorname{Geometric}(1/3)$ counts trials through success. Find $P(T=1)$.
        answerLines: 5
        answer: The first trial must succeed, so the probability is $1/3$.
      - id: 32
        type: freeform
        prompt: $T\sim\operatorname{Geometric}(1/3)$ counts trials through first success. Find $P(T=3)$.
        answerLines: 5
        answer: Two failures then success give $(2/3)^2(1/3)=4/27$.
      - id: 33
        type: freeform
        prompt: $T\sim\operatorname{Geometric}(1/3)$ counts trials through first success. Find $P(T>3)$.
        answerLines: 5
        answer: All first three trials fail, giving $(2/3)^3=8/27$.
      - id: 34
        type: freeform
        prompt: $T\sim\operatorname{Geometric}(1/3)$ counts trials through first success. Find $P(T\leq3)$.
        answerLines: 5
        answer: 'Take the complement: $1-8/27=19/27$.'
      - id: 35
        type: freeform
        prompt: $T\sim\operatorname{Geometric}(1/3)$ counts trials through first success. Find $P(T\geq3)$.
        answerLines: 5
        answer: The first two trials must fail, so the probability is $(2/3)^2=4/9$.
      - id: 36
        type: freeform
        prompt: $T\sim\operatorname{Geometric}(1/3)$ counts trials through first success. Let $F=T-1$. Find $P(F=2)$.
        answerLines: 5
        answer: Two failures before success means $T=3$, so the probability is $4/27$.
      - id: 37
        type: freeform
        prompt: $T\sim\operatorname{Geometric}(1/2)$. Find $P(2\leq T\leq4)$.
        answerLines: 5
        answer: 'Sum masses at two, three, four: $1/4+1/8+1/16=7/16$.'
      - id: 38
        type: freeform
        prompt: For $p=1$, find the trials-through-success waiting time.
        answerLines: 5
        answer: The first attempt always succeeds, so $T=1$.
      - id: 39
        type: freeform
        prompt: Explain why the geometric PMF has no combination coefficient.
        answerLines: 5
        answer: 'A stopping time of $k$ fixes every trial outcome through that point: failures in the first $k-1$ positions and success in the last. There are no alternative success-position patterns to count.'
      - id: 40
        type: freeform
        prompt: 'True or false: if $T$ counts trials through success, its minimum possible value is zero.'
        answerLines: 5
        answer: False. At least one trial is required; zero is possible only for the failures-before-success convention.
  - title: Geometric moments and memorylessness
    questions:
      - id: 41
        type: freeform
        prompt: $T\sim\operatorname{Geometric}(1/5)$. Find its mean.
        answerLines: 5
        answer: The mean is $1/p=5$.
      - id: 42
        type: freeform
        prompt: $T\sim\operatorname{Geometric}(1/5)$ counts trials through first success. Find its variance.
        answerLines: 5
        answer: The variance is $(4/5)/(1/25)=20$.
      - id: 43
        type: freeform
        prompt: $T\sim\operatorname{Geometric}(1/5)$ counts trials through first success. Find the mean number of failures before success.
        answerLines: 5
        answer: Failures equal $T-1$, so their mean is $5-1=4$.
      - id: 44
        type: freeform
        prompt: $T\sim\operatorname{Geometric}(1/5)$ counts trials through first success. Find the variance of failures before success.
        answerLines: 5
        answer: Subtracting one leaves variance unchanged, giving $20$.
      - id: 45
        type: freeform
        prompt: $T\sim\operatorname{Geometric}(1/2)$. Find $P(T>7\mid T>4)$.
        answerLines: 5
        answer: 'Memorylessness leaves three more failures: $(1/2)^3=1/8$.'
      - id: 46
        type: freeform
        prompt: Independent attempts each succeed with probability $0.3$. After six failures, find the conditional probability the next attempt succeeds.
        answerLines: 5
        answer: The independent constant-rate model leaves the probability at $0.3=3/10$.
      - id: 47
        type: freeform
        prompt: A trials-through-success geometric variable has mean $8$. Find its parameter.
        answerLines: 5
        answer: Since $1/p=8$, the success probability is $1/8$.
      - id: 48
        type: freeform
        prompt: A trials-through-success geometric variable has mean eight. Find its variance.
        answerLines: 5
        answer: The variance is $(7/8)/(1/64)=56$.
      - id: 49
        type: freeform
        prompt: Prove the geometric memoryless tail identity.
        answerLines: 5
        answer: For $q=1-p\in(0,1)$, the smaller tail contains the larger. Conditional probability gives $P(T>m+n\mid T>m)=q^{m+n}/q^m=q^n=P(T>n)$.
      - id: 50
        type: freeform
        prompt: Explain why a practice task with steadily improving success probability may not have a geometric waiting time.
        answerLines: 5
        answer: The success probability changes with trial number or history, so the constant-rate pattern probabilities and memoryless property no longer apply.
