      - id: 31
        type: freeform
        prompt: Why does a map from two inputs to three outputs have a 3-by-2 Jacobian?
        answerLines: 5
        answer: Each of the three output functions contributes a row of derivatives with respect to the two inputs.
  - title: Composition becomes matrix multiplication
    questions:
      - id: 32
        type: freeform
        prompt: Let $G(s,t)=(s+t,s-t)$ and $F(u,v)=(u^2,uv)$. At $(1,2)$, give the first row of the composition Jacobian.
        answerLines: 5
        answer: |-
          The answer is $\left(6,\ 6\right)$.

          The first output is $(s+t)^2$, so both entries are $2(s+t)=6$.
      - id: 33
        type: freeform
        prompt: For the explicit maps $G(s,t)=(s+t,s-t)$ and $F(u,v)=(u^2,uv)$, give the second composition-Jacobian row at $(1,2)$.
        answerLines: 5
        answer: |-
          The answer is $\left(2,\ -4\right)$.

          The second output is $s^2-t^2$, giving (2,-4).
