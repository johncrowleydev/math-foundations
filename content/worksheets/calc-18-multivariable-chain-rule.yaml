        prompt: For the map $G(s,t)=(s+t,s-t,0s+2t)$, give the final row of its Jacobian.
        answerLines: 5
        answer: |-
          The answer is $\left(0,\ 2\right)$.

          Differentiate the last output in input order (s,t): (0,2).
      - id: 29
        type: freeform
        prompt: For $F(x,y)=(x^2+y,xy)$, give its Jacobian entries at $(3,1)$ in row-major order as a four-tuple.
        answerLines: 5
        answer: |-
          The answer is $\left(6,\ 1,\ 1,\ 3\right)$.

          The rows are (2x,1) and (y,x), so the tuple is (6,1,1,3).
      - id: 30
        type: freeform
        prompt: For the map $G(s,t)=(s+t,s-t,3s+1t)$, give the final row of its Jacobian.
        answerLines: 5
        answer: |-
