  - title: The Jacobian is the derivative matrix
    questions:
      - id: 21
        type: freeform
        prompt: For $F(x,y)=(x^2+y,xy)$, give its Jacobian entries at $(1,2)$ in row-major order as a four-tuple.
        answerLines: 5
        answer: |-
          The answer is $\left(2,\ 1,\ 2,\ 1\right)$.

          The rows are (2x,1) and (y,x), so the tuple is (2,1,2,1).
      - id: 22
        type: freeform
        prompt: For the map $G(s,t)=(s+t,s-t,1s+2t)$, give the final row of its Jacobian.
        answerLines: 5
        answer: |-
          The answer is $\left(1,\ 2\right)$.

          Differentiate the last output in input order (s,t): (1,2).
      - id: 23
        type: freeform
        prompt: For $F(x,y)=(x^2+y,xy)$, give its Jacobian entries at $(-1,3)$ in row-major order as a four-tuple.
        answerLines: 5
        answer: |-
          The answer is $\left(-2,\ 1,\ 3,\ -1\right)$.

          The rows are (2x,1) and (y,x), so the tuple is (-2,1,3,-1).
      - id: 24
        type: freeform
        prompt: For the map $G(s,t)=(s+t,s-t,-1s+3t)$, give the final row of its Jacobian.
        answerLines: 5
        answer: |-
