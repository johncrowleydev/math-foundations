title: Multivariable Chain Rule and Jacobians
sections:
  - title: A moving input changes several coordinates
    questions:
      - id: 1
        type: freeform
        prompt: For $z=xy$, $x=t+1$ and $y=t^2+2$, find dz/dt.
        answerLines: 5
        answer: |-
          The answer is $t^{2}+2+2\cdot t\cdot \left(t+1\right)$.

          The two contributions give $(t^2+2)+2t(t+1)$.
      - id: 2
        type: freeform
        prompt: At a point where $f$ is differentiable, $f_x=1$ and $f_y=2$. Along a differentiable path through this point, x'=2 and y'=-3. Find the output rate.
        answerLines: 5
        answer: |-
          The answer is $-4$.

          The rate is $2(1)-3(2)=-4$.
      - id: 3
        type: freeform
        prompt: For $z=xy$, $x=t+-1$ and $y=t^2+3$, find dz/dt.
        answerLines: 5
        answer: |-
          The answer is $t^{2}+3+2\cdot t\cdot \left(t+-1\right)$.

          The two contributions give $(t^2+3)+2t(t+-1)$.
      - id: 4
        type: freeform
        prompt: At a point where $f$ is differentiable, $f_x=-1$ and $f_y=3$. Along a differentiable path through this point, x'=2 and y'=-3. Find the output rate.
        answerLines: 5
        answer: |-
          The answer is $-11$.

          The rate is $2(-1)-3(3)=-11$.
      - id: 5
        type: freeform
        prompt: For $z=xy$, $x=t+2$ and $y=t^2+-1$, find dz/dt.
        answerLines: 5
        answer: |-
          The answer is $t^{2}+-1+2\cdot t\cdot \left(t+2\right)$.

          The two contributions give $(t^2+-1)+2t(t+2)$.
      - id: 6
        type: freeform
        prompt: At a point where $f$ is differentiable, $f_x=2$ and $f_y=-1$. Along a differentiable path through this point, x'=2 and y'=-3. Find the output rate.
        answerLines: 5
        answer: |-
          The answer is $7$.

          The rate is $2(2)-3(-1)=7$.
      - id: 7
        type: freeform
        prompt: For $z=xy$, $x=t+0$ and $y=t^2+2$, find dz/dt.
        answerLines: 5
        answer: |-
          The answer is $t^{2}+2+2\cdot t\cdot \left(t+0\right)$.

          The two contributions give $(t^2+2)+2t(t+0)$.
      - id: 8
        type: freeform
        prompt: At a point where $f$ is differentiable, $f_x=0$ and $f_y=2$. Along a differentiable path through this point, x'=2 and y'=-3. Find the output rate.
        answerLines: 5
        answer: |-
          The answer is $-6$.

          The rate is $2(0)-3(2)=-6$.
      - id: 9
        type: freeform
        prompt: For $z=xy$, $x=t+3$ and $y=t^2+1$, find dz/dt.
        answerLines: 5
        answer: |-
          The answer is $t^{2}+1+2\cdot t\cdot \left(t+3\right)$.

          The two contributions give $(t^2+1)+2t(t+3)$.
      - id: 10
        type: freeform
        prompt: At a point where $f$ is differentiable, $f_x=3$ and $f_y=1$. Along a differentiable path through this point, x'=2 and y'=-3. Find the output rate.
        answerLines: 5
        answer: |-
          The answer is $3$.

          The rate is $2(3)-3(1)=3$.
  - title: Dependency paths organize the sum
    questions:
      - id: 11
        type: freeform
        prompt: For $u=s+t$, $v=s-t$, and $z=1u^2+2v$, find z_s in terms of s and t.
        answerLines: 5
        answer: |-
          The answer is $2\cdot \left(s+t\right)+2$.

          Both inner s derivatives are one, giving $2(s+t)+2$.
      - id: 12
        type: freeform
        prompt: For the explicit definitions $u=s+t$, $v=s-t$, $z=1u^2+2v$, find z_t.
        answerLines: 5
        answer: |-
          The answer is $2\cdot \left(s+t\right)-2$.

          The v branch has derivative -1, so $z_t=2(s+t)-(2)$.
      - id: 13
        type: freeform
        prompt: For $u=s+t$, $v=s-t$, and $z=-1u^2+3v$, find z_s in terms of s and t.
