title: Differentiation Rules and Trigonometric Functions
sections:
  - title: Linearity and the power rule
    questions:
      - id: 1
        type: freeform
        prompt: Differentiate $x^7$.
        answerLines: 5
        answer: The answer is $7\cdot x^{6}$. The power rule gives $7x^6$.
      - id: 2
        type: freeform
        prompt: Differentiate $5x^4-2x+9$.
        answerLines: 5
        answer: "The answer is $20\\cdot x^{3}-2$. Differentiate each term: $20x^3-2+0$."
      - id: 3
        type: freeform
        prompt: Differentiate $(x+2)(x-2)$ by expanding first.
        answerLines: 5
        answer: The answer is $2\cdot x$. The original product is $x^2-4$, whose derivative is $2x$.
      - id: 4
        type: freeform
        prompt: For $p(x)=x^4-3x^2$, find $p'(2)$.
        answerLines: 5
        answer: The answer is $20$. $p'=4x^3-6x$, giving $32-12=20$.
      - id: 5
        type: freeform
        prompt: Find the second derivative of $x^5-2x^3+4$.
        answerLines: 5
        answer: The answer is $20\cdot x^{3}-12\cdot x$. The first derivative is $5x^4-6x^2$; differentiating again gives $20x^3-12x$.
      - id: 6
        type: freeform
        prompt: Find the third derivative of $2x^3-5x^2+8$.
        answerLines: 5
        answer: The answer is $12$. The successive derivatives are $6x^2-10x$, $12x-10$, and $12$.
      - id: 7
        type: freeform
        prompt: Differentiate $ax^2+bx+c$ with respect to $x$, where $a,b,c$ are constants.
        answerLines: 5
        answer: The answer is $2\cdot a\cdot x+b$. Constants factor out, giving $2ax+b$.
      - id: 8
        type: freeform
        prompt: If $f'(2)=3$ and $g'(2)=-4$, find $(5f-2g)'(2)$.
        answerLines: 5
        answer: The answer is $23$. Linearity gives $5(3)-2(-4)=23$.
      - id: 9
        type: freeform
        prompt: Prove the constant-multiple rule using the difference quotient.
        answerLines: 5
        answer: For fixed $c$, $[cf(x+h)-cf(x)]/h=c[f(x+h)-f(x)]/h$. Taking the limit gives $(cf)'=cf'$.
      - id: 10
        type: freeform
        prompt: Explain why differentiating $x^2+x$ as $2x+1$ does not imply a rule $(fg)'=f'g'$.
        answerLines: 5
        answer: "The numerator for a sum splits into a sum of increments. A product's increment contains contributions from changes in either factor. The claimed product rule already fails for $f=g=x$: the product derivative is $2x$, while $f'g'=1$."
  - title: Negative and fractional powers
    questions:
      - id: 11
        type: freeform
        prompt: Differentiate $x^{-3}$ on $x\ne0$.
        answerLines: 5
        answer: The answer is $\frac{-3}{x^{4}}$. Multiply by $-3$ and lower the exponent to $-4$.
      - id: 12
        type: freeform
        prompt: Differentiate $2/x-5/x^2$ on $x\ne0$.
        answerLines: 5
        answer: The answer is $\frac{-2}{x^{2}}+\frac{10}{x^{3}}$. Rewrite as $2x^{-1}-5x^{-2}$ and apply the power rule.
      - id: 13
        type: freeform
        prompt: Differentiate $\sqrt{x}$ on $x>0$.
        answerLines: 5
        answer: The answer is $\frac{1}{2\cdot \sqrt{x}}$. The power rule with exponent $1/2$ gives $1/(2\sqrt{x})$.
      - id: 14
        type: freeform
        prompt: Differentiate $x^{3/2}$ on $x>0$.
        answerLines: 5
        answer: The answer is $\frac{3\cdot \sqrt{x}}{2}$. The exponent becomes $1/2$, giving $(3/2)\sqrt{x}$.
      - id: 15
        type: freeform
        prompt: Differentiate $1/\sqrt{x}$ on $x>0$.
        answerLines: 5
        answer: The answer is $\frac{-1}{2\cdot x^{\frac{3}{2}}}$. Write $x^{-1/2}$; the derivative is $-(1/2)x^{-3/2}$.
      - id: 16
        type: freeform
        prompt: For $f(x)=4/x^2$, find $f'(2)$.
        answerLines: 5
        answer: The answer is $-1$. $f'=-8/x^3$, so $f'(2)=-8/8=-1$.
      - id: 17
        type: freeform
        prompt: For $f(x)=x^{3/2}$ on positive inputs, find $f'(4)$.
        answerLines: 5
        answer: The answer is $3$. $f'=(3/2)\sqrt{x}$, giving $(3/2)(2)=3$.
      - id: 18
        type: freeform
        prompt: Using the real cube root, find the derivative of $x^{4/3}$ at zero from its difference quotient.
        answerLines: 5
        answer: The answer is $0$. The quotient is $h^{1/3}$, which tends to $0$.
      - id: 19
        type: freeform
        prompt: Explain why the derivative formula for $\sqrt{x}$ on $x>0$ does not give a finite derivative at zero.
        answerLines: 5
        answer: The formula is undefined at zero, and the right-hand quotient there is $\sqrt{h}/h=1/\sqrt{h}\to\infty$. Thus even the one-sided finite derivative fails.
      - id: 20
        type: freeform
        prompt: Derive the rule for $(1/x)'$ independently from the difference quotient.
        answerLines: 5
        answer: For $x\ne0$ and sufficiently small nonzero $h$, $[1/(x+h)-1/x]/h=-1/[x(x+h)]\to-1/x^2$.
  - title: Products have two contributions
    questions:
      - id: 21
        type: freeform
        prompt: Differentiate $(x^2+3)(x-1)$.
        answerLines: 5
        answer: The answer is $3\cdot x^{2}-2\cdot x+3$. The product rule gives $2x(x-1)+(x^2+3)=3x^2-2x+3$.
      - id: 22
        type: freeform
        prompt: Differentiate $(x^3+1)(x^2-2)$.
        answerLines: 5
        answer: The answer is $3\cdot x^{2}\cdot \left(x^{2}-2\right)+2\cdot x\cdot \left(x^{3}+1\right)$. Differentiate each factor in turn, retaining the other factor.
      - id: 23
        type: freeform
        prompt: Differentiate $x^2(1+1/x)$ on $x\ne0$.
        answerLines: 5
        answer: The answer is $2\cdot x+1$. Expanding first gives $x^2+x$ on the original domain; its derivative is $2x+1$.
      - id: 24
        type: freeform
        prompt: If $f(2)=3,f'(2)=4,g(2)=-1,g'(2)=5$, find $(fg)'(2)$.
        answerLines: 5
        answer: The answer is $11$. $f'g+fg'=4(-1)+3(5)=-4+15=11$.
      - id: 25
        type: freeform
        prompt: If $u(0)=0,u'(0)=2,v(0)=7,v'(0)=3$, find $(uv)'(0)$.
        answerLines: 5
        answer: The answer is $14$. $2(7)+0(3)=14$. A zero product value need not have zero derivative.
      - id: 26
        type: freeform
        prompt: Differentiate $x(x+1)(x-2)$.
        answerLines: 5
        answer: The answer is $3\cdot x^{2}-2\cdot x-2$. Expanding yields $x^3-x^2-2x$; its derivative is $3x^2-2x-2$.
      - id: 27
        type: freeform
        prompt: A price model is $p(q)=20-q$. Differentiate revenue $R(q)=q(20-q)$.
        answerLines: 5
        answer: The answer is $20-2\cdot q$. The product rule gives $(20-q)+q(-1)=20-2q$.
      - id: 28
        type: freeform
        prompt: For $R(q)=q(20-q)$, find marginal revenue at $q=6$.
        answerLines: 5
        answer: The answer is $8$. $R'(q)=20-2q$, so $R'(6)=8$.
      - id: 29
        type: freeform
        prompt: Derive the three-factor product rule from the two-factor rule.
        answerLines: 5
        answer: "Treat $fg$ as one factor: $[(fg)h]'=(fg)'h+(fg)h'=(f'g+fg')h+fgh'=f'gh+fg'h+fgh'$."
      - id: 30
        type: freeform
        prompt: Explain why knowing only $f'(a)$ and $g'(a)$ is usually insufficient to calculate $(fg)'(a)$.
        answerLines: 5
        answer: The product rule also requires $f(a)$ and $g(a)$. Functions differing by constants can have the same derivatives but different product derivatives because their values multiply the other rate.
  - title: Quotients and algebraic checks
    questions:
      - id: 31
        type: freeform
        prompt: Differentiate $(x+2)/(x-1)$ for $x\ne1$.
        answerLines: 5
        answer: The answer is $\frac{-3}{\left(x-1\right)^{2}}$. The numerator is $(x-1)-(x+2)=-3$.
      - id: 32
        type: freeform
        prompt: Differentiate $x^2/(x+1)$ for $x\ne-1$.
        answerLines: 5
        answer: The answer is $\frac{x^{2}+2\cdot x}{\left(x+1\right)^{2}}$. The quotient numerator is $2x(x+1)-x^2=x^2+2x$.
      - id: 33
        type: freeform
        prompt: Differentiate $(x^2-3)/x$ for $x\ne0$.
        answerLines: 5
        answer: The answer is $1+\frac{3}{x^{2}}$. Rewrite as $x-3/x$, giving $1+3/x^2$.
      - id: 34
        type: freeform
        prompt: Differentiate $1/(x^2+1)$.
        answerLines: 5
        answer: The answer is $\frac{-2\cdot x}{\left(x^{2}+1\right)^{2}}$. The numerator is $0(x^2+1)-1(2x)$; the denominator is always positive.
      - id: 35
        type: freeform
        prompt: If $f(1)=2,f'(1)=3,g(1)=4,g'(1)=5$, find $(f/g)'(1)$.
        answerLines: 5
        answer: The answer is $\frac{1}{8}$. $[3(4)-2(5)]/4^2=2/16=1/8$.
      - id: 36
        type: freeform
        prompt: For $q(x)=(x^2+1)/(x+2)$, find $q'(0)$.
        answerLines: 5
        answer: The answer is $\frac{-1}{4}$. The numerator at zero is $0(2)-1(1)=-1$ and the squared denominator is $4$.
      - id: 37
        type: freeform
        prompt: Differentiate $(x^3-x)/(x-1)$ on its original domain $x\ne1$.
        answerLines: 5
        answer: The answer is $2\cdot x+1$. Cancel to obtain $x(x+1)=x^2+x$ for $x\ne1$, then differentiate.
      - id: 38
        type: freeform
        prompt: Does canceling $x-1$ from $(x^2-1)/(x-1)$ make the original function differentiable at $1$?
        answerLines: 5
        answer: The answer is false. The original domain still excludes $1$. An explicit extension is needed before discussing its derivative there.
      - id: 39
        type: freeform
        prompt: Derive the quotient rule by differentiating $f=qg$ and solving for $q'$.
        answerLines: 5
        answer: The product rule gives $f'=q'g+qg'$. Since $g\ne0$, $q'=(f'-qg')/g=f'/g-fg'/g^2=(f'g-fg')/g^2$.
      - id: 40
        type: freeform
        prompt: Check the derivative of $(x^2+4)/x$ by two algebraically different methods.
        answerLines: 5
        answer: Rewriting gives $x+4/x$, whose derivative is $1-4/x^2$. The quotient rule gives $[2x^2-(x^2+4)]/x^2=(x^2-4)/x^2$, equal on $x\ne0$.
  - title: Trigonometric derivatives and radians
    questions:
      - id: 41
        type: freeform
        prompt: Differentiate $3\sin x-2\cos x$, with $x$ in radians.
        answerLines: 5
        answer: The answer is $3\cdot \cos\left(x\right)+2\cdot \sin\left(x\right)$. Linearity gives $3\cos x+2\sin x$.
      - id: 42
        type: freeform
        prompt: Differentiate $x\cos x$, with $x$ in radians.
        answerLines: 5
        answer: The answer is $\cos\left(x\right)-x\cdot \sin\left(x\right)$. The product rule gives $\cos x+x(-\sin x)$.
      - id: 43
        type: freeform
        prompt: Differentiate $\tan x$ where $\cos x\ne0$, using radians.
        answerLines: 5
        answer: The answer is $\sec\left(x\right)^{2}$. The quotient rule applied to $\sin x/\cos x$ gives $1/\cos^2x=\sec^2x$.
      - id: 44
        type: freeform
        prompt: Differentiate $\cot x$ where $\sin x\ne0$, using radians.
        answerLines: 5
        answer: The answer is $-\csc\left(x\right)^{2}$. The quotient numerator is $-\sin^2x-\cos^2x=-1$.
      - id: 45
        type: freeform
        prompt: Differentiate $\sec x$ where $\cos x\ne0$, using radians.
        answerLines: 5
        answer: The answer is $\sec\left(x\right)\cdot \tan\left(x\right)$. Differentiating $1/\cos x$ gives $\sin x/\cos^2x=\sec x\tan x$.
      - id: 46
        type: freeform
        prompt: Differentiate $\csc x$ where $\sin x\ne0$, using radians.
        answerLines: 5
        answer: The answer is $-\csc\left(x\right)\cdot \cot\left(x\right)$. Differentiating $1/\sin x$ gives $-\cos x/\sin^2x$.
      - id: 47
        type: freeform
        prompt: For $f(x)=\sin x$, find $f'(\pi)$ using radians.
        answerLines: 5
        answer: The answer is $-1$. $f'(\pi)=\cos\pi=-1$.
      - id: 48
        type: freeform
        prompt: Find the second derivative of $2\cos x+\sin x$, with radian input.
        answerLines: 5
        answer: The answer is $-2\cdot \cos\left(x\right)-\sin\left(x\right)$. The first derivative is $-2\sin x+\cos x$; the next is $-2\cos x-\sin x$.
      - id: 49
        type: freeform
        prompt: Derive $(\tan x)'$ from the quotient rule and state its domain restriction.
        answerLines: 5
        answer: With $\cos x\ne0$, $(\tan x)'=(\cos^2x+\sin^2x)/\cos^2x=\sec^2x$. The original and derivative expressions both require a nonzero cosine.
      - id: 50
        type: freeform
        prompt: Why would an unmodified derivative formula for a radian sine function be wrong for an input explicitly measured in degrees?
        answerLines: 5
        answer: One degree represents $\pi/180$ radians, so the independent variable changes the input scale. A unit degree increment is not a unit radian increment. The derivative with respect to degree input must account for that conversion; the next lesson's chain rule supplies the factor.
