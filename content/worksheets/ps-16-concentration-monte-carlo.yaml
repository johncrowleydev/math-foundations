title: Concentration and Monte Carlo Estimation
sections:
  - title: A mean can bound a nonnegative tail
    questions:
      - id: 1
        type: freeform
        prompt: A nonnegative work count has mean 3. Give the Markov probability bound for at least 12 units, capped at one.
        answerLines: 5
        answer: Markov gives $3/12$. Combining this with $P\le1$ gives the bound $1/4$.
      - id: 2
        type: freeform
        prompt: A nonnegative variable has mean 3. What threshold makes the Markov bound equal to $1/4$?
        answerLines: 5
        answer: 'Solve $3/a=1/4$: $a=12$.'
      - id: 3
        type: freeform
        prompt: A nonnegative work count has mean 8. Give the Markov probability bound for at least 40 units, capped at one.
        answerLines: 5
        answer: Markov gives $8/40$. Combining this with $P\le1$ gives the bound $1/5$.
      - id: 4
        type: freeform
        prompt: A nonnegative variable has mean 8. What threshold makes the Markov bound equal to $1/4$?
        answerLines: 5
        answer: 'Solve $8/a=1/4$: $a=32$.'
      - id: 5
        type: freeform
        prompt: A nonnegative work count has mean 5. Give the Markov probability bound for at least 20 units, capped at one.
        answerLines: 5
        answer: Markov gives $5/20$. Combining this with $P\le1$ gives the bound $1/4$.
      - id: 6
        type: freeform
        prompt: A nonnegative variable has mean 5. What threshold makes the Markov bound equal to $1/4$?
        answerLines: 5
        answer: 'Solve $5/a=1/4$: $a=20$.'
      - id: 7
        type: freeform
        prompt: A nonnegative work count has mean 7. Give the Markov probability bound for at least 21 units, capped at one.
        answerLines: 5
        answer: Markov gives $7/21$. Combining this with $P\le1$ gives the bound $1/3$.
      - id: 8
        type: freeform
        prompt: A nonnegative variable has mean 7. What threshold makes the Markov bound equal to $1/4$?
        answerLines: 5
        answer: 'Solve $7/a=1/4$: $a=28$.'
      - id: 9
        type: freeform
        prompt: A nonnegative work count has mean 10. Give the Markov probability bound for at least 8 units, capped at one.
        answerLines: 5
        answer: Markov gives $10/8$. Combining this with $P\le1$ gives the bound $1$.
      - id: 10
        type: freeform
        prompt: A nonnegative variable has mean 10. What threshold makes the Markov bound equal to $1/4$?
        answerLines: 5
        answer: 'Solve $10/a=1/4$: $a=40$.'
      - id: 11
        type: freeform
        prompt: Construct a nonnegative variable of mean 2 attaining the Markov bound at threshold 10.
        answerLines: 5
        answer: Let X be 10 with probability 1/5 and zero with probability 4/5. Its mean is 2 and its tail probability at 10 is 1/5.
      - id: 12
        type: freeform
        prompt: Explain why a signed variable with mean zero need not have zero probability of exceeding 1.
        answerLines: 5
        answer: Positive and negative contributions can cancel in the mean. Equal probabilities at 2 and −2 give mean zero and upper-tail probability one half.
  - title: Centering and squaring gives Chebyshev
    questions:
      - id: 13
        type: freeform
        prompt: A variable has variance 4. Give Chebyshev's bound for $P(|X-E[X]|\ge4)$.
        answerLines: 5
        answer: 'The bound is variance divided by squared distance: $4/16=1/4$.'
      - id: 14
        type: freeform
        prompt: For variance 4, what lower bound follows by taking the complement of the Chebyshev bound for $P(|X-E[X]|<4)$?
        answerLines: 5
        answer: 'Take the complement of the at-least event: $1-1/4=3/4$.'
      - id: 15
        type: freeform
        prompt: A variable has variance 9. Give Chebyshev's bound for $P(|X-E[X]|\ge6)$.
        answerLines: 5
        answer: 'The bound is variance divided by squared distance: $9/36=1/4$.'
      - id: 16
        type: freeform
        prompt: For variance 9, what lower bound follows by taking the complement of the Chebyshev bound for $P(|X-E[X]|<6)$?
        answerLines: 5
        answer: 'Take the complement of the at-least event: $1-1/4=3/4$.'
      - id: 17
        type: freeform
        prompt: A variable has variance 16. Give Chebyshev's bound for $P(|X-E[X]|\ge8)$.
        answerLines: 5
        answer: 'The bound is variance divided by squared distance: $16/64=1/4$.'
      - id: 18
        type: freeform
        prompt: For variance 16, what lower bound follows by taking the complement of the Chebyshev bound for $P(|X-E[X]|<8)$?
        answerLines: 5
        answer: 'Take the complement of the at-least event: $1-1/4=3/4$.'
      - id: 19
        type: freeform
        prompt: A variable has variance 1. Give Chebyshev's bound for $P(|X-E[X]|\ge5)$.
        answerLines: 5
        answer: 'The bound is variance divided by squared distance: $1/25=1/25$.'
      - id: 20
        type: freeform
        prompt: For variance 1, what lower bound follows by taking the complement of the Chebyshev bound for $P(|X-E[X]|<5)$?
        answerLines: 5
        answer: 'Take the complement of the at-least event: $1-1/25=24/25$.'
      - id: 21
        type: freeform
        prompt: A variable has variance 25. Give Chebyshev's bound for $P(|X-E[X]|\ge15)$.
        answerLines: 5
        answer: 'The bound is variance divided by squared distance: $25/225=1/9$.'
      - id: 22
        type: freeform
        prompt: For variance 25, what lower bound follows by taking the complement of the Chebyshev bound for $P(|X-E[X]|<15)$?
        answerLines: 5
        answer: 'Take the complement of the at-least event: $1-1/9=8/9$.'
      - id: 23
        type: freeform
        prompt: Does Chebyshev require a normal distribution? Explain.
        answerLines: 5
        answer: No. Apply Markov to the nonnegative squared centered deviation. Only the stated finite variance is used.
      - id: 24
        type: freeform
        prompt: Why does changing distance units not change the Chebyshev bound?
        answerLines: 5
        answer: Both variance and squared threshold multiply by the square of the conversion factor, so their ratio is unchanged.
  - title: Guarantees for averages and sample sizes
    questions:
      - id: 25
        type: freeform
        prompt: Independent identically distributed observations have variance 1. Using Chebyshev, give the smallest integer sample size certified by this bound for error at least 0.5 to have probability at most 0.1.
        answerLines: 5
        answer: Require $n\ge 1/(0.1\cdot0.5^2)$ and round upward, giving $n=40$.
      - id: 26
        type: freeform
        prompt: For 40 iid observations of variance 1, give the variance of their average as an exact value.
        answerLines: 5
        answer: Independence gives variance $\sigma^2/n=1/40=1/40$.
      - id: 27
        type: freeform
        prompt: Independent identically distributed observations have variance 4. Using Chebyshev, give the smallest integer sample size certified by this bound for error at least 0.5 to have probability at most 0.05.
        answerLines: 5
        answer: Require $n\ge 4/(0.05\cdot0.5^2)$ and round upward, giving $n=320$.
      - id: 28
        type: freeform
        prompt: For 320 iid observations of variance 4, give the variance of their average as an exact value.
        answerLines: 5
        answer: Independence gives variance $\sigma^2/n=4/320=1/80$.
      - id: 29
        type: freeform
        prompt: Independent identically distributed observations have variance 9. Using Chebyshev, give the smallest integer sample size certified by this bound for error at least 1 to have probability at most 0.1.
        answerLines: 5
        answer: Require $n\ge 9/(0.1\cdot1^2)$ and round upward, giving $n=90$.
      - id: 30
        type: freeform
        prompt: For 90 iid observations of variance 9, give the variance of their average as an exact value.
        answerLines: 5
        answer: Independence gives variance $\sigma^2/n=9/90=1/10$.
      - id: 31
        type: freeform
        prompt: Independent identically distributed observations have variance 2. Using Chebyshev, give the smallest integer sample size certified by this bound for error at least 0.2 to have probability at most 0.05.
        answerLines: 5
        answer: Require $n\ge 2/(0.05\cdot0.2^2)$ and round upward, giving $n=1000$.
      - id: 32
        type: freeform
        prompt: For 1000 iid observations of variance 2, give the variance of their average as an exact value.
        answerLines: 5
        answer: Independence gives variance $\sigma^2/n=2/1000=1/500$.
      - id: 33
        type: freeform
        prompt: Independent identically distributed observations have variance 1. Using Chebyshev, give the smallest integer sample size certified by this bound for error at least 0.1 to have probability at most 0.01.
        answerLines: 5
        answer: Require $n\ge 1/(0.01\cdot0.1^2)$ and round upward, giving $n=10000$.
      - id: 34
        type: freeform
        prompt: For 10000 iid observations of variance 1, give the variance of their average as an exact value.
        answerLines: 5
        answer: Independence gives variance $\sigma^2/n=1/10000=1/10000$.
      - id: 35
        type: freeform
        prompt: Explain the failure of the usual average-variance formula when every observation is the same random draw.
        answerLines: 5
        answer: The average equals that single draw, so its variance is unchanged. The covariance terms do not vanish.
      - id: 36
        type: freeform
        prompt: Is a Chebyshev sufficient sample size necessarily the smallest possible sample size?
        answerLines: 5
        answer: No. Chebyshev may be loose; additional distribution information can justify a smaller size.
  - title: Monte Carlo turns an expectation into an estimate
    questions:
      - id: 37
        type: freeform
        prompt: In 20 independent simulated trials, an event occurs 7 times. Give the Monte Carlo probability estimate.
        answerLines: 5
        answer: The indicator average is $7/20=7/20$.
      - id: 38
        type: freeform
        prompt: For uniform draws on an interval of length 2, the supplied values of $g$ average 7/20. Give the Monte Carlo integral estimate.
        answerLines: 5
        answer: "Multiply the average by interval length: $2\\cdot7/20=7/10$."
      - id: 39
        type: freeform
        prompt: In 40 independent simulated trials, an event occurs 18 times. Give the Monte Carlo probability estimate.
        answerLines: 5
        answer: The indicator average is $18/40=9/20$.
      - id: 40
        type: freeform
        prompt: For uniform draws on an interval of length 3, the supplied values of $g$ average 18/40. Give the Monte Carlo integral estimate.
        answerLines: 5
        answer: "Multiply the average by interval length: $3\\cdot18/40=27/20$."
      - id: 41
        type: freeform
        prompt: In 25 independent simulated trials, an event occurs 13 times. Give the Monte Carlo probability estimate.
        answerLines: 5
        answer: The indicator average is $13/25=13/25$.
      - id: 42
        type: freeform
        prompt: For uniform draws on an interval of length 4, the supplied values of $g$ average 13/25. Give the Monte Carlo integral estimate.
        answerLines: 5
        answer: "Multiply the average by interval length: $4\\cdot13/25=52/25$."
      - id: 43
        type: freeform
        prompt: In 16 independent simulated trials, an event occurs 9 times. Give the Monte Carlo probability estimate.
        answerLines: 5
        answer: The indicator average is $9/16=9/16$.
      - id: 44
        type: freeform
        prompt: For uniform draws on an interval of length 1, the supplied values of $g$ average 9/16. Give the Monte Carlo integral estimate.
        answerLines: 5
        answer: "Multiply the average by interval length: $1\\cdot9/16=9/16$."
      - id: 45
        type: freeform
        prompt: In 50 independent simulated trials, an event occurs 30 times. Give the Monte Carlo probability estimate.
        answerLines: 5
        answer: The indicator average is $30/50=3/5$.
      - id: 46
        type: freeform
        prompt: For uniform draws on an interval of length 5, the supplied values of $g$ average 30/50. Give the Monte Carlo integral estimate.
        answerLines: 5
        answer: "Multiply the average by interval length: $5\\cdot30/50=3$."
      - id: 47
        type: freeform
        prompt: Why does simulation from the wrong input distribution not solve the intended integral merely by using more draws?
        answerLines: 5
        answer: The average approaches an expectation under the simulated distribution. That can differ systematically from the required expectation.
      - id: 48
        type: freeform
        prompt: A simulation estimate exactly matches a known answer once. Does that establish zero Monte Carlo variance?
        answerLines: 5
        answer: No. A single realized estimate can agree by chance even though different random samples yield different estimates.
  - title: From individual failures to algorithm guarantees
    questions:
      - id: 49
        type: freeform
        prompt: 4 bad events each have probability at most $1/100$. Give the union bound for at least one bad event.
        answerLines: 5
        answer: 'Add the individual bounds: $4/100=1/25$. Independence is not needed.'
      - id: 50
        type: freeform
        prompt: A verifiable randomized procedure fails with probability $1/2$ on each of 4 independent runs. Give the probability that all runs fail.
        answerLines: 5
        answer: 'Multiply independent failure probabilities: $(1/2)^{4}=1/16$.'
      - id: 51
        type: freeform
        prompt: 7 bad events each have probability at most $1/200$. Give the union bound for at least one bad event.
        answerLines: 5
        answer: 'Add the individual bounds: $7/200=7/200$. Independence is not needed.'
      - id: 52
        type: freeform
        prompt: A verifiable randomized procedure fails with probability $1/2$ on each of 7 independent runs. Give the probability that all runs fail.
        answerLines: 5
        answer: 'Multiply independent failure probabilities: $(1/2)^{7}=1/128$.'
      - id: 53
        type: freeform
        prompt: 12 bad events each have probability at most $1/300$. Give the union bound for at least one bad event.
        answerLines: 5
        answer: 'Add the individual bounds: $12/300=1/25$. Independence is not needed.'
      - id: 54
        type: freeform
        prompt: A verifiable randomized procedure fails with probability $1/2$ on each of 12 independent runs. Give the probability that all runs fail.
        answerLines: 5
        answer: 'Multiply independent failure probabilities: $(1/2)^{12}=1/4096$.'
      - id: 55
        type: freeform
        prompt: 5 bad events each have probability at most $1/80$. Give the union bound for at least one bad event.
        answerLines: 5
        answer: 'Add the individual bounds: $5/80=1/16$. Independence is not needed.'
      - id: 56
        type: freeform
        prompt: A verifiable randomized procedure fails with probability $1/2$ on each of 5 independent runs. Give the probability that all runs fail.
        answerLines: 5
        answer: 'Multiply independent failure probabilities: $(1/2)^{5}=1/32$.'
      - id: 57
        type: freeform
        prompt: 9 bad events each have probability at most $1/90$. Give the union bound for at least one bad event.
        answerLines: 5
        answer: 'Add the individual bounds: $9/90=1/10$. Independence is not needed.'
      - id: 58
        type: freeform
        prompt: A verifiable randomized procedure fails with probability $1/2$ on each of 9 independent runs. Give the probability that all runs fail.
        answerLines: 5
        answer: 'Multiply independent failure probabilities: $(1/2)^{9}=1/512$.'
      - id: 59
        type: freeform
        prompt: Explain why majority voting is not justified just by an all-runs-fail probability.
        answerLines: 5
        answer: Majority voting can fail even when some runs succeed. Its bad event is different, so it needs a separate analysis.
      - id: 60
        type: freeform
        prompt: Give a dependence pattern where two failures each of probability 1/10 have joint probability 1/10 rather than 1/100.
        answerLines: 5
        answer: Let the two failure events be identical. Then their intersection is the same event with probability 1/10.
