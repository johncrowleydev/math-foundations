title: Linearization, Gradients, and Directional Derivatives
sections:
  - title: One approximation for every small displacement
    questions:
      - id: 1
        type: freeform
        prompt: For $f=x^2+xy$ at $(1,2)$, give the coefficient of the x displacement in its linearization.
        answerLines: 5
        answer: |-
          The answer is $4$.

          The x partial is 2x+y, giving 4.
      - id: 2
        type: freeform
        prompt: For $f=x^2+xy$ at $(1,2)$, give the coefficient of the y displacement.
        answerLines: 5
        answer: |-
          The answer is $1$.

          The y partial is x, giving 1.
      - id: 3
        type: freeform
        prompt: For $f=x^2+xy$ at $(-1,1)$, give the coefficient of the x displacement in its linearization.
        answerLines: 5
        answer: |-
          The answer is $-1$.

          The x partial is 2x+y, giving -1.
      - id: 4
        type: freeform
        prompt: For $f=x^2+xy$ at $(-1,1)$, give the coefficient of the y displacement.
        answerLines: 5
        answer: |-
          The answer is $-1$.

          The y partial is x, giving -1.
      - id: 5
        type: freeform
        prompt: For $f=x^2+xy$ at $(0,2)$, give the coefficient of the x displacement in its linearization.
        answerLines: 5
        answer: |-
          The answer is $2$.

          The x partial is 2x+y, giving 2.
      - id: 6
        type: freeform
        prompt: For $f=x^2+xy$ at $(0,2)$, give the coefficient of the y displacement.
        answerLines: 5
        answer: |-
          The answer is $0$.

          The y partial is x, giving 0.
