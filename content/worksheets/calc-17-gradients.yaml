  - title: Gradients and contour geometry
    questions:
      - id: 43
        type: freeform
        prompt: At $(1,2)$, find a vector perpendicular to the gradient of $x^2+y^2$ by giving $(-y,x)$ at that point.
        answerLines: 5
        answer: |-
          The answer is $\left(-2,\ 1\right)$.

          This vector is (-2,1); its dot product with (2x,2y) is zero.
      - id: 44
        type: freeform
        prompt: At $(1,2)$, write the tangent-line equation for the level curve of $x^2+y^2$ and justify it.
        answerLines: 5
        answer: The point is nonzero. The normal is (2,4), so the equation is $2(x-(1))+4(y-(2))=0$. Its direction is perpendicular to the gradient.
      - id: 45
        type: freeform
        prompt: At $(-1,1)$, find a vector perpendicular to the gradient of $x^2+y^2$ by giving $(-y,x)$ at that point.
        answerLines: 5
        answer: |-
          The answer is $\left(-1,\ -1\right)$.

          This vector is (-1,-1); its dot product with (2x,2y) is zero.
      - id: 46
        type: freeform
        prompt: At $(-1,1)$, write the tangent-line equation for the level curve of $x^2+y^2$ and justify it.
        answerLines: 5
        answer: The point is nonzero. The normal is (-2,2), so the equation is $-2(x-(-1))+2(y-(1))=0$. Its direction is perpendicular to the gradient.
      - id: 47
        type: freeform
        prompt: At $(0,2)$, find a vector perpendicular to the gradient of $x^2+y^2$ by giving $(-y,x)$ at that point.
        answerLines: 5
        answer: |-
          The answer is $\left(-2,\ 0\right)$.

          This vector is (-2,0); its dot product with (2x,2y) is zero.
      - id: 48
        type: freeform
        prompt: At $(0,2)$, write the tangent-line equation for the level curve of $x^2+y^2$ and justify it.
        answerLines: 5
        answer: The point is nonzero. The normal is (0,4), so the equation is $0(x-(0))+4(y-(2))=0$. Its direction is perpendicular to the gradient.
      - id: 49
        type: freeform
        prompt: At $(2,-1)$, find a vector perpendicular to the gradient of $x^2+y^2$ by giving $(-y,x)$ at that point.
        answerLines: 5
        answer: |-
          The answer is $\left(1,\ 2\right)$.

          This vector is (1,2); its dot product with (2x,2y) is zero.
      - id: 50
        type: freeform
        prompt: At $(2,-1)$, write the tangent-line equation for the level curve of $x^2+y^2$ and justify it.
        answerLines: 5
        answer: The point is nonzero. The normal is (4,-2), so the equation is $4(x-(2))+-2(y-(-1))=0$. Its direction is perpendicular to the gradient.
      - id: 51
        type: freeform
        prompt: At $(-2,-1)$, find a vector perpendicular to the gradient of $x^2+y^2$ by giving $(-y,x)$ at that point.
        answerLines: 5
        answer: |-
          The answer is $\left(1,\ -2\right)$.

          This vector is (1,-2); its dot product with (2x,2y) is zero.
      - id: 52
        type: freeform
        prompt: At $(-2,-1)$, write the tangent-line equation for the level curve of $x^2+y^2$ and justify it.
        answerLines: 5
        answer: The point is nonzero. The normal is (-4,-2), so the equation is $-4(x-(-2))+-2(y-(-1))=0$. Its direction is perpendicular to the gradient.
