  - title: Global extrema require the whole feasible set
    questions:
      - id: 41
        type: freeform
        prompt: Find the maximum value of $x^2+y^2$ on $0\leq x\leq2$, $0\leq y\leq3$.
        answerLines: 5
        answer: |-
          The answer is $13$.

          Both squares increase on the nonnegative intervals, so the corner (2,3) gives 13.
      - id: 42
        type: freeform
        prompt: Does $x^2+y^2$ attain its supremum on the open disk $x^2+y^2<2$?
        answerLines: 5
        answer: |-
          The answer is false.

          No: values approach 2 but the boundary is excluded.
      - id: 43
        type: freeform
        prompt: Find the maximum value of $x^2+y^2$ on $0\leq x\leq2$, $0\leq y\leq4$.
