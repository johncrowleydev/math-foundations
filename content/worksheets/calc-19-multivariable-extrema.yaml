  - title: When the test cannot decide
    questions:
      - id: 31
        type: freeform
        prompt: For $f=1x^4+2y^4$, classify the origin as minimum, maximum, or saddle.
        answerLines: 5
        answer: |-
          The answer is **minimum**.

          Both terms are nonnegative and vanish together only at the origin, so it is a minimum.
      - id: 32
        type: freeform
        prompt: For $f=1x^4-2y^4$, explain the classification of the origin without relying on its zero Hessian.
        answerLines: 5
        answer: Along y=0 the value is positive off the origin, while along x=0 it is negative. Therefore it is a saddle.
