title: Higher Derivatives and Multivariable Extrema
sections:
  - title: Differentiate the partial derivatives
    questions:
      - id: 1
        type: freeform
        prompt: For $f=1x^3y+2xy^2$, find f_xy (first x, then y).
        answerLines: 5
        answer: |-
          The answer is $3\cdot x^{2}+4\cdot y$.

          Differentiate $f_x=3x^2y+2y^2$ in y to get $3x^2+4y$.
      - id: 2
        type: freeform
        prompt: For $f=1x^3y+2xy^2$, find f_yy.
        answerLines: 5
        answer: |-
          The answer is $4\cdot x$.

          The y partial is $1x^3+4xy$; another y derivative is $4x$.
      - id: 3
        type: freeform
        prompt: For $f=-1x^3y+3xy^2$, find f_xy (first x, then y).
        answerLines: 5
        answer: |-
          The answer is $-3\cdot x^{2}+6\cdot y$.

          Differentiate $f_x=-3x^2y+3y^2$ in y to get $-3x^2+6y$.
      - id: 4
        type: freeform
        prompt: For $f=-1x^3y+3xy^2$, find f_yy.
        answerLines: 5
        answer: |-
          The answer is $6\cdot x$.

          The y partial is $-1x^3+6xy$; another y derivative is $6x$.
      - id: 5
        type: freeform
        prompt: For $f=2x^3y+-1xy^2$, find f_xy (first x, then y).
        answerLines: 5
        answer: |-
          The answer is $6\cdot x^{2}+-2\cdot y$.

          Differentiate $f_x=6x^2y+-1y^2$ in y to get $6x^2+-2y$.
      - id: 6
        type: freeform
        prompt: For $f=2x^3y+-1xy^2$, find f_yy.
        answerLines: 5
        answer: |-
          The answer is $-2\cdot x$.

          The y partial is $2x^3+-2xy$; another y derivative is $-2x$.
      - id: 7
        type: freeform
        prompt: For $f=3x^3y+2xy^2$, find f_xy (first x, then y).
        answerLines: 5
        answer: |-
          The answer is $9\cdot x^{2}+4\cdot y$.

          Differentiate $f_x=9x^2y+2y^2$ in y to get $9x^2+4y$.
      - id: 8
        type: freeform
        prompt: For $f=3x^3y+2xy^2$, find f_yy.
        answerLines: 5
        answer: |-
          The answer is $4\cdot x$.

          The y partial is $3x^3+4xy$; another y derivative is $4x$.
      - id: 9
        type: freeform
        prompt: For $f=-2x^3y+-3xy^2$, find f_xy (first x, then y).
        answerLines: 5
        answer: |-
          The answer is $-6\cdot x^{2}+-6\cdot y$.

          Differentiate $f_x=-6x^2y+-3y^2$ in y to get $-6x^2+-6y$.
      - id: 10
        type: freeform
        prompt: For $f=-2x^3y+-3xy^2$, find f_yy.
        answerLines: 5
        answer: |-
          The answer is $-6\cdot x$.

          The y partial is $-2x^3+-6xy$; another y derivative is $-6x$.
  - title: The Hessian and quadratic approximation
    questions:
      - id: 11
        type: freeform
        prompt: For $f=1x^2+2xy+2y^2$, give Hessian entries in row-major order.
        answerLines: 5
        answer: |-
          The answer is $\left(2,\ 2,\ 2,\ 4\right)$.

          The matrix rows are (2,2) and (2,4).
      - id: 12
        type: freeform
        prompt: For $f=1x^2+2xy+2y^2$, find the quadratic change at the origin for displacement (1/10,1/10).
        answerLines: 5
        answer: |-
          The answer is $\frac{5}{100}$.

          The exact quadratic value is $(1+2+2)/100$.
      - id: 13
        type: freeform
        prompt: For $f=-1x^2+2xy+3y^2$, give Hessian entries in row-major order.
        answerLines: 5
        answer: |-
          The answer is $\left(-2,\ 2,\ 2,\ 6\right)$.

          The matrix rows are (-2,2) and (2,6).
      - id: 14
        type: freeform
        prompt: For $f=-1x^2+2xy+3y^2$, find the quadratic change at the origin for displacement (1/10,1/10).
        answerLines: 5
        answer: |-
          The answer is $\frac{4}{100}$.

          The exact quadratic value is $(-1+2+3)/100$.
      - id: 15
        type: freeform
        prompt: For $f=2x^2+2xy+-1y^2$, give Hessian entries in row-major order.
        answerLines: 5
        answer: |-
          The answer is $\left(4,\ 2,\ 2,\ -2\right)$.

          The matrix rows are (4,2) and (2,-2).
      - id: 16
        type: freeform
        prompt: For $f=2x^2+2xy+-1y^2$, find the quadratic change at the origin for displacement (1/10,1/10).
        answerLines: 5
        answer: |-
          The answer is $\frac{3}{100}$.

          The exact quadratic value is $(2+2+-1)/100$.
      - id: 17
        type: freeform
        prompt: For $f=3x^2+2xy+2y^2$, give Hessian entries in row-major order.
        answerLines: 5
        answer: |-
          The answer is $\left(6,\ 2,\ 2,\ 4\right)$.

          The matrix rows are (6,2) and (2,4).
      - id: 18
        type: freeform
        prompt: For $f=3x^2+2xy+2y^2$, find the quadratic change at the origin for displacement (1/10,1/10).
        answerLines: 5
        answer: |-
          The answer is $\frac{7}{100}$.

          The exact quadratic value is $(3+2+2)/100$.
      - id: 19
        type: freeform
        prompt: For $f=-2x^2+2xy+-3y^2$, give Hessian entries in row-major order.
        answerLines: 5
        answer: |-
          The answer is $\left(-4,\ 2,\ 2,\ -6\right)$.

          The matrix rows are (-4,2) and (2,-6).
      - id: 20
        type: freeform
        prompt: For $f=-2x^2+2xy+-3y^2$, find the quadratic change at the origin for displacement (1/10,1/10).
        answerLines: 5
        answer: |-
          The answer is $\frac{-3}{100}$.

          The exact quadratic value is $(-2+2+-3)/100$.
  - title: Stationary points and the second derivative test
    questions:
      - id: 21
        type: freeform
        prompt: Find the stationary point of $f=(x-1)^2+2(y-2)^2$ as an ordered pair.
        answerLines: 5
        answer: |-
          The answer is $\left(1,\ 2\right)$.

          Set both first partials to zero: (1,2).
      - id: 22
        type: freeform
        prompt: For $f=x^2-2y^2$, classify the origin as minimum, maximum, or saddle.
        answerLines: 5
        answer: |-
          The answer is **saddle**.

          The discriminant is negative, and coordinate directions give both signs: saddle.
      - id: 23
        type: freeform
        prompt: Find the stationary point of $f=(x--1)^2+3(y-3)^2$ as an ordered pair.
        answerLines: 5
        answer: |-
