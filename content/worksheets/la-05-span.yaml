        answer: The matrix is 1 by 3. A coefficient list has 3 components, one per supplied vector. The combination has 1 components in the output space. A dependence equation asks a nonzero coefficient list to produce the 1-component zero vector.
      - id: 64
        type: freeform
        prompt: You place 4 vectors from real 3-dimensional space into matrix columns. State the size of the matrix, the number of components in a dependence coefficient list, and the number of components in the resulting combination.
        answerLines: 5
        answer: The matrix is 3 by 4. A coefficient list has 4 components, one per supplied vector. The combination has 3 components in the output space. A dependence equation asks a nonzero coefficient list to produce the 3-component zero vector.
      - id: 65
        type: freeform
        prompt: Give three plane vectors that are pairwise nonparallel but collectively dependent.
        answerLines: 5
        answer: Use (1,0),(0,1),(1,1). No pair is parallel, but the third is the sum of the first two.
      - id: 66
        type: freeform
        prompt: Prove that a subset of an independent collection is independent.
        answerLines: 5
        answer: Any nontrivial zero combination in the subset would extend to the whole collection by giving omitted vectors coefficient zero, contradicting independence.
      - id: 67
        type: freeform
        prompt: Prove that adding a vector outside the span of an independent list preserves independence.
        answerLines: 5
        answer: In a zero combination, a nonzero coefficient on the new vector would express it using the old list, contradicting the outside-span assumption. Its coefficient is therefore zero, and independence forces all the old coefficients to vanish.
      - id: 68
        type: freeform
        prompt: Why must four vectors in real three-dimensional space be dependent?
        answerLines: 5
        answer: Their homogeneous coefficient system has four unknown coefficients but at most three pivots. It has a nontrivial solution, which is a dependence relation.
      - id: 69
        type: freeform
        prompt: If a list is dependent, does deleting an arbitrary one of its vectors always preserve its span? Give a counterexample.
        answerLines: 5
        answer: No. From (1,0),(2,0),(0,1), deleting (0,1) loses the vertical direction. One must delete a vector expressible through the retained ones.
      - id: 70
        type: freeform
        prompt: Explain why adding a vector already in the span does not enlarge that span.
        answerLines: 5
        answer: Substitute its existing combination whenever it occurs in a new combination. Every new output is still a combination of the old list; the reverse inclusion is immediate.
      - id: 71
        type: freeform
        prompt: Can an independent list fail to span the intended space? Give a specific example with the space named.
        answerLines: 5
        answer: Yes. The single vector (1,0) is independent but does not span the real coordinate plane, since it cannot produce (0,1).
      - id: 72
        type: freeform
        prompt: Explain why two different representations of one output imply dependence of the supplied vectors.
        answerLines: 5
        answer: Subtract the representations. Their different coefficient lists give a nonzero difference list producing zero, which is exactly dependence.
