        answerLines: 5
        answer: Zero satisfies the equation. Adding two satisfying equations gives the same zero constraint for the sum; scaling a satisfying equation by any real number gives zero again. Thus addition and scalar multiplication stay inside. The set is a subspace.
      - id: 36
        type: freeform
        prompt: Determine whether the vectors (x,y,z) satisfying x- 2y- 1z=0 form a subspace. Check all defining requirements.
        answerLines: 5
        answer: Zero satisfies the equation. Adding two satisfying equations gives the same zero constraint for the sum; scaling a satisfying equation by any real number gives zero again. Thus addition and scalar multiplication stay inside. The set is a subspace.
      - id: 37
        type: freeform
        prompt: Is the set of vectors (x,y,z) satisfying x+2y-z=1 a subspace of real three-dimensional space? Give a decisive reason.
        answerLines: 5
        answer: No. The zero vector makes the left side zero, not 1. Every subspace must contain zero. This nonzero offset cannot be ignored.
      - id: 38
        type: freeform
        prompt: Is the set of vectors (x,y,z) satisfying x+2y-z=2 a subspace of real three-dimensional space? Give a decisive reason.
        answerLines: 5
        answer: No. The zero vector makes the left side zero, not 2. Every subspace must contain zero. This nonzero offset cannot be ignored.
      - id: 39
        type: freeform
        prompt: Is the set of vectors (x,y,z) satisfying x+2y-z=-1 a subspace of real three-dimensional space? Give a decisive reason.
        answerLines: 5
        answer: No. The zero vector makes the left side zero, not -1. Every subspace must contain zero. This nonzero offset cannot be ignored.
      - id: 40
        type: freeform
        prompt: Is the set of vectors (x,y,z) satisfying x+2y-z=3 a subspace of real three-dimensional space? Give a decisive reason.
        answerLines: 5
        answer: No. The zero vector makes the left side zero, not 3. Every subspace must contain zero. This nonzero offset cannot be ignored.
      - id: 41
        type: freeform
        prompt: Is the set of vectors (x,y,z) satisfying x+2y-z=-2 a subspace of real three-dimensional space? Give a decisive reason.
        answerLines: 5
        answer: No. The zero vector makes the left side zero, not -2. Every subspace must contain zero. This nonzero offset cannot be ignored.
      - id: 42
        type: freeform
        prompt: Is the set of vectors (x,y,z) satisfying x+2y-z=4 a subspace of real three-dimensional space? Give a decisive reason.
        answerLines: 5
        answer: No. The zero vector makes the left side zero, not 4. Every subspace must contain zero. This nonzero offset cannot be ignored.
      - id: 43
        type: freeform
        prompt: Prove that the intersection of two subspaces of the same real coordinate space is a subspace.
        answerLines: 5
        answer: Zero belongs to both. Sums and scalar multiples of vectors belonging to both stay in both by each subspace’s closure properties. Therefore they stay in the intersection.
      - id: 44
        type: freeform
        prompt: Show that the union of two subspaces need not be a subspace.
        answerLines: 5
        answer: The coordinate axes are each subspaces, but their union contains (1,0) and (0,1) without their sum (1,1). Closure under addition fails.
      - id: 45
        type: freeform
        prompt: Is the set consisting only of zero a subspace? Check the operations.
        answerLines: 5
        answer: Yes. It contains zero, adding its only vector to itself gives zero, and scaling it by any real scalar gives zero.
      - id: 46
        type: freeform
        prompt: Show that vectors with nonnegative coordinates need not form a subspace even though their sums remain nonnegative.
        answerLines: 5
        answer: The vector (1,0) is included, but its scalar multiple (-1,0) is not. Closure under all real scalars fails.
      - id: 47
        type: freeform
        prompt: Prove the null space of a matrix is closed under addition.
        answerLines: 5
        answer: If Au=0 and Av=0, then A(u+v)=Au+Av=0, so the sum is in the null space.
      - id: 48
        type: freeform
        prompt: Why is the column space a subspace without checking its entries one target at a time?
        answerLines: 5
        answer: It is the span of the columns. Zero coefficients produce zero; adding and scaling combinations produces more combinations.
      - id: 49
        type: freeform
        prompt: Why do row operations preserve row space?
        answerLines: 5
        answer: New rows are combinations of old rows, giving one inclusion of spans. Invertibility of each row operation gives the reverse inclusion.
      - id: 50
        type: freeform
        prompt: For a two-by-four matrix, in which coordinate spaces do its row space, column space, and null space lie?
        answerLines: 5
        answer: The row space and null space lie in real four-dimensional input space. The column space lies in real two-dimensional output space.
  - title: Reading independence from elimination
    questions:
      - id: 51
        type: freeform
        prompt: A matrix has three columns and its homogeneous system has one free variable. Are the columns independent? Explain using a nontrivial homogeneous solution.
        answerLines: 5
        answer: They are dependent. Choosing a nonzero value for the free variable and solving for the pivot variables gives a nonzero coefficient vector sent to zero, a nontrivial zero combination of the columns.
      - id: 52
        type: freeform
        prompt: Do the independent vectors (1,0,1) and (0,1,1) span all of three-dimensional space? Identify a condition on every vector they span and give an unreachable target.
        answerLines: 5
        answer: No. Every combination is (a,b,a+b), so the third coordinate must equal the first plus the second. The target (0,0,1) violates that condition. Independence does not imply coverage of the entire ambient space.
      - id: 53
        type: freeform
        prompt: An 3-by-2 matrix has 2 pivot columns after elimination. Are its columns independent? How many free variables occur in the homogeneous coefficient system?
        answerLines: 5
        answer: There are 0 free variables. No variable is free, so the zero solution is the only homogeneous solution and the columns are independent.
      - id: 54
        type: freeform
        prompt: An 2-by-3 matrix has 2 pivot columns after elimination. Are its columns independent? How many free variables occur in the homogeneous coefficient system?
        answerLines: 5
        answer: There are 1 free variables. A free variable can be chosen nonzero, giving a nontrivial zero combination; the columns are dependent.
      - id: 55
        type: freeform
        prompt: An 4-by-3 matrix has 2 pivot columns after elimination. Are its columns independent? How many free variables occur in the homogeneous coefficient system?
        answerLines: 5
