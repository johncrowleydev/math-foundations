      - id: 56
        type: freeform
        prompt: An 3-by-3 matrix has 3 pivot columns after elimination. Are its columns independent? How many free variables occur in the homogeneous coefficient system?
        answerLines: 5
        answer: There are 0 free variables. No variable is free, so the zero solution is the only homogeneous solution and the columns are independent.
      - id: 57
        type: freeform
        prompt: An 2-by-2 matrix has 1 pivot columns after elimination. Are its columns independent? How many free variables occur in the homogeneous coefficient system?
        answerLines: 5
        answer: There are 1 free variables. A free variable can be chosen nonzero, giving a nontrivial zero combination; the columns are dependent.
      - id: 58
        type: freeform
        prompt: An 4-by-4 matrix has 0 pivot columns after elimination. Are its columns independent? How many free variables occur in the homogeneous coefficient system?
        answerLines: 5
        answer: There are 4 free variables. A free variable can be chosen nonzero, giving a nontrivial zero combination; the columns are dependent.
      - id: 59
        type: freeform
        prompt: You place 3 vectors from real 2-dimensional space into matrix columns. State the size of the matrix, the number of components in a dependence coefficient list, and the number of components in the resulting combination.
        answerLines: 5
        answer: The matrix is 2 by 3. A coefficient list has 3 components, one per supplied vector. The combination has 2 components in the output space. A dependence equation asks a nonzero coefficient list to produce the 2-component zero vector.
      - id: 60
        type: freeform
        prompt: You place 2 vectors from real 3-dimensional space into matrix columns. State the size of the matrix, the number of components in a dependence coefficient list, and the number of components in the resulting combination.
        answerLines: 5
        answer: The matrix is 3 by 2. A coefficient list has 2 components, one per supplied vector. The combination has 3 components in the output space. A dependence equation asks a nonzero coefficient list to produce the 3-component zero vector.
      - id: 61
        type: freeform
        prompt: You place 3 vectors from real 4-dimensional space into matrix columns. State the size of the matrix, the number of components in a dependence coefficient list, and the number of components in the resulting combination.
        answerLines: 5
        answer: The matrix is 4 by 3. A coefficient list has 3 components, one per supplied vector. The combination has 4 components in the output space. A dependence equation asks a nonzero coefficient list to produce the 4-component zero vector.
      - id: 62
        type: freeform
        prompt: You place 4 vectors from real 2-dimensional space into matrix columns. State the size of the matrix, the number of components in a dependence coefficient list, and the number of components in the resulting combination.
        answerLines: 5
        answer: The matrix is 2 by 4. A coefficient list has 4 components, one per supplied vector. The combination has 2 components in the output space. A dependence equation asks a nonzero coefficient list to produce the 2-component zero vector.
      - id: 63
        type: freeform
        prompt: You place 3 vectors from real 1-dimensional space into matrix columns. State the size of the matrix, the number of components in a dependence coefficient list, and the number of components in the resulting combination.
