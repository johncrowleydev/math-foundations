title: Span and Linear Independence
sections:
  - title: Span is everything you can build
    questions:
      - id: 1
        type: freeform
        prompt: Does (3,4) lie in the span of u=(1,0) and v=(1,2)? Find coefficients or prove none exist.
        answerLines: 5
        answer: Yes. The second coordinate forces the coefficient of v to be 2. The first then forces the coefficient of u to be 1, so u+2v=(3,4).
      - id: 2
        type: freeform
        prompt: Describe the span of (2,-1) geometrically and decide whether (6,-3) and (1,1) belong to it.
        answerLines: 5
        answer: 'The span is the line through the origin in direction (2,-1). The first target is three times that vector and belongs. The second cannot be a scalar multiple: its first coordinate would require scalar one half, producing second coordinate negative one half rather than one.'
      - id: 3
        type: freeform
        prompt: Determine whether (1, 2, 0) lies in the span of (1,0,2) and (0,1,-1), and find coefficients. Give one nearby target with the same first two coordinates that is unreachable.
        answerLines: 5
        answer: 'The coefficients are 1,2, producing third component 0. Changing only that component to 1 makes a target unreachable: every combination has third coordinate twice the first minus the second.'
      - id: 4
        type: freeform
        prompt: Determine whether (2, -1, 5) lies in the span of (1,0,2) and (0,1,-1), and find coefficients. Give one nearby target with the same first two coordinates that is unreachable.
        answerLines: 5
        answer: 'The coefficients are 2,-1, producing third component 5. Changing only that component to 6 makes a target unreachable: every combination has third coordinate twice the first minus the second.'
      - id: 5
        type: freeform
        prompt: Determine whether (-1, 3, -5) lies in the span of (1,0,2) and (0,1,-1), and find coefficients. Give one nearby target with the same first two coordinates that is unreachable.
        answerLines: 5
        answer: 'The coefficients are -1,3, producing third component -5. Changing only that component to -4 makes a target unreachable: every combination has third coordinate twice the first minus the second.'
      - id: 6
        type: freeform
        prompt: Determine whether (0, 2, -2) lies in the span of (1,0,2) and (0,1,-1), and find coefficients. Give one nearby target with the same first two coordinates that is unreachable.
        answerLines: 5
        answer: 'The coefficients are 0,2, producing third component -2. Changing only that component to -1 makes a target unreachable: every combination has third coordinate twice the first minus the second.'
      - id: 7
        type: freeform
        prompt: Determine whether (3, 0, 6) lies in the span of (1,0,2) and (0,1,-1), and find coefficients. Give one nearby target with the same first two coordinates that is unreachable.
        answerLines: 5
        answer: 'The coefficients are 3,0, producing third component 6. Changing only that component to 7 makes a target unreachable: every combination has third coordinate twice the first minus the second.'
      - id: 8
        type: freeform
        prompt: Determine whether (-2, -1, -3) lies in the span of (1,0,2) and (0,1,-1), and find coefficients. Give one nearby target with the same first two coordinates that is unreachable.
        answerLines: 5
        answer: 'The coefficients are -2,-1, producing third component -3. Changing only that component to -2 makes a target unreachable: every combination has third coordinate twice the first minus the second.'
      - id: 9
        type: freeform
        prompt: Let u=(1,0), v=(0,1), and w=u+1v. Prove that u,w and u,v have the same span, rather than only showing one inclusion.
        answerLines: 5
        answer: w is a combination of u,v, so the first span is contained in the second. Conversely v=(w-u)/1, since 1 is nonzero, so both u and v lie in the first span. Every combination can therefore be rebuilt in either collection.
      - id: 10
        type: freeform
        prompt: Let u=(1,0), v=(0,1), and w=u+2v. Prove that u,w and u,v have the same span, rather than only showing one inclusion.
        answerLines: 5
        answer: w is a combination of u,v, so the first span is contained in the second. Conversely v=(w-u)/2, since 2 is nonzero, so both u and v lie in the first span. Every combination can therefore be rebuilt in either collection.
      - id: 11
        type: freeform
        prompt: Let u=(1,0), v=(0,1), and w=u- 1v. Prove that u,w and u,v have the same span, rather than only showing one inclusion.
        answerLines: 5
        answer: w is a combination of u,v, so the first span is contained in the second. Conversely v=(w-u)/-1, since -1 is nonzero, so both u and v lie in the first span. Every combination can therefore be rebuilt in either collection.
      - id: 12
        type: freeform
        prompt: Let u=(1,0), v=(0,1), and w=u+3v. Prove that u,w and u,v have the same span, rather than only showing one inclusion.
        answerLines: 5
        answer: w is a combination of u,v, so the first span is contained in the second. Conversely v=(w-u)/3, since 3 is nonzero, so both u and v lie in the first span. Every combination can therefore be rebuilt in either collection.
      - id: 13
        type: freeform
        prompt: Let u=(1,0), v=(0,1), and w=u- 2v. Prove that u,w and u,v have the same span, rather than only showing one inclusion.
        answerLines: 5
        answer: w is a combination of u,v, so the first span is contained in the second. Conversely v=(w-u)/-2, since -2 is nonzero, so both u and v lie in the first span. Every combination can therefore be rebuilt in either collection.
      - id: 14
        type: freeform
        prompt: Let u=(1,0), v=(0,1), and w=u+4v. Prove that u,w and u,v have the same span, rather than only showing one inclusion.
        answerLines: 5
        answer: w is a combination of u,v, so the first span is contained in the second. Conversely v=(w-u)/4, since 4 is nonzero, so both u and v lie in the first span. Every combination can therefore be rebuilt in either collection.
  - title: Independence means no redundant direction
    questions:
      - id: 15
        type: freeform
        prompt: Determine whether u=(1,2), v=(2,4) are linearly independent. Give a zero combination that supports your conclusion.
        answerLines: 5
        answer: They are dependent because 2u-v=0 has coefficients 2 and -1, not both zero. The vector v supplies no direction beyond u.
      - id: 16
        type: freeform
        prompt: Prove that (1,0,1) and (0,1,1) are linearly independent.
        answerLines: 5
        answer: An arbitrary combination with coefficients a and b is (a,b,a+b). If it equals zero, its first two coordinates force a=0 and b=0. Thus the only zero combination is the trivial one.
      - id: 17
        type: freeform
        prompt: For u=(1,0,1), v=(0,1,1), and w=(1, 2, 3), exhibit a nontrivial zero combination and identify a redundant vector.
        answerLines: 5
        answer: w=1u+2v, hence coefficient list (-1, -2, 1) gives zero. Its last coefficient is one, so it is nontrivial. The vector w adds no direction beyond u,v.
      - id: 18
        type: freeform
        prompt: For u=(1,0,1), v=(0,1,1), and w=(2, -1, 1), exhibit a nontrivial zero combination and identify a redundant vector.
        answerLines: 5
        answer: w=2u- 1v, hence coefficient list (-2, 1, 1) gives zero. Its last coefficient is one, so it is nontrivial. The vector w adds no direction beyond u,v.
      - id: 19
        type: freeform
        prompt: For u=(1,0,1), v=(0,1,1), and w=(-1, 3, 2), exhibit a nontrivial zero combination and identify a redundant vector.
        answerLines: 5
        answer: w=-1u+3v, hence coefficient list (1, -3, 1) gives zero. Its last coefficient is one, so it is nontrivial. The vector w adds no direction beyond u,v.
      - id: 20
        type: freeform
        prompt: For u=(1,0,1), v=(0,1,1), and w=(0, 2, 2), exhibit a nontrivial zero combination and identify a redundant vector.
        answerLines: 5
        answer: w=0u+2v, hence coefficient list (0, -2, 1) gives zero. Its last coefficient is one, so it is nontrivial. The vector w adds no direction beyond u,v.
      - id: 21
        type: freeform
        prompt: For u=(1,0,1), v=(0,1,1), and w=(3, 0, 3), exhibit a nontrivial zero combination and identify a redundant vector.
        answerLines: 5
        answer: w=3u+0v, hence coefficient list (-3, 0, 1) gives zero. Its last coefficient is one, so it is nontrivial. The vector w adds no direction beyond u,v.
      - id: 22
        type: freeform
        prompt: For u=(1,0,1), v=(0,1,1), and w=(-2, -1, -3), exhibit a nontrivial zero combination and identify a redundant vector.
        answerLines: 5
        answer: w=-2u- 1v, hence coefficient list (2, 1, 1) gives zero. Its last coefficient is one, so it is nontrivial. The vector w adds no direction beyond u,v.
      - id: 23
        type: freeform
        prompt: Prove that (1,0,1) and (0,1,2) are independent, then describe precisely what they span.
        answerLines: 5
        answer: A combination with coefficients s,t is (s,t,1s+(2)t). If it is zero, the first two coordinates force s=t=0. The span consists exactly of vectors with third coordinate 1 times the first plus 2 times the second. It is a plane, not the whole three-dimensional space.
      - id: 24
        type: freeform
        prompt: Prove that (1,0,2) and (0,1,-1) are independent, then describe precisely what they span.
        answerLines: 5
        answer: A combination with coefficients s,t is (s,t,2s+(-1)t). If it is zero, the first two coordinates force s=t=0. The span consists exactly of vectors with third coordinate 2 times the first plus -1 times the second. It is a plane, not the whole three-dimensional space.
      - id: 25
        type: freeform
        prompt: Prove that (1,0,-1) and (0,1,3) are independent, then describe precisely what they span.
        answerLines: 5
        answer: A combination with coefficients s,t is (s,t,-1s+(3)t). If it is zero, the first two coordinates force s=t=0. The span consists exactly of vectors with third coordinate -1 times the first plus 3 times the second. It is a plane, not the whole three-dimensional space.
      - id: 26
        type: freeform
        prompt: Prove that (1,0,0) and (0,1,2) are independent, then describe precisely what they span.
        answerLines: 5
        answer: A combination with coefficients s,t is (s,t,0s+(2)t). If it is zero, the first two coordinates force s=t=0. The span consists exactly of vectors with third coordinate 0 times the first plus 2 times the second. It is a plane, not the whole three-dimensional space.
      - id: 27
        type: freeform
        prompt: Prove that (1,0,3) and (0,1,0) are independent, then describe precisely what they span.
        answerLines: 5
        answer: A combination with coefficients s,t is (s,t,3s+(0)t). If it is zero, the first two coordinates force s=t=0. The span consists exactly of vectors with third coordinate 3 times the first plus 0 times the second. It is a plane, not the whole three-dimensional space.
      - id: 28
        type: freeform
        prompt: Prove that (1,0,-2) and (0,1,-1) are independent, then describe precisely what they span.
        answerLines: 5
        answer: A combination with coefficients s,t is (s,t,-2s+(-1)t). If it is zero, the first two coordinates force s=t=0. The span consists exactly of vectors with third coordinate -2 times the first plus -1 times the second. It is a plane, not the whole three-dimensional space.
  - title: Subspaces and the origin
    questions:
      - id: 29
        type: freeform
        prompt: Is the set of plane vectors (x,y) satisfying x+y=0 a subspace? Check zero, addition, and scalar multiplication.
        answerLines: 5
        answer: Yes. Zero satisfies the equation. Adding two pairs whose coordinate sums are zero gives another with sum zero. Scaling such a pair multiplies its zero coordinate sum by the scalar, leaving zero.
      - id: 30
        type: freeform
        prompt: Is the set of plane vectors with x at least zero a subspace? Give a decisive justification.
        answerLines: 5
        answer: No. It contains (1,0), but multiplying this vector by -1 gives (-1,0), which is outside the set. Closure under every real scalar fails.
      - id: 31
        type: freeform
        prompt: Determine whether the vectors (x,y,z) satisfying x+1y+2z=0 form a subspace. Check all defining requirements.
        answerLines: 5
        answer: Zero satisfies the equation. Adding two satisfying equations gives the same zero constraint for the sum; scaling a satisfying equation by any real number gives zero again. Thus addition and scalar multiplication stay inside. The set is a subspace.
      - id: 32
        type: freeform
        prompt: Determine whether the vectors (x,y,z) satisfying x+2y- 1z=0 form a subspace. Check all defining requirements.
        answerLines: 5
        answer: Zero satisfies the equation. Adding two satisfying equations gives the same zero constraint for the sum; scaling a satisfying equation by any real number gives zero again. Thus addition and scalar multiplication stay inside. The set is a subspace.
      - id: 33
