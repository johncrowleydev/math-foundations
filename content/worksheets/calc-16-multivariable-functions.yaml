          Holding x fixed gives $3x^2+-2y$.
      - id: 41
        type: freeform
        prompt: For $f(x,y)=-1x^2y+-2y^2$, find $f_x$.
        answerLines: 5
        answer: |-
          The answer is $-2\cdot x\cdot y$.

          Holding y fixed gives $-2xy$.
      - id: 42
        type: freeform
        prompt: For $f(x,y)=-1x^2y+-2y^2$, find $f_y$.
        answerLines: 5
        answer: |-
          The answer is $-1\cdot x^{2}+-4\cdot y$.

          Holding x fixed gives $-1x^2+-4y$.
      - id: 43
        type: freeform
        prompt: Find the x partial of $\sin(xy)$.
        answerLines: 5
        answer: |-
          The answer is $y\cdot \cos\left(x\cdot y\right)$.

          The inner derivative with y fixed is y, giving $y\cos(xy)$.
  - title: Coordinate information has limits
    questions:
      - id: 44
        type: freeform
        prompt: Let $f(0,0)=0$ and $f(x,y)=-3xy/(x^2+y^2)$ elsewhere. Find $f_x(0,0)$.
        answerLines: 5
        answer: |-
          The answer is $0$.

          Along y=0 the function is zero, so its x difference quotient is zero and $f_x(0,0)=0$.
      - id: 45
        type: freeform
        prompt: For $f(x,y)=x^2-3y^2$, explain why zero first partials at the origin do not establish a minimum.
        answerLines: 5
        answer: Both first partials vanish there. On y=0 the output is positive off the origin; on x=0 it is negative. Every neighborhood contains both signs.
