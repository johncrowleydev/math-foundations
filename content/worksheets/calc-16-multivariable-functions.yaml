  - title: Partial derivatives hold other inputs fixed
    questions:
      - id: 33
        type: freeform
        prompt: For $f(x,y)=1x^2y+2y^2$, find $f_x$.
        answerLines: 5
        answer: |-
          The answer is $2\cdot x\cdot y$.

          Holding y fixed gives $2xy$.
      - id: 34
        type: freeform
        prompt: For $f(x,y)=1x^2y+2y^2$, find $f_y$.
        answerLines: 5
        answer: |-
          The answer is $1\cdot x^{2}+4\cdot y$.

          Holding x fixed gives $1x^2+4y$.
      - id: 35
        type: freeform
        prompt: For $f(x,y)=-2x^2y+1y^2$, find $f_x$.
        answerLines: 5
        answer: |-
          The answer is $-4\cdot x\cdot y$.

          Holding y fixed gives $-4xy$.
      - id: 36
