title: Multivariable Functions and Partial Derivatives
sections:
  - title: Several inputs, one output
    questions:
      - id: 1
        type: freeform
        prompt: Evaluate $f(1,2)$ for $f(x,y)=2x^2+xy-y$.
        answerLines: 5
        answer: |-
          The answer is $2$.

          Substitution gives $2(1)^2+(1)(2)-(2)=2$.
      - id: 2
        type: freeform
        prompt: Is $(1,2)$ in the domain of $\sqrt{9-x^2-y^2}$?
        answerLines: 5
        answer: |-
          The answer is true.

          5 does not exceed 9, so the radicand is nonnegative.
      - id: 3
        type: freeform
        prompt: Evaluate $f(-2,1)$ for $f(x,y)=2x^2+xy-y$.
        answerLines: 5
        answer: |-
          The answer is $5$.

          Substitution gives $2(-2)^2+(-2)(1)-(1)=5$.
      - id: 4
        type: freeform
        prompt: Is $(-2,1)$ in the domain of $\sqrt{9-x^2-y^2}$?
        answerLines: 5
        answer: |-
          The answer is true.

          5 does not exceed 9, so the radicand is nonnegative.
      - id: 5
        type: freeform
        prompt: Evaluate $f(0,3)$ for $f(x,y)=2x^2+xy-y$.
        answerLines: 5
        answer: |-
          The answer is $-3$.

          Substitution gives $2(0)^2+(0)(3)-(3)=-3$.
      - id: 6
        type: freeform
        prompt: Is $(0,3)$ in the domain of $\sqrt{9-x^2-y^2}$?
        answerLines: 5
        answer: |-
          The answer is true.

          9 does not exceed 9, so the radicand is nonnegative.
      - id: 7
        type: freeform
        prompt: Evaluate $f(3,-1)$ for $f(x,y)=2x^2+xy-y$.
        answerLines: 5
        answer: |-
          The answer is $16$.

          Substitution gives $2(3)^2+(3)(-1)-(-1)=16$.
      - id: 8
        type: freeform
        prompt: Is $(3,-1)$ in the domain of $\sqrt{9-x^2-y^2}$?
        answerLines: 5
        answer: |-
          The answer is false.

          10 exceeds 9, so the radicand is not nonnegative.
      - id: 9
        type: freeform
        prompt: Evaluate $f(-1,-2)$ for $f(x,y)=2x^2+xy-y$.
        answerLines: 5
        answer: |-
          The answer is $6$.

          Substitution gives $2(-1)^2+(-1)(-2)-(-2)=6$.
      - id: 10
        type: freeform
        prompt: Is $(-1,-2)$ in the domain of $\sqrt{9-x^2-y^2}$?
        answerLines: 5
        answer: |-
          The answer is true.

          5 does not exceed 9, so the radicand is nonnegative.
      - id: 11
        type: freeform
        prompt: Explain why the formula domain and feasible domain of a production model may differ.
        answerLines: 5
        answer: A polynomial can accept every real input while counts or capacities may require nonnegative, integral, or bounded values. The model supplies these additional restrictions.
  - title: Slices and level curves
    questions:
      - id: 12
        type: freeform
        prompt: For $f(x,y)=x^2+2y^2$, give the slice obtained by fixing $y=2$ as a formula in $x$.
        answerLines: 5
        answer: |-
          The answer is $x^{2}+8$.

          Replace y with 2: $x^2+8$.
      - id: 13
        type: freeform
        prompt: At what level does $(1,2)$ lie for $f(x,y)=x^2+2y^2$?
        answerLines: 5
        answer: |-
          The answer is $9$.

          The level is the output $9$.
      - id: 14
        type: freeform
        prompt: For $f(x,y)=x^2+2y^2$, give the slice obtained by fixing $y=1$ as a formula in $x$.
        answerLines: 5
        answer: |-
