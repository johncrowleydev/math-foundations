      - id: 19
        type: freeform
        prompt: At what level does $(3,-1)$ lie for $f(x,y)=x^2+2y^2$?
        answerLines: 5
        answer: |-
          The answer is $11$.

          The level is the output $11$.
      - id: 20
        type: freeform
        prompt: For $f(x,y)=x^2+2y^2$, give the slice obtained by fixing $y=-2$ as a formula in $x$.
        answerLines: 5
        answer: |-
          The answer is $x^{2}+8$.

          Replace y with -2: $x^2+8$.
      - id: 21
        type: freeform
        prompt: At what level does $(-1,-2)$ lie for $f(x,y)=x^2+2y^2$?
        answerLines: 5
        answer: |-
          The answer is $9$.

          The level is the output $9$.
      - id: 22
        type: freeform
        prompt: For $x^2-y^2=0$, describe the level set without calling it a single smooth curve.
        answerLines: 5
        answer: It is the union of the two intersecting lines y=x and y=-x.
  - title: Limits require every approach
    questions:
      - id: 23
        type: freeform
        prompt: For $f(x,y)=-3xy/(x^2+y^2)$, find its value along $y=x\ne0$.
        answerLines: 5
        answer: |-
          The answer is $\frac{-3}{2}$.

          Cancel $x^2$ on this punctured path to obtain $-3/2$.
      - id: 24
        type: freeform
        prompt: Define $p(0,0)=0$ and $p(x,y)=-3x^2y/(x^2+y^2)$ elsewhere. Prove continuity at the origin.
        answerLines: 5
        answer: The bound $|p(x,y)|\leq3|y|\leq3\sqrt{x^2+y^2}$ tends to zero. Thus the limit equals the assigned value.
      - id: 25
        type: freeform
        prompt: For $f(x,y)=-1xy/(x^2+y^2)$, find its value along $y=x\ne0$.
        answerLines: 5
        answer: |-
