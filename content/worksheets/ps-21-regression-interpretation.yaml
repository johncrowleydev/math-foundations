title: Regression and Statistical Interpretation
sections:
  - title: A fitted line and a population model
    questions:
      - id: 1
        type: freeform
        prompt: Given $\bar x=2$, $\bar y=7$, $S_{xx}=10$, and $S_{xy}=15$, give $(b_0,b_1)$.
        answerLines: 5
        answer: 'Divide the centered cross-product by predictor spread: $b_1=3/2$. Then $b_0=7-(3/2)(2)=4$.'
      - id: 2
        type: freeform
        prompt: Given $\bar x=0$, $\bar y=3$, $S_{xx}=8$, and $S_{xy}=-4$, give $(b_0,b_1)$.
        answerLines: 5
        answer: 'Divide the centered cross-product by predictor spread: $b_1=-1/2$. Then $b_0=3-(-1/2)(0)=3$.'
      - id: 3
        type: freeform
        prompt: Given $\bar x=-1$, $\bar y=4$, $S_{xx}=6$, and $S_{xy}=12$, give $(b_0,b_1)$.
        answerLines: 5
        answer: 'Divide the centered cross-product by predictor spread: $b_1=2$. Then $b_0=4-(2)(-1)=6$.'
      - id: 4
        type: freeform
        prompt: For $(x,y)=(0,2),(1,3),(2,4)$, give $(S_{xx},S_{xy})$.
        answerLines: 5
        answer: Both means are $1,3$ respectively. Centered predictor differences are $-1,0,1$ and centered responses are $-1,0,1$, so both sums equal $2$.
      - id: 5
        type: freeform
        prompt: The fitted line is $\widehat y=3-2x$. Give its prediction and the residual for $(x,y)=(4,-3)$.
        answerLines: 5
        answer: The prediction is $3-8=-5$, and the residual is $-3-(-5)=2$.
      - id: 6
        type: freeform
        prompt: For the line $\widehat y=1+x/2$, give the prediction at $x=6$.
        answerLines: 5
        answer: Substitution gives $1+6/2=4$.
      - id: 7
        type: freeform
        prompt: Residuals are $1,-2,1$. Compute SSE.
        answerLines: 5
        answer: 'Square before adding: $1+4+1=6$.'
      - id: 8
        type: freeform
        prompt: A fitted slope is $-3$ kilograms per hour. What predicted mean change corresponds to an increase of $2$ hours?
        answerLines: 5
        answer: 'Multiply slope by predictor change: $-3(2)=-6$ kilograms.'
      - id: 9
        type: freeform
        prompt: Does a simple least-squares line with an intercept and nonconstant predictor pass through the sample means?
        answerLines: 5
        answer: Yes. The identity $b_0=\bar y-b_1\bar x$ gives $b_0+b_1\bar x=\bar y$.
      - id: 10
        type: freeform
        prompt: All five predictor values equal 4. Explain why the data cannot identify separate intercept and slope values.
        answerLines: 5
        answer: Only the combination β₀+4β₁ affects fitted responses. Increasing the intercept by 4 and decreasing the slope by 1 leaves all predictions unchanged.
      - id: 11
        type: freeform
        prompt: Explain the difference between a model error and an observed residual.
        answerLines: 5
        answer: A model error subtracts the unknown population mean from a response. A residual subtracts the fitted sample line, which depends on all observations.
  - title: Why Gaussian likelihood gives least squares
    questions:
      - id: 12
        type: freeform
        prompt: A normal-error line fit has $n=6$ and minimized SSE $8$. Give the maximum-likelihood variance estimate and the unbiased residual-variance estimate, in that order.
        answerLines: 5
        answer: The likelihood estimate divides by $n$; the unbiased estimate allows for two fitted coefficients. Thus the values are $4/3$ and $2$.
      - id: 13
        type: freeform
        prompt: A normal-error line fit has $n=10$ and minimized SSE $32$. Give the maximum-likelihood variance estimate and the unbiased residual-variance estimate, in that order.
        answerLines: 5
        answer: The likelihood estimate divides by $n$; the unbiased estimate allows for two fitted coefficients. Thus the values are $16/5$ and $4$.
      - id: 14
        type: freeform
        prompt: A normal-error line fit has $n=12$ and minimized SSE $50$. Give the maximum-likelihood variance estimate and the unbiased residual-variance estimate, in that order.
        answerLines: 5
        answer: The likelihood estimate divides by $n$; the unbiased estimate allows for two fitted coefficients. Thus the values are $25/6$ and $5$.
      - id: 15
        type: freeform
        prompt: On the same observations, candidates A and B have SSE $8$ and $20$. With common fixed variance $3$, compute $\ell(A)-\ell(B)$.
        answerLines: 5
        answer: The normalizing terms cancel. The difference is $(\operatorname{SSE}_B-\operatorname{SSE}_A)/(2\sigma^2)=(20-8)/6=2$.
      - id: 16
        type: freeform
        prompt: On the same observations, candidates A and B have SSE $15$ and $9$. With common fixed variance $2$, compute $\ell(A)-\ell(B)$.
        answerLines: 5
        answer: The normalizing terms cancel. The difference is $(\operatorname{SSE}_B-\operatorname{SSE}_A)/(2\sigma^2)=(9-15)/4=-3/2$.
      - id: 17
        type: freeform
        prompt: On the same observations, candidates A and B have SSE $12$ and $12$. With common fixed variance $5$, compute $\ell(A)-\ell(B)$.
        answerLines: 5
        answer: The normalizing terms cancel. The difference is $(\operatorname{SSE}_B-\operatorname{SSE}_A)/(2\sigma^2)=(12-12)/10=0$.
      - id: 18
        type: freeform
        prompt: A line fit uses $n=18$ independent observations. How many residual degrees of freedom enter its variance estimate?
        answerLines: 5
        answer: Two coefficients were fitted, so $18-2=16$.
      - id: 19
        type: freeform
        prompt: At a candidate line, SSE is $24$ and fixed $\sigma^2=3$. Compute the coefficient-dependent negative log-likelihood term $\operatorname{SSE}/(2\sigma^2)$.
        answerLines: 5
        answer: The term is $24/6=4$. The omitted normalizing term is constant only when variance is fixed.
      - id: 20
        type: freeform
        prompt: Must the observed predictor values have a normal distribution for the conditional Gaussian-error model?
        answerLines: 5
        answer: No. Normality is imposed on the errors, conditional on the predictors.
      - id: 21
        type: freeform
        prompt: Why cannot one maximize likelihood over unknown variance by minimizing SSE divided by variance alone?
        answerLines: 5
        answer: The log normalizing term also depends on variance. Omitting it rewards making variance indefinitely large and changes the optimization problem.
      - id: 22
        type: freeform
        prompt: Does zero training SSE prove that the population error variance is zero?
        answerLines: 5
        answer: No. A finite sample can fit perfectly by chance or excessive flexibility. The usual positive-variance likelihood estimate is degenerate at zero SSE, and future-data uncertainty is not established by that fit.
  - title: Uncertainty in a coefficient
    questions:
      - id: 23
        type: freeform
        prompt: Given residual standard error $s=2$ and $S_{xx}=100$, compute $\operatorname{SE}(b_1)$.
        answerLines: 5
        answer: Use $s/\sqrt{S_{xx}}=2/10=1/5$.
      - id: 24
        type: freeform
        prompt: A fit has $b_1=1$ and $\operatorname{SE}(b_1)=1/5$. Compute the statistic for $H_0:\beta_1=0$.
        answerLines: 5
        answer: 'Subtract the null slope before standardizing: $t=(1-0)/(1/5)=5$.'
      - id: 25
        type: freeform
        prompt: Given residual standard error $s=3$ and $S_{xx}=36$, compute $\operatorname{SE}(b_1)$.
        answerLines: 5
        answer: Use $s/\sqrt{S_{xx}}=3/6=1/2$.
      - id: 26
        type: freeform
        prompt: A fit has $b_1=-2$ and $\operatorname{SE}(b_1)=1/2$. Compute the statistic for $H_0:\beta_1=-1$.
        answerLines: 5
        answer: 'Subtract the null slope before standardizing: $t=(-2--1)/(1/2)=-2$.'
      - id: 27
        type: freeform
        prompt: Given residual standard error $s=1$ and $S_{xx}=25$, compute $\operatorname{SE}(b_1)$.
        answerLines: 5
        answer: Use $s/\sqrt{S_{xx}}=1/5=1/5$.
      - id: 28
        type: freeform
        prompt: A fit has $b_1=0.8$ and $\operatorname{SE}(b_1)=1/5$. Compute the statistic for $H_0:\beta_1=0$.
        answerLines: 5
        answer: 'Subtract the null slope before standardizing: $t=(0.8-0)/(1/5)=4$.'
      - id: 29
        type: freeform
        prompt: The fitted slope is $1.2$, its SE is $0.3$, and the supplied 95% t multiplier is $2.228$. Give both confidence endpoints to four decimal places.
        answerLines: 5
        answer: The margin is $2.228(0.3)=0.6684$. The endpoints are $0.5316$ and $1.8684$.
      - id: 30
        type: freeform
        prompt: At a stated two-sided level, the critical value is $2.4$ and the observed statistic is $-2.7$. Should the null be rejected?
        answerLines: 5
        answer: 'Yes. Two-sided rejection compares absolute magnitude: $2.7>2.4$.'
      - id: 31
        type: freeform
        prompt: With fixed $s$, multiplying $S_{xx}$ by nine multiplies the slope SE by what factor?
        answerLines: 5
        answer: The denominator is a square root, so SE is multiplied by $1/3$.
      - id: 32
        type: freeform
        prompt: A centered-predictor fit has $\bar x=0$, $n=16$, and $s=4$. Compute the intercept SE.
        answerLines: 5
        answer: The formula reduces to $s/\sqrt n=4/4=1$.
      - id: 33
        type: freeform
        prompt: A 95% slope interval is [0.1,0.3]. Explain what the 95% refers to.
        answerLines: 5
        answer: It is the long-run coverage of intervals made by this procedure under its assumptions. It is not a 95% probability that this fixed population slope lies in this already observed interval.
  - title: Predicting a mean and predicting one new observation
    questions:
      - id: 34
        type: freeform
        prompt: Use $n=4$, $S_{xx}=8$, and $x_0-\bar x=0$. Compute $h_0$.
        answerLines: 5
        answer: The leverage factor is $1/4+0/8=1/4$.
      - id: 35
        type: freeform
        prompt: At a prediction point, $h_0=1/4$ and $s=2$. Give the squared SE for the fitted mean and the squared SE for a new response.
        answerLines: 5
        answer: They are $s^2h_0=1$ and $s^2(1+h_0)=5$. The second adds the individual error variance.
      - id: 36
        type: freeform
        prompt: Use $n=8$, $S_{xx}=16$, and $x_0-\bar x=2$. Compute $h_0$.
        answerLines: 5
        answer: The leverage factor is $1/8+4/16=3/8$.
      - id: 37
        type: freeform
        prompt: At a prediction point, $h_0=3/8$ and $s=2$. Give the squared SE for the fitted mean and the squared SE for a new response.
        answerLines: 5
        answer: They are $s^2h_0=3/2$ and $s^2(1+h_0)=11/2$. The second adds the individual error variance.
      - id: 38
        type: freeform
        prompt: Use $n=10$, $S_{xx}=20$, and $x_0-\bar x=0$. Compute $h_0$.
        answerLines: 5
        answer: The leverage factor is $1/10+0/20=1/10$.
      - id: 39
        type: freeform
        prompt: At a prediction point, $h_0=1/10$ and $s=1$. Give the squared SE for the fitted mean and the squared SE for a new response.
        answerLines: 5
        answer: They are $s^2h_0=1/10$ and $s^2(1+h_0)=11/10$. The second adds the individual error variance.
      - id: 40
        type: freeform
        prompt: The fitted mean is $8$, its SE is $0.5$, and the supplied t multiplier is $2.2$. Give the mean-response interval endpoints.
        answerLines: 5
        answer: The margin is $2.2(0.5)=1.1$, so the endpoints are $6.9,9.1$.
      - id: 41
        type: freeform
        prompt: The fitted value is $8$, the new-response SE is $1.5$, and the supplied t multiplier is $2.2$. Give the prediction interval endpoints.
        answerLines: 5
        answer: The margin is $2.2(1.5)=3.3$, so the endpoints are $4.7,11.3$.
      - id: 42
        type: freeform
        prompt: If residual standard error is $3$, by how much does the new-response squared SE exceed the fitted-mean squared SE at the same predictor?
        answerLines: 5
        answer: The extra variance is $s^2=9$.
      - id: 43
        type: freeform
        prompt: At the same point and confidence level, with positive residual variance, can the individual prediction interval be narrower than the mean-response interval?
        answerLines: 5
        answer: No. Its variance adds $s^2>0$, so its margin is larger.
      - id: 44
        type: freeform
        prompt: Why does a very precise estimated mean not guarantee a very precise individual prediction?
        answerLines: 5
        answer: A new response has its own random error. Estimation uncertainty may shrink with sample size while the individual error variance remains positive.
  - title: Assumptions, diagnostics, and the limits of a slope
    questions:
      - id: 45
        type: freeform
        prompt: An intercept-containing least-squares fit has SSE $12$ and SST $48$. Compute $R^2$.
        answerLines: 5
        answer: Use $1-\operatorname{SSE}/\operatorname{SST}=1-12/48=3/4$.
      - id: 46
        type: freeform
        prompt: An intercept-containing least-squares fit has SSE $18$ and SST $60$. Compute $R^2$.
        answerLines: 5
        answer: Use $1-\operatorname{SSE}/\operatorname{SST}=1-18/60=7/10$.
      - id: 47
        type: freeform
        prompt: An intercept-containing least-squares fit has SSE $30$ and SST $30$. Compute $R^2$.
        answerLines: 5
        answer: Use $1-\operatorname{SSE}/\operatorname{SST}=1-30/30=0$.
      - id: 48
        type: freeform
        prompt: A slope is $2$ response units per meter. Express it per centimeter.
        answerLines: 5
        answer: One centimeter is $1/100$ meter, so the slope is $2/100=1/50$ response units per centimeter.
      - id: 49
        type: freeform
        prompt: A slope estimate is $0.002$ response units per minute. What predicted mean change occurs over $30$ minutes?
        answerLines: 5
        answer: The fitted change is $0.002(30)=0.06$ response units. Compare this magnitude with what matters in context.
      - id: 50
        type: freeform
        prompt: Does a high R² by itself establish that a predictor causes a response?
        answerLines: 5
        answer: No. A fitted association can reflect confounding, selection, or a shared cause.
      - id: 51
        type: freeform
        prompt: Can a high-leverage observation have a small residual?
        answerLines: 5
        answer: Yes. It can pull the fitted line close to itself while substantially changing the line.
      - id: 52
        type: freeform
        prompt: A residual plot has a clear U shape. Which part of a straight-line model should be reconsidered, and why?
        answerLines: 5
        answer: 'The conditional mean specification should be reconsidered: a curved residual pattern suggests systematic structure remains after subtracting the fitted line.'
      - id: 53
        type: freeform
        prompt: Residual spread grows steadily with fitted values. Explain the threat to the ordinary slope interval.
        answerLines: 5
        answer: The constant-variance assumption is doubtful, so the usual common-variance SE and resulting interval need not have their stated coverage.
      - id: 54
        type: freeform
        prompt: A time series has long runs of positive residuals followed by long runs of negative residuals. Explain why increasing the number of recorded times alone does not validate independent-error inference.
        answerLines: 5
        answer: Nearby errors may be correlated. More records do not remove dependence; the sampling model and uncertainty calculation must address it.
      - id: 55
        type: freeform
        prompt: A study reports a statistically significant slope from a convenience sample. Name two reasons to limit its interpretation.
        answerLines: 5
        answer: Convenience sampling may not represent the target population, and observational association need not be causal. The effect may also be too small for practical importance.
