title: Orthogonality and Projections
sections:
  - title: Projecting onto a line
    questions:
      - id: 1
        type: freeform
        prompt: Project b=(4,2) onto the line spanned by u=(1,1). Find the residual and check its perpendicularity to u.
        answerLines: 5
        answer: The coefficient is (4+2)/(1+1)=3. The projection is (3,3), and the residual is (1,-1). Its dot product with u is 1-1=0.
      - id: 2
        type: freeform
        prompt: Why does replacing a nonzero line direction u by 2u leave the projection of a target onto that line unchanged?
        answerLines: 5
        answer: In the projection formula the numerator doubles, the denominator quadruples, and the final direction vector doubles. These factors cancel. Geometrically, u and 2u span the same line.
      - id: 3
        type: freeform
        prompt: Project b=(3, 4) onto the line spanned by u=(2, -1). Give the scalar coefficient, projected vector, and residual b minus projection. Check orthogonality.
        answerLines: 5
        answer: The coefficient is 2/5=2/5. Projection is (4/5, -2/5) and residual (11/5, 22/5). Taking its dot product with u gives zero because the numerator is (b dot u)(u dot u) minus itself.
      - id: 4
        type: freeform
        prompt: Project b=(-2, 1) onto the line spanned by u=(0, 3). Give the scalar coefficient, projected vector, and residual b minus projection. Check orthogonality.
        answerLines: 5
        answer: The coefficient is 3/9=1/3. Projection is (0, 1) and residual (-2, 0). Taking its dot product with u gives zero because the numerator is (b dot u)(u dot u) minus itself.
      - id: 5
        type: freeform
        prompt: Project b=(1, -4) onto the line spanned by u=(-3, 2). Give the scalar coefficient, projected vector, and residual b minus projection. Check orthogonality.
        answerLines: 5
        answer: The coefficient is -11/13=-11/13. Projection is (33/13, -22/13) and residual (-20/13, -30/13). Taking its dot product with u gives zero because the numerator is (b dot u)(u dot u) minus itself.
      - id: 6
        type: freeform
        prompt: Project b=(0, -3, 1) onto the line spanned by u=(1, 0, 2). Give the scalar coefficient, projected vector, and residual b minus projection. Check orthogonality.
        answerLines: 5
        answer: The coefficient is 2/5=2/5. Projection is (2/5, 0, 4/5) and residual (-2/5, -3, 1/5). Taking its dot product with u gives zero because the numerator is (b dot u)(u dot u) minus itself.
      - id: 7
        type: freeform
        prompt: Project b=(-1, 2, 3) onto the line spanned by u=(2, -1, 0). Give the scalar coefficient, projected vector, and residual b minus projection. Check orthogonality.
        answerLines: 5
        answer: The coefficient is -4/5=-4/5. Projection is (-8/5, 4/5, 0) and residual (3/5, 6/5, 3). Taking its dot product with u gives zero because the numerator is (b dot u)(u dot u) minus itself.
      - id: 8
        type: freeform
        prompt: Project b=(3, 0, 1, -1) onto the line spanned by u=(1, 2, -2, 0). Give the scalar coefficient, projected vector, and residual b minus projection. Check orthogonality.
        answerLines: 5
        answer: The coefficient is 1/9=1/9. Projection is (1/9, 2/9, -2/9, 0) and residual (26/9, -2/9, 11/9, -1). Taking its dot product with u gives zero because the numerator is (b dot u)(u dot u) minus itself.
      - id: 9
        type: freeform
        prompt: Project b=(3,1) onto the line generated by u=(2, 2). Compare the result with projection using (1,1).
        answerLines: 5
        answer: The coefficient for u is 1, producing (2,2). Using (1,1) gives coefficient two and the same point. The nonzero rescaling changes the coefficient but not the line or projection.
      - id: 10
        type: freeform
        prompt: Project b=(3,1) onto the line generated by u=(-1, -1). Compare the result with projection using (1,1).
        answerLines: 5
        answer: The coefficient for u is -2, producing (2,2). Using (1,1) gives coefficient two and the same point. The nonzero rescaling changes the coefficient but not the line or projection.
      - id: 11
        type: freeform
        prompt: Project b=(3,1) onto the line generated by u=(3, 3). Compare the result with projection using (1,1).
        answerLines: 5
        answer: The coefficient for u is 2/3, producing (2,2). Using (1,1) gives coefficient two and the same point. The nonzero rescaling changes the coefficient but not the line or projection.
      - id: 12
        type: freeform
        prompt: Project b=(3,1) onto the line generated by u=(-2, -2). Compare the result with projection using (1,1).
        answerLines: 5
        answer: The coefficient for u is -1, producing (2,2). Using (1,1) gives coefficient two and the same point. The nonzero rescaling changes the coefficient but not the line or projection.
      - id: 13
        type: freeform
        prompt: Project b=(3,1) onto the line generated by u=(4, 4). Compare the result with projection using (1,1).
        answerLines: 5
        answer: The coefficient for u is 1/2, producing (2,2). Using (1,1) gives coefficient two and the same point. The nonzero rescaling changes the coefficient but not the line or projection.
      - id: 14
        type: freeform
        prompt: Project b=(3,1) onto the line generated by u=(-3, -3). Compare the result with projection using (1,1).
        answerLines: 5
        answer: The coefficient for u is -2/3, producing (2,2). Using (1,1) gives coefficient two and the same point. The nonzero rescaling changes the coefficient but not the line or projection.
  - title: Why perpendicular means closest
    questions:
      - id: 57
        type: freeform
        prompt: Prove that the perpendicular projection onto a line is the unique closest point using the Pythagorean theorem.
        answerLines: 5
        answer: For projected point p and any other line point q, b-p is perpendicular to p-q. Thus the squared distance from b to q equals the squared residual length plus the nonnegative squared distance from p to q. Equality requires q=p.
      - id: 67
        type: freeform
        prompt: If b is already in the permitted subspace, what are its orthogonal projection and residual?
        answerLines: 5
        answer: The projection is b itself, giving residual zero and the smallest possible squared distance.
      - id: 68
        type: freeform
        prompt: If b is perpendicular to every vector in the permitted subspace, what is its projection?
        answerLines: 5
        answer: Zero. Its residual is b, already perpendicular to the subspace; every nonzero candidate adds a positive squared distance term.
  - title: Orthonormal directions
    questions:
      - id: 16
        type: freeform
        prompt: Q has the single column (1,0). Compute Q transpose times Q and Q times Q transpose. Explain why only one is an identity matrix of its size.
        answerLines: 5
        answer: Q transpose Q is the one by one matrix containing 1, an identity. Q Q transpose has rows (1,0),(0,0), a projection onto the horizontal axis, not the two by two identity.
      - id: 17
        type: freeform
        prompt: The orthonormal columns of Q are (1,0,0) and (0,0,1). Project (1, 2, 3) onto their span. Give Q transpose b and the residual.
        answerLines: 5
        answer: Q transpose b gives coefficients (1, 3). The projection is (1, 0, 3); the residual is (0, 2, 0), perpendicular to both columns.
      - id: 18
        type: freeform
        prompt: The orthonormal columns of Q are (1,0,0) and (0,0,1). Project (-2, 1, 4) onto their span. Give Q transpose b and the residual.
        answerLines: 5
        answer: Q transpose b gives coefficients (-2, 4). The projection is (-2, 0, 4); the residual is (0, 1, 0), perpendicular to both columns.
      - id: 19
        type: freeform
        prompt: The orthonormal columns of Q are (1,0,0) and (0,0,1). Project (0, 3, -1) onto their span. Give Q transpose b and the residual.
        answerLines: 5
        answer: Q transpose b gives coefficients (0, -1). The projection is (0, 0, -1); the residual is (0, 3, 0), perpendicular to both columns.
      - id: 20
        type: freeform
        prompt: The orthonormal columns of Q are (1,0,0) and (0,0,1). Project (4, -2, 0) onto their span. Give Q transpose b and the residual.
        answerLines: 5
        answer: Q transpose b gives coefficients (4, 0). The projection is (4, 0, 0); the residual is (0, -2, 0), perpendicular to both columns.
      - id: 21
        type: freeform
        prompt: The orthonormal columns of Q are (1,0,0) and (0,0,1). Project (2, 2, 2) onto their span. Give Q transpose b and the residual.
        answerLines: 5
        answer: Q transpose b gives coefficients (2, 2). The projection is (2, 0, 2); the residual is (0, 2, 0), perpendicular to both columns.
      - id: 22
        type: freeform
        prompt: The orthonormal columns of Q are (1,0,0) and (0,0,1). Project (-1, -3, 2) onto their span. Give Q transpose b and the residual.
        answerLines: 5
        answer: Q transpose b gives coefficients (-1, 2). The projection is (-1, 0, 2); the residual is (0, -3, 0), perpendicular to both columns.
      - id: 59
        type: freeform
        prompt: For a matrix Q with orthonormal columns, why can Q transpose Q be identity while Q Q transpose is not?
        answerLines: 5
        answer: The first product records pairwise dot products of the columns and is identity. The reverse product projects onto their span, which may be a proper subspace of the output space.
  - title: Carrying out Gram–Schmidt
    questions:
      - id: 15
        type: freeform
        prompt: Use Gram–Schmidt on u=(1,0) followed by v=(1,1). Give the resulting orthonormal vectors and show the subtraction step.
        answerLines: 5
        answer: The first normalized direction is (1,0). The projection of v onto it is (1,0); subtracting leaves (0,1), already unit length. The resulting ordered list is (1,0),(0,1).
      - id: 23
        type: freeform
        prompt: Apply Gram–Schmidt to the ordered vectors (1,0,0) and (1, 1, 1). Give the orthonormal vectors and verify that the span is unchanged.
        answerLines: 5
        answer: The first vector already has unit length. Subtract its projection (1,0,0) from the second, leaving (0, 1, 1). Divide that remainder by square root of 2 for the second unit vector. It is perpendicular to the first, and the original second vector is 1 times the first plus square root of 2 times the second unit vector.
      - id: 24
        type: freeform
        prompt: Apply Gram–Schmidt to the ordered vectors (1,0,0) and (2, 1, 1). Give the orthonormal vectors and verify that the span is unchanged.
        answerLines: 5
        answer: The first vector already has unit length. Subtract its projection (2,0,0) from the second, leaving (0, 1, 1). Divide that remainder by square root of 2 for the second unit vector. It is perpendicular to the first, and the original second vector is 2 times the first plus square root of 2 times the second unit vector.
      - id: 25
        type: freeform
        prompt: Apply Gram–Schmidt to the ordered vectors (1,0,0) and (-1, 2, 1). Give the orthonormal vectors and verify that the span is unchanged.
        answerLines: 5
        answer: The first vector already has unit length. Subtract its projection (-1,0,0) from the second, leaving (0, 2, 1). Divide that remainder by square root of 5 for the second unit vector. It is perpendicular to the first, and the original second vector is -1 times the first plus square root of 5 times the second unit vector.
      - id: 26
        type: freeform
        prompt: Apply Gram–Schmidt to the ordered vectors (1,0,0) and (3, -1, 1). Give the orthonormal vectors and verify that the span is unchanged.
        answerLines: 5
        answer: The first vector already has unit length. Subtract its projection (3,0,0) from the second, leaving (0, -1, 1). Divide that remainder by square root of 2 for the second unit vector. It is perpendicular to the first, and the original second vector is 3 times the first plus square root of 2 times the second unit vector.
      - id: 27
        type: freeform
        prompt: Apply Gram–Schmidt to the ordered vectors (1,0,0) and (1, -2, 1). Give the orthonormal vectors and verify that the span is unchanged.
        answerLines: 5
        answer: The first vector already has unit length. Subtract its projection (1,0,0) from the second, leaving (0, -2, 1). Divide that remainder by square root of 5 for the second unit vector. It is perpendicular to the first, and the original second vector is 1 times the first plus square root of 5 times the second unit vector.
      - id: 28
        type: freeform
        prompt: Apply Gram–Schmidt to the ordered vectors (1,0,0) and (-2, -1, 1). Give the orthonormal vectors and verify that the span is unchanged.
        answerLines: 5
        answer: The first vector already has unit length. Subtract its projection (-2,0,0) from the second, leaving (0, -1, 1). Divide that remainder by square root of 2 for the second unit vector. It is perpendicular to the first, and the original second vector is -2 times the first plus square root of 2 times the second unit vector.
      - id: 58
        type: freeform
        prompt: What happens if Gram–Schmidt encounters a zero remainder? Why must you not normalize it?
        answerLines: 5
        answer: The current input lies in the span of previously retained directions, so it adds no independent direction. Its norm is zero and division is undefined; discard the redundant direction or handle dependence explicitly.
  - title: QR as a record of the construction
    questions:
      - id: 66
        type: freeform
        prompt: What does QR factorization separate in a full-column-rank model matrix?
        answerLines: 5
        answer: Q contains orthonormal directions spanning the same column space, while upper-triangular R contains the coefficients reconstructing the original columns from those directions.
