title: Orthogonality, Projections, and Least Squares
sections:
  - title: Projecting onto a line
    questions:
      - id: 1
        type: freeform
        prompt: Project b=(4,2) onto the line spanned by u=(1,1). Find the residual and check its perpendicularity to u.
        answerLines: 5
        answer: The coefficient is (4+2)/(1+1)=3. The projection is (3,3), and the residual is (1,-1). Its dot product with u is 1-1=0.
      - id: 2
        type: freeform
        prompt: Why does replacing a nonzero line direction u by 2u leave the projection of a target onto that line unchanged?
        answerLines: 5
        answer: In the projection formula the numerator doubles, the denominator quadruples, and the final direction vector doubles. These factors cancel. Geometrically, u and 2u span the same line.
  - title: Orthonormal directions
    questions:
      - id: 3
        type: freeform
        prompt: Use Gram–Schmidt on u=(1,0) followed by v=(1,1). Give the resulting orthonormal vectors and show the subtraction step.
        answerLines: 5
        answer: The first normalized direction is (1,0). The projection of v onto it is (1,0); subtracting leaves (0,1), already unit length. The resulting ordered list is (1,0),(0,1).
      - id: 4
        type: freeform
        prompt: Q has the single column (1,0). Compute Q transpose times Q and Q times Q transpose. Explain why only one is an identity matrix of its size.
        answerLines: 5
        answer: Q transpose Q is the one by one matrix containing 1, an identity. Q Q transpose has rows (1,0),(0,0), a projection onto the horizontal axis, not the two by two identity.
  - title: Least squares and the normal equations
    questions:
      - id: 5
        type: freeform
        prompt: Find the least-squares constant fit c to observations 2,4,9. Give the fitted output and the residual b minus the fitted output.
        answerLines: 5
        answer: The normal equation is 3c=15, giving c=5. The fitted output is (5,5,5), and the residual is (-3,-1,4). Its components sum to zero, making it perpendicular to the column of ones.
      - id: 6
        type: freeform
        prompt: A has one column (1,2) and b=(1,1). Solve the scalar normal equation for the coefficient, then give the fitted output.
        answerLines: 5
        answer: A transpose A is 5 and A transpose b is 3, so the coefficient is 3/5. The fitted output is (3/5,6/5). The residual (2/5,-1/5) has zero dot product with (1,2).
  - title: What a best fit does and does not say
    questions:
      - id: 7
        type: freeform
        prompt: A least-squares calculation returns a nonzero residual. Does that alone mean the calculation is wrong? Explain.
        answerLines: 5
        answer: No. If the target lies outside the column space, no exact fit exists and the closest permitted output has a nonzero residual. The residual should be orthogonal to the column space at a least-squares solution.
      - id: 8
        type: freeform
        prompt: Why might two different coefficient vectors give the same unique closest output in a least-squares problem?
        answerLines: 5
        answer: Dependent columns give a nonzero null-space direction. Adding such a direction to a coefficient vector does not change its output. The projection output can therefore be unique even when its coefficient representation is not.
