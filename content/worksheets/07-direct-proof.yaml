title: Direct Proof
instructions:
  80 exercises in eight sections. Give reasons and show the requested proof, including domains
  and all necessary cases. Integer arithmetic is exact. Blank response space is provided; the answer key follows
  the student section.
sections:
  - title: A. Definitions and proof obligations
    instructions: State domains and distinguish assumptions from goals.
    questions:
      - id: 1
        type: reasoning
        prompt: 'State the hypotheses and conclusion of: for integers $a,b$, if both are odd then $a+b$ is even.'
        answerLines: 3
        answer:
          Choose arbitrary integers $a,b$; assume each is odd. The goal is an integer $t$ with $a+b=2t$.
          Oddness is a hypothesis, not a conclusion.
      - id: 2
        type: reasoning
        prompt: Expand $d\mid n$ using an existential quantifier over integers. Is $d=0$ excluded by this definition?
        answerLines: 3
        answer:
          '$d\mid n$ means $\exists k\in\mathbb Z,\ n=dk$. Zero is allowed: $0\mid n$ holds exactly when
          $n=0$.'
      - id: 3
        type: reasoning
        prompt: Give witnesses showing that $-8$ is even and $-7$ is odd.
        answerLines: 3
        answer: $-8=2(-4)$ and $-7=2(-4)+1$. Both witnesses are integers, as required by the definitions.
      - id: 4
        type: reasoning
        prompt: What two conditions must a fraction $a/b$ meet to establish rationality?
        answerLines: 3
        answer:
          Its numerator and denominator must be integers, and $b\ne0$. A formal fraction with an unspecified
          or zero denominator does not suffice.
      - id: 5
        type: reasoning
        prompt: Why must independent odd integers usually be written $2r+1$ and $2s+1$, not both $2k+1$?
        answerLines: 3
        answer:
          Independent existential hypotheses may have different witnesses. Reusing $k$ would force the two
          integers to be equal and would prove only a restricted case.
      - id: 6
        type: reasoning
        prompt: State the proof obligations for $A=B$ using subset inclusions.
        answerLines: 3
        answer:
          Establish $A\subseteq B$ and $B\subseteq A$. In each direction choose an arbitrary element of the
          first set and show membership in the other.
      - id: 7
        type: reasoning
        prompt: State what must be proved for an integer to be the unique solution of an equation.
        answerLines: 3
        answer:
          Show existence by verifying an integer solution, then show at most one by taking any two integer
          solutions and proving they are equal.
      - id: 8
        type: reasoning
        prompt: Translate the goal that the product of two even integers is divisible by 4 into a witness equation.
        answerLines: 3
        answer:
          For arbitrary even integers $a,b$, the goal is $ab=4t$ for some integer $t$. Merely showing $ab=2t$
          proves only evenness.
      - id: 9
        type: reasoning
        prompt: Explain why an arbitrary integer differs from a randomly selected example in a universal proof.
        answerLines: 3
        answer:
          The arbitrary integer has no extra property beyond the stated assumptions, so the deduction covers
          every allowed integer. A sampled example establishes only its own instance.
      - id: 10
        type: reasoning
        prompt: Identify a genuine counterexample's two requirements for $P(x)\to Q(x)$ on domain $D$.
        answerLines: 3
        answer:
          It must be an allowed $x\in D$ with $P(x)$ true and $Q(x)$ false. An input outside $D$ or with
          false hypothesis does not refute the claim.
  - title: B. Parity and explicit witnesses
    instructions: Prove each claim for arbitrary integers satisfying its hypotheses.
    questions:
      - id: 11
        type: reasoning
        prompt: Prove that the sum of two even integers is even.
        answerLines: 6
        answer: Let $a=2r,b=2s$ for integers $r,s$. Then $a+b=2(r+s)$. Since $r+s$ is integral, the sum is even.
      - id: 12
        type: reasoning
        prompt: Prove that the sum of an even integer and an odd integer is odd.
        answerLines: 6
        answer:
          Let $a=2r,b=2s+1$ for integers $r,s$. Then $a+b=2(r+s)+1$, with integer witness $r+s$, so the sum
          is odd.
      - id: 13
        type: reasoning
        prompt: Prove that the difference of two odd integers is even.
        answerLines: 6
        answer: Let $a=2r+1,b=2s+1$ for integers $r,s$. Their difference is $2(r-s)$, and $r-s$ is an integer.
      - id: 14
        type: reasoning
        prompt: Prove that the product of an even integer and any integer is even.
        answerLines: 6
        answer:
          Let $a=2r$ with $r\in\mathbb Z$ and let $b\in\mathbb Z$ be arbitrary. Then $ab=2(rb)$, with integer
          witness $rb$.
      - id: 15
        type: reasoning
        prompt: Prove that the product of two odd integers is odd.
        answerLines: 6
        answer:
          Write the arbitrary odd integers as $2r+1$ and $2s+1$. Their product is $2(2rs+r+s)+1$. The parenthesized
          expression is integral, proving oddness.
      - id: 16
        type: reasoning
        prompt: Prove that the square of an odd integer leaves remainder 1 on division by 8.
        answerLines: 6
        answer:
          Let $n=2k+1$. Then $n^2=4k(k+1)+1$. One of consecutive integers $k,k+1$ is even, so $k(k+1)=2t$
          for integer $t$. Thus $n^2=8t+1$.
      - id: 17
        type: reasoning
        prompt: Prove that $n(n+1)$ is even for every integer $n$, using cases.
        answerLines: 6
        answer:
          If $n=2k$, the product is $2[k(n+1)]$. If $n=2k+1$, it is $2[n(k+1)]$. Every integer is even or
          odd, and both witnesses are integers.
      - id: 18
        type: reasoning
        prompt: Prove that $n^2+n+1$ is odd for every integer $n$.
        answerLines: 6
        answer:
          For arbitrary integer $n$, the consecutive product $n(n+1)$ is even, so it equals $2t$ for integer
          $t$. Hence $n^2+n+1=2t+1$ is odd.
      - id: 19
        type: reasoning
        prompt: Prove that the sum of three odd integers is odd.
        answerLines: 6
        answer:
          Write the arbitrary odd integers as $2r+1,2s+1,2t+1$. Their sum is $2(r+s+t+1)+1$, with an integer
          witness.
      - id: 20
        type: reasoning
        prompt: Prove that if $n$ is even, then $n^2$ is divisible by 4.
        answerLines: 6
        answer:
          Write the arbitrary even integer as $n=2k$. Then $n^2=4k^2$, where $k^2\in\mathbb Z$, so $4\mid
          n^2$.
  - title: C. Divisibility and rational closure
    instructions: Use definitions and verify integer or nonzero side conditions.
    questions:
      - id: 21
        type: reasoning
        prompt: 'Prove transitivity of divisibility: $a\mid b$ and $b\mid c$ imply $a\mid c$.'
        answerLines: 6
        answer:
          For arbitrary integers satisfying the hypotheses, write $b=ar$ and $c=bs$ with integers $r,s$.
          Then $c=a(rs)$, giving the required integer witness.
      - id: 22
        type: reasoning
        prompt: Prove that $d\mid a$ and $d\mid b$ imply $d\mid(a-b)$.
        answerLines: 6
        answer:
          Write $a=dr,b=ds$ for integers $r,s$. Then $a-b=d(r-s)$, and $r-s$ is an integer. No division by
          $d$ is needed.
      - id: 23
        type: reasoning
        prompt: Prove that $d\mid a$ and $d\mid b$ imply $d\mid(5a-2b)$.
        answerLines: 6
        answer:
          Choose integer witnesses $a=dr,b=ds$. Then $5a-2b=d(5r-2s)$. The coefficient is integral, proving
          divisibility.
      - id: 24
        type: reasoning
        prompt: Prove that $a\mid b$ implies $a^2\mid b^2$ for integers $a,b$.
        answerLines: 6
        answer:
          Write $b=ak$ with integer $k$. Squaring gives $b^2=a^2k^2$, whose integer witness is $k^2$. This
          also covers $a=0$ when the hypothesis holds.
      - id: 25
        type: reasoning
        prompt: Prove that a common integer divisor of $n$ and $n+1$ divides 1.
        answerLines: 6
        answer:
          Write $n=dr,n+1=ds$ with integer witnesses. Subtract to get $1=d(s-r)$, so $d\mid1$. In particular
          any positive common divisor is 1.
      - id: 26
        type: reasoning
        prompt: Prove that the product of two rational numbers is rational.
        answerLines: 6
        answer:
          For arbitrary rationals $x=a/b,y=c/d$ with integer numerators and nonzero integer denominators,
          $xy=ac/(bd)$. Both entries are integers and $bd\ne0$, proving rationality.
      - id: 27
        type: reasoning
        prompt: Prove that the difference of two rational numbers is rational.
        answerLines: 6
        answer:
          Write arbitrary rationals as $a/b,c/d$, with $b,d\ne0$. Their difference is $(ad-bc)/(bd)$, an
          integer numerator over a nonzero integer denominator.
      - id: 28
        type: reasoning
        prompt: Prove that a nonzero rational number has a rational reciprocal.
        answerLines: 6
        answer:
          Let $x=a/b\ne0$, with integers $a,b$ and $b\ne0$. Since $x\ne0$, also $a\ne0$. The reciprocal is
          $b/a$, a rational number.
      - id: 29
        type: reasoning
        prompt: Prove that $x/y$ is rational when $x,y$ are rational and $y\ne0$.
        answerLines: 6
        answer:
          Write $x=a/b,y=c/d$, with integer entries and $b,d\ne0$. Nonzero $y$ gives $c\ne0$. Then $x/y=ad/(bc)$
          has integer numerator and nonzero integer denominator.
      - id: 30
        type: reasoning
        prompt: Prove that the average of two rational numbers is rational.
        answerLines: 6
        answer:
          For arbitrary rationals $x=a/b,y=c/d$ with nonzero integer denominators, $(x+y)/2=(ad+bc)/(2bd)$.
          Its numerator is integer and denominator is nonzero integer.
  - title: D. Cases, sets, and biconditionals
    instructions: All sets lie in a common universe. Prove every requested direction.
    questions:
      - id: 31
        type: reasoning
        prompt: Prove $A\cap B\subseteq A\cup B$ by an element argument.
        answerLines: 6
        answer:
          Choose arbitrary $x\in A\cap B$. Then $x\in A$ and $x\in B$; in particular it belongs to at least
          one, so $x\in A\cup B$.
      - id: 32
        type: reasoning
        prompt: Prove that $A\subseteq B$ and $B\subseteq C$ imply $A\subseteq C$.
        answerLines: 6
        answer:
          Choose arbitrary $x\in A$. The first inclusion gives $x\in B$, and the second gives $x\in C$. This
          covers every element of $A$.
      - id: 33
        type: reasoning
        prompt: Prove $A\cap(B\cup C)=(A\cap B)\cup(A\cap C)$.
        answerLines: 6
        answer:
          An arbitrary $x$ belongs to the left side exactly when $x\in A$ and either $x\in B$ or $x\in C$.
          By distribution this means either membership in both $A,B$ or in both $A,C$, exactly the right side.
          Each step is reversible.
      - id: 34
        type: reasoning
        prompt: Prove $A\setminus(B\cup C)=(A\setminus B)\cap(A\setminus C)$.
        answerLines: 6
        answer:
          Membership on the left means $x\in A$, $x\notin B$, and $x\notin C$. This is equivalent to membership
          in both differences on the right. The equivalence holds for arbitrary ambient $x$.
      - id: 35
        type: reasoning
        prompt: Prove that $A\subseteq B$ if and only if $A\cup B=B$.
        answerLines: 6
        answer:
          If $A\subseteq B$, any element in the union is in $B$, and every $B$ element is in the union. Conversely,
          if the union equals $B$, each $x\in A$ lies in the union and hence in $B$.
      - id: 36
        type: reasoning
        prompt: Prove that an integer $n$ is odd if and only if $n+1$ is even.
        answerLines: 6
        answer:
          If $n=2k+1$, then $n+1=2(k+1)$ is even. Conversely, if $n+1=2k$, then $n=2(k-1)+1$ is odd. All
          witnesses are integers.
      - id: 37
        type: reasoning
        prompt: Prove that $6\mid n$ implies both $2\mid n$ and $3\mid n$.
        answerLines: 6
        answer:
          For arbitrary integer $n=6k$, we have $n=2(3k)$ and $n=3(2k)$. The two coefficients are integers,
          proving both parts of the conclusion.
      - id: 38
        type: reasoning
        prompt: Prove $|x|\geq x$ for every real $x$, defining absolute value by cases.
        answerLines: 6
        answer:
          If $x\geq0$, then $|x|=x$. If $x<0$, then $|x|=-x>x$. These cases cover all real numbers, so the
          inequality always holds.
      - id: 39
        type: reasoning
        prompt: Prove that $n^2\geq n$ for every integer $n$, using cases.
        answerLines: 6
        answer:
          If $n\leq0$, then $n^2\geq0\geq n$. Otherwise integrality gives $n\geq1$, so multiplying $n\geq1$
          by positive $n$ gives $n^2\geq n$.
      - id: 40
        type: reasoning
        prompt: Prove that $A\cap B=\varnothing$ if and only if $A\subseteq B^c$.
        answerLines: 6
        answer:
          Empty intersection means no element of $A$ is in $B$, so every $A$ element lies in $B^c$. Conversely,
          that inclusion makes membership in both $A$ and $B$ impossible, so the intersection is empty.
  - title: E. Constructing witnesses and uniqueness
    instructions: Verify the witness and its domain; handle uniqueness separately.
    questions:
      - id: 41
        type: reasoning
        prompt: Prove that every integer has a larger even integer.
        answerLines: 6
        answer:
          Let $n\in\mathbb Z$ be arbitrary and choose $m=2|n|+2$. It is even and integral, and $m\geq2n+2>n$
          for $n\geq0$; for $n<0$, $m>0>n$.
      - id: 42
        type: reasoning
        prompt: Prove that between real numbers $a<b$ there is a real number.
        answerLines: 6
        answer:
          Choose $c=(a+b)/2$. Both $c-a$ and $b-c$ equal the positive number $(b-a)/2$, so $a<c<b$ and $c$
          is real.
      - id: 43
        type: reasoning
        prompt: Prove that between rational numbers $a<b$ there is a rational number.
        answerLines: 6
        answer:
          Choose $c=(a+b)/2$, rational by rational closure. The differences $c-a=b-c=(b-a)/2$ are positive,
          so the rational witness lies strictly between them.
      - id: 44
        type: reasoning
        prompt:
          Prove that every integer $n$ can be expressed as a difference of two odd integers exactly when
          $n$ is even.
        answerLines: 6
        answer:
          A difference of odd integers is even. Conversely, if $n=2k$, choose the odd integers $2k+1$ and
          1; their difference is $n$. This proves both directions.
      - id: 45
        type: reasoning
        prompt: Prove that each integer $n$ has a unique integer $m$ satisfying $n+m=0$.
        answerLines: 6
        answer:
          'Existence: $m=-n$ is integral and satisfies the equation. Uniqueness: any solutions $a,b$ satisfy
          $n+a=n+b=0$, so subtraction of $n$ gives $a=b$.'
      - id: 46
        type: reasoning
        prompt: Prove that for every real $y$ there is exactly one real $x$ with $3x+2=y$.
        answerLines: 6
        answer:
          'Existence: $x=(y-2)/3$ is real and substitution gives $y$. If $3a+2=y=3b+2$, then $3a=3b$ and
          $a=b$, proving uniqueness.'
      - id: 47
        type: reasoning
        prompt: Prove that there exists an integer divisible by both 4 and 6 but not by 5.
        answerLines: 6
        answer:
          Choose 12. It equals $4\cdot3$ and $6\cdot2$. It is not divisible by 5 because $12=5\cdot2+2$ has
          nonzero remainder.
      - id: 48
        type: reasoning
        prompt: Prove that every positive integer $n$ divides some larger positive integer.
        answerLines: 6
        answer: For arbitrary positive $n$, choose $m=2n$. It is positive, $n\mid m$ with witness 2, and $m-n=n>0$.
      - id: 49
        type: reasoning
        prompt: Prove that a nonempty finite set of integers can have at most one least element.
        answerLines: 6
        answer:
          If $a,b$ are both least, then $a\leq b$ and $b\leq a$. Antisymmetry of integer order gives $a=b$.
          This proves at most one; no existence argument is needed for the stated claim.
      - id: 50
        type: reasoning
        prompt: Prove that $f:\mathbb Z\to\mathbb Z$, $f(n)=5n-3$, is injective.
        answerLines: 6
        answer:
          Let arbitrary integers $a,b$ satisfy $f(a)=f(b)$. Then $5a-3=5b-3$, so $5(a-b)=0$ and $a=b$. This
          is exactly injectivity.
  - title: F. Counterexamples and missing assumptions
    instructions: For a false universal claim, give an allowed counterexample and verify both sides.
    questions:
      - id: 51
        type: reasoning
        prompt: 'Refute: every integer is the sum of two even integers.'
        answerLines: 4
        answer:
          The integer 1 is a counterexample. Any sum $2r+2s=2(r+s)$ is even, while 1 is odd, so no such representation
          exists.
      - id: 52
        type: reasoning
        prompt: 'Refute: if $ab$ is even, then both integers $a,b$ are even.'
        answerLines: 4
        answer:
          Choose $a=2,b=3$. Their product 6 is even but $b$ is odd, so the conclusion that both are even
          fails.
      - id: 53
        type: reasoning
        prompt: 'Refute: if $a\mid b$, then $b\mid a$.'
        answerLines: 4
        answer:
          Choose $a=2,b=6$. We have $6=2\cdot3$, but no integer $k$ has $2=6k$. Thus the hypothesis holds
          and conclusion fails.
      - id: 54
        type: reasoning
        prompt: 'Refute: the quotient of any two rational numbers is rational. State a repair.'
        answerLines: 4
        answer:
          Taking divisor 0 makes the quotient undefined, so the assertion is not valid as written. Require
          the divisor to be a nonzero rational number; rational division closure then applies.
      - id: 55
        type: reasoning
        prompt: 'Refute: between any distinct integers there is another integer.'
        answerLines: 4
        answer:
          'Between 2 and 3 no integer exists: an integer greater than 2 is at least 3. The midpoint 2.5 is
          not an allowed integer witness.'
      - id: 56
        type: reasoning
        prompt: Refute $A\setminus B=B\setminus A$ for arbitrary sets.
        answerLines: 4
        answer: Set $A=\{1\}$ and $B=\varnothing$. Then $A\setminus B=\{1\}$ while $B\setminus A=\varnothing$.
      - id: 57
        type: reasoning
        prompt: 'Refute: $A\cup B=A\cup C$ always implies $B=C$.'
        answerLines: 4
        answer: Let $A=\{1\},B=\varnothing,C=\{1\}$. Both unions are $\{1\}$, but $B\ne C$.
      - id: 58
        type: reasoning
        prompt: 'Refute: if $n^2\geq n$, then the real number $n$ is an integer.'
        answerLines: 4
        answer: Choose $n=3/2$. Its square is $9/4\geq3/2$, but $3/2$ is not an integer.
      - id: 59
        type: reasoning
        prompt: 'Refute: a function is injective if one output has exactly one preimage.'
        answerLines: 4
        answer:
          Define $f:\{1,2,3\}\to\{a,b\}$ by $f(1)=a,f(2)=b,f(3)=b$. Output $a$ has one preimage, but distinct
          inputs 2 and 3 collide, so the function is not injective.
      - id: 60
        type: reasoning
        prompt: 'Refute: $A\subseteq B$ proves $A=B$.'
        answerLines: 4
        answer:
          Let $A=\{1\}$ and $B=\{1,2\}$. Every element of $A$ belongs to $B$, but 2 belongs only to $B$.
          The reverse inclusion is missing.
  - title: G. Diagnose and repair proofs
    instructions: Explain the gap and provide the corrected reasoning requested.
    questions:
      - id: 61
        type: reasoning
        prompt: An even-square proof chooses $n=8$ and checks $64$. Repair its universal step.
        answerLines: 5
        answer:
          The example covers only 8. Instead choose any even integer $n=2k$ with $k\in\mathbb Z$. Then $n^2=2(2k^2)$,
          which is even because its witness is integral.
      - id: 62
        type: reasoning
        prompt: A proof writes $a=2k+1,b=2k+1$ for arbitrary odd $a,b$. Repair the sum argument.
        answerLines: 5
        answer:
          Use independent integer witnesses $a=2r+1,b=2s+1$. Then $a+b=2(r+s+1)$ is even. A shared witness
          unjustifiably assumed $a=b$.
      - id: 63
        type: reasoning
        prompt: A proof claims $n^2=2k$ implies $n=2\sqrt{k/2}$ and hence evenness. What is missing?
        answerLines: 6
        answer:
          'There are two gaps. Taking the positive square root loses negative solutions: $n=-2,k=2$ satisfies
          $n^2=2k$ but not the claimed equation for $n$. Even for $n\geq0$, the argument does not show that $\sqrt{k/2}$
          is an integer, as the evenness definition requires. A valid proof shows odd integer inputs have odd squares
          and uses contraposition.'
      - id: 64
        type: reasoning
        prompt: A proof of rational addition omits the denominator check. Complete it.
        answerLines: 5
        answer:
          Write $x=a/b,y=c/d$ with all entries integral and $b,d\ne0$. Then $x+y=(ad+bc)/(bd)$ has integral
          numerator and denominator, and $bd\ne0$, which completes the rationality definition.
      - id: 65
        type: reasoning
        prompt: A proof of $x^2\geq0$ splits real $x$ into positive and negative cases. Repair it.
        answerLines: 5
        answer:
          Add $x=0$, where $x^2=0$. If $x>0$, multiplying positives gives $x^2>0$. If $x<0$, then $-x>0$
          and $x^2=(-x)^2>0$. All real inputs are covered.
      - id: 66
        type: reasoning
        prompt:
          A proof cancels $a$ from $ab=ac$ without hypotheses. State the missing assumption and a counterexample
          without it.
        answerLines: 5
        answer: Require $a\ne0$ to divide by $a$. Without it, $a=0,b=1,c=2$ gives equal products but $b\ne c$.
      - id: 67
        type: reasoning
        prompt: A proof of set equality establishes only the left-to-right inclusion. What remains, and why?
        answerLines: 5
        answer:
          Prove every element of the right-hand set belongs to the left-hand set. One inclusion permits extra
          elements on the right, as $\{1\}\subseteq\{1,2\}$ shows.
      - id: 68
        type: reasoning
        prompt: A witness proof for $\forall n\in\mathbb Z\exists m\in\mathbb Z,\ m>n$ chooses $m=10$. Repair it.
        answerLines: 5
        answer:
          The fixed choice fails for $n\geq10$. After arbitrary $n$ is given, choose $m=n+1$; it is integral
          and exceeds $n$.
      - id: 69
        type: reasoning
        prompt: A uniqueness proof shows any two solutions equal but never finds a solution. What does it establish?
        answerLines: 5
        answer:
          It proves at most one solution, which also allows zero solutions. To claim exactly one, separately
          exhibit a solution or otherwise prove existence.
      - id: 70
        type: reasoning
        prompt: A proposed counterexample to even $n\to4\mid n$ chooses $n=3$. Repair it.
        answerLines: 5
        answer:
          'The hypothesis is false at 3, so it is not a counterexample. Choose 6: it is even but leaves remainder
          2 on division by 4.'
  - title: H. Mixed proof practice
    instructions: Write complete arguments and state any side conditions explicitly.
    questions:
      - id: 71
        type: reasoning
        prompt: Prove that the sum of two integers with the same parity is even.
        answerLines: 7
        answer:
          Let arbitrary integers $a,b$ have the same parity. If both are even, write $a=2r,b=2s$, giving
          sum $2(r+s)$. If both are odd, write $a=2r+1,b=2s+1$, giving sum $2(r+s+1)$. Both exhaustive cases have
          integer witnesses.
      - id: 72
        type: reasoning
        prompt: Prove that $d\mid a$ implies $d\mid a^2$ for all integers $d,a$.
        answerLines: 7
        answer:
          For arbitrary $d,a$ satisfying the hypothesis, write $a=dk$ with integer $k$. Then $a^2=d(ka)$,
          where $ka$ is an integer. This handles zero and negative values without division.
      - id: 73
        type: reasoning
        prompt: Prove that if $a,b$ are rational and $a<b$, there are two distinct rationals strictly between them.
        answerLines: 7
        answer:
          Choose $u=(2a+b)/3$ and $v=(a+2b)/3$. Rational closure gives rational witnesses. Each of $u-a,v-u,b-v$
          equals $(b-a)/3>0$, so $a<u<v<b$.
      - id: 74
        type: reasoning
        prompt: Prove that $A\subseteq B$ implies $A\cap C\subseteq B\cap C$.
        answerLines: 7
        answer:
          Let arbitrary $x\in A\cap C$. Then $x\in A$ and $x\in C$. The assumed inclusion gives $x\in B$,
          so $x\in B\cap C$, proving the inclusion.
      - id: 75
        type: reasoning
        prompt: Prove that $A\subseteq B$ implies $A\cup C\subseteq B\cup C$.
        answerLines: 7
        answer:
          Choose arbitrary $x\in A\cup C$. If $x\in A$, then $x\in B$ and hence the target union. If $x\in
          C$, it belongs to the target union directly. These cases cover the source union.
      - id: 76
        type: reasoning
        prompt: Prove that the composition of injective functions $f:A\to B$ and $g:B\to C$ is injective.
        answerLines: 7
        answer:
          For arbitrary $x,y\in A$, suppose $g(f(x))=g(f(y))$. Injectivity of $g$ gives $f(x)=f(y)$; injectivity
          of $f$ gives $x=y$. Thus equal composite outputs force equal inputs.
      - id: 77
        type: reasoning
        prompt: Prove that the composition of surjective functions $f:A\to B$ and $g:B\to C$ is surjective.
        answerLines: 7
        answer:
          Given arbitrary $c\in C$, surjectivity of $g$ supplies $b\in B$ with $g(b)=c$. Surjectivity of
          $f$ supplies $a\in A$ with $f(a)=b$. Then $g(f(a))=c$, giving an allowed preimage for every target.
      - id: 78
        type: reasoning
        prompt: Prove that for real $x,y$, if $x\geq y\geq0$ then $x^2\geq y^2$.
        answerLines: 7
        answer:
          For arbitrary real $x,y$ meeting the hypotheses, $x-y\geq0$ and $x+y\geq0$. Their product is nonnegative,
          so $x^2-y^2=(x-y)(x+y)\geq0$.
      - id: 79
        type: reasoning
        prompt: Prove that an integer is divisible by 4 if and only if it is twice an even integer.
        answerLines: 7
        answer:
          If $n=4k$, choose the even integer $m=2k$, so $n=2m$. Conversely, if $n=2m$ with even $m=2k$, then
          $n=4k$. Both constructions use integer witnesses.
      - id: 80
        type: reasoning
        prompt: Prove that $f:\mathbb R\to\mathbb R$, $f(x)=2x-5$, is a bijection and give its inverse.
        answerLines: 7
        answer:
          Equal outputs $2a-5=2b-5$ force $a=b$, proving injectivity. For arbitrary real target $y$, $x=(y+5)/2$
          is real and maps to $y$, proving surjectivity. Thus $f^{-1}(y)=(y+5)/2$; substitution verifies both inverse
          identities.
