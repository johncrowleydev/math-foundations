  - title: K. Satisfiability
    instructions:
      A formula is satisfiable if at least one assignment makes it true. Give a model when one
      exists.
    questions:
      - id: 127
        type: reasoning
        prompt: Satisfiable or unsatisfiable? Explain.
        answerLines: 3
        answer: 'Unsatisfiable: $p$ and $\neg p$ cannot both be true.'
        math: p\land\neg p
      - id: 128
        type: reasoning
        prompt: Is this satisfiable? Is it stronger than merely satisfiable?
        answerLines: 3
        answer: Yes; it is a tautology, satisfied by every assignment.
        math: p\lor\neg p
      - id: 129
        type: reasoning
        prompt: Is this satisfiable? Give a model.
        answerLines: 3
        answer: 'Yes: $p=T$, $q=T$.'
        math: p\land q
      - id: 130
        type: reasoning
        prompt: Is this satisfiable?
        answerLines: 3
        answer: No. The required $p=T$, $q=F$ makes the implication false.
        math: (p\to q)\land p\land\neg q
      - id: 131
        type: reasoning
        prompt: Is this satisfiable? Give a model.
        answerLines: 3
        answer: 'Yes: $p=F$, $q=T$.'
        math: (p\lor q)\land\neg p
      - id: 132
        type: reasoning
        prompt: Is this satisfiable?
        answerLines: 3
        answer: No. The biconditional requires equal values, while $p\land\neg q$ requires different values.
        math: (p\leftrightarrow q)\land p\land\neg q
      - id: 133
        type: reasoning
        prompt: Is this satisfiable? Explain.
        answerLines: 4
        answer: No. $p$ forces $q$, then $r$, contradicting $\neg r$.
        math: (p\to q)\land(q\to r)\land p\land\neg r
      - id: 134
        type: reasoning
        prompt: Determine satisfiability; give a model if one exists.
        answerLines: 4
        answer: 'Satisfiable: $p=T$, $q=F$, $r=T$.'
        math: (p\lor q)\land(\neg p\lor r)\land\neg q
      - id: 135
        type: reasoning
        prompt: Determine satisfiability.
        answerLines: 3
        answer: Unsatisfiable. The first clause needs one true, but the other clauses require both false.
        math: (p\lor q)\land\neg p\land\neg q
      - id: 136
        type: reasoning
        prompt: Is every tautology satisfiable? Explain.
        answerLines: 3
        answer: Yes. True under every assignment implies true under at least one.
      - id: 137
        type: reasoning
        prompt: Can a contradiction be satisfiable? Explain.
        answerLines: 3
        answer: No. It is false under every assignment.
      - id: 138
        type: reasoning
        prompt: Is every satisfiable formula a tautology? Give an example.
        answerLines: 3
        answer: No. $p$ is satisfiable but false when $p=F$.
  - title: L. Comprehensive challenges
    instructions: Mix the ideas from the entire lesson. Show your reasoning.
    questions:
      - id: 139
        type: reasoning
        prompt:
          'Translate and assess validity: if the deploy succeeds, tests pass. If tests pass, monitoring
          is green. The deploy succeeds. Therefore monitoring is green.'
        answerLines: 5
        answer:
          Let $p$ = deploy succeeds, $q$ = tests pass, $r$ = monitoring green. Premises $p\to q$, $q\to
          r$, $p$; conclusion $r$. Valid by hypothetical syllogism and modus ponens.
      - id: 140
        type: reasoning
        prompt: Are the converse and inverse always equivalent? Show by rewriting.
        answerLines: 4
        answer:
          'Yes. Converse: $q\to p\equiv\neg q\lor p$. Inverse: $\neg p\to\neg q\equiv p\lor\neg q$.
          Commutativity makes these equal.'
      - id: 141
        type: reasoning
        prompt: Simplify using only NOT, AND, and OR.
        answerLines: 4
        answer: $p\land\neg q\land\neg r$.
        math: \neg(p\to(q\lor r))
      - id: 142
        type: reasoning
        prompt: Simplify using De Morgan's laws.
        answerLines: 4
        answer: $(\neg p\lor\neg q)\land\neg r$.
        math: \neg((p\land q)\lor r)
      - id: 143
        type: reasoning
        prompt: Prove the equivalence using words, a truth table, or laws.
        answerLines: 5
        answer: Both are true exactly when $p,q$ are both true or both false.
        math: p\leftrightarrow q\equiv(p\land q)\lor(\neg p\land\neg q)
      - id: 144
        type: reasoning
        prompt: Classify as tautology, contradiction, or contingency. Explain.
        answerLines: 4
        answer: 'Tautology: an implication is equivalent to its contrapositive.'
        math: (p\to q)\leftrightarrow(\neg q\to\neg p)
      - id: 145
        type: reasoning
        prompt: Classify as tautology, contradiction, or contingency.
        answerLines: 4
        answer:
          'Contingency. Equivalent to $p\leftrightarrow q$: true when the values match, false when they
