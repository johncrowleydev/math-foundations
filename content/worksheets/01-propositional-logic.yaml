  - title: M. From laws to proofs
    instructions: Three additional exercises connect the practice set to the remaining lesson examples.
    questions:
      - id: 151
        type: reasoning
        prompt: Use associativity and commutativity to put $p$ first and group $q,r$.
        answerLines: 4
        answer: $(q\land p)\land r\equiv(p\land q)\land r\equiv p\land(q\land r)$.
        math: (q\land p)\land r
      - id: 152
        type: reasoning
        prompt: 'For an integer $n$, prove by contrapositive: if $n^2$ is even, then $n$ is even.'
        answerLines: 6
        answer:
          If $n$ is odd, write $n=2k+1$. Then $n^2=2(2k^2+2k)+1$ is odd. This proves the contrapositive
          and hence the original.
      - id: 153
        type: reasoning
        prompt: Can a valid argument have false premises in the real world? Explain.
        answerLines: 4
        answer:
          Yes. Validity excludes an assignment with all premises true and conclusion false; it does
          not assert the premises are actually true.
