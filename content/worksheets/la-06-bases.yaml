title: Bases, Coordinates, and Dimension
sections:
  - title: A basis gives unique coordinates
    questions:
      - id: 1
        type: freeform
        prompt: For the ordered basis p=(1,1), q=(1,-1), find the coordinates of (5,1). Distinguish them from standard coordinates.
        answerLines: 5
        answer: Solving a+b=5 and a-b=1 gives a=3, b=2. The coordinates in the ordered basis (p,q) are (3,2); standard coordinates remain (5,1).
      - id: 3
        type: freeform
        prompt: Find the coordinates of (3, -1) in the ordered basis p=(1,1), q=(1,-1). Reconstruct the original vector.
        answerLines: 5
        answer: The coefficients c,d satisfy c+d=3, c-d=-1, so c=1,d=2. The basis-coordinate list is (1, 2); its reconstruction 1p+(2)q is (3, -1).
      - id: 4
        type: freeform
        prompt: Find the coordinates of (1, 3) in the ordered basis p=(1,1), q=(1,-1). Reconstruct the original vector.
        answerLines: 5
        answer: The coefficients c,d satisfy c+d=1, c-d=3, so c=2,d=-1. The basis-coordinate list is (2, -1); its reconstruction 2p+(-1)q is (1, 3).
      - id: 5
        type: freeform
        prompt: Find the coordinates of (2, -4) in the ordered basis p=(1,1), q=(1,-1). Reconstruct the original vector.
        answerLines: 5
        answer: The coefficients c,d satisfy c+d=2, c-d=-4, so c=-1,d=3. The basis-coordinate list is (-1, 3); its reconstruction -1p+(3)q is (2, -4).
      - id: 6
        type: freeform
        prompt: Find the coordinates of (2, -2) in the ordered basis p=(1,1), q=(1,-1). Reconstruct the original vector.
        answerLines: 5
        answer: The coefficients c,d satisfy c+d=2, c-d=-2, so c=0,d=2. The basis-coordinate list is (0, 2); its reconstruction 0p+(2)q is (2, -2).
      - id: 7
        type: freeform
        prompt: Find the coordinates of (3, 3) in the ordered basis p=(1,1), q=(1,-1). Reconstruct the original vector.
        answerLines: 5
        answer: The coefficients c,d satisfy c+d=3, c-d=3, so c=3,d=0. The basis-coordinate list is (3, 0); its reconstruction 3p+(0)q is (3, 3).
      - id: 8
        type: freeform
        prompt: Find the coordinates of (-3, -1) in the ordered basis p=(1,1), q=(1,-1). Reconstruct the original vector.
        answerLines: 5
        answer: The coefficients c,d satisfy c+d=-3, c-d=-1, so c=-2,d=-1. The basis-coordinate list is (-2, -1); its reconstruction -2p+(-1)q is (-3, -1).
      - id: 62
        type: freeform
        prompt: Why must coordinates in an ordered basis be unique?
        answerLines: 5
        answer: Subtracting two different coefficient representations would give a nontrivial zero combination of the basis vectors, contradicting independence.
  - title: Extracting a basis rather than guessing one
    questions:
      - id: 9
        type: freeform
        prompt: Give a basis and dimension for the subspace consisting of (x,y,z) with z=1x+2y. Prove both spanning and independence.
        answerLines: 5
        answer: Every vector equals x(1, 0, 1)+y(0, 1, 2). These two vectors span, and their first two coordinates force both coefficients to zero in a zero combination. They form a basis, and the dimension is two.
      - id: 10
        type: freeform
        prompt: Give a basis and dimension for the subspace consisting of (x,y,z) with z=2x- 1y. Prove both spanning and independence.
        answerLines: 5
        answer: Every vector equals x(1, 0, 2)+y(0, 1, -1). These two vectors span, and their first two coordinates force both coefficients to zero in a zero combination. They form a basis, and the dimension is two.
      - id: 11
        type: freeform
        prompt: Give a basis and dimension for the subspace consisting of (x,y,z) with z=-1x+3y. Prove both spanning and independence.
        answerLines: 5
        answer: Every vector equals x(1, 0, -1)+y(0, 1, 3). These two vectors span, and their first two coordinates force both coefficients to zero in a zero combination. They form a basis, and the dimension is two.
      - id: 12
        type: freeform
        prompt: Give a basis and dimension for the subspace consisting of (x,y,z) with z=0x+2y. Prove both spanning and independence.
        answerLines: 5
        answer: Every vector equals x(1, 0, 0)+y(0, 1, 2). These two vectors span, and their first two coordinates force both coefficients to zero in a zero combination. They form a basis, and the dimension is two.
      - id: 13
        type: freeform
        prompt: Give a basis and dimension for the subspace consisting of (x,y,z) with z=3x+0y. Prove both spanning and independence.
        answerLines: 5
        answer: Every vector equals x(1, 0, 3)+y(0, 1, 0). These two vectors span, and their first two coordinates force both coefficients to zero in a zero combination. They form a basis, and the dimension is two.
      - id: 14
        type: freeform
        prompt: Give a basis and dimension for the subspace consisting of (x,y,z) with z=-2x- 1y. Prove both spanning and independence.
        answerLines: 5
        answer: Every vector equals x(1, 0, -2)+y(0, 1, -1). These two vectors span, and their first two coordinates force both coefficients to zero in a zero combination. They form a basis, and the dimension is two.
      - id: 61
        type: freeform
        prompt: If a list spans a subspace but is dependent, explain how a basis can be extracted.
        answerLines: 5
        answer: Find a vector expressible through the others and remove it without changing the span. Repeat until the remaining spanning list is independent.
  - title: Dimension and the ambient space
    questions:
      - id: 2
        type: freeform
        prompt: Give a basis and dimension for the subspace consisting of all multiples of (2,-1,3). Explain why one vector suffices.
        answerLines: 5
        answer: The one-vector list containing (2,-1,3) is a basis. It spans by the definition of the subspace and is independent because that vector is nonzero. The dimension is one.
      - id: 60
        type: freeform
        prompt: Give a basis for the zero-only subspace. Why is the list containing zero not a basis?
        answerLines: 5
        answer: The empty list is a basis and the dimension is zero. A list containing zero is dependent, so it is not a basis.
      - id: 68
        type: freeform
        prompt: Can vectors be a basis of a proper subspace but fail to be a basis of the ambient space? Give an example.
        answerLines: 5
        answer: The single vector (1,0,0) is a basis of the first coordinate axis but does not span the full three-dimensional space.
