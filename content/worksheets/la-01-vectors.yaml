      - id: 65
        type: freeform
        prompt: Two observations with matching coordinate meanings are (2, -1) and (3, 4). Find their componentwise average. Explain why the average need not be an actually observed record.
        answerLines: 5
        answer: 'Add first, then multiply every component by one half: (5/2, 3/2). The calculation summarizes the two records; it does not assert that an object with these values was observed or is physically feasible.'
