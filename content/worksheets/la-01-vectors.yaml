      - id: 71
        type: freeform
        prompt: A model doubles its output when production doubles in one experiment. Has proportionality for all production amounts been proved? Explain.
        answerLines: 5
        answer: No. One successful test is evidence for one input pair, not a universal property. Setup thresholds or changing waste rates could still make other amounts fail.
      - id: 72
        type: freeform
        prompt: A mixture recipe uses coefficients one half and one half. Why can fractional coefficients be meaningful here even if they were disallowed for numbers of finished products?
        answerLines: 5
        answer: The coefficients can denote fractions of an amount of mixture. Feasibility comes from the application; it is not a universal restriction to integer coefficients.
      - id: 73
        type: freeform
        prompt: Explain why adding a vector of temperatures to a vector of prices is not made meaningful merely by their having the same length.
        answerLines: 5
        answer: Matching component counts makes the formal operation defined, but the coordinates have incompatible quantities and units. The application has not specified a meaningful combined measurement.
      - id: 74
        type: freeform
        prompt: A traveler ends where they started after a long walk. What can you conclude about displacement and distance?
        answerLines: 5
        answer: Displacement is zero because the endpoints agree. Distance can be positive; it records the total lengths of the traveled pieces.
