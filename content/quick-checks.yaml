propositional-logic:
  - id: quick-1
    after: 'Disjunction: OR'
    prompt: A rule accepts applicants with teaching OR research experience. Does someone with both satisfy this rule?
    options:
      - Yes
      - No
    answer: 0
    explanation: Inclusive OR requires at least one condition. Having both satisfies it too.
    teachingHash: 6d167ec03c8e5e0c7e0459ebeb548f4cb08bcbe952feadcbc24c9eeca591b572
  - id: quick-2
    after: Common equivalence laws
    prompt: Which expression is equivalent to $(p\land q)\lor(p\land\neg q)$?
    options:
      - $p$
      - $q$
      - $p\land q$
    answer: 0
    explanation: Both alternatives require $p$. Factoring gives $p\land(q\lor\neg q)$. The parentheses are always true, leaving $p$.
    teachingHash: f820fed523590f53ca5ef0e68909754320a2225aa848167d8fa71da857e6b695
predicates-and-quantifiers:
  - id: quick-1
    after: 'Existential quantification: there exists'
    prompt: To establish $\exists x\in\mathbb Z\,(x>10)$, how many verified examples are enough?
    options:
      - One
      - Every integer must be checked
      - Exactly two
    answer: 0
    explanation: 'One allowed integer is enough: 11 belongs to the domain and is greater than 10. Such an example is a witness.'
    teachingHash: fb186307d1248f97c738a0f37f361a23071d8abe28d4c44c453f3d83d6ed62a3
  - id: quick-2
    after: Several variables and quantifier order
    prompt: In $\forall x\in\mathbb Z\exists y\in\mathbb Z\,(y>x)$, may the chosen $y$ depend on $x$?
    options:
      - Yes
      - No
    answer: 0
    explanation: Yes. We receive $x$ before choosing $y$, so $y=x+1$ works. Reversing the quantifiers would require one integer larger than every integer.
    teachingHash: 0edefe1e102e07a322121b876181d92c420a62e9c6567f13885646e8b02b4855
sets-and-set-operations:
  - id: quick-1
    after: Membership and subsets are different
    prompt: Let $A=\{1,2\}$. Which statement is true?
    options:
      - $\{1\}\in A$
      - $\{1\}\subseteq A$
      - $3\in A$
    answer: 1
    explanation: The only element of $\{1\}$ is in $A$, so it is a subset. The elements of $A$ are the numbers 1 and 2, not the set $\{1\}$.
    teachingHash: afb554ebea35e92e548d003c90fe97c63c9b9d9eb388cd11ab4c839d0b56a798
  - id: quick-2
    after: Power sets
    prompt: How many subsets does $\{a,b\}$ have?
    options:
      - '2'
      - '3'
      - '4'
    answer: 2
    explanation: "There are four: $\\varnothing$, $\\{a\\}$, $\\{b\\}$, and $\\{a,b\\}$. Each element can independently be included or omitted."
    teachingHash: f9f8de6a3c4b4feeaa0cc456c54d4fa000400e4ae643300eea4b8465e9222a21
relations:
  - id: quick-1
    after: Four fundamental properties
    prompt: A symmetric relation must relate every object to itself.
    options:
      - 'True'
      - 'False'
    answer: 1
    explanation: Symmetry says that any existing pair can be reversed. Requiring every self-pair is reflexivity, a different property.
    teachingHash: 2658ae4755bfd5de090d66e8145af5915a5faef785d476ffcc3ed1bfab724321
  - id: quick-2
    after: Partial and total orders
    prompt: Must every pair of elements in a partial order be comparable?
    options:
      - Yes
      - No
    answer: 1
    explanation: No. For example, the subsets {1} and {2} are incomparable under inclusion. A total order adds the requirement that every pair be comparable.
    teachingHash: f3f001d48cce60516f745174981e488c3e2a1b2545bac3c7c00795477a2c6807
functions:
  - id: quick-1
    after: Surjective functions
    prompt: A function assigns different outputs to different inputs, but misses one element of its codomain. Which description fits?
    options:
      - Injective but not surjective
      - Surjective but not injective
      - Both injective and surjective
    answer: 0
    explanation: Different inputs remain distinguishable, so the function is injective. The missed target prevents surjectivity.
    teachingHash: 34605129db1b1a287ca3063984f1337476a629f6b085fcd09c3348eebf1855e2
  - id: quick-2
    after: Floor and ceiling functions
    prompt: What is $\lfloor-1.2\rfloor$?
    options:
      - −1
      - −2
      - '0'
    answer: 1
    explanation: The floor is the greatest integer no larger than the input. That integer is −2; −1 is larger than −1.2.
    teachingHash: efb87f0726a743c9c1afaf9aa1e1424d47fe9648712ceffa0b1fbf0292910996
sequences-and-summations:
  - id: quick-1
    after: Summation notation and term counts
    prompt: How many terms occur in $\sum_{k=0}^{4}a_k$?
    options:
      - '4'
      - '5'
      - '6'
    answer: 1
    explanation: 'Both endpoints are included: the indices are 0, 1, 2, 3, and 4. The starting index is not the number of terms.'
    teachingHash: be99e9513b8fca33e37d10bbdbf943278186c4049e1fceb27c0fe0e3941d7762
  - id: quick-2
    after: Reindexing and telescoping
    prompt: What remains in $(b_2-b_1)+(b_3-b_2)+(b_4-b_3)$?
    options:
      - $b_4-b_1$
      - $b_4+b_1$
      - $0$
    answer: 0
    explanation: The intermediate terms $b_2$ and $b_3$ cancel. The first negative term and last positive term have no partners, leaving $b_4-b_1$.
    teachingHash: 7e6cab4b50f952d27b969704b741ccc995c81d4354f9eff25a94daec67716633
direct-proof:
  - id: quick-1
    after: Unpack definitions
    prompt: Which representation states that an integer n is odd?
    options:
      - $n=2k$ for some integer $k$
      - $n=2k+1$ for some integer $k$
      - $n=2k+1$ for some real $k$
    answer: 1
    explanation: The integer restriction on k is essential. Allowing any real k would make the third description hold for every integer, including even ones.
    teachingHash: 66c3ba6c14e14efd4fd623e1d08a70c716d5d8013e8a1693c939c17ea7c77ea1
  - id: quick-2
    after: Constructive existence
    prompt: An existence proof proposes an object with the required property. Must it also check that the object belongs to the allowed domain?
    options:
      - Yes
      - No
    answer: 0
    explanation: Yes. A proposed witness must pass both checks. A real number between two consecutive integers does not establish the existence of an integer between them.
    teachingHash: b334ba133538d57ee9991e3e58079459a011765fd7715e7a46c8e081b7587149
proof-by-contrapositive:
  - id: quick-1
    after: The proof template
    prompt: To prove $P\to Q$ by contrapositive, where do you start?
    options:
      - Assume $Q$
      - Assume $\neg P$
      - Assume $\neg Q$
    answer: 2
    explanation: Start with $\neg Q$ and establish $\neg P$. This proves the equivalent implication $\neg Q\to\neg P$.
    teachingHash: 05e48aeddcd892b0c41ad86e82b51d6e49df88dd6f77007c068d500e8c555c77
  - id: quick-2
    after: 'Worked proof: an even square has an even root'
    prompt: For integer $n$, which assumption starts a contrapositive proof of “if $n^2$ is even, then $n$ is even”?
    options:
      - $n$ is odd
      - $n^2$ is even
      - $n$ is even
    answer: 0
    explanation: 'Negate the conclusion: the integer n is not even, hence odd. Its odd-number representation then lets us show that its square is odd.'
    teachingHash: fa85c4b0385510e423609753572cd76442e8f6617a560d3b2fff193f129e6634
proof-by-contradiction:
  - id: quick-1
    after: The logical structure
    prompt: A contradiction proof derives a surprising result. Is surprise alone enough to finish the proof?
    options:
      - Yes
      - No
    answer: 1
    explanation: No. The result must conflict with a stated assumption, definition, or established fact. A negative number, for example, is not inherently impossible.
    teachingHash: ade1eeb7304a7aea1a8d0cca7d217ccc1f3998efda511b86069461961ccbecbf
  - id: quick-2
    after: The irrationality of the square root of 2
    prompt: Why choose $\sqrt2=a/b$ in lowest terms before proving both $a$ and $b$ even?
    options:
      - To make the denominator even
      - To ensure a shared factor of 2 contradicts the chosen representation
      - To assume the desired conclusion
    answer: 1
    explanation: Lowest terms rules out a common positive divisor greater than 1. Without that restriction, two even entries would simply describe a fraction that can be reduced.
    teachingHash: e8f686a637b07d54a2f871898dc6645160cfada948e761819c8b2b2b4c003f30
mathematical-induction:
  - id: quick-1
    after: The induction principle
    prompt: An induction has base $P(3)$ and a valid step from $P(k)$ to $P(k+1)$ for every integer $k\geq3$. What does it establish?
    options:
      - All integer indices
      - All integer indices at least 3
      - Only index 3
    answer: 1
    explanation: The base starts the chain at 3 and the step carries it forward. Neither part establishes the earlier indices.
    teachingHash: 686a3d2f69aa33c83e72d3c0596af2457bdbd8d0e7b3d7d09ebe82f76e0f73ad
  - id: quick-2
    after: Inequalities require a bridge
    prompt: A proof aiming for $2^{k+1}\geq(k+1)^2$ has reached $2^{k+1}\geq2k^2$. What remains?
    options:
      - Prove $2k^2\geq(k+1)^2$ in the step's range
      - Nothing; the step is finished
      - Assume $2^{k+1}=(k+1)^2$
    answer: 0
    explanation: The hypothesis supplied an intermediate bound. A further comparison must connect that bound to the target; this is the bridge in the inductive step.
    teachingHash: 741dba1350470df6987a3c5676096d4dbd80ccedb45bbf9e49e007bb50f5f749
strong-induction:
  - id: quick-1
    after: The strong induction principle
    prompt: While proving $P(n)$ for integer indices starting at 2, which case may strong induction supply? Assume $n\geq4$.
    options:
      - $P(n)$
      - $P(1)$
      - $P(n-2)$
    answer: 2
    explanation: The index $n-2$ is at least 2 and strictly below $n$. The current case is not available, and index 1 is outside the theorem's range.
    teachingHash: f723473a7a83ef9d036f16a091ac8ccfc7c04116aead278d0211e1d7c0ff913d
  - id: quick-2
    after: Postage with several base cases
    prompt: A construction adds 4-unit stamps and aims to cover every amount from 18 onward. Which base block supports that step?
    options:
      - 18 alone
      - 18 and 22
      - 18, 19, 20, and 21
    answer: 2
    explanation: The four consecutive bases start all four chains of amounts separated by steps of four. A base at 18 alone reaches only one of those chains.
    teachingHash: ffe11d66e15fdb0893cb724ff5c2c891f88cc02b80d77dc1c98eebc68e2d061b
combinatorics:
  - id: quick-1
    after: Unordered selections and combinations
    prompt: A committee has no named roles. Does swapping the order in which its members are listed create a new committee?
    options:
      - Yes
      - No
    answer: 1
    explanation: The members determine the committee. Ordered selection counts each committee repeatedly, which is why the combination formula corrects that overcount.
    teachingHash: 9d6ffdd173769b411a267afb8f00f0bd488da588a86703d5e1cd7f9bb51f6732
  - id: quick-2
    after: The pigeonhole principle
    prompt: Thirteen people are grouped by their twelve possible birth months. What is guaranteed?
    options:
      - Every month has someone
      - At least two people share a birth month
      - Exactly two people share one month
    answer: 1
    explanation: If every month had at most one person, there could be at most twelve people. Some month therefore has at least two; it may have more.
    teachingHash: f9b690c096fc61ff842ecca0f1abfdd7ff1c4a0af10cafdbc98e8d6eefa80998
recurrence-relations:
  - id: quick-1
    after: A recurrence needs a domain and initial conditions
    prompt: Does $a_n=a_{n-1}+3$ for integer $n\geq1$ determine a unique sequence without an initial value?
    options:
      - Yes
      - No
    answer: 1
    explanation: No. Starting at 0 and starting at 10 produce different sequences obeying the same update rule. The initial data select the sequence.
    teachingHash: 4c61ad5c1877784cdd9f0ea54d1f42799e7a8bae82ddbcf04274b5110d452ce5
  - id: quick-2
    after: Different amounts of branching
    prompt: Two recurrences halve the input on every recursive step. Must they have the same total work?
    options:
      - Yes
      - No
    answer: 1
    explanation: No. One may follow one smaller call while the other follows two. Equal depth does not imply equal numbers of calls across all levels.
    teachingHash: 81799b4c86a3f4e67dc59b320c04a86e8dfacbf77b26a73b727db19e7e525c89
graph-theory:
  - id: quick-1
    after: Adjacency and degree
    prompt: In a finite simple undirected graph, what does the sum of the degrees count?
    options:
      - Each edge once
      - Each edge twice
      - Each vertex twice
    answer: 1
    explanation: Each edge has two distinct endpoints and contributes one to the degree at each endpoint. The degree sum is twice the edge count.
    teachingHash: 6703fd956b326c40fe018aa35e787ffcf909e51e191e072121bde8eb25f42348
  - id: quick-2
    after: Euler trails and Hamiltonian cycles
    prompt: Which route is required to use every edge exactly once?
    options:
      - An Euler trail
      - A Hamiltonian cycle
      - Every path
    answer: 0
    explanation: An Euler trail is about covering edges. A Hamiltonian cycle visits every vertex exactly once before returning to its start.
    teachingHash: 7504100a9246dfce93a2756f3e48090143237536d5bea3c95458494cbc0e12e9
asymptotic-growth:
  - id: quick-1
    after: 'Big O: an eventual upper bound'
    prompt: In $f(n)=O(g(n))$, may the comparison constant $c$ be chosen anew for each $n$?
    options:
      - Yes
      - No
    answer: 1
    explanation: No. One fixed positive c must work for every input beyond one fixed threshold. Choosing c separately for each n changes the quantifier order.
    teachingHash: 39b0cc4c8fac50414d98780c05b74d21747201605ff354e018293c7336751637
  - id: quick-2
    after: Big Omega and Big Theta
    prompt: What does $f(n)=\Theta(g(n))$ assert?
    options:
      - The functions are equal at every input
      - Matching eventual upper and lower bounds by positive constant multiples
      - Only an eventual upper bound
    answer: 1
    explanation: Theta bounds f between two fixed positive multiples of g after a threshold. The functions can differ at every input and still have the same growth scale.
    teachingHash: cb047f2a5bcb244d67f5b2f8b7a84491ed5ef472821e1b230ebcb6d324a0456a
linear-algebra-vectors:
  - id: quick-1
    after: Adding and scaling
    prompt: Which statement describes the zero vector?
    options:
      - It has length zero and no direction.
      - It points along the first coordinate axis.
      - It cannot result from scalar multiplication.
    answer: 0
    explanation: All components are zero. Multiplying any vector by zero produces it, but there is no nonzero displacement to specify a direction.
    teachingHash: 82ef2b3bb10fecab40b9f9f20ffe19533aa5bd5260019167238092d340d5fa5e
  - id: quick-2
    after: Building linear combinations
    prompt: Two listed vectors must always provide two different directions.
    options:
      - 'True'
      - 'False'
    answer: 1
    explanation: One vector can be a scalar multiple of the other. For example, (1,1) and (2,2) only provide combinations along one line.
    teachingHash: cceb98c3bd5e3df2d38cc6f2ff2e1f3784935d27f567612b1afcc62d3082f3df
linear-algebra-dot-products:
  - id: quick-1
    after: Length and unit vectors
    prompt: Can the zero vector be normalized by dividing it by its norm?
    options:
      - Yes
      - No
    answer: 1
    explanation: Its norm is zero, so the proposed division is undefined. The zero vector also has no direction to retain.
    teachingHash: 36e3cc774ac0f5523c0ae052d347f8f90ebddd235bbdd605d82987e515fc3356
  - id: quick-2
    after: Angle and orthogonality
    prompt: Orthogonal nonzero vectors have which dot product?
    options:
      - One
      - Zero
      - Their combined length
    answer: 1
    explanation: Orthogonality is defined by a zero dot product; neither vector needs to have unit length.
    teachingHash: b7f038d6f76cc83a80b3eb09de14ad0bbd5977a9508d0a286955104627021d05
linear-algebra-matrices:
  - id: quick-1
    after: A matrix acting on a vector
    prompt: A four by two matrix maps a two-component column to how many components?
    options:
      - Two
      - Four
      - Eight
    answer: 1
    explanation: There is one output for each of the four rows.
    teachingHash: 4a8df325886627eaf2b70db7852d7a66f3c57baa23e037b4a4da27c382c68e37
  - id: quick-2
    after: Composition determines the product
    prompt: When both AB and BA exist, they must be equal.
    options:
      - 'True'
      - 'False'
    answer: 1
    explanation: 'Order matters: the products represent different orders of applying the transformations.'
    teachingHash: 669abd621207094e7b3b44e55ef8fa99fc9d1f1d5dee7a25deb15160e4baca3e
linear-algebra-systems:
  - id: quick-1
    after: No solution or a family of solutions
    prompt: An augmented row representing 0=0 proves inconsistency.
    options:
      - 'True'
      - 'False'
    answer: 1
    explanation: It gives no new restriction. A row representing zero equal to a nonzero constant proves inconsistency.
    teachingHash: 5066f657ec6432c6f598b1474f18403585c4717d2122240e04223c080f5a1344
  - id: quick-2
    after: Homogeneous systems and verification
    prompt: A real homogeneous linear system always has at least one solution.
    options:
      - 'True'
      - 'False'
    answer: 0
    explanation: The zero vector always solves it, even if no nontrivial solution exists.
    teachingHash: 8954f676fa46b6d9df6c26909a3d2f9f9c489a2cbc18f751d4a77ec87c4e1116
linear-algebra-span:
  - id: quick-1
    after: Independence means no redundant direction
    prompt: A collection containing the zero vector is linearly independent.
    options:
      - 'True'
      - 'False'
    answer: 1
    explanation: Coefficient one on the zero vector and zero on the others gives a nontrivial zero combination.
    teachingHash: c765c5eab768b54fb41315b86c8066e971c3118cea28d4a27abdaea555cf10c2
  - id: quick-2
    after: Subspaces and the origin
    prompt: Which must belong to every subspace?
    options:
      - The zero vector
      - Every standard basis vector
      - Every vector with positive components
    answer: 0
    explanation: Containing zero is part of the subspace definition. A proper subspace need not contain the standard basis vectors.
    teachingHash: 948087ffa1e0db7e91d68d8629cd876c45d5f2234fd0ce8d942c979ee305e6c3
linear-algebra-bases:
  - id: quick-1
    after: Rank and nullity
    prompt: Rank plus nullity equals which size of a matrix?
    options:
      - The number of columns
      - The number of rows
      - The number of entries
    answer: 0
    explanation: The input variables, one per column, split into pivot variables and free variables.
    teachingHash: ce96533358a8d23f1fdfa6095bad98711d8bf93952c9744ca4ae390ab1faeb78
  - id: quick-2
    after: Invertible matrices
    prompt: Taking the reciprocal of every entry gives a matrix inverse.
    options:
      - 'True'
      - 'False'
    answer: 1
    explanation: An inverse is defined by matrix multiplication producing identity. Entrywise reciprocals do not generally do this.
    teachingHash: ecaeff67776dfea4aec5a614123e04b2d29035d8c38d52e03702fafcc67ba031
linear-algebra-transformations:
  - id: quick-1
    after: What linearity requires
    prompt: A function that takes zero to zero must be linear.
    options:
      - 'True'
      - 'False'
    answer: 1
    explanation: Coordinate squaring preserves zero but fails the defining addition and scaling properties.
    teachingHash: 3efc6ed76ddac0a55e8421b9ecc7af5c984934b639a53c46a60d84350142da60
  - id: quick-2
    after: Kernel, image, and information loss
    prompt: Changing the declared codomain can change whether a rule is surjective.
    options:
      - 'True'
      - 'False'
    answer: 0
    explanation: Surjectivity compares the actual image with the declared codomain. Projection reaches an entire axis but not the entire plane.
    teachingHash: bfb353d1e9bc551b11967a3538feb0273269aaed99024a8527e13618e426cff4
linear-algebra-projections:
  - id: quick-1
    after: Projecting onto a line
    prompt: The residual of an orthogonal projection is perpendicular to the permitted line.
    options:
      - 'True'
      - 'False'
    answer: 0
    explanation: This orthogonality is what makes the projected point the closest one, by the Pythagorean theorem.
    teachingHash: b9974d7f2f709226d8fce0db15f5051344cfbfc53972ad543ce468108640c5b4
  - id: quick-2
    after: Least squares and the normal equations
    prompt: In 'normal equations,' normal refers to what?
    options:
      - Perpendicularity
      - A probability distribution
      - An exactly solvable original system
    answer: 0
    explanation: The residual must be perpendicular to every column of the model matrix.
    teachingHash: 5cf1109131072db2caca3c99cf5ac373fd26cd4b5a930652985c6eedfb480e2a
linear-algebra-eigenvalues:
  - id: quick-1
    after: Directions that are only scaled
    prompt: An eigenvalue of -2 indicates what happens to its eigenvector?
    options:
      - Direction reverses and length doubles
      - Length becomes negative
      - The vector becomes zero
    answer: 0
    explanation: The negative sign reverses direction, while the magnitude two is the length factor.
    teachingHash: 6f753cadcc8325e961e3caf494e1a544070db3074ef89422a3b0545c3bbe634c
  - id: quick-2
    after: Limits and interpretation
    prompt: Every real square matrix has a basis of real eigenvectors.
    options:
      - 'True'
      - 'False'
    answer: 1
    explanation: Some matrices lack enough independent eigenvectors; a right-angle rotation has no real eigenvectors at all.
    teachingHash: dff0433e5979135e542eaf4721b570bc62cb2424b4385d78368c35355c95e87c
linear-algebra-svd:
  - id: quick-1
    after: A small example you can verify
    prompt: Singular values can be negative.
    options:
      - 'True'
      - 'False'
    answer: 1
    explanation: By the SVD convention they are nonnegative length scale factors. Direction changes are represented by the orthogonal factors.
    teachingHash: ba2c59cd23f40d8a8334f28d96b2e351bc1a65ab4ec28fcd1cbdbdc869e2c1b5
  - id: quick-2
    after: Connection to rank and eigenvalues
    prompt: A matrix has three positive singular values. What is its rank?
    options:
      - One
      - Three
      - The number of rows, regardless of values
    answer: 1
    explanation: Rank counts positive singular values, one for each independent output direction.
    teachingHash: 130f70047facef68e9fb2fd6303b5ec9880f22a138530aab15cadf54bf65f4e4
