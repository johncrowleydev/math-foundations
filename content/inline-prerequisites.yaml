  '45':
    after: Coordinates, composition, and affine rules
    instructions: ''
    prompt: A multiplies the first standard coordinate by 2 and the second by 1. Find its matrix in the ordered basis (1,1),(1,-1), using that basis for input and output.
    answer: The first basis vector goes to (2,1), whose basis coordinates are (3/2, 1/2). The second goes to (2,-1), whose basis coordinates are (1/2, 3/2). These are the columns, so the new rows are (3/2, 1/2), (1/2, 3/2).
