  '41':
    after: Building linear combinations
    instructions: ''
    prompt: Express (4, 1) as a linear combination of p=(1,1) and q=(2,-1). Derive the coefficients by matching components, then rebuild the target.
    answer: Writing coefficients c,d gives c+2d=4 and c-d=1. Subtracting the second equation from the first gives 3d=3, so d=1 and c=2. Thus the coefficients are (2, 1); rebuilding gives (4, 1).
