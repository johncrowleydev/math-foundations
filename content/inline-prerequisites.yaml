  '58':
    after: Carrying out Gram–Schmidt
    instructions: ''
    prompt: What happens if Gram–Schmidt encounters a zero remainder? Why must you not normalize it?
    answer: The current input lies in the span of previously retained directions, so it adds no independent direction. Its norm is zero and division is undefined; discard the redundant direction or handle dependence explicitly.
