  '3':
    after: What linearity requires
    instructions: ''
    prompt: Define T(x)=Ax for A with rows (1, 2), (0, 1). State the input and output coordinate spaces and prove both linearity properties for arbitrary compatible vectors.
    answer: Inputs have 2 components and outputs 2. Each row dot product distributes across u+v, so A(u+v)=Au+Av. Scalar factors can be taken outside each row's sum, so A(cu)=cAu. Both identities hold for every real c and every input pair.
    concepts:
      - linear-algebra-transformations-1
    requires:
