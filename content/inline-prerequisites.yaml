    exerciseHash: 48223f0ba3edf6145d90f898562f8b5e9779edb460ebb6cc0cbf7e2fc1933df7
    prompt: In the three-peg Tower of Hanoi puzzle, move a stack of $n$ differently sized disks to another peg. Move one exposed disk at a time and never place a larger disk on a smaller one. Let $H(n)$ be the minimum number of moves. State $H(0)$ and derive a recurrence for $H(n)$.
    answer: $H(0)=0$ and $H(n)=2H(n-1)+1$ for $n\geq1$. The usual construction moves the smaller stack to the spare peg, moves the largest disk to its destination, and moves the smaller stack onto it, using this many moves. For a lower bound, before the largest disk's first move the entire smaller stack must have moved to one other peg, requiring at least $H(n-1)$ moves. After its last move to the destination, the smaller stack is entirely on a different peg and needs at least $H(n-1)$ further moves. Those two stages and at least one largest-disk move give the same lower bound, so the construction is optimal.
