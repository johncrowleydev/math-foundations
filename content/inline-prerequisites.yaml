  '64':
    after: What a best fit does and does not say
    instructions: ''
    prompt: A fit minimizes squared error. Does it necessarily minimize the sum of absolute errors? Explain.
    answer: No. Those are different objectives and can prefer different fits. For observations zero, zero, and six, squared-error constant fitting gives two, while zero has smaller total absolute error than two.
