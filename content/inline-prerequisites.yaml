    prompt: Let $f,g,h:\mathbb R\to\mathbb R$ satisfy $f(x)=x+2$, $g(x)=3x$, and $h(x)=x-1$. Compute $g\circ f$, then verify $h\circ(g\circ f)=(h\circ g)\circ f$.
    answer: The first composite is $(g\circ f)(x)=3x+6$. Then $h(g(f(x)))=3x+5$. Also $(h\circ g)(y)=3y-1$, so substituting $y=f(x)=x+2$ gives $3(x+2)-1=3x+5$. Both groupings have the same values and types.
