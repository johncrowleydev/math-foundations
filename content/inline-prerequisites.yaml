    prompt: |-
      Write the converse and contrapositive of this statement. Decide whether the original and each rewritten statement are true, giving a counterexample for each false claim.

      If an integer is divisible by 10, then it is even.
    answer: 'Original true. Converse: if even, then divisible by 10; false (6). Contrapositive: if not even, then not divisible by 10; true.'
