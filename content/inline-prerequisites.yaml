  '71':
    after: Linear models and their limits
    instructions: ''
    prompt: A model doubles its output when production doubles in one experiment. Has proportionality for all production amounts been proved? Explain.
    answer: No. One successful test is evidence for one input pair, not a universal property. Setup thresholds or changing waste rates could still make other amounts fail.
    concepts:
