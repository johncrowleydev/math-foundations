  '29':
    after: Adding and scaling
    instructions: ''
    prompt: A path moves (1, 0), then (0, 2), then (-1, 0). Find its total displacement and its distance traveled. Explain the difference.
    answer: The displacement is (0, 2); the horizontal movements cancel. Distance traveled is 1+2+1=4 units. The length of the final displacement is only 2; cancellation of displacement does not cancel distance traveled.
    concepts:
      - linear-algebra-vectors-2
    requires:
      - lesson: linear-algebra-vectors
        section: Coordinates and vectors
        teachingHash: 865ea2b06ef55b14cae666985af26213eea8b4817d47727bd874333d020f286e
