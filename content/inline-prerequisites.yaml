    prompt: For linear search in a nonempty n-element array, give best- and worst-case comparison counts.
    answer: The best case is 1 when the first item matches. The worst case is $n$, for example when the target is absent. Hence the respective bounds are $\Theta(1)$ and $\Theta(n)$.
