  '9':
    after: Span is everything you can build
    instructions: ''
    prompt: Let u=(1,0), v=(0,1), and w=u+1v. Prove that u,w and u,v have the same span, rather than only showing one inclusion.
    answer: w is a combination of u,v, so the first span is contained in the second. Conversely v=(w-u)/1, since 1 is nonzero, so both u and v lie in the first span. Every combination can therefore be rebuilt in either collection.
    concepts:
      - linear-algebra-span-1
    requires:
