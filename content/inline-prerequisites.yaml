  '37':
    after: Kernel, image, and information loss
    instructions: ''
    prompt: For T(x,y)=(x,y,1x+2y), find the kernel and image. Compare surjectivity when the codomain is three-dimensional space versus the image plane.
    answer: The first two coordinates force zero-only kernel, so the map is injective. Its image is the plane with third coordinate 1 times the first plus 2 times the second. It is not onto the full three-dimensional space but is onto that plane if the plane is declared as codomain.
