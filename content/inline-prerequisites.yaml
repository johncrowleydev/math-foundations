    after: QR as a record of the construction
    instructions: ''
    prompt: What does QR factorization separate in a full-column-rank model matrix?
    answer: Q contains orthonormal directions spanning the same column space, while upper-triangular R contains the coefficients reconstructing the original columns from those directions.
