    after: Independence means no redundant direction
    instructions: ''
    prompt: Prove that (1,0,1) and (0,1,2) are independent, then describe precisely what they span.
    answer: A combination with coefficients s,t is (s,t,1s+(2)t). If it is zero, the first two coordinates force s=t=0. The span consists exactly of vectors with third coordinate 1 times the first plus 2 times the second. It is a plane, not the whole three-dimensional space.
    concepts:
      - linear-algebra-span-2
