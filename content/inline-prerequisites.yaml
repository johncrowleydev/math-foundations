    after: Constructive existence
    instructions: Explain your reasoning.
    answer:
      Let $n$ be an arbitrary integer. If $n\geq0$, choose $m=2n+2=2(n+1)$; it is an even integer and
      $m-n=n+2>0$. If $n<0$, choose $m=2$, which is even and greater than $n$. These cases cover every
      integer.
