    prompt: Start i at 1 and repeatedly execute a body and double i while i is at most n. Count executions exactly.
    answer: The values are $2^0$ through $2^k$, where $k=\lfloor\log_2 n\rfloor$. There are $\lfloor\log_2 n\rfloor+1$ executions, hence $\Theta(\log n)$ for $n\geq2$.
