  '43':
    after: Coordinates, composition, and affine rules
    instructions: ''
    prompt: Is T(x,y)=(x+2,y-1) linear or affine but not linear? Explain using its value at zero.
    answer: It is affine but not linear. Its value at (0,0) is (2,-1), whereas a linear transformation must preserve zero. It is the identity linear rule plus a fixed nonzero offset.
