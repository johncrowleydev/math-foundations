  '39':
    after: Building linear combinations
    instructions: ''
    prompt: Let u=(1,2) and v=(2,-1). Find 3u-2v, showing the component arithmetic.
    answer: Three u is (3,6), and negative two v is (-4,2). Adding gives (-1,8). Both components must be scaled before the vectors are added.
    concepts:
