  '31':
    after: Connection to rank and eigenvalues
    instructions: ''
    prompt: A is the 2-by-3 rectangular diagonal matrix with diagonal (3, 2) and all other entries zero. Find rank, nullity, and all eigenvalues of A transpose A, counting zeros.
    answer: Rank is 2. Nullity is 1, from number of columns minus rank. A transpose A is 3 by 3 with diagonal (9, 4, 0). In a wide matrix, extra zero eigenvalues arise from input directions beyond the rectangular diagonal.
