  '62':
    after: A fit can be unique even when its parameters are not
    instructions: ''
    prompt: Prove A transpose A is invertible when A has independent columns.
    answer: If A transpose A x=0, multiply by x transpose to get squared norm of Ax equal to zero. Then Ax=0, and independent columns force x=0. The square matrix has zero-only null space and is invertible.
