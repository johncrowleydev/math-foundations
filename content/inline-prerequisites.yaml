  '29':
    after: Kernel, image, and information loss
    instructions: ''
    prompt: For T(x,y,z)=(x,y), find the kernel and image. State whether T is injective and surjective when its codomain is the coordinate plane.
    answer: The kernel is all (0,0,t), with real t; the image is the whole plane. It is not injective because the third coordinate is lost, but it is surjective onto the stated codomain.
    concepts:
      - linear-algebra-transformations-3
    requires:
