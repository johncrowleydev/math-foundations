    prompt: State the definition of $f(n)=O(g(n))$, including the order of the quantifiers.
    answer: There exist $c>0$ and an integer $n_0\geq1$ such that for every integer $n\geq n_0$, $0\leq f(n)\leq cg(n)$. The same constants work for every later index.
