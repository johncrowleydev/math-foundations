    prompt: 'For an integer $n$, prove by contrapositive: if $n^2$ is even, then $n$ is even.'
    answer: If $n$ is odd, write $n=2k+1$. Then $n^2=2(2k^2+2k)+1$ is odd. This proves the contrapositive and hence the original.
