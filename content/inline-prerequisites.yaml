    prompt: For u=(1,0,1), v=(0,1,1), and w=(1, 2, 3), exhibit a nontrivial zero combination and identify a redundant vector.
    answer: w=1u+2v, hence coefficient list (-1, -2, 1) gives zero. Its last coefficient is one, so it is nontrivial. The vector w adds no direction beyond u,v.
