    instructions: ''
    prompt: Solve x+y=5 and x-y=1. Verify the same pair in both original equations.
    answer: Adding gives 2x=6, so x=3 and y=2. The checks are 3+2=5 and 3-2=1. A solution must use the same values in both equations.
