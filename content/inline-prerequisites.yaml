    exerciseHash: 29b84dbcdfc0aba8751fceb54327970efbc5178bee398d393632ae016f4a4515
  '17':
    after: Adding and scaling
    instructions: ''
    prompt: For u=(2, -1) and v=(3, 4), calculate 3u-2v. Check by adding 2v to your result.
    answer: Three u is (6, -3); negative two v is (-6, -8). Their sum is (0, -11). Adding (6, 8) recovers (6, -3), as required.
    concepts:
      - linear-algebra-vectors-2
    requires:
      - lesson: linear-algebra-vectors
