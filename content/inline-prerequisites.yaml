    exerciseHash: fd47f6fdef8219026889a95ff5936dfd02e2dca116f7e681d783b05cfa6c0991
    prompt: Assume nonnegative $T(1)=1$ and $T(n)\leq2T(n/2)+n$ on powers of two. Prove $T(n)\leq n\log_2 n+n$.
    answer: Induct on $\log_2 n$. At $n=1$ the proposed bound is equality. At $n\geq2$, the induction hypothesis gives $T(n/2)\leq(n/2)\log_2(n/2)+n/2$. Therefore $T(n)\leq2[(n/2)\log_2(n/2)+n/2]+n=n\log_2 n+n$.
