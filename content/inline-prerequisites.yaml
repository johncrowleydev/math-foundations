linear-algebra-transformations:
  '1':
    after: What linearity requires
    instructions: ''
    prompt: Prove that T(x,y)=(2x-y,3y) is linear by checking addition and scalar multiplication for arbitrary inputs.
    answer: For inputs (x,y),(a,b), T(x+a,y+b)=(2x+2a-y-b,3y+3b), equal to the sum of their outputs. For any real c, T(cx,cy)=(c(2x-y),c(3y))=cT(x,y). Both required properties hold.
    concepts:
      - linear-algebra-transformations-1
    requires:
      - lesson: linear-algebra-bases
