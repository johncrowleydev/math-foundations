    instructions: ''
    prompt: Find a nonzero vector perpendicular to (1, 2) and explain why your construction works without estimating an angle.
    answer: One choice is (-2, 1). The dot product is 1 times -2 plus 2 times 1, or zero. The vector is nonzero because the given vector is nonzero.
