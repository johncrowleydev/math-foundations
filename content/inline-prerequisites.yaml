    after: Span is everything you can build
    instructions: ''
    prompt: Does (3,4) lie in the span of u=(1,0) and v=(1,2)? Find coefficients or prove none exist.
    answer: Yes. The second coordinate forces the coefficient of v to be 2. The first then forces the coefficient of u to be 1, so u+2v=(3,4).
