# Authored exercise-level evidence. IDs are canonical, not display positions.
concepts:
  - id: recurrence-unfolding
    name: Unfolding and telescoping recurrences
  - id: affine-recurrence
    name: First-order affine recurrences
  - id: forced-recurrence
    name: Recurrences with varying forcing terms
  - id: characteristic-roots
    name: Characteristic roots of second-order recurrences
  - id: repeated-roots
    name: Repeated characteristic roots
  - id: counting-recurrence
    name: Constructing recurrences from disjoint cases
  - id: recurrence-verification
    name: Verifying recurrence solutions
  - id: divide-conquer-recurrence
    name: Divide-and-conquer recurrences and recursion trees
  - id: recurrence-bounds
    name: Proving upper and lower recurrence bounds
teaching:
  - concept: recurrence-unfolding
    lesson: recurrence-relations
    section: 'Iteration: unfold the definition'
  - concept: affine-recurrence
    lesson: recurrence-relations
    section: First-order linear recurrences
  - concept: forced-recurrence
    lesson: recurrence-relations
    section: A varying nonhomogeneous term
  - concept: characteristic-roots
    lesson: recurrence-relations
    section: Second-order homogeneous recurrences
  - concept: repeated-roots
    lesson: recurrence-relations
    section: Repeated roots
  - concept: counting-recurrence
    lesson: recurrence-relations
    section: Recurrences from counting
  - concept: recurrence-verification
    lesson: recurrence-relations
    section: Testing and correcting a proposed formula
  - concept: divide-conquer-recurrence
    lesson: recurrence-relations
    section: Divide-and-conquer recurrences
  - concept: recurrence-bounds
    lesson: recurrence-relations
    section: Guessing bounds and proving them
