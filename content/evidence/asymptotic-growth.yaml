# Authored exercise-level evidence. IDs are canonical, not display positions.
concepts:
  - id: cost-model
    name: Input size and computational cost models
  - id: big-o
    name: Eventual upper bounds and big O
  - id: big-omega-theta
    name: Lower and tight asymptotic bounds
  - id: asymptotic-rules
    name: Combining asymptotic bounds
  - id: growth-comparison
    name: Polynomial, logarithmic and exponential growth
  - id: little-o
    name: Strictly slower growth and little o
  - id: loop-counting
    name: Counting loop operations
  - id: case-complexity
    name: Best, worst and average case
  - id: algorithm-lower-bound
    name: Problem lower bounds versus implementation bounds
teaching:
  - concept: cost-model
    lesson: asymptotic-growth
    section: State the function and the model
  - concept: big-o
    lesson: asymptotic-growth
    section: 'Big O: an eventual upper bound'
  - concept: big-omega-theta
    lesson: asymptotic-growth
    section: Big Omega and Big Theta
  - concept: asymptotic-rules
    lesson: asymptotic-growth
    section: Useful rules, with reasons
  - concept: growth-comparison
    lesson: asymptotic-growth
    section: Polynomials and logarithm bases
  - concept: little-o
    lesson: asymptotic-growth
    section: Strictly slower growth
  - concept: loop-counting
    lesson: asymptotic-growth
    section: Counting simple and consecutive loops
  - concept: case-complexity
    lesson: asymptotic-growth
    section: Worst case is a different axis
  - concept: algorithm-lower-bound
    lesson: asymptotic-growth
    section: An upper-bound proof is not an algorithm lower bound
