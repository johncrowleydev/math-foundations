# Authored exercise-level evidence. IDs are canonical, not display positions.
concepts:
  - id: set-description
    name: Set descriptions, equality and cardinality
  - id: membership-subset
    name: Membership and subset inclusion
  - id: set-operations
    name: Union, intersection, difference and complement
  - id: set-proofs
    name: Element arguments for set inclusion and equality
  - id: set-identities
    name: Set identities and transformations
  - id: power-set
    name: Power sets and subset counting
  - id: cartesian-product
    name: Ordered pairs and Cartesian products
  - id: inclusion-exclusion
    name: Inclusion-exclusion and overlap counts
  - id: partitions
    name: Partitions and disjoint coverage
  - id: indexed-sets
    name: Indexed unions and intersections
teaching:
  - concept: set-description
    lesson: sets-and-set-operations
    section: Elements, descriptions, and equality
  - concept: membership-subset
    lesson: sets-and-set-operations
    section: Membership and subsets are different
  - concept: set-operations
    lesson: sets-and-set-operations
    section: Union, intersection, difference, and complement
  - concept: set-proofs
    lesson: sets-and-set-operations
    section: Proving inclusions and identities
  - concept: set-identities
    lesson: sets-and-set-operations
    section: Laws of set operations
  - concept: power-set
    lesson: sets-and-set-operations
    section: Power sets
  - concept: cartesian-product
    lesson: sets-and-set-operations
    section: Ordered pairs and Cartesian products
  - concept: inclusion-exclusion
    lesson: sets-and-set-operations
    section: Counting unions without double-counting
  - concept: partitions
    lesson: sets-and-set-operations
    section: Partitions and indexed families
  - concept: indexed-sets
    lesson: sets-and-set-operations
    section: Partitions and indexed families
