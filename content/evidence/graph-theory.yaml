# Authored exercise-level evidence. IDs are canonical, not display positions.
concepts:
  - id: graph-definition
    name: Vertices, edges and graph conventions
  - id: graph-degree
    name: Adjacency, degree and the handshaking lemma
  - id: graph-routes
    name: Walks, trails, paths and cycles
  - id: graph-connectivity
    name: Reachability and connected components
  - id: trees-forests
    name: Trees, forests and spanning trees
  - id: rooted-trees
    name: Rooted and binary trees
  - id: dag-order
    name: Directed acyclic graphs and topological order
  - id: graph-representation
    name: Adjacency lists and matrices
  - id: graph-search
    name: Breadth-first and depth-first search
  - id: euler-routes
    name: Euler trails and circuits
  - id: hamiltonian-routes
    name: Hamiltonian paths and cycles
