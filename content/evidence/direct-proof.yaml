# Authored exercise-level evidence. IDs are canonical, not display positions.
concepts:
  - id: proof-obligations
    name: Hypotheses, conclusions and proof obligations
  - id: direct-proof
    name: Direct proof from definitions
  - id: parity
    name: Parity
  - id: divisibility
    name: Divisibility
  - id: rationality
    name: Rational and irrational numbers
  - id: proof-cases
    name: Proof by cases
  - id: biconditional-proof
    name: Proving both directions
  - id: constructive-existence
    name: Constructive existence
  - id: proof-diagnosis
    name: Validating and repairing reasoning
teaching:
  - concept: proof-obligations
    lesson: direct-proof
    section: Read the claim before choosing a method
  - concept: direct-proof
    lesson: direct-proof
    section: Unpack definitions
  - concept: parity
    lesson: direct-proof
    section: 'Worked proof: the sum of two odd integers'
  - concept: divisibility
    lesson: direct-proof
    section: Divisibility and linear combinations
  - concept: rationality
    lesson: direct-proof
    section: Closure claims
  - concept: proof-cases
    lesson: direct-proof
    section: Proof by cases
  - concept: biconditional-proof
    lesson: direct-proof
    section: Biconditionals need both directions
  - concept: constructive-existence
    lesson: direct-proof
    section: Constructive existence
  - concept: proof-diagnosis
    lesson: direct-proof
    section: Diagnose and revise a proof
