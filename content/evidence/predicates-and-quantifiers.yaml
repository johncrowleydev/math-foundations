# Authored exercise-level evidence. IDs are canonical, not display positions.
concepts:
  - id: predicate-domain
    name: Domains and allowable witnesses
  - id: predicate-evaluation
    name: Predicates and substitution
  - id: universal-quantification
    name: Universal quantification
  - id: existential-quantification
    name: Existential quantification and witnesses
  - id: variable-scope
    name: Free variables, binding and scope
  - id: quantifier-translation
    name: Translating quantified statements
  - id: quantifier-negation
    name: Negation of quantified statements
  - id: quantifier-order
    name: Quantifier order and dependent witnesses
  - id: uniqueness
    name: Existence and uniqueness
  - id: vacuous-quantification
    name: Empty domains and vacuous quantified statements
  - id: quantifier-laws
    name: Quantifier distribution and equivalence
  - id: quantified-inference
    name: Valid inference with quantifiers
  - id: quantified-proof
    name: Arbitrary objects and witness proofs
  - id: quantified-specification
    name: Quantified specifications and finite tests
teaching:
  - concept: predicate-domain
    lesson: predicates-and-quantifiers
    section: Domains come first
  - concept: predicate-evaluation
    lesson: predicates-and-quantifiers
    section: Predicates and substitution
  - concept: universal-quantification
    lesson: predicates-and-quantifiers
    section: 'Universal quantification: for every'
  - concept: existential-quantification
    lesson: predicates-and-quantifiers
    section: 'Existential quantification: there exists'
  - concept: variable-scope
    lesson: predicates-and-quantifiers
    section: Scope, free variables, and bound variables
  - concept: quantifier-translation
    lesson: predicates-and-quantifiers
    section: Translating all, some, none, and only
  - concept: quantifier-negation
    lesson: predicates-and-quantifiers
    section: Negating quantified statements
  - concept: quantifier-order
    lesson: predicates-and-quantifiers
    section: Several variables and quantifier order
  - concept: uniqueness
    lesson: predicates-and-quantifiers
    section: Existence, uniqueness, and exactly one
  - concept: vacuous-quantification
    lesson: predicates-and-quantifiers
    section: Vacuous truth and empty cases
  - concept: quantifier-laws
    lesson: predicates-and-quantifiers
    section: Which distributions are valid?
  - concept: quantified-inference
    lesson: predicates-and-quantifiers
    section: Valid reasoning with quantifiers
  - concept: quantified-proof
    lesson: predicates-and-quantifiers
    section: Writing a quantified proof
  - concept: quantified-specification
    lesson: predicates-and-quantifiers
    section: Quantifiers in programs and specifications
