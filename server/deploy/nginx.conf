server {
    listen 172.31.3.18:80;
    server_name foundations.johncrowley.dev;
    location /.well-known/acme-challenge/ { root /var/www/foundations; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 127.0.0.1:17443 ssl;
    server_name foundations.johncrowley.dev;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/foundations.johncrowley.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/foundations.johncrowley.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    client_max_body_size 64m;
    client_body_timeout 120s;
    location /api/ {
        proxy_pass http://127.0.0.1:18084;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        access_log off;
    }
    root /opt/math-foundations/current/web;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    location ~ /\. { deny all; }
    location ~* (secret\.txt|\.env|server\.env)$ { return 404; }
    location = /sw.js { add_header Cache-Control "no-cache"; }
    location = /index.html { add_header Cache-Control "no-cache"; }
    location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
    location / { add_header Cache-Control "no-cache"; try_files $uri $uri/ /index.html; }
}
