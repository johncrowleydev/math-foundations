server {
    listen 172.31.3.18:80;
    server_name foundations.johncrowley.dev;
    location /.well-known/acme-challenge/ { root /var/www/foundations; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 127.0.0.1:17443 ssl;
    server_name foundations.johncrowley.dev;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/foundations.johncrowley.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/foundations.johncrowley.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    client_max_body_size 64m;
    client_body_timeout 120s;
    location /api/ {
        proxy_pass http://127.0.0.1:18084;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_set_header Host $host;
        access_log off;
    }
    location / { return 404; }
}
