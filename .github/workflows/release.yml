name: Publish Android update
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: publish-android-update
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Build and test sync API
        working-directory: server
        run: |
          go test -race ./...
          go build -o "$RUNNER_TEMP/foundations-test" .
          echo "CLOUD_TEST_SERVER=$RUNNER_TEMP/foundations-test" >> "$GITHUB_ENV"
          echo "CLOUD_TEST_CATALOG=$GITHUB_WORKSPACE/output/grading-catalog.json" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'build-tools;36.0.0' 'platforms;android-36'
      - run: npm ci && npm test && npm run typecheck && npm run format:check
      - run: bash android/gradlew -p android :app:assembleRelease :app:testDebugUnitTest :app:lintRelease
      - name: Sign and verify APK
        env:
          FOUNDATIONS_KEYSTORE_BASE64: ${{ secrets.FOUNDATIONS_KEYSTORE_BASE64 }}
          FOUNDATIONS_LINEAGE_BASE64: ${{ secrets.FOUNDATIONS_LINEAGE_BASE64 }}
          FOUNDATIONS_PASSWORD: ${{ secrets.FOUNDATIONS_PASSWORD }}
        run: |
          export FOUNDATIONS_KEYSTORE="$RUNNER_TEMP/foundations.p12"
          export FOUNDATIONS_LINEAGE="$RUNNER_TEMP/foundations.lineage"
          trap 'rm -f "$FOUNDATIONS_KEYSTORE" "$FOUNDATIONS_LINEAGE"' EXIT
          printf '%s' "$FOUNDATIONS_KEYSTORE_BASE64" | base64 --decode > "$FOUNDATIONS_KEYSTORE"
          printf '%s' "$FOUNDATIONS_LINEAGE_BASE64" | base64 --decode > "$FOUNDATIONS_LINEAGE"
          node scripts/package-release.mjs
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "JSON.parse(require('fs').readFileSync('output/release/update.json','utf8')).versionName")
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "Version $version is already published; leaving its assets unchanged."
            exit 0
          fi
          gh release create "v$version" output/release/foundations.apk output/release/update.json output/release/SHA256SUMS --target "$GITHUB_SHA" --title "Foundations $version" --generate-notes --latest
