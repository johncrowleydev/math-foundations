name: Foundations checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: npm ci && npm ci --prefix web
      - name: Enforce declarative curriculum sources
        run: npm run audit:architecture
      - run: npm test && npm run typecheck && npm run web:build && npm run web:test && npm run format:check
      - name: Validate content without writing artifacts
        run: npm run content:validate
      - name: Verify independent adversarial oracles
        run: npm run verify:adversarial
      - name: Install browser for E2E checks
        run: npx playwright install --with-deps chromium
      - name: Browser and offline regression checks
        run: npm run test:e2e
      - run: go test -race ./...
        working-directory: server
      - name: Verify builds leave canonical curriculum unchanged
        run: |
          git diff --exit-code -- content
          test -z "$(git ls-files --others --exclude-standard -- content)"
