name: Foundations checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: foundations-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and read-only validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install root dependencies
        run: npm ci
      - name: Formatting
        run: npm run format:check
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Architecture and content validation
        run: npm run content:validate
      - name: Verify canonical-content immutability
        if: always()
        run: |
          git diff --exit-code -- content
          test -z "$(git ls-files --others --exclude-standard -- content)"

  content:
    name: Compile shared curriculum artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install root dependencies
        run: npm ci
      - name: Build content once
        run: npm run content:build
      - name: Verify canonical-content immutability
        if: always()
        run: |
          git diff --exit-code -- content
          test -z "$(git ls-files --others --exclude-standard -- content)"
      - uses: actions/upload-artifact@v4
        with:
          name: curriculum
          path: |
            output/content/
            output/grading-catalog.json
            output/formula-inventory.json
          if-no-files-found: error
          retention-days: 7

  unit:
    name: Root tests and curriculum audits
    needs: content
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install root dependencies
        run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: curriculum
          path: output
      - name: Curriculum and deterministic coverage audits
        run: npm run audit:curriculum
      - name: Manual TeX inspection audit
        run: npm run audit:tex
      - name: Root unit tests
        run: npm run test:unit
      - name: Exporter tests
        run: npm run test:utilities
      - name: Verify canonical-content immutability
        if: always()
        run: |
          git diff --exit-code -- content
          test -z "$(git ls-files --others --exclude-standard -- content)"

  web:
    name: Web build and tests
    needs: content
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - name: Install root and web dependencies
        run: npm ci && npm ci --prefix web
      - uses: actions/download-artifact@v4
        with:
          name: curriculum
          path: output
      - name: Web production build
        run: npm run build --prefix web
      - name: Web tests
        run: npm run web:test
      - name: Verify canonical-content immutability
        if: always()
        run: |
          git diff --exit-code -- content
          test -z "$(git ls-files --others --exclude-standard -- content)"
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: |
            web/dist/
            web/public/*.json
          if-no-files-found: error
          retention-days: 7

  verification:
    name: Independent mathematical verification
    needs: content
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/verification/requirements.txt
      - name: Install pinned SymPy
        run: python -m pip install -r tools/verification/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: curriculum
          path: output
      - name: Independent adversarial oracle
        run: python tools/verification/deterministic-adversarial.py --check
      - name: Independent linear algebra oracle
        run: python tools/verification/verify-linear-algebra.py
      - name: Verify canonical-content immutability
        if: always()
        run: |
          git diff --exit-code -- content
          test -z "$(git ls-files --others --exclude-standard -- content)"

  go:
    name: Go race tests
    needs: content
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: actions/download-artifact@v4
        with:
          name: curriculum
          path: output
      - name: Go race suite
        shell: bash
        run: |
          test -s ../output/grading-catalog.json
          go test -race -json ./... | tee ../output/go-tests.jsonl
        working-directory: server
      - name: Verify canonical-content immutability
        if: always()
        run: |
          git diff --exit-code -- content
          test -z "$(git ls-files --others --exclude-standard -- content)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: go-timings
          path: output/go-tests.jsonl
          retention-days: 7

  e2e:
    name: Browser and offline regressions
    needs: [content, web]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Install root and web dependencies
        run: npm ci && npm ci --prefix web
      - uses: actions/download-artifact@v4
        with:
          name: curriculum
          path: output
      - uses: actions/download-artifact@v4
        with:
          name: web
          path: web
      # Browser + OS installation was only 22s. Keep Playwright's locked browser;
      # its upstream CI guidance advises against caching these large binaries.
      - name: Install compatible Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: E2E suite (three isolated workers)
        run: npm run test:e2e
        env:
          E2E_WORKERS: '3'
      - name: Verify canonical-content immutability
        if: always()
        run: |
          git diff --exit-code -- content
          test -z "$(git ls-files --others --exclude-standard -- content)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results
          path: output/e2e/
          if-no-files-found: error
          retention-days: 7
