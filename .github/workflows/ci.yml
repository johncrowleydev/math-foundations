name: Android checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Build and test sync API
        working-directory: server
        run: |
          go test -race ./...
          go build -o "$RUNNER_TEMP/foundations-test" .
          echo "CLOUD_TEST_SERVER=$RUNNER_TEMP/foundations-test" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci && npm test && npm run typecheck && npm run format:check
      - run: bash android/gradlew -p android :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
